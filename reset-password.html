<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WishPath.ai • New password</title>
  <meta name="theme-color" content="#191919" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x2728;</text></svg>" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #191919;
      font-family: 'Inter', system-ui, sans-serif;
      color: #F0EFF5;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #252525;
      border-radius: 20px;
      padding: 40px 32px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      border: 1px solid rgba(104,107,130,0.24);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .logo-gradient {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(90deg, #7132F5, #A78BFA);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .logo .sparkle { color: #7132F5; margin-right: 4px; -webkit-text-fill-color: #7132F5; }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      margin: 0 0 8px;
    }
    .sub {
      text-align: center;
      color: #9497A9;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .input-group { margin-bottom: 18px; }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #9497A9;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .input-wrapper { position: relative; }
    .input-wrapper input { padding-right: 56px; }
    input {
      width: 100%;
      background: #191919;
      border: 1px solid rgba(104,107,130,0.24);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: #F0EFF5;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }
    input:focus {
      border-color: #7132F5;
      box-shadow: 0 0 0 3px rgba(113,50,245,0.15);
    }
    .show-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #7132F5;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #7132F5, #A78BFA);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .login-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .error { color: #f87171; font-size: 14px; margin-top: 8px; min-height: 20px; }
    .back-link { text-align: center; margin-top: 24px; }
    .back-link a { color: #9497A9; font-size: 14px; text-decoration: none; }
    .back-link a:hover { color: #F0EFF5; }
    .hidden { display: none !important; }
    #resetWaiting { text-align: center; color: #9497A9; font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <span class="sparkle">✦</span><span class="logo-gradient">WishPath.ai</span>
    </div>

    <div id="resetWaiting">Verifying your link…</div>

    <div id="resetFormWrap" class="hidden">
      <h1>Set a new password</h1>
      <p class="sub">Choose a strong password you haven’t used elsewhere.</p>
      <form id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="input-group">
          <label for="newPw">NEW PASSWORD</label>
          <div class="input-wrapper">
            <input id="newPw" type="password" placeholder="Min 8 characters" minlength="8" required autocomplete="new-password" />
            <button type="button" class="show-btn" onclick="togglePw('newPw', this)">Show</button>
          </div>
        </div>
        <div class="input-group">
          <label for="newPw2">CONFIRM PASSWORD</label>
          <div class="input-wrapper">
            <input id="newPw2" type="password" placeholder="Re-enter password" minlength="8" required autocomplete="new-password" />
            <button type="button" class="show-btn" onclick="togglePw('newPw2', this)">Show</button>
          </div>
        </div>
        <div class="error" id="resetError"></div>
        <button class="login-btn" type="submit" id="resetBtn">Update password</button>
      </form>
    </div>

    <div class="back-link">
      <a href="/login.html">← Back to log in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/auth.js"></script>
  <script>
    function togglePw(id, btn) {
      var inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    }

    (function initResetPage() {
      var sb = getSupabase();
      var formShown = false;

      function showForm() {
        if (formShown) return;
        formShown = true;
        document.getElementById('resetWaiting').classList.add('hidden');
        document.getElementById('resetFormWrap').classList.remove('hidden');
      }

      function showInvalid(msg) {
        document.getElementById('resetWaiting').innerHTML =
          '<p class="error" style="margin-bottom:12px;">' + (msg || 'This link is invalid or has expired.') + '</p>' +
          '<p><a href="/login.html" style="color:#7132F5;font-weight:600;">Request a new link</a></p>';
      }

      sb.auth.onAuthStateChange(function(event) {
        if (event === 'PASSWORD_RECOVERY') showForm();
      });

      setTimeout(function() {
        sb.auth.getSession().then(function(r) {
          if (r.data && r.data.session) showForm();
        });
      }, 300);

      setTimeout(function() {
        if (formShown) return;
        sb.auth.getSession().then(function(r) {
          if (r.data && r.data.session) showForm();
          else showInvalid();
        });
      }, 2200);
    })();

    async function handleResetPassword(e) {
      e.preventDefault();
      var err = document.getElementById('resetError');
      var btn = document.getElementById('resetBtn');
      var pw = document.getElementById('newPw').value;
      var pw2 = document.getElementById('newPw2').value;
      err.textContent = '';
      if (pw !== pw2) {
        err.textContent = 'Passwords do not match.';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await updateUserPassword(pw);
        window.location.href = '/dashboard.html';
      } catch (ex) {
        err.textContent = ex.message || 'Could not update password';
        btn.disabled = false;
        btn.textContent = 'Update password';
      }
    }
  </script>
</body>
</html>
