<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wish Runner — WishPath</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0B1628;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    font-family: 'Press Start 2P', monospace;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  @media screen and (orientation: portrait) and (max-width: 900px) {
    html { transform: rotate(90deg); transform-origin: top left; width: 100vh; height: 100vw; position: absolute; top: 0; left: 100%; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════════
// WISH RUNNER — Spaceship Maze Runner
// Horizontal scrolling maze · GD visuals · Cosmic theme
// "Hotter" difficulty · Massive particles · Level warp
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const isPortrait = window.innerWidth < window.innerHeight && window.innerWidth < 900;
  W = isPortrait ? window.innerHeight : window.innerWidth;
  H = isPortrait ? window.innerWidth : window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = (isPortrait ? window.innerHeight : W) + 'px';
  canvas.style.height = (isPortrait ? window.innerWidth : H) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SHIP_X = W * 0.18;
}

let SHIP_X = 0;

// ─── HELPERS ───────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return Math.random() * (b - a) + a; }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function arcadeFont(sz) { return `${sz}px 'Press Start 2P', monospace`; }
function hexToRgba(hex, a) {
  const c = hex.replace('#','');
  return `rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`;
}

// ─── LEVEL COLOR THEMES — cool → hot ──────────────────────────
const LEVEL_THEMES = [
  { bg1:'#0B1628', bg2:'#050D1A', edge:'#22D3EE', wall:'#142848', wallEdge:'#1E3A6E', grid:'rgba(60,140,220,0.05)', accent:'#67E8F9', name:'FROZEN VOID' },
  { bg1:'#0D0B28', bg2:'#08061A', edge:'#A855F7', wall:'#1E1248', wallEdge:'#3A1E6E', grid:'rgba(140,60,220,0.05)', accent:'#C084FC', name:'NEBULA DRIFT' },
  { bg1:'#1A0D20', bg2:'#10061A', edge:'#FF2EC4', wall:'#2A1035', wallEdge:'#6E1E50', grid:'rgba(220,60,160,0.05)', accent:'#FF6BD6', name:'PLASMA STORM' },
  { bg1:'#1A1005', bg2:'#120A02', edge:'#F97316', wall:'#2A1A08', wallEdge:'#6E4010', grid:'rgba(220,120,30,0.05)', accent:'#FB923C', name:'SOLAR FLARE' },
  { bg1:'#1A0505', bg2:'#120202', edge:'#EF4444', wall:'#2A0808', wallEdge:'#6E1010', grid:'rgba(220,40,40,0.05)', accent:'#F87171', name:'INFERNO CORE' },
  { bg1:'#0A1A08', bg2:'#051205', edge:'#7DF900', wall:'#102A08', wallEdge:'#2E6E10', grid:'rgba(100,220,30,0.05)', accent:'#A4FF44', name:'TOXIC ZONE' },
  { bg1:'#1A1A05', bg2:'#121202', edge:'#FDE047', wall:'#2A2A08', wallEdge:'#6E6E10', grid:'rgba(220,220,30,0.04)', accent:'#FEF08A', name:'GOLD RUSH' },
];
function getTheme() { return LEVEL_THEMES[(level - 1) % LEVEL_THEMES.length]; }

// ─── STATE ─────────────────────────────────────────────────────
const STATE = { MENU: 0, PLAYING: 1, DEAD: 2 };
let state = STATE.MENU;

let score = 0, distance = 0;
let highScore = parseInt(localStorage.getItem('wr_m2_hi')) || 0;
let totalCoinsAll = parseInt(localStorage.getItem('wr_m2_coins')) || 0;
let attempt = parseInt(localStorage.getItem('wr_m2_attempt')) || 1;
let runStartTime = 0;

// Ship
const SHIP_W = 52, SHIP_H = 28;
const ship = { y:0, vy:0, targetY:0, bankAngle:0, flamePhase:0, trail:[] };
const SHIP_SPEED = 440;

// Maze
let walls = [];
let scrollSpeed = 200, baseSpeed = 200, maxSpeed = 520;
let cameraX = 0;
let nextWallX = 0;

// Health + damage visuals
let health = 3, maxHealth = 3;
let invincTimer = 0, hitFlashTimer = 0;
let damageLevel = 0; // 0=clean, 1=light smoke, 2=heavy smoke, 3=dead

// Diamonds (green, 8=level-up via score)
let diamonds = [];
let diamondsCollected = 0;
const DIAMONDS_PER_LEVEL = 8;

// Level system — GOLD COINS trigger level warp
let level = 1;
let levelUpFlash = 0;
let levelWarpTimer = 0; // warp transition effect
let levelWarpFrom = null; // previous theme

// Gold coins — 3 = level warp!
let goldCoins = [];
let goldCoinsCollected = 0;
let jackpotTimer = 0, jackpotScoreAnim = 0;

// Blue diamonds — 3 = super boost
let blueDiamonds = [];
let blueDiamondsCollected = 0;
let superBoostTimer = 0, blueDiamondHudFlash = 0;

// Particles
const MAX_PARTICLES = 1500;
let particles = [];
let deathParticles = [];
let persistentSmoke = []; // continuous smoke from damaged ship
let floatingTexts = [];
let shakeX = 0, shakeY = 0, shakeDur = 0;
let screenFlash = 0, screenFlashColor = '#FFF';

// Death
let deathTimer = 0;
let wreckageX = 0, wreckageY = 0; // position of wreckage on death screen

// Input
let isDragging = false, dragStartY = 0, dragShipStartY = 0;
let useMouseFollow = false;
const keysDown = {};

let lastTime = 0;

// ─── PARTICLES ─────────────────────────────────────────────────
function spawnP(x,y,color,vx,vy,life,size,grav,shape) {
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({x,y,vx:vx||0,vy:vy||0,life,maxLife:life,size:size||3,color,grav:grav||0,shape:shape||'circle'});
}
function spawnBurst(x,y,color,count,spread,life,size) {
  const n = Math.min(count, MAX_PARTICLES - particles.length);
  for (let i = 0; i < n; i++) {
    const a = rand(0,Math.PI*2), spd = rand(0.5,spread);
    spawnP(x,y,color,Math.cos(a)*spd,Math.sin(a)*spd,rand(life*0.5,life),rand(size*0.3,size),0.02);
  }
}

// MASSIVE orb burst for collections
function spawnOrbBurst(x, y, colors, count, spread) {
  const n = Math.min(count, MAX_PARTICLES - particles.length);
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI*2);
    const spd = rand(1, spread);
    const c = colors[randInt(0, colors.length-1)];
    const sz = rand(3, 10);
    spawnP(x, y, c, Math.cos(a)*spd, Math.sin(a)*spd, rand(0.4, 1.0), sz, 0.01, 'circle');
  }
  // Extra sparkle ring
  for (let i = 0; i < Math.min(30, MAX_PARTICLES-particles.length); i++) {
    const a = rand(0, Math.PI*2);
    spawnP(x, y, '#FFFFFF', Math.cos(a)*rand(spread*0.8,spread*1.2), Math.sin(a)*rand(spread*0.8,spread*1.2),
      rand(0.2,0.5), rand(1,3), 0, 'circle');
  }
}

// MASSIVE death explosion
function spawnDeathExplosion(x, y) {
  const colors = ['#FF4444','#FF8800','#FFCC00','#FF2EC4','#A855F7','#22D3EE','#FFFFFF','#FDE047'];
  // Big particle burst
  for (let i = 0; i < 120; i++) {
    const a = rand(0,Math.PI*2), spd = rand(2,16);
    const c = colors[randInt(0,colors.length-1)];
    spawnP(x,y,c,Math.cos(a)*spd,Math.sin(a)*spd-rand(0,4),rand(0.5,1.8),rand(2,9),0.1);
  }
  // Fire core
  for (let i = 0; i < 40; i++) {
    const a = rand(0,Math.PI*2), spd = rand(0.5,5);
    spawnP(x,y,'#FF6600',Math.cos(a)*spd,Math.sin(a)*spd,rand(0.3,0.8),rand(5,15),0.05);
  }
  // Square debris / shrapnel
  for (let i = 0; i < 35; i++) {
    deathParticles.push({
      x, y, vx:rand(-10,10), vy:rand(-12,6),
      rot:rand(0,6.28), rotV:rand(-0.4,0.4),
      size:rand(3,14), life:rand(0.8,2.5), maxLife:2.5,
      color: colors[randInt(0,colors.length-1)],
    });
  }
  // Expanding shockwave ring (drawn separately)
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx*dt*60; p.y += p.vy*dt*60; p.vy += p.grav*dt*60;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = deathParticles.length-1; i >= 0; i--) {
    const d = deathParticles[i];
    d.x += d.vx*dt*60; d.y += d.vy*dt*60; d.vy += 0.2*dt*60;
    d.rot += d.rotV*dt*60; d.life -= dt;
    if (d.life <= 0) deathParticles.splice(i,1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = clamp(p.life/p.maxLife,0,1);
    const sz = p.size*(0.3+alpha*0.7);
    if (sz < 0.3) continue;
    ctx.globalAlpha = alpha*0.9;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = Math.min(12,sz*2);
    ctx.beginPath(); ctx.arc(p.x,p.y,sz,0,Math.PI*2); ctx.fill();
  }
  for (const d of deathParticles) {
    const alpha = clamp(d.life/d.maxLife,0,1);
    ctx.globalAlpha = alpha; ctx.fillStyle = d.color;
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot);
    ctx.fillRect(-d.size/2,-d.size/2,d.size,d.size);
    ctx.restore();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

// ─── PERSISTENT SMOKE FROM DAMAGED SHIP ────────────────────────
function updatePersistentSmoke(dt) {
  // Spawn new smoke based on damage level
  if (state === STATE.PLAYING && damageLevel > 0) {
    const rate = damageLevel === 1 ? 0.3 : 0.7;
    if (Math.random() < rate) {
      const smokeColor = damageLevel === 1 ? 'rgba(180,180,180,0.5)' : 'rgba(60,60,60,0.7)';
      const sz = damageLevel === 1 ? rand(3,7) : rand(5,12);
      persistentSmoke.push({
        x: SHIP_X - SHIP_W*0.3 + rand(-8,8),
        y: ship.y + rand(-5,5),
        size: sz, maxSize: sz * 3,
        life: rand(0.4, 0.9), maxLife: 0.9,
        vx: rand(-3, -1.5), vy: rand(-1.5, 1.5),
        color: smokeColor,
        dark: damageLevel >= 2,
      });
    }
    // Heavy smoke: extra dark plume
    if (damageLevel >= 2 && Math.random() < 0.4) {
      persistentSmoke.push({
        x: SHIP_X + rand(-5,5),
        y: ship.y + rand(-8,8),
        size: rand(4,8), maxSize: rand(15,25),
        life: rand(0.5,1.2), maxLife: 1.2,
        vx: rand(-2.5,-0.5), vy: rand(-2,0),
        color: 'rgba(30,30,30,0.8)',
        dark: true,
      });
    }
  }

  // Update
  for (let i = persistentSmoke.length-1; i >= 0; i--) {
    const s = persistentSmoke[i];
    s.x += s.vx * dt * 60;
    s.y += s.vy * dt * 60;
    s.vy -= 0.02 * dt * 60; // drift upward slightly
    s.size = lerp(s.size, s.maxSize, dt * 2);
    s.life -= dt;
    if (s.life <= 0) persistentSmoke.splice(i,1);
  }
}

function drawPersistentSmoke() {
  for (const s of persistentSmoke) {
    const alpha = clamp(s.life / s.maxLife, 0, 1) * (s.dark ? 0.6 : 0.35);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.dark ? '#222' : '#999';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── FLOATING TEXT ─────────────────────────────────────────────
function addFloatingText(x, y, text, color, size) {
  floatingTexts.push({ x, y, text, color, size:size||14, life:1.5, maxLife:1.5 });
}
function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length-1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 50 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatingTexts.splice(i,1);
  }
}
function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    const alpha = clamp(ft.life / ft.maxLife, 0, 1);
    const scale = 1 + (1 - alpha) * 0.2; // slight grow as it fades
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.translate(ft.x, ft.y);
    ctx.scale(scale, scale);
    ctx.font = arcadeFont(ft.size);
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.shadowColor = ft.color; ctx.shadowBlur = 15;
    ctx.fillText(ft.text, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ─── BACKGROUND ────────────────────────────────────────────────
let bgStars = [];
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 100; i++) {
    bgStars.push({
      x:rand(0,W), y:rand(0,H), size:rand(0.5,2.2),
      alpha:rand(0.15,0.55), twinkle:rand(1,4), offset:rand(0,6.28),
      color: Math.random()<0.6 ? '#FFF' : ['#A855F7','#22D3EE','#3B82F6'][randInt(0,2)],
      parallax: rand(0.05,0.3),
    });
  }
}
initBgStars();
window.addEventListener('resize', () => { resize(); initBgStars(); });

function drawBackground(time) {
  const theme = getTheme();

  // Heat factor — ramps up with distance, gives a warm overlay
  const heat = clamp(distance / 20000, 0, 0.4);

  const skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0, theme.bg1);
  skyGrad.addColorStop(1, theme.bg2);
  ctx.fillStyle = skyGrad; ctx.fillRect(0,0,W,H);

  // Heat overlay
  if (heat > 0.02) {
    ctx.globalAlpha = heat * 0.3;
    const heatGrad = ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.7);
    heatGrad.addColorStop(0, 'rgba(255,80,20,0.15)');
    heatGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = heatGrad; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

  // Grid
  const tileSize = 50;
  const offsetX = (cameraX * 0.15) % tileSize;
  ctx.strokeStyle = theme.grid; ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (let x = -offsetX; x < W+tileSize; x += tileSize) { ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for (let y = 0; y <= H; y += tileSize) { ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();

  // Stars
  for (const s of bgStars) {
    const sx = ((s.x - cameraX*s.parallax) % W + W) % W;
    const tw = Math.sin(time*0.001*s.twinkle+s.offset);
    const a = s.alpha*(0.5+tw*0.5);
    if (a < 0.03) continue;
    ctx.globalAlpha = a; ctx.fillStyle = s.color;
    if (s.size>1.5) { ctx.shadowColor = s.color; ctx.shadowBlur = s.size*4; }
    ctx.beginPath(); ctx.arc(sx,s.y,s.size,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // Level warp transition overlay
  if (levelWarpTimer > 0) {
    const t = levelWarpTimer;
    // Flash + ripple
    if (t > 1.5) {
      ctx.globalAlpha = (t - 1.5) * 2;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,W,H);
    } else if (t > 0.5) {
      ctx.globalAlpha = (t - 0.5) * 0.3;
      ctx.fillStyle = theme.edge;
      ctx.fillRect(0,0,W,H);
    }
    ctx.globalAlpha = 1;
  }
}

// ─── MAZE WALLS ────────────────────────────────────────────────
function generateWalls() {
  const needUpTo = cameraX + W + 600;
  // Difficulty scaling — gets "hotter"
  const diff = clamp(distance / 15000, 0, 1); // 0=easy, 1=max
  const levelDiff = (level - 1) * 0.08;

  while (nextWallX < needUpTo) {
    const spacing = Math.max(140, 300 - diff*100 - levelDiff*40 + rand(-20,20));
    nextWallX += spacing;

    const gapH = Math.max(75, 170 - diff*50 - levelDiff*20 + rand(-10,10));
    const margin = gapH/2 + 25;
    const gapY = clamp(
      H/2 + Math.sin(nextWallX*0.003+level)*H*0.28 + rand(-50,50),
      margin, H-margin
    );

    let type = 0;
    if (diff > 0.3 && Math.random() < 0.2 + diff*0.15) type = 1; // thick
    if (diff > 0.5 && Math.random() < 0.1 + diff*0.1) type = 2;  // double

    walls.push({ x:nextWallX, gapY, gapH, passed:false, type, hit:false });

    if (type === 2) {
      const gapY2 = clamp(gapY+rand(-40,40), margin, H-margin);
      walls.push({ x:nextWallX+55, gapY:gapY2, gapH:gapH*0.9, passed:false, type:0, hit:false });
    }

    // Diamond in gap
    if (Math.random() < 0.55) {
      diamonds.push({ x:nextWallX+rand(5,35), y:gapY+rand(-gapH*0.2,gapH*0.2), collected:false, anim:rand(0,6.28) });
    }
    // Floating diamond between walls
    if (Math.random() < 0.25) {
      diamonds.push({ x:nextWallX-spacing*0.5, y:rand(50,H-50), collected:false, anim:rand(0,6.28) });
    }
    // Gold coin (rare)
    if (Math.random() < 0.04) {
      goldCoins.push({ x:nextWallX+rand(-15,15), y:gapY, collected:false, anim:rand(0,6.28) });
    }
    // Blue diamond
    if (Math.random() < 0.05) {
      blueDiamonds.push({ x:nextWallX+rand(5,35), y:gapY+rand(-15,15), collected:false, anim:rand(0,6.28) });
    }
  }
}

function drawWalls(time) {
  const theme = getTheme();
  for (const w of walls) {
    const sx = w.x - cameraX;
    if (sx < -80 || sx > W+80) continue;
    const wallW = w.type === 1 ? 48 : 30;
    const topH = w.gapY - w.gapH/2;
    const botY = w.gapY + w.gapH/2;

    drawWallBlock(sx, 0, wallW, topH, theme, w.hit);
    drawWallBlock(sx, botY, wallW, H-botY, theme, w.hit);

    if (!w.hit) {
      ctx.shadowColor = theme.edge; ctx.shadowBlur = 10;
      ctx.strokeStyle = theme.edge; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx,topH); ctx.lineTo(sx+wallW,topH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx,botY); ctx.lineTo(sx+wallW,botY); ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
}

function drawWallBlock(x,y,w,h,theme,hit) {
  if (h<=0) return;
  ctx.fillStyle = hit ? 'rgba(255,50,50,0.35)' : theme.wall;
  ctx.fillRect(x,y,w,h);

  const ts = 25;
  ctx.strokeStyle = hit ? 'rgba(255,100,100,0.12)' : hexToRgba(theme.wallEdge, 0.2);
  ctx.lineWidth = 0.5; ctx.beginPath();
  for (let gx = x; gx <= x+w; gx += ts) { ctx.moveTo(gx,y); ctx.lineTo(gx,y+h); }
  for (let gy = y-(y%ts); gy <= y+h; gy += ts) { if (gy>=y) { ctx.moveTo(x,gy); ctx.lineTo(x+w,gy); } }
  ctx.stroke();

  ctx.strokeStyle = hit ? 'rgba(255,80,80,0.4)' : theme.wallEdge;
  ctx.lineWidth = 1.5; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);

  const eg = ctx.createLinearGradient(x,0,x+6,0);
  eg.addColorStop(0, hit ? 'rgba(255,80,80,0.2)' : hexToRgba(theme.wallEdge,0.25));
  eg.addColorStop(1, 'transparent');
  ctx.fillStyle = eg; ctx.fillRect(x,y,6,h);
}

// ─── BOUNDARY WALLS ────────────────────────────────────────────
function drawBoundaryWalls() {
  const theme = getTheme();
  const bh = 8;
  ctx.fillStyle = theme.wall; ctx.fillRect(0,0,W,bh);
  ctx.shadowColor = theme.edge; ctx.shadowBlur = 8;
  ctx.strokeStyle = theme.edge; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,bh); ctx.lineTo(W,bh); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = theme.wall; ctx.fillRect(0,H-bh,W,bh);
  ctx.shadowColor = theme.edge; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0,H-bh); ctx.lineTo(W,H-bh); ctx.stroke(); ctx.shadowBlur = 0;
}

// ─── COLLECTIBLES ──────────────────────────────────────────────
function drawDiamond(d, time) {
  if (d.collected) return;
  const sx = d.x - cameraX;
  if (sx<-30||sx>W+30) return;
  const bob = Math.sin(time*0.003+d.anim)*5;
  ctx.save(); ctx.translate(sx, d.y+bob);
  ctx.rotate(Math.sin(time*0.002+d.anim)*0.2);
  const sz=13;
  ctx.shadowColor='#7DF900'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz,0); ctx.lineTo(0,sz); ctx.lineTo(-sz,0); ctx.closePath();
  ctx.fillStyle='#7DF900'; ctx.fill();
  ctx.strokeStyle='#A4FF44'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.moveTo(0,-sz*0.5); ctx.lineTo(sz*0.35,0); ctx.lineTo(0,sz*0.1); ctx.lineTo(-sz*0.1,-sz*0.1); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
}

function drawGoldCoin(gc, time) {
  if (gc.collected) return;
  const sx = gc.x-cameraX;
  if (sx<-30||sx>W+30) return;
  const bob = Math.sin(time*0.004+gc.anim)*4;
  const scaleX = Math.abs(Math.cos(time*0.003+gc.anim));
  ctx.save(); ctx.translate(sx,gc.y+bob); ctx.scale(0.3+scaleX*0.7,1);
  ctx.shadowColor='#FDE047'; ctx.shadowBlur=18;
  ctx.fillStyle='#FDE047';
  ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#EAB308'; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0; ctx.fillStyle='#EAB308';
  ctx.font=arcadeFont(10); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('★',0,1);
  ctx.restore();
}

function drawBlueDiamondObj(bd, time) {
  if (bd.collected) return;
  const sx = bd.x-cameraX;
  if (sx<-30||sx>W+30) return;
  const bob = Math.sin(time*0.003+bd.anim)*6;
  const pulse = 0.9+Math.sin(time*0.005+bd.anim)*0.1;
  ctx.save(); ctx.translate(sx,bd.y+bob); ctx.scale(pulse,pulse);
  const sz=12;
  ctx.shadowColor='#3B82F6'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz,0); ctx.lineTo(0,sz); ctx.lineTo(-sz,0); ctx.closePath();
  const g=ctx.createLinearGradient(-sz,-sz,sz,sz);
  g.addColorStop(0,'#3B82F6'); g.addColorStop(1,'#60A5FA');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#93C5FD'; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0; ctx.restore();
}

// ─── SPACESHIP ─────────────────────────────────────────────────
function drawShip(time) {
  if (state === STATE.DEAD && deathTimer > 0.25) return;

  const sx = SHIP_X, sy = ship.y;

  if (invincTimer > 0 && Math.floor(invincTimer*10)%2===0) ctx.globalAlpha = 0.5;

  // Engine trail
  if (state === STATE.PLAYING) {
    const tc = superBoostTimer>0 ? '#FDE047' : '#22D3EE';
    ship.trail.push({ x:sx-SHIP_W*0.5, y:sy, life:0.3, maxLife:0.3, color:tc, size:rand(3,5) });
    if (ship.trail.length>22) ship.trail.shift();
  }
  for (let i=ship.trail.length-1;i>=0;i--) {
    const t=ship.trail[i]; t.x-=2.5; t.life-=0.016;
    if(t.life<=0){ship.trail.splice(i,1);continue;}
    const a=(t.life/t.maxLife)*0.35;
    ctx.globalAlpha=a; ctx.fillStyle=t.color;
    ctx.shadowColor=t.color; ctx.shadowBlur=5;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.size*(t.life/t.maxLife),0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  if (invincTimer>0&&Math.floor(invincTimer*10)%2===0) ctx.globalAlpha=0.5;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(ship.bankAngle);

  // Super boost aura
  if (superBoostTimer>0) {
    ctx.shadowColor='#FDE047'; ctx.shadowBlur=35;
    ctx.fillStyle='rgba(253,224,71,0.12)';
    ctx.beginPath(); ctx.arc(0,0,SHIP_W*0.8,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // ── Engine flame ──
  ship.flamePhase += 0.3;
  const flameLen = 20+Math.sin(ship.flamePhase*3)*5+(superBoostTimer>0?14:0);
  const flameW = 10+Math.sin(ship.flamePhase*5)*3;

  const fg = ctx.createLinearGradient(-SHIP_W*0.5-flameLen,0,-SHIP_W*0.5,0);
  fg.addColorStop(0,'transparent');
  fg.addColorStop(0.3, superBoostTimer>0?'rgba(253,224,71,0.6)':'rgba(255,46,196,0.5)');
  fg.addColorStop(0.7, superBoostTimer>0?'rgba(253,224,71,0.8)':'rgba(168,85,247,0.7)');
  fg.addColorStop(1,'rgba(34,211,238,0.9)');
  ctx.fillStyle=fg;
  ctx.beginPath();
  ctx.moveTo(-SHIP_W*0.5,-flameW);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.7,0,-SHIP_W*0.5-flameLen,0);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.7,0,-SHIP_W*0.5,flameW);
  ctx.closePath(); ctx.fill();

  const ig = ctx.createLinearGradient(-SHIP_W*0.5-flameLen*0.6,0,-SHIP_W*0.5,0);
  ig.addColorStop(0,'transparent');
  ig.addColorStop(0.5,'rgba(255,255,255,0.4)');
  ig.addColorStop(1,'rgba(255,255,255,0.8)');
  ctx.fillStyle=ig;
  ctx.beginPath();
  ctx.moveTo(-SHIP_W*0.5,-flameW*0.4);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.4,0,-SHIP_W*0.5-flameLen*0.6,0);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.4,0,-SHIP_W*0.5,flameW*0.4);
  ctx.closePath(); ctx.fill();

  // ── Ship body ──
  const hg = ctx.createLinearGradient(0,-SHIP_H*0.6,0,SHIP_H*0.6);
  hg.addColorStop(0,'#C084FC');
  hg.addColorStop(0.3,'#A855F7');
  hg.addColorStop(0.5,'#7C3AED');
  hg.addColorStop(0.7,'#22D3EE');
  hg.addColorStop(1,'#0E7490');

  // Tint hull red when damaged
  ctx.beginPath();
  ctx.moveTo(SHIP_W*0.55,0);
  ctx.quadraticCurveTo(SHIP_W*0.3,-SHIP_H*0.35,SHIP_W*0.05,-SHIP_H*0.4);
  ctx.lineTo(-SHIP_W*0.4,-SHIP_H*0.35);
  ctx.lineTo(-SHIP_W*0.5,-SHIP_H*0.15);
  ctx.lineTo(-SHIP_W*0.5,SHIP_H*0.15);
  ctx.lineTo(-SHIP_W*0.4,SHIP_H*0.35);
  ctx.lineTo(SHIP_W*0.05,SHIP_H*0.4);
  ctx.quadraticCurveTo(SHIP_W*0.3,SHIP_H*0.35,SHIP_W*0.55,0);
  ctx.closePath();
  ctx.fillStyle=hg; ctx.fill();

  // Damage tint
  if (damageLevel >= 1) {
    ctx.globalAlpha = 0.15 + damageLevel * 0.1;
    ctx.fillStyle = '#FF4444'; ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.shadowColor='#67E8F9'; ctx.shadowBlur=10;
  ctx.strokeStyle='#67E8F9'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.shadowBlur=0;

  // Cockpit
  const cg = ctx.createRadialGradient(SHIP_W*0.15,-2,0,SHIP_W*0.15,-2,10);
  cg.addColorStop(0,'rgba(255,255,255,0.7)');
  cg.addColorStop(0.5,'rgba(103,232,249,0.5)');
  cg.addColorStop(1,'rgba(34,211,238,0.2)');
  ctx.fillStyle=cg;
  ctx.beginPath(); ctx.ellipse(SHIP_W*0.15,-1,8,5,-0.15,0,Math.PI*2); ctx.fill();

  // Top fin
  ctx.fillStyle='#7C3AED';
  ctx.beginPath(); ctx.moveTo(-SHIP_W*0.2,-SHIP_H*0.38); ctx.lineTo(-SHIP_W*0.35,-SHIP_H*0.7); ctx.lineTo(-SHIP_W*0.42,-SHIP_H*0.35); ctx.closePath();
  ctx.fill(); ctx.strokeStyle='#A855F7'; ctx.lineWidth=1; ctx.stroke();

  // Bottom fin
  ctx.fillStyle='#7C3AED';
  ctx.beginPath(); ctx.moveTo(-SHIP_W*0.2,SHIP_H*0.38); ctx.lineTo(-SHIP_W*0.35,SHIP_H*0.7); ctx.lineTo(-SHIP_W*0.42,SHIP_H*0.35); ctx.closePath();
  ctx.fill(); ctx.strokeStyle='#A855F7'; ctx.lineWidth=1; ctx.stroke();

  // Highlight
  ctx.globalAlpha=0.12; ctx.fillStyle='#FFF';
  ctx.beginPath(); ctx.moveTo(SHIP_W*0.5,0);
  ctx.quadraticCurveTo(SHIP_W*0.25,-SHIP_H*0.3,-SHIP_W*0.1,-SHIP_H*0.32);
  ctx.lineTo(-SHIP_W*0.1,-SHIP_H*0.05);
  ctx.quadraticCurveTo(SHIP_W*0.2,-SHIP_H*0.05,SHIP_W*0.5,0);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;

  // Damage scorch marks
  if (damageLevel >= 1) {
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.ellipse(-SHIP_W*0.15, SHIP_H*0.2, 6, 3, 0.3, 0, Math.PI*2); ctx.fill();
    if (damageLevel >= 2) {
      ctx.beginPath(); ctx.ellipse(SHIP_W*0.1, -SHIP_H*0.15, 8, 4, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-SHIP_W*0.3, 0, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

// ─── WRECKAGE ON DEATH SCREEN ──────────────────────────────────
function drawWreckage(time) {
  const wx = wreckageX, wy = wreckageY;
  ctx.save();
  ctx.translate(wx, wy);
  ctx.rotate(0.3); // tilted wreck

  // Broken hull pieces
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.moveTo(-15,-8); ctx.lineTo(10,-12); ctx.lineTo(15,0); ctx.lineTo(-5,10); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.moveTo(5,-5); ctx.lineTo(20,-3); ctx.lineTo(18,8); ctx.lineTo(0,6); ctx.closePath();
  ctx.fill();

  // Red damage glow
  ctx.globalAlpha = 0.3 + Math.sin(time*0.005)*0.1;
  ctx.fillStyle = '#FF4444';
  ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();

  // Rising smoke from wreckage
  const smokeCount = 3 + Math.floor(Math.sin(time*0.002)*2);
  for (let i = 0; i < smokeCount; i++) {
    const phase = time*0.001 + i*1.5;
    const sx2 = wx + Math.sin(phase*0.7)*8;
    const sy2 = wy - 10 - ((phase*20)%40);
    const sz2 = 4 + ((phase*5)%8);
    const a2 = 0.15 - ((phase*4)%0.15);
    if (a2 > 0) {
      ctx.globalAlpha = a2;
      ctx.fillStyle = '#555';
      ctx.beginPath(); ctx.arc(sx2, sy2, sz2, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ─── UPDATE ────────────────────────────────────────────────────
function updateShip(dt) {
  if (state !== STATE.PLAYING) return;

  const dy = ship.targetY - ship.y;
  ship.vy = dy * 8;
  ship.vy = clamp(ship.vy, -SHIP_SPEED, SHIP_SPEED);
  ship.y += ship.vy * dt;
  ship.y = clamp(ship.y, 25, H-25);

  const targetBank = clamp(ship.vy/SHIP_SPEED*0.4, -0.4, 0.4);
  ship.bankAngle = lerp(ship.bankAngle, targetBank, 0.15);

  if (invincTimer>0) invincTimer-=dt;
  if (hitFlashTimer>0) hitFlashTimer-=dt;
  if (superBoostTimer>0) superBoostTimer-=dt;
  if (jackpotTimer>0) { jackpotTimer-=dt; jackpotScoreAnim=Math.min(10000,jackpotScoreAnim+dt*8000); }
  if (levelUpFlash>0) levelUpFlash-=dt;
  if (levelWarpTimer>0) levelWarpTimer-=dt;
  if (blueDiamondHudFlash>0) blueDiamondHudFlash-=dt;

  // Engine particles
  if (Math.random()<0.4) {
    const col = superBoostTimer>0?'#FDE047':(Math.random()<0.5?'#FF2EC4':'#A855F7');
    spawnP(SHIP_X-SHIP_W*0.5-rand(5,15),ship.y+rand(-4,4),col,rand(-3,-6),rand(-0.5,0.5),rand(0.12,0.25),rand(1.5,3),0);
  }
}

function checkCollisions() {
  if (state !== STATE.PLAYING) return;

  const sl = SHIP_X-SHIP_W*0.38+cameraX, sr = SHIP_X+SHIP_W*0.38+cameraX;
  const st = ship.y-SHIP_H*0.32, sb = ship.y+SHIP_H*0.32;

  // Walls
  for (const w of walls) {
    if (w.hit&&w.passed) continue;
    const ww = w.type===1?48:30;
    if (sr>w.x && sl<w.x+ww) {
      const topH = w.gapY-w.gapH/2;
      const botY = w.gapY+w.gapH/2;
      if (st<topH || sb>botY) {
        if (superBoostTimer>0) { if(!w.hit){w.hit=true;spawnBurst(SHIP_X,ship.y,'#FDE047',15,4,0.4,4);score+=50;} continue; }
        if (invincTimer<=0&&!w.hit) { w.hit=true; takeDamage(); }
      } else if (!w.passed) { w.passed=true; score+=10; }
    }
  }

  // Boundaries
  if (st<8||sb>H-8) { if(invincTimer<=0&&superBoostTimer<=0) takeDamage(); }

  // Diamonds
  for (const d of diamonds) {
    if (d.collected) continue;
    if (Math.abs((SHIP_X+cameraX)-d.x)<28 && Math.abs(ship.y-d.y)<28) {
      d.collected = true;
      diamondsCollected++; totalCoinsAll++;
      const pts = 1000;
      score += pts;
      // MASSIVE green orb burst
      spawnOrbBurst(d.x-cameraX, d.y, ['#7DF900','#A4FF44','#22D3EE','#67E8F9','#FFFFFF'], 60, 8);
      shakeDur = 0.15; screenFlash = 0.15; screenFlashColor = '#7DF900';
      // GIANT floating score
      addFloatingText(d.x-cameraX, d.y-25, '+'+pts.toLocaleString(), '#7DF900', 22);
    }
  }

  // Gold coins
  for (const gc of goldCoins) {
    if (gc.collected) continue;
    if (Math.abs((SHIP_X+cameraX)-gc.x)<28 && Math.abs(ship.y-gc.y)<28) {
      gc.collected = true; goldCoinsCollected++;
      const pts = 2000;
      score += pts;
      // MASSIVE gold orb burst
      spawnOrbBurst(gc.x-cameraX, gc.y, ['#FDE047','#FEF08A','#EAB308','#FFFFFF','#FFD700'], 80, 10);
      shakeDur = 0.2; screenFlash = 0.2; screenFlashColor = '#FDE047';
      addFloatingText(gc.x-cameraX, gc.y-25, '★ +'+pts.toLocaleString(), '#FDE047', 24);

      if (goldCoinsCollected >= 3) {
        // LEVEL WARP!
        goldCoinsCollected = 0;
        levelWarpFrom = getTheme();
        level++;
        levelWarpTimer = 2.0;
        levelUpFlash = 2.0;
        scrollSpeed = Math.min(maxSpeed, baseSpeed+(level-1)*22);
        shakeDur = 0.6;
        screenFlash = 0.8; screenFlashColor = '#FFFFFF';
        // Massive warp burst
        spawnOrbBurst(W/2, H/2, ['#FFFFFF','#FDE047','#A855F7','#22D3EE','#FF2EC4','#7DF900'], 150, 14);
        addFloatingText(W/2, H/2-40, 'LEVEL '+level+'!', '#FFFFFF', 30);
        addFloatingText(W/2, H/2+10, getTheme().name, getTheme().edge, 14);
        score += 10000;
        jackpotTimer = 2.5; jackpotScoreAnim = 0;
      }
    }
  }

  // Blue diamonds
  for (const bd of blueDiamonds) {
    if (bd.collected) continue;
    if (Math.abs((SHIP_X+cameraX)-bd.x)<28 && Math.abs(ship.y-bd.y)<28) {
      bd.collected = true; blueDiamondsCollected++; blueDiamondHudFlash = 0.5;
      spawnOrbBurst(bd.x-cameraX, bd.y, ['#3B82F6','#60A5FA','#93C5FD','#FFFFFF'], 40, 6);
      shakeDur = 0.1; screenFlash = 0.1; screenFlashColor = '#3B82F6';
      addFloatingText(bd.x-cameraX, bd.y-20, '◆ BOOST', '#60A5FA', 14);
      if (blueDiamondsCollected >= 3) {
        blueDiamondsCollected = 0; superBoostTimer = 5;
        screenFlash = 0.6; screenFlashColor = '#3B82F6'; shakeDur = 0.3;
        spawnOrbBurst(SHIP_X, ship.y, ['#3B82F6','#FDE047','#FFFFFF'], 80, 10);
        addFloatingText(W/2, H/3, '⚡ SUPER BOOST! ⚡', '#FDE047', 20);
      }
    }
  }
}

function takeDamage() {
  health--;
  damageLevel = maxHealth - health;
  invincTimer=1.5; hitFlashTimer=0.3; shakeDur=0.4;
  screenFlash=0.3; screenFlashColor='#FF4444';
  spawnBurst(SHIP_X, ship.y, '#FF4444', 25, 5, 0.5, 4);
  if (health<=0) die();
  else addFloatingText(SHIP_X, ship.y-35, '-1 ❤', '#FF4444', 16);
}

function die() {
  state = STATE.DEAD; deathTimer = 0; damageLevel = 3;
  wreckageX = SHIP_X; wreckageY = ship.y;
  spawnDeathExplosion(SHIP_X, ship.y);
  shakeDur = 0.8; screenFlash = 0.6; screenFlashColor = '#FF2222';
  if (score>highScore) { highScore=Math.floor(score); localStorage.setItem('wr_m2_hi',highScore); }
  localStorage.setItem('wr_m2_coins',totalCoinsAll);
  attempt++; localStorage.setItem('wr_m2_attempt',attempt);
}

function startGame() {
  state = STATE.PLAYING;
  score=0; distance=0; health=3; damageLevel=0;
  invincTimer=0; hitFlashTimer=0;
  diamondsCollected=0; goldCoinsCollected=0; blueDiamondsCollected=0;
  superBoostTimer=0; jackpotTimer=0;
  level=1; levelUpFlash=0; levelWarpTimer=0;
  scrollSpeed=baseSpeed; cameraX=0; nextWallX=W*0.7;
  ship.y=H/2; ship.vy=0; ship.targetY=H/2; ship.bankAngle=0; ship.trail=[];
  walls=[]; diamonds=[]; goldCoins=[]; blueDiamonds=[];
  particles=[]; deathParticles=[]; persistentSmoke=[]; floatingTexts=[];
  shakeX=0; shakeY=0; shakeDur=0; screenFlash=0; deathTimer=0; blueDiamondHudFlash=0;
  runStartTime = performance.now();
  generateWalls();
}

function update(dt) {
  processKeyboardInput(dt);

  if (state === STATE.DEAD) {
    deathTimer += dt;
    updateParticles(dt); updateFloatingTexts(dt);
    // Keep smoking on death
    if (deathTimer > 0.5) {
      if (Math.random()<0.3) {
        persistentSmoke.push({
          x:wreckageX+rand(-10,10), y:wreckageY+rand(-8,5),
          size:rand(3,8), maxSize:rand(12,22), life:rand(0.5,1.2), maxLife:1.2,
          vx:rand(-1.5,0), vy:rand(-2,-0.5), color:'rgba(50,50,50,0.6)', dark:true,
        });
      }
    }
    updatePersistentSmoke(dt);
    if (shakeDur>0) { shakeDur-=dt; shakeX=rand(-6,6)*(shakeDur/0.8); shakeY=rand(-6,6)*(shakeDur/0.8); }
    else { shakeX=0;shakeY=0; }
    if (screenFlash>0) screenFlash-=dt*2;
    return;
  }
  if (state !== STATE.PLAYING) return;

  const effSpeed = superBoostTimer>0 ? scrollSpeed*1.3 : scrollSpeed;
  cameraX += effSpeed*dt; distance += effSpeed*dt;
  score += effSpeed*dt*0.03;

  // Speed ramp — "hotter"
  scrollSpeed = Math.min(maxSpeed, baseSpeed + distance*0.006 + (level-1)*20);

  generateWalls();
  updateShip(dt);
  checkCollisions();
  updateParticles(dt);
  updatePersistentSmoke(dt);
  updateFloatingTexts(dt);

  const cleanX = cameraX-200;
  walls=walls.filter(w=>w.x+60>cleanX);
  diamonds=diamonds.filter(d=>d.x>cleanX);
  goldCoins=goldCoins.filter(g=>g.x>cleanX);
  blueDiamonds=blueDiamonds.filter(b=>b.x>cleanX);

  if (shakeDur>0) { shakeDur-=dt; shakeX=rand(-8,8)*(shakeDur/0.5); shakeY=rand(-8,8)*(shakeDur/0.5); }
  else { shakeX=0;shakeY=0; }
  if (screenFlash>0) screenFlash-=dt*2;
}

// ─── HUD ───────────────────────────────────────────────────────
function drawHUD() {
  const pad=12;
  const theme=getTheme();

  // Progress bar
  const barH=5, barY=pad;
  const progress = clamp(distance/(4000+level*1500),0,1);
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.fillRect(W*0.15,barY,W*0.7,barH);
  const bg2=ctx.createLinearGradient(W*0.15,0,W*0.15+W*0.7*progress,0);
  bg2.addColorStop(0,'#7DF900'); bg2.addColorStop(1,'#A4FF44');
  ctx.fillStyle=bg2; ctx.shadowColor='#7DF900'; ctx.shadowBlur=6;
  ctx.fillRect(W*0.15,barY,W*0.7*progress,barH);
  ctx.shadowBlur=0;
  ctx.font=arcadeFont(9); ctx.fillStyle='#FFF'; ctx.textAlign='right';
  ctx.fillText(Math.floor(progress*100)+'%', W*0.15+W*0.7+40, barY+barH+1);

  // Score pill
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(pad+8,pad+20,170,30,15); ctx.fill();
  ctx.font=arcadeFont(10); ctx.fillStyle='#FDE047'; ctx.textAlign='left';
  ctx.fillText('★ '+Math.floor(score).toLocaleString(), pad+20, pad+40);

  // Level pill
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(pad+8,pad+58,140,26,13); ctx.fill();
  ctx.font=arcadeFont(8); ctx.fillStyle=theme.edge;
  ctx.fillText('LV '+level+' '+theme.name.split(' ')[0], pad+18, pad+76);

  // Hearts
  const heartX=W-pad-10, heartY=pad+32;
  ctx.font=arcadeFont(14); ctx.textAlign='right';
  for (let i=0;i<3;i++) {
    const hx=heartX-(2-i)*28;
    if (i<health) { ctx.fillStyle='#FF4444'; ctx.shadowColor='#FF4444'; ctx.shadowBlur=8; }
    else { ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.shadowBlur=0; }
    ctx.fillText('♥',hx,heartY);
  }
  ctx.shadowBlur=0;

  // Diamond counter
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(W-pad-120,heartY+14,120,26,13); ctx.fill();
  ctx.font=arcadeFont(8); ctx.fillStyle='#7DF900'; ctx.textAlign='right';
  ctx.fillText('◆ '+diamondsCollected, W-pad-14, heartY+34);

  // Gold coin counter — prominent!
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(W-pad-100,heartY+46,100,28,14); ctx.fill();
  ctx.font=arcadeFont(10); ctx.fillStyle='#FDE047';
  ctx.fillText('★ '+goldCoinsCollected+'/3', W-pad-14, heartY+66);
  // Glow when close to 3
  if (goldCoinsCollected >= 2) {
    const pulse = 0.3+Math.sin(performance.now()*0.01)*0.2;
    ctx.globalAlpha=pulse; ctx.strokeStyle='#FDE047'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(W-pad-100,heartY+46,100,28,14); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // Boost slots bottom-left
  const slotX=pad+10, slotY=H-50;
  for (let i=0;i<3;i++) {
    const sx2=slotX+i*32;
    ctx.beginPath();
    ctx.moveTo(sx2+10,slotY-12); ctx.lineTo(sx2+22,slotY); ctx.lineTo(sx2+10,slotY+12); ctx.lineTo(sx2-2,slotY);
    ctx.closePath();
    if (i<blueDiamondsCollected) {
      ctx.fillStyle='#3B82F6'; ctx.shadowColor='#3B82F6'; ctx.shadowBlur=10; ctx.fill();
    } else { ctx.strokeStyle='rgba(59,130,246,0.3)'; ctx.lineWidth=2; ctx.stroke(); }
    ctx.shadowBlur=0;
  }
  if (blueDiamondHudFlash>0) {
    ctx.globalAlpha=blueDiamondHudFlash; ctx.fillStyle='#3B82F6';
    ctx.fillRect(slotX-5,slotY-18,100,36); ctx.globalAlpha=1;
  }
  if (superBoostTimer>0) {
    const p2=0.7+Math.sin(performance.now()*0.01)*0.3;
    ctx.globalAlpha=p2; ctx.font=arcadeFont(10); ctx.fillStyle='#FDE047';
    ctx.textAlign='left'; ctx.shadowColor='#FDE047'; ctx.shadowBlur=10;
    ctx.fillText('⚡ BOOST '+superBoostTimer.toFixed(1)+'s', slotX, slotY+28);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Jackpot/level warp overlay
  if (jackpotTimer>0) {
    const p2=0.5+Math.sin(performance.now()*0.015)*0.3;
    ctx.globalAlpha=p2; ctx.font=arcadeFont(20); ctx.fillStyle='#FDE047';
    ctx.textAlign='center'; ctx.shadowColor='#FDE047'; ctx.shadowBlur=20;
    ctx.fillText('★ LEVEL WARP! ★', W/2, H/2-15);
    ctx.font=arcadeFont(14);
    ctx.fillText('+'+Math.floor(jackpotScoreAnim).toLocaleString(), W/2, H/2+18);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Level up
  if (levelUpFlash>0 && jackpotTimer<=0) {
    const a=Math.min(1,levelUpFlash);
    ctx.globalAlpha=a*0.8; ctx.font=arcadeFont(22); ctx.fillStyle=theme.edge;
    ctx.textAlign='center'; ctx.shadowColor=theme.edge; ctx.shadowBlur=20;
    ctx.fillText('LEVEL '+level, W/2, H*0.35);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Hit flash
  if (hitFlashTimer>0) {
    ctx.globalAlpha=hitFlashTimer*0.4; ctx.fillStyle='#FF0000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
}

// ─── MENU SCREEN ───────────────────────────────────────────────
function drawMenuScreen() {
  const time = performance.now();
  ctx.fillStyle='rgba(5,10,25,0.6)'; ctx.fillRect(0,0,W,H);

  const titleY = H*0.25;
  const pulse = 1+Math.sin(time*0.003)*0.03;
  ctx.save(); ctx.translate(W/2,titleY); ctx.scale(pulse,pulse);
  ctx.shadowColor='#A855F7'; ctx.shadowBlur=30;
  ctx.font=arcadeFont(Math.min(34,W*0.042));
  ctx.fillStyle='#FFF'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('WISH RUNNER',0,0);
  ctx.shadowBlur=0;
  ctx.font=arcadeFont(Math.min(11,W*0.015)); ctx.fillStyle='#22D3EE';
  ctx.fillText('SPACE MAZE CHALLENGE',0,34);
  ctx.restore();

  ctx.font=arcadeFont(Math.min(12,W*0.017)); ctx.fillStyle=getTheme().edge; ctx.textAlign='center';
  ctx.fillText(getTheme().name, W/2, titleY+64);

  const btnR=Math.min(50,W*0.055), btnY=H*0.55;
  const bp=1+Math.sin(time*0.004)*0.05;
  ctx.save(); ctx.translate(W/2,btnY); ctx.scale(bp,bp);
  ctx.strokeStyle='#FFF'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(0,0,btnR+8,0,Math.PI*2); ctx.stroke();
  ctx.shadowColor='#7DF900'; ctx.shadowBlur=25;
  ctx.fillStyle='#7DF900';
  ctx.beginPath(); ctx.arc(0,0,btnR,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#5BC700'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#FFF';
  ctx.beginPath(); ctx.moveTo(-btnR*0.22,-btnR*0.32); ctx.lineTo(-btnR*0.22,btnR*0.32); ctx.lineTo(btnR*0.32,0); ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.font=arcadeFont(Math.min(9,W*0.013)); ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.textAlign='center';
  ctx.fillText('TAP / CLICK TO PLAY', W/2, btnY+btnR+30);
  ctx.font=arcadeFont(Math.min(7,W*0.01)); ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.fillText('DRAG / ARROWS / MOUSE TO STEER', W/2, btnY+btnR+48);

  ctx.font=arcadeFont(Math.min(10,W*0.014)); ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('ATTEMPT '+attempt, W/2, H*0.84);
  if (highScore>0) { ctx.fillStyle='#FDE047'; ctx.fillText('★ BEST: '+highScore.toLocaleString(), W/2, H*0.9); }
}

// ─── DEATH SCREEN ──────────────────────────────────────────────
function drawGameOverScreen() {
  if (deathTimer<0.3) return;
  const revealT=clamp((deathTimer-0.3)/0.8,0,1);
  const alpha=easeOutCubic(revealT);
  ctx.fillStyle=`rgba(5,10,20,${alpha*0.75})`; ctx.fillRect(0,0,W,H);
  if (revealT<0.1) return;
  ctx.globalAlpha=alpha;

  // Wreckage behind panel
  if (deathTimer > 0.5) drawWreckage(performance.now());

  const panelW=Math.min(400,W*0.65), panelH=Math.min(310,H*0.7);
  const panelX=(W-panelW)/2, panelY=(H-panelH)/2;

  ctx.fillStyle='rgba(15,25,50,0.93)';
  ctx.beginPath(); ctx.roundRect(panelX,panelY,panelW,panelH,16); ctx.fill();
  ctx.strokeStyle='rgba(100,150,255,0.3)'; ctx.lineWidth=2; ctx.stroke();

  ctx.font=arcadeFont(Math.min(14,W*0.02)); ctx.fillStyle=getTheme().edge; ctx.textAlign='center';
  ctx.fillText('LEVEL '+level+' — '+getTheme().name, W/2, panelY+32);

  const statY=panelY+58, statGap=27;
  ctx.font=arcadeFont(Math.min(9,W*0.013));
  const elapsedSec=((performance.now()-runStartTime)/1000).toFixed(1);
  const progress=clamp(distance/(4000+level*1500)*100,0,100).toFixed(0);
  const wallsPassed=walls.filter(w=>w.passed).length;
  const stats=[
    ['ATTEMPT',''+attempt],['SCORE',Math.floor(score).toLocaleString()],
    ['WALLS',''+wallsPassed],['TIME',elapsedSec+'s'],
    ['PROGRESS',progress+'%'],['DIAMONDS',''+diamondsCollected],
  ];
  for (let i=0;i<stats.length;i++) {
    const sy=statY+i*statGap;
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.textAlign='left'; ctx.fillText(stats[i][0],panelX+25,sy);
    ctx.fillStyle='#FFF'; ctx.textAlign='right'; ctx.fillText(stats[i][1],panelX+panelW-25,sy);
  }

  if (Math.floor(score)>=highScore&&score>0) {
    ctx.font=arcadeFont(Math.min(11,W*0.015)); ctx.fillStyle='#FDE047'; ctx.textAlign='center';
    ctx.shadowColor='#FDE047'; ctx.shadowBlur=12;
    ctx.fillText('★ NEW BEST! ★', W/2, panelY+panelH-58);
    ctx.shadowBlur=0;
  }

  if (deathTimer>1.0) {
    const btnR2=Math.min(28,W*0.035), btnY2=panelY+panelH-24;
    const bp2=1+Math.sin(performance.now()*0.004)*0.05;
    ctx.save(); ctx.translate(W/2,btnY2); ctx.scale(bp2,bp2);
    ctx.strokeStyle='#FFF'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,btnR2+6,0,Math.PI*2); ctx.stroke();
    ctx.shadowColor='#7DF900'; ctx.shadowBlur=15;
    ctx.fillStyle='#7DF900';
    ctx.beginPath(); ctx.arc(0,0,btnR2,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle='#5BC700'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#FFF'; ctx.strokeStyle='#FFF'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,btnR2*0.4,-0.8,Math.PI*1.5,false); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(btnR2*0.15,-btnR2*0.5); ctx.lineTo(btnR2*0.45,-btnR2*0.25); ctx.lineTo(btnR2*0.05,-btnR2*0.15); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// ─── DRAW ──────────────────────────────────────────────────────
function draw() {
  const time = performance.now();
  ctx.clearRect(0,0,W,H);
  drawBackground(time);

  ctx.save(); ctx.translate(shakeX,shakeY);

  drawWalls(time);
  drawBoundaryWalls();

  for (const d of diamonds) drawDiamond(d,time);
  for (const gc of goldCoins) drawGoldCoin(gc,time);
  for (const bd of blueDiamonds) drawBlueDiamondObj(bd,time);

  // Smoke behind ship
  drawPersistentSmoke();

  if (state===STATE.PLAYING||state===STATE.DEAD) drawShip(time);

  drawParticles();
  drawFloatingTexts();
  ctx.restore();

  if (screenFlash>0) {
    ctx.globalAlpha=screenFlash*0.35; ctx.fillStyle=screenFlashColor;
    ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }

  if (state===STATE.PLAYING) drawHUD();
  if (state===STATE.MENU) drawMenuScreen();
  if (state===STATE.DEAD) drawGameOverScreen();
}

// ─── GAME LOOP ─────────────────────────────────────────────────
function loop(time) {
  requestAnimationFrame(loop);
  const dt = Math.min((time-lastTime)/1000,0.05);
  lastTime = time;
  update(dt);
  draw();
}

// ─── INPUT ─────────────────────────────────────────────────────
function handleTap() {
  if (state===STATE.MENU) { startGame(); return; }
  if (state===STATE.DEAD&&deathTimer>0.8) { startGame(); return; }
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (state!==STATE.PLAYING) { handleTap(); return; }
  isDragging=true;
  const touch=e.touches[0], rect=canvas.getBoundingClientRect();
  const isP=window.innerWidth<window.innerHeight&&window.innerWidth<900;
  dragStartY = isP?(rect.right-touch.clientX):(touch.clientY-rect.top);
  dragShipStartY = ship.targetY;
}, { passive:false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!isDragging||state!==STATE.PLAYING) return;
  const touch=e.touches[0], rect=canvas.getBoundingClientRect();
  const isP=window.innerWidth<window.innerHeight&&window.innerWidth<900;
  const currentY = isP?(rect.right-touch.clientX):(touch.clientY-rect.top);
  const scale = isP?(H/rect.width):(H/rect.height);
  ship.targetY = clamp(dragShipStartY+(currentY-dragStartY)*scale, 25, H-25);
}, { passive:false });

canvas.addEventListener('touchend', (e) => { e.preventDefault(); isDragging=false; }, { passive:false });

canvas.addEventListener('mousedown', (e) => {
  if (state!==STATE.PLAYING) { handleTap(); return; }
  useMouseFollow=true;
  const rect=canvas.getBoundingClientRect();
  ship.targetY = clamp((e.clientY-rect.top)*(H/rect.height), 25, H-25);
});
canvas.addEventListener('mousemove', (e) => {
  if (state!==STATE.PLAYING||!useMouseFollow) return;
  const rect=canvas.getBoundingClientRect();
  ship.targetY = clamp((e.clientY-rect.top)*(H/rect.height), 25, H-25);
});

document.addEventListener('keydown', (e) => {
  if (e.code==='Space'||e.code==='Enter') { e.preventDefault(); handleTap(); return; }
  keysDown[e.code]=true;
  if (['ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code)) { e.preventDefault(); useMouseFollow=false; }
});
document.addEventListener('keyup', (e) => { keysDown[e.code]=false; });

function processKeyboardInput(dt) {
  if (state!==STATE.PLAYING||useMouseFollow) return;
  let dir=0;
  if (keysDown['ArrowUp']||keysDown['KeyW']) dir-=1;
  if (keysDown['ArrowDown']||keysDown['KeyS']) dir+=1;
  if (dir!==0) ship.targetY = clamp(ship.targetY+dir*SHIP_SPEED*dt, 25, H-25);
}

document.addEventListener('touchmove', (e) => e.preventDefault(), { passive:false });

// ─── INIT ──────────────────────────────────────────────────────
resize();
lastTime = performance.now();
requestAnimationFrame(loop);
</script>
