<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wish Runner — WishPath</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0B001F;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─── SETUP ──────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ─── COSMIC PALETTE ─────────────────────────────────────────────
const COL = {
  bg: '#0B001F',
  deepBg: '#05000F',
  purple: '#A855F7',
  purpleDark: '#7C3AED',
  purpleDeep: '#5B21B6',
  cyan: '#22D3EE',
  cyanGlow: '#67E8F9',
  gold: '#FDE047',
  goldLight: '#FEF08A',
  goldDark: '#EAB308',
  magenta: '#FF2EC4',
  magentaGlow: '#FF6BD6',
  emerald: '#00FF9F',
  emeraldSoft: '#6EFFCB',
  white: '#ffffff',
  blue: '#3B82F6',
  pink: '#EC4899',
  gridDim: 'rgba(168, 85, 247, 0.06)',
  gridBright: 'rgba(168, 85, 247, 0.18)',
};

// ─── STATE ──────────────────────────────────────────────────────
const STATE = { MENU: 0, PLAYING: 1, DEAD: 2 };
let state = STATE.MENU;
let score = 0, distance = 0, orbsCollected = 0, combo = 0, comboTimer = 0, maxCombo = 0;
let speed = 0.9, baseSpeed = 0.9, maxSpeed = 11, speedTimer = 0;
let highScore = parseInt(localStorage.getItem('wp_game_highscore')) || 0;
let totalCoins = parseInt(localStorage.getItem('wp_game_coins')) || 0;
let isNewHighScore = false;

// Player
const player = {
  lane: 1, targetLane: 1,
  x: 0, y: 0,
  jumpY: 0, jumpVel: 0, isJumping: false,
  slideTimer: 0, isSliding: false,
  height: 94, width: 65,
  animPhase: 0,
  collectBoost: 0, // brief engine boost after collecting
};

// Path perspective constants
const HORIZON_Y = 0.28;
const PATH_BOTTOM_W = 0.85;
const PATH_TOP_W = 0.08;
const LANE_COUNT = 3;

// Obstacles + orbs
let obstacles = [];
let orbs = [];
let spawnTimer = 0;
let orbSpawnTimer = 0;
let distanceMarkerFlash = 0;
let lastMarkerDistance = 0;

// Particles — object pooled (1000 cap during jackpot)
const MAX_PARTICLES = 1000;
let particles = [];
let sparkles = []; // persistent path-edge sparkles

// Gold Coin Jackpot System
let goldCoins = []; // active gold coin objects on path
let goldCoinsCollected = 0; // 0-2, triggers jackpot at 3
let goldCoinSpawnDist = 0; // distance until next gold coin spawns
let nextGoldCoinAt = rand(800, 1500); // first spawn distance
let jackpotTimer = 0; // countdown for jackpot celebration (2.5s)
let jackpotScoreAnim = 0; // animated score bonus rolling up
let goldCoinHudFlash = 0; // HUD flash when coin collected
let totalJackpots = 0; // jackpots hit this run

// Screen shake + health
let health = 3, invincTimer = 0, hitFlashTimer = 0, damageLevel = 0;
let shakeX = 0, shakeY = 0, shakeDur = 0;
let screenFlash = 0, screenFlashColor = COL.gold;
let floatingTexts = [];

// Level system
let level = 1, levelUpFlash = 0, slowMoTimer = 0;
const ORBS_PER_LEVEL = 8;

// Environment phase colors — cycle through cosmic themes
const ENV_PHASES = [
  { edge: '#A855F7', grid: 'rgba(168, 85, 247,', glow: '#C084FC', nebula: 'rgba(168, 85, 247, 0.03)' },  // purple
  { edge: '#3B82F6', grid: 'rgba(59, 130, 246,', glow: '#60A5FA', nebula: 'rgba(59, 130, 246, 0.03)' },   // blue
  { edge: '#22D3EE', grid: 'rgba(34, 211, 238,', glow: '#67E8F9', nebula: 'rgba(34, 211, 238, 0.03)' },   // cyan
  { edge: '#FDE047', grid: 'rgba(253, 224, 71,', glow: '#FEF08A', nebula: 'rgba(253, 224, 71, 0.02)' },   // gold
  { edge: '#FF2EC4', grid: 'rgba(255, 46, 196,', glow: '#FF6BD6', nebula: 'rgba(255, 46, 196, 0.03)' },   // magenta
  { edge: '#00FF9F', grid: 'rgba(0, 255, 159,', glow: '#6EFFCB', nebula: 'rgba(0, 255, 159, 0.02)' },     // emerald
];

function getEnvPhase() { return ENV_PHASES[(level - 1) % ENV_PHASES.length]; }

// Grid scroll
let gridOffset = 0;

// Game over animation
let deathTimer = 0;
let gameOverStatReveal = 0;

// Hit motivational messages
const HIT_MESSAGES = [
  'Shake it off! \uD83D\uDCA5\u2728', 'KEEP GOING! \uD83D\uDCAA', 'YOU GOT THIS! \uD83D\uDD25',
  'STAY FOCUSED! \u26A1', 'ALMOST THERE! \uD83D\uDE80',
];
const COLLECT_EMOJIS = ['\u2728', '\uD83D\uDE80', '\uD83D\uDCB0', '\uD83C\uDF1F', '\uD83D\uDCAA', '\uD83D\uDCAB', '\u2B50'];
// Diamond shimmer colors for rotation
const DIAMOND_COLORS = [COL.cyan, COL.emerald, COL.gold, COL.white, COL.cyanGlow, COL.emeraldSoft];

// Delta time
let lastTime = 0;

// ─── HELPERS ────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return Math.random() * (b - a) + a; }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

function getPathX(lane, zFrac) {
  const bottomW = W * PATH_BOTTOM_W;
  const topW = W * PATH_TOP_W;
  const pathW = lerp(bottomW, topW, zFrac);
  const laneW = pathW / LANE_COUNT;
  const pathLeft = (W - pathW) / 2;
  return pathLeft + laneW * (lane + 0.5);
}

function getPathY(zFrac) {
  return lerp(H, H * HORIZON_Y, zFrac);
}

function getScale(zFrac) { return lerp(1, 0.1, zFrac); }

function getPathEdges(zFrac) {
  const bottomW = W * PATH_BOTTOM_W;
  const topW = W * PATH_TOP_W;
  const pathW = lerp(bottomW, topW, zFrac);
  const pathLeft = (W - pathW) / 2;
  return { left: pathLeft, right: pathLeft + pathW, width: pathW };
}

function hexToRgb(hex) {
  const c = hex.replace('#', '');
  return { r: parseInt(c.slice(0, 2), 16), g: parseInt(c.slice(2, 4), 16), b: parseInt(c.slice(4, 6), 16) };
}

function lerpColor(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  return `rgb(${Math.round(lerp(pa.r, pb.r, t))},${Math.round(lerp(pa.g, pb.g, t))},${Math.round(lerp(pa.b, pb.b, t))})`;
}

// ─── PARTICLE SYSTEM (pooled) ───────────────────────────────────
function spawnParticle(x, y, color, vx, vy, life, size, grav) {
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({ x, y, vx: vx || 0, vy: vy || 0, life, maxLife: life, size: size || 3, color, grav: grav || 0.05 });
}

function spawnBurst(x, y, color, count, spread, life, size) {
  const budget = Math.min(count, MAX_PARTICLES - particles.length);
  for (let i = 0; i < budget; i++) {
    const angle = rand(0, Math.PI * 2);
    const spd = rand(0.5, spread);
    spawnParticle(x, y, color, Math.cos(angle) * spd, Math.sin(angle) * spd, rand(life * 0.5, life), rand(size * 0.5, size), 0.03);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vy += p.grav * dt * 60;
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); }
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = clamp(p.life / p.maxLife, 0, 1);
    const sz = p.size * (0.3 + alpha * 0.7);
    if (sz < 0.3) continue;
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = Math.min(12, sz * 2);
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ─── PARALLAX STARFIELD + NEBULAE ───────────────────────────────
let stars = [];
let nebulae = [];

function initStars() {
  stars = [];
  for (let i = 0; i < 250; i++) {
    const layer = Math.random() < 0.35 ? 0 : (Math.random() < 0.5 ? 1 : (Math.random() < 0.6 ? 2 : 3));
    stars.push({
      x: rand(0, W), y: rand(0, H),
      size: [rand(0.4, 1.0), rand(0.8, 1.8), rand(1.5, 2.8), rand(2.2, 3.5)][layer],
      baseAlpha: [rand(0.25, 0.5), rand(0.4, 0.7), rand(0.6, 0.85), rand(0.75, 1)][layer],
      twinkleSpeed: rand(1.5, 5),
      twinkleOffset: rand(0, Math.PI * 2),
      layer,
      color: Math.random() < 0.5 ? COL.white :
        [COL.purple, COL.cyan, COL.emeraldSoft, COL.goldLight, COL.magentaGlow, '#E0CFFF'][randInt(0, 5)],
    });
  }
}

function initNebulae() {
  nebulae = [];
  const colors = [
    'rgba(168, 85, 247, 0.04)',  // purple
    'rgba(59, 130, 246, 0.035)', // blue
    'rgba(236, 72, 153, 0.03)',  // pink
    'rgba(34, 211, 238, 0.025)', // cyan
  ];
  for (let i = 0; i < 8; i++) {
    nebulae.push({
      x: rand(0, W), y: rand(0, H),
      rx: rand(80, 200), ry: rand(50, 140),
      color: colors[i % colors.length],
      layer: i < 3 ? 0 : (i < 6 ? 1 : 2),
      baseY: rand(0, H),
    });
  }
}
initStars();
initNebulae();
window.addEventListener('resize', () => { initNebulae(); initStars(); });

function updateStars(dt) {
  const layerSpeeds = [0.04, 0.12, 0.28, 0.5];
  for (const s of stars) {
    s.y += layerSpeeds[s.layer] * dt * 60;
    if (s.y > H + 5) { s.y = -5; s.x = rand(0, W); }
  }
  // Nebula drift
  const nebulaSpeeds = [0.03, 0.08, 0.18];
  for (const n of nebulae) {
    n.y += nebulaSpeeds[n.layer] * dt * 60;
    if (n.y - n.ry > H + 20) { n.y = -n.ry - 20; n.x = rand(0, W); }
  }
}

function drawNebulae() {
  for (const n of nebulae) {
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, Math.max(n.rx, n.ry));
    grad.addColorStop(0, n.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStars(time) {
  for (const s of stars) {
    const twinkle = Math.sin(time * 0.001 * s.twinkleSpeed + s.twinkleOffset);
    const alpha = s.baseAlpha * (0.6 + twinkle * 0.4);
    if (alpha < 0.03) continue;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.color;

    if (s.size > 1.8) {
      ctx.shadowColor = s.color;
      ctx.shadowBlur = s.size * 5;
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Cross-glow for bright stars
    if (s.size > 2.0 && alpha > 0.45) {
      ctx.globalAlpha = alpha * 0.3;
      const arm = s.size * 5;
      ctx.fillRect(s.x - arm, s.y - 0.5, arm * 2, 1);
      ctx.fillRect(s.x - 0.5, s.y - arm, 1, arm * 2);
    }
  }
  ctx.globalAlpha = 1;
}

// ─── GOD RAYS from vanishing point ──────────────────────────────
function drawGodRays(time) {
  const cx = W / 2;
  const cy = H * HORIZON_Y;
  const env = getEnvPhase();
  const rayCount = 8;
  const baseAngle = time * 0.0001;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < rayCount; i++) {
    const angle = baseAngle + (i / rayCount) * Math.PI * 2;
    const flicker = 0.015 + Math.sin(time * 0.002 + i * 1.3) * 0.01;
    const length = H * 0.7;
    const spread = 0.12;

    ctx.globalAlpha = flicker;
    ctx.fillStyle = env.edge;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle - spread) * length, cy + Math.sin(angle - spread) * length);
    ctx.lineTo(cx + Math.cos(angle + spread) * length, cy + Math.sin(angle + spread) * length);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ─── PATH EDGE SPARKLES ─────────────────────────────────────────
function updatePathSparkles(dt) {
  // Spawn sparkles along path edges
  if (state === STATE.PLAYING && Math.random() < 0.6) {
    const z = rand(0.02, 0.8);
    const e = getPathEdges(z);
    const side = Math.random() < 0.5 ? e.left : e.right;
    const y = getPathY(z);
    const s = getScale(z);
    const env = getEnvPhase();
    sparkles.push({
      x: side + rand(-3, 3), y: y + rand(-2, 2),
      life: rand(0.3, 0.8), maxLife: rand(0.3, 0.8),
      size: rand(1, 3) * s,
      color: Math.random() < 0.6 ? env.edge : COL.white,
    });
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    sparkles[i].life -= dt;
    if (sparkles[i].life <= 0) sparkles.splice(i, 1);
  }
  // Cap sparkles
  if (sparkles.length > 60) sparkles.splice(0, sparkles.length - 60);
}

function drawPathSparkles() {
  for (const s of sparkles) {
    const alpha = clamp(s.life / s.maxLife, 0, 1);
    const pulse = 0.5 + Math.sin(s.life * 15) * 0.5;
    ctx.globalAlpha = alpha * pulse;
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ─── AMBIENT SPARKLE PARTICLES ──────────────────────────────────
function spawnAmbientSparkles(dt) {
  if (state !== STATE.PLAYING) return;
  // Floating sparkles around path area
  if (Math.random() < 0.3) {
    const x = rand(W * 0.1, W * 0.9);
    const y = rand(H * HORIZON_Y, H * 0.95);
    const env = getEnvPhase();
    const col = Math.random() < 0.4 ? env.edge : Math.random() < 0.5 ? COL.white : env.glow;
    spawnParticle(x, y, col, rand(-0.3, 0.3), rand(-0.5, 0.2), rand(0.5, 1.5), rand(0.8, 2), 0);
  }
}

// ─── DRAW PATH ──────────────────────────────────────────────────
function drawPath() {
  const horizonY = H * HORIZON_Y;
  const env = getEnvPhase();

  // Main path fill — cosmic tunnel
  ctx.beginPath();
  const eBot = getPathEdges(0);
  const eTop = getPathEdges(1);
  ctx.moveTo(eBot.left, H);
  ctx.lineTo(eTop.left, horizonY);
  ctx.lineTo(eTop.right, horizonY);
  ctx.lineTo(eBot.right, H);
  ctx.closePath();
  const pathGrad = ctx.createLinearGradient(0, horizonY, 0, H);
  pathGrad.addColorStop(0, 'rgba(10, 5, 30, 0.5)');
  pathGrad.addColorStop(0.5, 'rgba(15, 8, 40, 0.75)');
  pathGrad.addColorStop(1, 'rgba(20, 10, 50, 0.9)');
  ctx.fillStyle = pathGrad;
  ctx.fill();

  // Inner glow on path surface
  const innerGlow = ctx.createLinearGradient(0, horizonY, 0, H);
  innerGlow.addColorStop(0, `${env.grid} 0.04)`);
  innerGlow.addColorStop(0.5, `${env.grid} 0.02)`);
  innerGlow.addColorStop(1, `${env.grid} 0.06)`);
  ctx.fillStyle = innerGlow;
  ctx.fill();

  // Grid lines (horizontal — scrolling)
  const gridSpacing = 0.04;
  gridOffset = (gridOffset + speed * 0.001) % gridSpacing;
  for (let z = gridOffset; z < 1; z += gridSpacing) {
    const y = getPathY(z);
    const e = getPathEdges(z);
    const alpha = lerp(0.18, 0.02, z);
    ctx.strokeStyle = `${env.grid} ${alpha})`;
    ctx.lineWidth = lerp(1.2, 0.3, z);
    ctx.beginPath();
    ctx.moveTo(e.left, y);
    ctx.lineTo(e.right, y);
    ctx.stroke();
  }

  // Lane dividers
  for (let l = 1; l < LANE_COUNT; l++) {
    ctx.beginPath();
    for (let z = 0; z <= 1; z += 0.02) {
      const e = getPathEdges(z);
      const laneW = e.width / LANE_COUNT;
      const x = e.left + laneW * l;
      const y = getPathY(z);
      if (z === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    const laneGrad = ctx.createLinearGradient(0, H, 0, horizonY);
    laneGrad.addColorStop(0, `${env.grid} 0.2)`);
    laneGrad.addColorStop(1, `${env.grid} 0.02)`);
    ctx.strokeStyle = laneGrad;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Edge glow — electric purple with cyan outer edge
  for (let side = 0; side < 2; side++) {
    ctx.beginPath();
    for (let z = 0; z <= 1; z += 0.01) {
      const e = getPathEdges(z);
      const x = side === 0 ? e.left : e.right;
      const y = getPathY(z);
      if (z === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    // Inner edge — environment color
    const edgeGrad = ctx.createLinearGradient(0, H, 0, horizonY);
    edgeGrad.addColorStop(0, env.edge);
    edgeGrad.addColorStop(0.6, env.glow);
    edgeGrad.addColorStop(1, 'transparent');
    ctx.strokeStyle = edgeGrad;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = env.edge;
    ctx.shadowBlur = 18;
    ctx.stroke();

    // Outer edge — cyan accent
    ctx.strokeStyle = `rgba(34, 211, 238, 0.3)`;
    ctx.lineWidth = 1;
    ctx.shadowColor = COL.cyan;
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

// ─── OBSTACLES ──────────────────────────────────────────────────
function spawnObstacle() {
  const types = ['tall', 'tall', 'low', 'low'];
  if (distance > 300) types.push('gap');
  const type = types[randInt(0, types.length - 1)];
  const lane = randInt(0, 2);
  const obs = { lane, z: 1.1, type, moving: false, movDir: 0, movSpeed: 0 };

  if (distance > 800 && Math.random() < 0.3) {
    let lane2 = lane === 1 ? (Math.random() < 0.5 ? 0 : 2) : (lane === 0 ? 1 : 1);
    obstacles.push({ lane: lane2, z: 1.1, type: types[randInt(0, types.length - 1)], moving: false, movDir: 0, movSpeed: 0 });
  }

  if (distance > 1500 && Math.random() < 0.25) {
    obs.moving = true;
    obs.movDir = Math.random() < 0.5 ? -1 : 1;
    obs.movSpeed = rand(0.3, 0.7);
  }

  obstacles.push(obs);
}

function spawnOrb() {
  const lane = randInt(0, 2);
  const floating = Math.random() < 0.3;
  const premium = Math.random() < 0.125;
  orbs.push({ lane, z: 1.1, collected: false, floating, premium, pulse: rand(0, Math.PI * 2) });
}

function updateObstacles(dt) {
  const moveSpeed = speed * 0.012 * dt * 60;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.z -= moveSpeed;
    if (o.moving) {
      o.lane += o.movDir * o.movSpeed * dt;
      if (o.lane <= 0) { o.lane = 0; o.movDir = 1; }
      if (o.lane >= 2) { o.lane = 2; o.movDir = -1; }
    }
    if (o.z < -0.1) obstacles.splice(i, 1);
  }
}

function updateOrbs(dt) {
  const moveSpeed = speed * 0.012 * dt * 60;
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.z -= moveSpeed;
    o.pulse += dt * 4;
    if (o.z < -0.1 || o.collected) orbs.splice(i, 1);
  }
}

function drawDynamite(x, y, s, w, h) {
  // Red cylindrical body
  const bw = w * 0.6;
  const bh = h;
  const bodyGrad = ctx.createLinearGradient(x - bw / 2, y - bh, x + bw / 2, y - bh);
  bodyGrad.addColorStop(0, '#CC1111');
  bodyGrad.addColorStop(0.3, '#FF2E2E');
  bodyGrad.addColorStop(0.6, '#FF4444');
  bodyGrad.addColorStop(0.8, '#FF2E2E');
  bodyGrad.addColorStop(1, '#AA0000');
  ctx.shadowColor = '#FF2E2E';
  ctx.shadowBlur = 15 * s;
  ctx.fillStyle = bodyGrad;
  // Rounded rect body
  const rad = bw * 0.25;
  ctx.beginPath();
  ctx.moveTo(x - bw / 2 + rad, y - bh);
  ctx.lineTo(x + bw / 2 - rad, y - bh);
  ctx.quadraticCurveTo(x + bw / 2, y - bh, x + bw / 2, y - bh + rad);
  ctx.lineTo(x + bw / 2, y - rad);
  ctx.quadraticCurveTo(x + bw / 2, y, x + bw / 2 - rad, y);
  ctx.lineTo(x - bw / 2 + rad, y);
  ctx.quadraticCurveTo(x - bw / 2, y, x - bw / 2, y - rad);
  ctx.lineTo(x - bw / 2, y - bh + rad);
  ctx.quadraticCurveTo(x - bw / 2, y - bh, x - bw / 2 + rad, y - bh);
  ctx.closePath();
  ctx.fill();
  // Dark bands
  ctx.fillStyle = 'rgba(100, 0, 0, 0.4)';
  ctx.fillRect(x - bw / 2, y - bh * 0.35, bw, bh * 0.08);
  ctx.fillRect(x - bw / 2, y - bh * 0.65, bw, bh * 0.08);
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(x - bw * 0.15, y - bh + 2 * s, bw * 0.12, bh - 4 * s);
  ctx.shadowBlur = 0;
  // Fuse — curvy line from top
  const fuseTop = y - bh;
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.moveTo(x, fuseTop);
  const fWiggle = Math.sin(performance.now() * 0.008) * 3 * s;
  ctx.quadraticCurveTo(x + fWiggle, fuseTop - 8 * s, x + 2 * s, fuseTop - 14 * s);
  ctx.stroke();
  // Spark tip — orange/yellow glow
  const sparkX = x + 2 * s;
  const sparkY = fuseTop - 14 * s;
  const sparkFlicker = 0.6 + Math.sin(performance.now() * 0.02) * 0.4;
  ctx.fillStyle = `rgba(255, 200, 50, ${sparkFlicker})`;
  ctx.shadowColor = '#FFAA00';
  ctx.shadowBlur = 10 * s;
  ctx.beginPath();
  ctx.arc(sparkX, sparkY, 3 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `rgba(255, 255, 200, ${sparkFlicker * 0.8})`;
  ctx.beginPath();
  ctx.arc(sparkX, sparkY, 1.5 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Fuse spark particles
  if (s > 0.3 && Math.random() < 0.5) {
    spawnParticle(sparkX + rand(-2, 2), sparkY + rand(-2, 2),
      Math.random() < 0.5 ? '#FFAA00' : '#FF6B35',
      rand(-1, 1), rand(-1.5, -0.3), rand(0.1, 0.25), rand(1, 2.5) * s, 0.04);
  }
}

function drawObstacle(o) {
  if (o.z < 0 || o.z > 1) return;
  const x = getPathX(o.lane, o.z);
  const y = getPathY(o.z);
  const s = getScale(o.z);
  const w = 30 * s;

  if (o.type === 'tall') {
    const h = 50 * s;
    drawDynamite(x, y, s, w, h);
  } else if (o.type === 'low') {
    // Horizontal dynamite (on its side)
    ctx.save();
    ctx.translate(x, y - 24 * s);
    ctx.rotate(Math.PI / 2);
    drawDynamite(0, 12 * s, s, w * 0.7, 30 * s);
    ctx.restore();
  } else if (o.type === 'gap') {
    const e = getPathEdges(o.z);
    const laneW = e.width / LANE_COUNT;
    const lx = e.left + laneW * Math.floor(o.lane);
    ctx.fillStyle = 'rgba(5, 0, 15, 0.95)';
    ctx.fillRect(lx, y - 6 * s, laneW, 12 * s);
    ctx.strokeStyle = 'rgba(255, 46, 46, 0.6)';
    ctx.shadowColor = '#FF2E2E';
    ctx.shadowBlur = 10 * s;
    ctx.lineWidth = 1;
    ctx.strokeRect(lx, y - 6 * s, laneW, 12 * s);
    ctx.shadowBlur = 0;
  }
}

function drawDiamond(x, y, s, rotation, isPremium) {
  const size = 14 * s;
  const rot = rotation;
  // Simulate 3D rotation — squeeze x based on rotation
  const squeeze = Math.abs(Math.cos(rot));
  const hw = size * 0.7 * Math.max(0.3, squeeze); // half width
  const hh = size; // half height (top to middle)
  const bottomH = size * 1.2; // bottom point length

  ctx.save();
  ctx.translate(x, y);

  // Rainbow glow aura
  const glowPhase = rot * 0.5;
  const glowCol = isPremium ? COL.gold :
    DIAMOND_COLORS[Math.floor((glowPhase % (Math.PI * 2)) / (Math.PI * 2) * DIAMOND_COLORS.length) % DIAMOND_COLORS.length];
  ctx.shadowColor = glowCol;
  ctx.shadowBlur = 25 * s;

  // Determine face colors based on rotation for 3D effect
  const facing = Math.sin(rot); // -1 to 1, which side faces us
  const shimmer = Math.sin(rot * 2) * 0.5 + 0.5;

  if (isPremium) {
    // Gold diamond — solid gold shimmer
    const leftCol = lerpColor(COL.gold, COL.goldLight, shimmer);
    const rightCol = lerpColor(COL.goldDark, COL.gold, shimmer);
    const topLeftCol = lerpColor(COL.goldLight, '#FFFDE0', shimmer);
    const topRightCol = lerpColor(COL.gold, COL.goldLight, shimmer);

    // Top-left facet
    ctx.fillStyle = topLeftCol;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.moveTo(0, -hh); ctx.lineTo(-hw, 0); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
    // Top-right facet
    ctx.fillStyle = topRightCol;
    ctx.beginPath();
    ctx.moveTo(0, -hh); ctx.lineTo(hw, 0); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
    // Bottom-left facet
    ctx.fillStyle = leftCol;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(-hw, 0); ctx.lineTo(0, bottomH); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
    // Bottom-right facet
    ctx.fillStyle = rightCol;
    ctx.beginPath();
    ctx.moveTo(hw, 0); ctx.lineTo(0, bottomH); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
  } else {
    // Rainbow diamond — shift colors
    const ci = ((rot / (Math.PI * 2)) * DIAMOND_COLORS.length) % DIAMOND_COLORS.length;
    const c0 = DIAMOND_COLORS[Math.floor(ci) % DIAMOND_COLORS.length];
    const c1 = DIAMOND_COLORS[(Math.floor(ci) + 1) % DIAMOND_COLORS.length];
    const c2 = DIAMOND_COLORS[(Math.floor(ci) + 2) % DIAMOND_COLORS.length];
    const c3 = DIAMOND_COLORS[(Math.floor(ci) + 3) % DIAMOND_COLORS.length];
    const t = ci % 1;

    // Top-left facet
    ctx.fillStyle = lerpColor(c0, c1, t);
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    ctx.moveTo(0, -hh); ctx.lineTo(-hw, 0); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
    // Top-right facet (brighter)
    ctx.fillStyle = lerpColor(c1, c2, t);
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.moveTo(0, -hh); ctx.lineTo(hw, 0); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
    // Bottom-left facet (darker)
    ctx.fillStyle = lerpColor(c2, c3, t);
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(-hw, 0); ctx.lineTo(0, bottomH); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
    // Bottom-right facet
    ctx.fillStyle = lerpColor(c3, c0, t);
    ctx.globalAlpha = 0.88;
    ctx.beginPath();
    ctx.moveTo(hw, 0); ctx.lineTo(0, bottomH); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill();
  }

  // Edge highlights — white lines along facet edges
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.4 + shimmer * 0.3;
  ctx.strokeStyle = COL.white;
  ctx.lineWidth = 0.8 * s;
  ctx.beginPath();
  ctx.moveTo(0, -hh); ctx.lineTo(-hw, 0); ctx.lineTo(0, bottomH); ctx.lineTo(hw, 0); ctx.closePath();
  ctx.moveTo(0, -hh); ctx.lineTo(0, bottomH);
  ctx.stroke();

  // Center sparkle highlight
  ctx.globalAlpha = shimmer * 0.6;
  ctx.fillStyle = COL.white;
  ctx.beginPath();
  ctx.arc(0, -hh * 0.2, 2 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOrb(o) {
  if (o.z < 0 || o.z > 1 || o.collected) return;
  const x = getPathX(o.lane, o.z);
  let y = getPathY(o.z);
  const s = getScale(o.z);
  if (o.floating) y -= 35 * s;
  else y -= 15 * s;

  // Slow rotation
  const rotation = o.pulse * 0.8;

  drawDiamond(x, y, s, rotation, o.premium);

  // Outer pulse ring
  const ringAlpha = 0.2 + Math.sin(o.pulse * 2) * 0.15;
  const ringR = 18 * s;
  ctx.strokeStyle = o.premium ? COL.gold : COL.cyan;
  ctx.globalAlpha = ringAlpha;
  ctx.lineWidth = 1 * s;
  ctx.shadowColor = o.premium ? COL.gold : COL.cyan;
  ctx.shadowBlur = 8 * s;
  ctx.beginPath();
  ctx.arc(x, y, ringR, 0, Math.PI * 2);
  ctx.stroke();

  // Ambient sparkles around diamond
  if (s > 0.3 && Math.random() < 0.35) {
    const col = o.premium ? COL.gold : DIAMOND_COLORS[randInt(0, DIAMOND_COLORS.length - 1)];
    spawnParticle(x + rand(-12, 12) * s, y + rand(-12, 12) * s, col,
      rand(-0.4, 0.4), rand(-0.6, 0.2), rand(0.15, 0.4), rand(1, 2.5) * s, 0);
  }

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ─── GOLD COIN SYSTEM ───────────────────────────────────────────
function spawnGoldCoin() {
  const lane = randInt(0, 2);
  goldCoins.push({ lane, z: 1.1, collected: false, pulse: rand(0, Math.PI * 2), spin: rand(0, Math.PI * 2) });
}

function updateGoldCoins(dt) {
  const moveSpeed = speed * 0.012 * dt * 60;
  for (let i = goldCoins.length - 1; i >= 0; i--) {
    const c = goldCoins[i];
    c.z -= moveSpeed;
    c.pulse += dt * 3;
    c.spin += dt * 2.5;
    if (c.z < -0.1 || c.collected) goldCoins.splice(i, 1);
  }
  // Jackpot celebration timer
  if (jackpotTimer > 0) {
    jackpotTimer -= dt;
    // Rain gold particles from top during jackpot
    if (jackpotTimer > 0.5) {
      for (let i = 0; i < 4; i++) {
        spawnParticle(rand(0, W), rand(-10, 0),
          Math.random() < 0.6 ? COL.gold : Math.random() < 0.5 ? COL.goldLight : COL.white,
          rand(-1, 1), rand(2, 6), rand(0.8, 2.0), rand(3, 7), 0.03);
      }
    }
  }
  // Score roll-up animation
  if (jackpotScoreAnim > 0) {
    const add = Math.min(jackpotScoreAnim, 300 * dt * 60);
    score += add;
    jackpotScoreAnim -= add;
    if (jackpotScoreAnim < 1) jackpotScoreAnim = 0;
  }
  // HUD flash decay
  if (goldCoinHudFlash > 0) goldCoinHudFlash -= dt;
}

function drawGoldCoin(c) {
  if (c.z < 0 || c.z > 1 || c.collected) return;
  const x = getPathX(c.lane, c.z);
  let y = getPathY(c.z) - 20 * getScale(c.z);
  const s = getScale(c.z);
  const r = 22 * s; // BIG — 2-3x diamond size
  const squeeze = Math.abs(Math.cos(c.spin));
  const coinW = r * Math.max(0.25, squeeze);
  const pulseGlow = 1 + Math.sin(c.pulse * 2) * 0.2;

  ctx.save();
  ctx.translate(x, y);

  // Outer golden glow aura
  ctx.shadowColor = COL.gold;
  ctx.shadowBlur = 35 * s * pulseGlow;

  // Coin body — ellipse (squeezed for 3D spin)
  const coinGrad = ctx.createLinearGradient(-coinW, -r, coinW, r);
  coinGrad.addColorStop(0, '#B8860B');
  coinGrad.addColorStop(0.3, COL.gold);
  coinGrad.addColorStop(0.5, COL.goldLight);
  coinGrad.addColorStop(0.7, COL.gold);
  coinGrad.addColorStop(1, '#B8860B');
  ctx.fillStyle = coinGrad;
  ctx.globalAlpha = 0.95;
  ctx.beginPath();
  ctx.ellipse(0, 0, coinW, r, 0, 0, Math.PI * 2);
  ctx.fill();

  // Inner circle border
  ctx.strokeStyle = '#B8860B';
  ctx.lineWidth = 2 * s;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, coinW * 0.75, r * 0.75, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Embossed star in center (only visible when face is showing)
  if (squeeze > 0.4) {
    ctx.globalAlpha = squeeze * 0.7;
    ctx.fillStyle = '#B8860B';
    ctx.font = `bold ${Math.floor(r * 1.0)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('\u2605', 0, 1 * s); // ★ star
    // Brighter overlay
    ctx.globalAlpha = squeeze * 0.4;
    ctx.fillStyle = COL.goldLight;
    ctx.fillText('\u2605', 0, 0);
  }

  // Edge highlight — bright rim
  ctx.globalAlpha = 0.4 + Math.sin(c.pulse * 3) * 0.2;
  ctx.strokeStyle = COL.goldLight;
  ctx.lineWidth = 1.5 * s;
  ctx.beginPath();
  ctx.ellipse(0, 0, coinW, r, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();

  // Outer pulse ring
  ctx.strokeStyle = COL.gold;
  ctx.globalAlpha = 0.25 + Math.sin(c.pulse * 2) * 0.15;
  ctx.lineWidth = 1.5 * s;
  ctx.shadowColor = COL.gold;
  ctx.shadowBlur = 12 * s;
  ctx.beginPath();
  ctx.arc(x, y, r * 1.8, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // Constant sparkle particles
  if (s > 0.25 && Math.random() < 0.6) {
    spawnParticle(x + rand(-r, r), y + rand(-r, r),
      Math.random() < 0.6 ? COL.gold : COL.goldLight,
      rand(-0.5, 0.5), rand(-0.8, 0.2), rand(0.2, 0.5), rand(1.5, 3) * s, 0);
  }
}

function checkGoldCoinCollisions() {
  const pz = 0.14;
  const hitZone = 0.045; // slightly larger hit zone — reward the player
  for (const c of goldCoins) {
    if (c.collected) continue;
    if (Math.abs(c.z - pz) > hitZone) continue;
    if (Math.abs(c.lane - player.lane) > 0.7) continue;

    c.collected = true;
    goldCoinsCollected++;
    goldCoinHudFlash = 0.8;

    const cx = getPathX(c.lane, c.z);
    const cy = getPathY(c.z) - 20 * getScale(c.z);

    // Gold burst on pickup
    spawnBurst(cx, cy, COL.gold, 50, 6, 1.0, 7);
    spawnBurst(cx, cy, COL.goldLight, 30, 5, 0.8, 5);
    spawnBurst(cx, cy, COL.white, 15, 4, 0.5, 3);
    screenFlash = 0.35;
    screenFlashColor = COL.gold;
    shakeDur = 0.1;

    floatingTexts.push({ text: '+GOLD COIN! \uD83E\uDE99', x: cx, y: cy - 15, life: 1.8, maxLife: 1.8, color: COL.gold, size: 26 });
    floatingTexts.push({ text: `\uD83E\uDE99 ${goldCoinsCollected}/3`, x: cx, y: cy + 10, life: 1.5, maxLife: 1.5, color: COL.goldLight, size: 20 });

    // Check for JACKPOT
    if (goldCoinsCollected >= 3) {
      triggerJackpot();
    }
  }
}

function triggerJackpot() {
  jackpotTimer = 2.5;
  goldCoinsCollected = 0;
  totalJackpots++;
  jackpotScoreAnim = 10000; // will roll up into score
  slowMoTimer = Math.max(slowMoTimer, 0.5);
  shakeDur = 0.6;
  screenFlash = 0.8;
  screenFlashColor = COL.gold;

  // MASSIVE particle explosion — hundreds of gold beads
  spawnBurst(W / 2, H * 0.4, COL.gold, 120, 10, 2.0, 10);
  spawnBurst(W / 2, H * 0.4, COL.goldLight, 80, 8, 1.5, 8);
  spawnBurst(W / 2, H * 0.4, COL.white, 40, 7, 1.0, 5);
  spawnBurst(W / 2, H * 0.4, COL.cyan, 30, 6, 1.0, 5);
  spawnBurst(W / 2, H * 0.4, COL.magentaGlow, 20, 5, 0.8, 4);
  // Confetti-style colored bursts from edges
  spawnBurst(W * 0.2, H * 0.3, COL.emerald, 25, 5, 1.2, 5);
  spawnBurst(W * 0.8, H * 0.3, COL.purple, 25, 5, 1.2, 5);
  spawnBurst(W * 0.5, H * 0.2, COL.gold, 40, 6, 1.5, 6);

  // Giant text
  floatingTexts.push({ text: 'JACKPOT! \uD83D\uDCB0', x: W / 2, y: H * 0.3, life: 3.0, maxLife: 3.0, color: COL.gold, size: 52 });
  floatingTexts.push({ text: 'WISH MANIFESTED! \u2728', x: W / 2, y: H * 0.38, life: 3.0, maxLife: 3.0, color: COL.goldLight, size: 24 });
  floatingTexts.push({ text: '+10,000', x: W / 2, y: H * 0.25, life: 3.0, maxLife: 3.0, color: COL.gold, size: 44 });

  // Emoji shower
  const jackpotEmojis = ['\uD83D\uDCB0', '\u2728', '\uD83D\uDE80', '\uD83C\uDF1F', '\uD83D\uDC8E', '\uD83E\uDE99'];
  for (let i = 0; i < 10; i++) {
    floatingTexts.push({
      text: jackpotEmojis[i % jackpotEmojis.length],
      x: rand(W * 0.15, W * 0.85), y: rand(H * 0.2, H * 0.6),
      life: 2.5, maxLife: 2.5, color: COL.gold, size: 28
    });
  }
}

// ─── PLAYER ─────────────────────────────────────────────────────
function updatePlayer(dt) {
  if (touching) {
    player.lane = lerp(player.lane, player.targetLane, 0.7 * dt * 60);
  } else {
    player.lane = lerp(player.lane, player.targetLane, 0.45 * dt * 60);
  }
  player.x = getPathX(player.lane, 0.14);
  player.y = getPathY(0.14);

  // Jump physics
  if (player.isJumping) {
    player.jumpVel += 0.4 * dt * 60;
    player.jumpY += player.jumpVel * dt * 60;
    if (player.jumpY >= 0) {
      player.jumpY = 0; player.jumpVel = 0; player.isJumping = false;
    }
  }

  // Slide timer
  if (player.isSliding) {
    player.slideTimer -= dt;
    if (player.slideTimer <= 0) { player.isSliding = false; player.slideTimer = 0; }
  }

  // Invincibility + hit flash
  if (invincTimer > 0) invincTimer -= dt;
  if (hitFlashTimer > 0) hitFlashTimer -= dt;
  if (player.collectBoost > 0) player.collectBoost -= dt;

  // Anim
  player.animPhase += dt * 5;

  // Damage smoke — cinematic
  if (state === STATE.PLAYING && damageLevel > 0) {
    const smokeRate = damageLevel === 1 ? 0.4 : 0.8;
    if (Math.random() < smokeRate) {
      const smokeCol = damageLevel === 1 ? 'rgba(160,140,180,0.5)' : 'rgba(60,40,70,0.7)';
      spawnParticle(
        player.x + rand(-10, 10), player.y + player.jumpY + rand(-12, 5),
        smokeCol, rand(-1, 1), rand(-2, -0.3), rand(0.4, 0.9), rand(3, 7), 0.02
      );
    }
    // Fire sparks at damage 2
    if (damageLevel >= 2 && Math.random() < 0.35) {
      spawnParticle(
        player.x + rand(-14, 14), player.y + player.jumpY + rand(-18, 0),
        Math.random() < 0.5 ? COL.magenta : '#FF6B35',
        rand(-2.5, 2.5), rand(-2.5, 0), rand(0.15, 0.35), rand(1.5, 3), 0.03
      );
    }
    // Occasional magenta flash particles
    if (damageLevel >= 2 && Math.random() < 0.15) {
      spawnParticle(
        player.x + rand(-8, 8), player.y + player.jumpY + rand(-10, 0),
        COL.magentaGlow, rand(-1, 1), rand(-1, 0), rand(0.1, 0.2), rand(2, 4), 0
      );
    }
  }

  // Engine flame particles — multi-layered
  if (state === STATE.PLAYING) {
    const boost = player.collectBoost > 0;
    const flameCount = player.isSliding ? 2 : (boost ? 8 : 5);
    for (let i = 0; i < flameCount; i++) {
      // Blue core
      const baseY = player.y + player.jumpY + (player.isSliding ? 3 : 8);
      if (i < 2) {
        spawnParticle(
          player.x + rand(-3, 3), baseY + rand(0, 2),
          COL.cyan, rand(-0.2, 0.2), rand(1.5, 4), rand(0.12, 0.3), rand(2, 3.5), 0.02
        );
      }
      // Orange mid
      const flameCol = Math.random() < 0.3 ? '#FF6B35' : Math.random() < 0.4 ? COL.gold : COL.purple;
      spawnParticle(
        player.x + rand(-7, 7), baseY + rand(0, 5),
        flameCol, rand(-0.5, 0.5), rand(1, 3.5), rand(0.15, 0.45), rand(2, boost ? 6 : 4.5), 0.02
      );
    }
    // Wingtip sparkles
    if (Math.random() < 0.5 && !player.isSliding) {
      const s = getScale(0.14);
      const w = player.width * s;
      for (const side of [-1, 1]) {
        if (Math.random() < 0.4) {
          spawnParticle(
            player.x + side * w * 0.45, player.y + player.jumpY - rand(0, 5),
            Math.random() < 0.5 ? COL.cyan : COL.purple,
            side * rand(0.3, 1), rand(-0.3, 0.3), rand(0.1, 0.25), rand(1, 2), 0
          );
        }
      }
    }
    // Glow trail
    if (Math.random() < 0.5) {
      spawnParticle(
        player.x + rand(-4, 4), player.y + player.jumpY + rand(3, 10),
        COL.purple, rand(-0.2, 0.2), rand(0.5, 1.5), rand(0.15, 0.35), rand(1.5, 3), 0.01
      );
    }
  }
}

function drawPlayer() {
  const x = player.x;
  let y = player.y + player.jumpY;
  const s = getScale(0.14);
  const bob = Math.sin(player.animPhase) * 2.5 + Math.sin(player.animPhase * 1.7) * 0.8;
  const tilt = Math.sin(player.animPhase * 0.7) * 0.04;

  // Invincibility blink
  if (invincTimer > 0 && Math.sin(invincTimer * 20) > 0.3) return;

  ctx.save();
  ctx.translate(x, y + bob);
  ctx.rotate(tilt);

  // Hit flash — magenta overlay
  if (hitFlashTimer > 0) {
    ctx.globalAlpha = 0.5 + (hitFlashTimer / 0.25) * 0.5;
  }

  const w = player.width * s;
  const h = player.height * s;

  if (player.isSliding) {
    const sw = w * 1.3;
    const sh = h * 0.3;
    ctx.shadowColor = COL.cyan;
    ctx.shadowBlur = 24;

    const bodyGrad = ctx.createLinearGradient(-sw / 2, -sh, sw / 2, 0);
    bodyGrad.addColorStop(0, COL.purple);
    bodyGrad.addColorStop(0.5, COL.cyan);
    bodyGrad.addColorStop(1, COL.purple);
    ctx.fillStyle = hitFlashTimer > 0 ? COL.magenta : bodyGrad;
    ctx.beginPath();
    ctx.moveTo(0, -sh);
    ctx.lineTo(sw / 2, 0);
    ctx.lineTo(0, sh * 0.3);
    ctx.lineTo(-sw / 2, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(150, 220, 255, 0.6)';
    ctx.beginPath();
    ctx.ellipse(0, -sh * 0.3, sw * 0.12, sh * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // ── SPACESHIP ──
    ctx.shadowColor = COL.cyan;
    ctx.shadowBlur = 32;

    const hullGrad = ctx.createLinearGradient(0, -h, 0, h * 0.1);
    hullGrad.addColorStop(0, COL.cyan);
    hullGrad.addColorStop(0.3, COL.purple);
    hullGrad.addColorStop(0.7, COL.purpleDark);
    hullGrad.addColorStop(1, COL.purpleDeep);
    ctx.fillStyle = hitFlashTimer > 0 ? COL.magenta : hullGrad;

    // Ship body
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.lineTo(w * 0.18, -h * 0.55);
    ctx.lineTo(w * 0.22, -h * 0.15);
    ctx.lineTo(w * 0.5, h * 0.05);
    ctx.lineTo(w * 0.35, h * 0.1);
    ctx.lineTo(w * 0.18, h * 0.05);
    ctx.lineTo(0, h * 0.15);
    ctx.lineTo(-w * 0.18, h * 0.05);
    ctx.lineTo(-w * 0.35, h * 0.1);
    ctx.lineTo(-w * 0.5, h * 0.05);
    ctx.lineTo(-w * 0.22, -h * 0.15);
    ctx.lineTo(-w * 0.18, -h * 0.55);
    ctx.closePath();
    ctx.fill();

    // Panel lines
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-w * 0.12, -h * 0.5);
    ctx.lineTo(-w * 0.15, h * 0.05);
    ctx.moveTo(w * 0.12, -h * 0.5);
    ctx.lineTo(w * 0.15, h * 0.05);
    ctx.stroke();

    // Cockpit — cyan dome
    const cockpitGrad = ctx.createRadialGradient(0, -h * 0.45, 0, 0, -h * 0.45, w * 0.14);
    cockpitGrad.addColorStop(0, 'rgba(200, 255, 255, 0.95)');
    cockpitGrad.addColorStop(0.5, 'rgba(34, 211, 238, 0.7)');
    cockpitGrad.addColorStop(1, 'rgba(168, 85, 247, 0.3)');
    ctx.fillStyle = cockpitGrad;
    ctx.shadowColor = COL.cyan;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.45, w * 0.12, h * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cockpit highlight
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(-w * 0.03, -h * 0.48, w * 0.04, h * 0.04, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Wing neon edges
    ctx.shadowBlur = 0;
    ctx.strokeStyle = COL.cyan;
    ctx.globalAlpha = Math.min(1, ctx.globalAlpha) * 0.6;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(w * 0.22, -h * 0.15);
    ctx.lineTo(w * 0.5, h * 0.05);
    ctx.moveTo(-w * 0.22, -h * 0.15);
    ctx.lineTo(-w * 0.5, h * 0.05);
    ctx.stroke();
    ctx.globalAlpha = hitFlashTimer > 0 ? 0.5 + (hitFlashTimer / 0.25) * 0.5 : 1;

    // Engine nozzles — multi-color glow
    const eg1 = 0.5 + Math.sin(player.animPhase * 8) * 0.3;
    const eg2 = 0.5 + Math.sin(player.animPhase * 8 + 1) * 0.3;
    // Blue core
    ctx.fillStyle = `rgba(34, 211, 238, ${eg1 * 0.8})`;
    ctx.shadowColor = COL.cyan;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(-w * 0.1, h * 0.08, w * 0.05, 0, Math.PI * 2);
    ctx.arc(w * 0.1, h * 0.08, w * 0.05, 0, Math.PI * 2);
    ctx.fill();
    // Orange outer
    ctx.fillStyle = `rgba(255, 150, 50, ${eg2 * 0.6})`;
    ctx.shadowColor = '#FF6B35';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(-w * 0.1, h * 0.1, w * 0.07, 0, Math.PI * 2);
    ctx.arc(w * 0.1, h * 0.1, w * 0.07, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── COLLISION ──────────────────────────────────────────────────
function checkCollisions() {
  const pz = 0.14;
  const hitZone = 0.035;

  for (const o of obstacles) {
    if (Math.abs(o.z - pz) > hitZone) continue;
    if (Math.abs(o.lane - player.lane) > 0.6) continue;

    if (o.type === 'tall') {
      if (player.isJumping && player.jumpY < -20) continue;
      takeDamage();
      if (state === STATE.DEAD) return;
      o.z = -1;
      continue;
    } else if (o.type === 'low') {
      if (player.isSliding) continue;
      if (player.isJumping) continue;
      takeDamage();
      if (state === STATE.DEAD) return;
      o.z = -1;
      continue;
    } else if (o.type === 'gap') {
      if (player.isJumping) continue;
      takeDamage();
      if (state === STATE.DEAD) return;
      o.z = -1;
      continue;
    }
  }

  // Orb collection
  for (const o of orbs) {
    if (o.collected) continue;
    if (Math.abs(o.z - pz) > hitZone) continue;
    if (Math.abs(o.lane - player.lane) > 0.6) continue;
    if (o.floating && !(player.isJumping && player.jumpY < -15)) continue;

    o.collected = true;
    orbsCollected++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    comboTimer = 2;
    const ox = getPathX(o.lane, o.z);
    const oy = getPathY(o.z) - 15 * getScale(o.z);
    player.collectBoost = 0.4;

    // Level up check
    const newLevel = Math.floor((orbsCollected - 1) / ORBS_PER_LEVEL) + 1;
    if (newLevel > level) {
      level = newLevel;
      levelUpFlash = 2.5;
      slowMoTimer = 0.6;
      screenFlash = 0.5;
      const env = getEnvPhase();
      screenFlashColor = env.edge;
      shakeDur = 0.15;
      spawnBurst(W / 2, H * 0.4, env.edge, 60, 7, 1.2, 8);
      spawnBurst(W / 2, H * 0.4, env.glow, 35, 5, 0.9, 6);
      spawnBurst(W / 2, H * 0.4, COL.white, 20, 3, 0.6, 3);
      floatingTexts.push({ text: `LEVEL ${level}!`, x: W / 2, y: H * 0.35, life: 2.5, maxLife: 2.5, color: env.edge, size: 52 });
    }

    // Combo-scaled explosion multiplier
    const comboScale = Math.min(combo, 10) / 5; // 0.2 at combo 1, 2.0 at combo 10

    if (o.premium) {
      // PREMIUM DIAMOND — slow-mo + massive gold explosion
      const pts = 50 * Math.min(combo, 10);
      score += pts;
      slowMoTimer = Math.max(slowMoTimer, 0.3);
      // Massive gold Orbeez blast
      spawnBurst(ox, oy, COL.gold, 80, 8, 1.4, 9);
      spawnBurst(ox, oy, COL.goldLight, 50, 6, 1.0, 7);
      spawnBurst(ox, oy, COL.cyan, 25, 5, 0.8, 5);
      spawnBurst(ox, oy, COL.white, 20, 7, 0.5, 3);
      // Large slow gold beads
      for (let i = 0; i < 15; i++) {
        const angle = rand(0, Math.PI * 2);
        const spd = rand(1, 3.5);
        spawnParticle(ox, oy, Math.random() < 0.7 ? COL.gold : COL.goldLight,
          Math.cos(angle) * spd, Math.sin(angle) * spd,
          rand(0.7, 1.4), rand(5, 10), 0.02);
      }
      screenFlash = 0.5;
      screenFlashColor = COL.gold;
      shakeDur = 0.15;
      floatingTexts.push({ text: `+${pts} BONUS \uD83D\uDC8E`, x: ox, y: oy - 10, life: 1.8, maxLife: 1.8, color: COL.gold, size: 30 });
      // Emoji particles
      for (let i = 0; i < 4; i++) {
        floatingTexts.push({
          text: ['\uD83D\uDCB0', '\u2B50', '\uD83C\uDF1F', '\uD83D\uDC8E'][i % 4],
          x: ox + rand(-35, 35), y: oy + rand(-25, 10),
          life: 1.5, maxLife: 1.5, color: COL.gold, size: 24
        });
      }
    } else {
      // REGULAR DIAMOND — ORBEEZ BLAST (colorful beads!)
      const pts = 10 * Math.min(combo, 10);
      score += pts;
      // Scale particle counts with combo
      const baseCount = Math.floor(60 + comboScale * 40);
      // Multi-color bead explosion
      spawnBurst(ox, oy, COL.cyan, baseCount, 7 + comboScale, 1.3, 6);
      spawnBurst(ox, oy, COL.emerald, Math.floor(baseCount * 0.5), 5, 1.0, 5);
      spawnBurst(ox, oy, COL.gold, Math.floor(baseCount * 0.3), 5, 0.8, 4);
      spawnBurst(ox, oy, COL.magentaGlow, Math.floor(baseCount * 0.2), 4, 0.7, 3);
      spawnBurst(ox, oy, COL.white, 20, 8, 0.5, 2);
      // Large slow beads
      const beadCount = Math.floor(12 + comboScale * 8);
      for (let i = 0; i < beadCount; i++) {
        const angle = rand(0, Math.PI * 2);
        const spd = rand(1.5, 5 + comboScale);
        const col = [COL.cyan, COL.emerald, COL.gold, COL.magentaGlow, COL.white][randInt(0, 4)];
        spawnParticle(ox, oy, col,
          Math.cos(angle) * spd, Math.sin(angle) * spd - 1,
          rand(0.5, 1.0), rand(3, 7 + comboScale * 2), 0.05);
      }
      // Tiny fast sparks
      for (let i = 0; i < 20; i++) {
        const angle = rand(0, Math.PI * 2);
        const spd = rand(3, 8);
        spawnParticle(ox, oy, COL.white,
          Math.cos(angle) * spd, Math.sin(angle) * spd,
          rand(0.15, 0.4), rand(1, 2.5), 0.02);
      }
      screenFlash = 0.25;
      screenFlashColor = COL.cyan;
      // Emoji particles floating up
      const emoji = COLLECT_EMOJIS[randInt(0, COLLECT_EMOJIS.length - 1)];
      floatingTexts.push({
        text: emoji, x: ox + rand(-15, 15), y: oy,
        life: 1.2, maxLife: 1.2, color: COL.cyan, size: 22
      });
      if (combo > 2) {
        floatingTexts.push({
          text: `+${pts}`, x: ox + rand(-10, 10), y: oy + 15,
          life: 1.0, maxLife: 1.0, color: COL.gold, size: 18
        });
      }
    }
  }

  // Gold coin collection
  checkGoldCoinCollisions();
}

// ─── DAMAGE / HEALTH ────────────────────────────────────────────
function takeDamage() {
  if (invincTimer > 0) return;
  health--;
  damageLevel = 3 - health;
  hitFlashTimer = 0.3;
  invincTimer = 1.5;
  shakeDur = 0.35;
  screenFlash = 0.4;
  screenFlashColor = COL.magenta;
  slowMoTimer = Math.max(slowMoTimer, 0.3);

  // DYNAMITE EXPLOSION — fire, smoke, sparks
  const explosionScale = damageLevel; // 1, 2, or 3
  // Fire (orange/yellow)
  spawnBurst(player.x, player.y, '#FF6B35', 25 * explosionScale, 5 + explosionScale, 0.8, 5 + explosionScale);
  spawnBurst(player.x, player.y, COL.gold, 15 * explosionScale, 4 + explosionScale, 0.6, 4);
  // Smoke (gray puffs)
  spawnBurst(player.x, player.y, 'rgba(120,110,100,0.7)', 10 * explosionScale, 3, 1.0, 6 + explosionScale);
  // White/orange sparks
  spawnBurst(player.x, player.y, COL.white, 10, 6, 0.4, 2);
  spawnBurst(player.x, player.y, '#FFAA00', 8, 5, 0.5, 3);

  if (health <= 0) {
    // MASSIVE FINAL EXPLOSION
    spawnBurst(player.x, player.y, '#FF4400', 80, 9, 1.3, 8);
    spawnBurst(player.x, player.y, '#FF6B35', 50, 7, 1.0, 7);
    spawnBurst(player.x, player.y, COL.gold, 30, 6, 0.9, 6);
    spawnBurst(player.x, player.y, 'rgba(80,70,60,0.8)', 25, 5, 1.2, 8);
    spawnBurst(player.x, player.y, COL.white, 20, 5, 0.6, 3);
    floatingTexts.push({ text: 'BOOM! \uD83D\uDCA5', x: player.x, y: player.y - 45, life: 2, maxLife: 2, color: '#FF4400', size: 40 });
    floatingTexts.push({ text: 'DESTROYED!', x: player.x, y: player.y - 75, life: 2.5, maxLife: 2.5, color: COL.magenta, size: 28 });
    gameOver();
  } else {
    const hitText = health === 2 ? 'BOOM! \uD83D\uDCA5' : 'HIT! \uD83D\uDCA5';
    floatingTexts.push({ text: hitText, x: player.x, y: player.y - 35, life: 1.3, maxLife: 1.3, color: '#FF4400', size: 32 });
    // Motivational message
    const msg = HIT_MESSAGES[randInt(0, HIT_MESSAGES.length - 1)];
    floatingTexts.push({ text: msg, x: player.x, y: player.y - 65, life: 2.2, maxLife: 2.2, color: COL.gold, size: 17 });
  }
}

// ─── GAME OVER ──────────────────────────────────────────────────
function gameOver() {
  state = STATE.DEAD;
  shakeDur = 0.5;
  shakeX = 0; shakeY = 0;
  deathTimer = 0;
  gameOverStatReveal = 0;

  totalCoins += orbsCollected;
  localStorage.setItem('wp_game_coins', totalCoins);
  const finalScore = Math.floor(score + distance);
  if (finalScore > highScore) {
    highScore = finalScore;
    localStorage.setItem('wp_game_highscore', highScore);
    isNewHighScore = true;
  } else {
    isNewHighScore = false;
  }
}

function resetGame() {
  state = STATE.PLAYING;
  score = 0; distance = 0; orbsCollected = 0; combo = 0; comboTimer = 0; maxCombo = 0;
  speed = baseSpeed; speedTimer = 0;
  player.lane = 1; player.targetLane = 1;
  player.jumpY = 0; player.jumpVel = 0; player.isJumping = false;
  player.slideTimer = 0; player.isSliding = false;
  player.collectBoost = 0;
  obstacles = []; orbs = [];
  particles = []; sparkles = [];
  spawnTimer = 0; orbSpawnTimer = 0;
  lastMarkerDistance = 0; distanceMarkerFlash = 0; screenFlash = 0; floatingTexts = [];
  level = 1; levelUpFlash = 0; slowMoTimer = 0;
  health = 3; damageLevel = 0; invincTimer = 0; hitFlashTimer = 0;
  deathTimer = 0; gameOverStatReveal = 0;
  goldCoins = []; goldCoinsCollected = 0; goldCoinSpawnDist = 0;
  nextGoldCoinAt = rand(800, 1500); jackpotTimer = 0; jackpotScoreAnim = 0; goldCoinHudFlash = 0; totalJackpots = 0;
  isNewHighScore = false;
}

// ─── INPUT ──────────────────────────────────────────────────────
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let touching = false, touchCurrentX = 0;
let touchLaneOffset = 0;
let verticalSwipeDone = false;

function screenXToLane(screenX) {
  const e = getPathEdges(0.14);
  const t = (screenX - e.left) / e.width;
  return clamp(t * LANE_COUNT - 0.5, 0, 2);
}

function jump() {
  if (state === STATE.PLAYING && !player.isJumping) {
    player.isJumping = true;
    player.jumpVel = -7;
  }
}
function slide() {
  if (state === STATE.PLAYING && !player.isSliding && !player.isJumping) {
    player.isSliding = true;
    player.slideTimer = 0.5;
  }
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchCurrentX = t.clientX;
  touchStartTime = Date.now();
  touching = true;
  verticalSwipeDone = false;
  touchLaneOffset = player.lane - screenXToLane(t.clientX);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touching) return;
  const t = e.touches[0];
  touchCurrentX = t.clientX;

  if (state === STATE.PLAYING) {
    player.targetLane = clamp(screenXToLane(touchCurrentX) + touchLaneOffset, 0, 2);
    if (!verticalSwipeDone) {
      const dy = t.clientY - touchStartY;
      if (Math.abs(dy) > 20 && Math.abs(dy) > Math.abs(t.clientX - touchStartX) * 0.8) {
        verticalSwipeDone = true;
        if (dy < -20) jump();
        else if (dy > 20) slide();
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touching = false;
  const elapsed = Date.now() - touchStartTime;
  const dx = Math.abs(touchCurrentX - touchStartX);
  const dy = Math.abs((e.changedTouches[0]?.clientY || touchStartY) - touchStartY);
  if (elapsed < 300 && dx < 15 && dy < 15) {
    if (state === STATE.MENU || state === STATE.DEAD) resetGame();
  }
}, { passive: false });

document.addEventListener('keydown', e => {
  if (state === STATE.MENU || state === STATE.DEAD) {
    if (['Space', 'Enter', 'ArrowUp', 'KeyW'].includes(e.code)) {
      resetGame(); return;
    }
  }
  if (state !== STATE.PLAYING) return;
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA':
      player.targetLane = Math.max(0, Math.round(player.targetLane) - 1); break;
    case 'ArrowRight': case 'KeyD':
      player.targetLane = Math.min(2, Math.round(player.targetLane) + 1); break;
    case 'ArrowUp': case 'KeyW': case 'Space': jump(); break;
    case 'ArrowDown': case 'KeyS': slide(); break;
  }
});

// ─── HUD / UI ───────────────────────────────────────────────────
function drawGlowText(text, x, y, size, color, align, glow) {
  ctx.font = `bold ${size}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  if (glow) {
    ctx.shadowColor = color || COL.white;
    ctx.shadowBlur = glow;
  }
  ctx.fillStyle = color || COL.white;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
}

function draw3DScore(text, cx, cy, size, color) {
  ctx.font = `900 ${size}px -apple-system, 'Segoe UI', Roboto, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 0;

  const rgb = hexToRgb(typeof color === 'string' && color.startsWith('#') ? color : '#ffffff');
  const darkR = Math.floor(rgb.r * 0.25);
  const darkG = Math.floor(rgb.g * 0.25);
  const darkB = Math.floor(rgb.b * 0.25);
  const midR = Math.floor(rgb.r * 0.5);
  const midG = Math.floor(rgb.g * 0.5);
  const midB = Math.floor(rgb.b * 0.5);

  const depth = Math.max(4, Math.floor(size * 0.1));
  for (let i = depth; i >= 1; i--) {
    const t = i / depth;
    const r = Math.floor(lerp(midR, darkR, t));
    const g = Math.floor(lerp(midG, darkG, t));
    const b = Math.floor(lerp(midB, darkB, t));
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillText(text, cx + i * 0.8, cy + i * 1.2);
  }

  ctx.shadowColor = color;
  ctx.shadowBlur = Math.min(35, size * 0.5);
  ctx.fillStyle = color;
  ctx.fillText(text, cx, cy);

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = COL.white;
  ctx.fillText(text, cx, cy - 1);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 40 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    const alpha = clamp(ft.life / (ft.maxLife * 0.5), 0, 1);
    const scale = 1 + (1 - ft.life / ft.maxLife) * 0.3;
    ctx.globalAlpha = alpha;
    drawGlowText(ft.text, ft.x, ft.y, Math.floor(ft.size * scale), ft.color, 'center', 18);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const pad = 16;
  const top = 14 + (CSS.supports('padding-top: env(safe-area-inset-top)') ? 30 : 0);

  // Score — gold neon 3D with pulse
  const finalScore = Math.floor(score + distance);
  const scorePulse = 1 + Math.sin(Date.now() * 0.005) * 0.06;
  const scoreSize = Math.floor(48 * scorePulse);
  draw3DScore(finalScore.toLocaleString(), W / 2, top + 30, scoreSize, COL.gold);

  // Diamonds — top-left with diamond icon
  drawDiamond(pad + 10, top + 10, 0.5, performance.now() * 0.002, false);
  drawGlowText(`${orbsCollected}`, pad + 24, top, 20, COL.cyanGlow, 'left', 8);

  // Level — glowing, pulses on level up
  const env = getEnvPhase();
  const lvScale = levelUpFlash > 0 ? 1 + Math.sin(levelUpFlash * 8) * 0.15 : 1;
  const lvSize = Math.floor(18 * lvScale);
  drawGlowText(`LV ${level}`, pad, top + 28, lvSize, env.edge, 'left', levelUpFlash > 0 ? 20 : 10);

  // Distance — top-right
  drawGlowText(`${Math.floor(distance)}m`, W - pad, top, 24, 'rgba(255,255,255,0.7)', 'right', 6);

  // Combo — scales bigger with higher combos
  if (combo > 1 && comboTimer > 0) {
    const comboAlpha = Math.min(1, comboTimer);
    ctx.globalAlpha = comboAlpha;
    const mult = Math.min(combo, 10);
    const comboSize = 22 + Math.min(mult, 10) * 2;
    const comboPulse = 1 + Math.sin(Date.now() * 0.01) * 0.1;
    drawGlowText(`x${mult} COMBO`, W / 2, top + 58, Math.floor(comboSize * comboPulse), COL.gold, 'center', 20);
    ctx.globalAlpha = 1;
  }

  // Distance milestone flash
  if (distanceMarkerFlash > 0) {
    ctx.globalAlpha = distanceMarkerFlash;
    drawGlowText(`${Math.floor(lastMarkerDistance)}m`, W / 2, H * 0.35, 36, COL.cyan, 'center', 24);
    ctx.globalAlpha = 1;
  }

  // Health hearts — color-coded: green (3), yellow (2), magenta (1)
  for (let i = 0; i < 3; i++) {
    const hx = W - pad - i * 24 - 12;
    const hy = top + 30;
    const filled = i < health;
    ctx.save();
    ctx.translate(hx, hy);
    const heartScale = filled && hitFlashTimer > 0 ? 1.3 : 1;
    ctx.scale(heartScale, heartScale);
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(-5, -3, -9, -3, -9, 1);
    ctx.bezierCurveTo(-9, 5, 0, 10, 0, 12);
    ctx.bezierCurveTo(0, 10, 9, 5, 9, 1);
    ctx.bezierCurveTo(9, -3, 5, -3, 0, 3);
    ctx.closePath();
    if (filled) {
      const hCol = health === 3 ? COL.emerald : health === 2 ? COL.gold : COL.magenta;
      ctx.fillStyle = hCol;
      ctx.shadowColor = hCol;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Gold coin progress — 3 coin slots below level
  const coinY = top + 48;
  for (let i = 0; i < 3; i++) {
    const cx = pad + 8 + i * 20;
    const filled = i < goldCoinsCollected;
    const flashScale = (filled && goldCoinHudFlash > 0) ? 1 + goldCoinHudFlash * 0.5 : 1;
    ctx.save();
    ctx.translate(cx, coinY);
    ctx.scale(flashScale, flashScale);
    if (filled) {
      ctx.fillStyle = COL.gold;
      ctx.shadowColor = COL.gold;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.fill();
      // Star in center
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#B8860B';
      ctx.font = 'bold 8px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u2605', 0, 0.5);
    } else {
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  // Jackpot celebration overlay
  if (jackpotTimer > 0) {
    const t = jackpotTimer / 2.5;
    // Pulsing golden border
    ctx.save();
    ctx.globalAlpha = t * 0.25;
    const jGrad = ctx.createLinearGradient(0, 0, 0, H * 0.1);
    jGrad.addColorStop(0, COL.gold);
    jGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = jGrad;
    ctx.fillRect(0, 0, W, H * 0.1);
    const jGrad2 = ctx.createLinearGradient(0, H, 0, H * 0.9);
    jGrad2.addColorStop(0, COL.gold);
    jGrad2.addColorStop(1, 'transparent');
    ctx.fillStyle = jGrad2;
    ctx.fillRect(0, H * 0.9, W, H * 0.1);
    ctx.restore();
  }

  // High combo screen border glow (5x+)
  if (combo >= 5 && comboTimer > 0) {
    const mult = Math.min(combo, 10);
    const glowAlpha = Math.min(0.15, mult * 0.02) * Math.min(1, comboTimer);
    const pulse = 0.7 + Math.sin(Date.now() * 0.008) * 0.3;
    ctx.save();
    ctx.globalAlpha = glowAlpha * pulse;
    // Top border
    const borderGrad = ctx.createLinearGradient(0, 0, 0, H * 0.15);
    borderGrad.addColorStop(0, COL.gold);
    borderGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = borderGrad;
    ctx.fillRect(0, 0, W, H * 0.15);
    // Bottom border
    const borderGrad2 = ctx.createLinearGradient(0, H, 0, H * 0.85);
    borderGrad2.addColorStop(0, COL.gold);
    borderGrad2.addColorStop(1, 'transparent');
    ctx.fillStyle = borderGrad2;
    ctx.fillRect(0, H * 0.85, W, H * 0.15);
    // Side borders
    const sideGrad = ctx.createLinearGradient(0, 0, W * 0.08, 0);
    sideGrad.addColorStop(0, COL.gold);
    sideGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = sideGrad;
    ctx.fillRect(0, 0, W * 0.08, H);
    const sideGrad2 = ctx.createLinearGradient(W, 0, W * 0.92, 0);
    sideGrad2.addColorStop(0, COL.gold);
    sideGrad2.addColorStop(1, 'transparent');
    ctx.fillStyle = sideGrad2;
    ctx.fillRect(W * 0.92, 0, W * 0.08, H);
    ctx.restore();
  }

  // Level up flash overlay
  if (levelUpFlash > 1.5) {
    const t = (levelUpFlash - 1.5) / 1.0;
    ctx.globalAlpha = t * 0.15;
    ctx.fillStyle = env.edge;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  drawFloatingTexts();
}

// ─── MENU SCREEN ────────────────────────────────────────────────
function drawMenuScreen() {
  const titleY = H * 0.18;
  const time = performance.now();

  // Title sparkle particles around text
  if (Math.random() < 0.3) {
    spawnParticle(
      W / 2 + rand(-100, 100), titleY + rand(-20, 80),
      Math.random() < 0.5 ? COL.gold : COL.goldLight,
      rand(-0.5, 0.5), rand(-0.5, 0.5), rand(0.3, 0.8), rand(1, 3), 0
    );
  }

  // "WISH" — gold glow
  ctx.font = `bold 52px -apple-system, 'Segoe UI', Roboto, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = COL.gold;
  ctx.shadowBlur = 50;
  ctx.fillStyle = COL.gold;
  ctx.fillText('WISH', W / 2, titleY);
  ctx.shadowBlur = 25;
  ctx.fillText('WISH', W / 2, titleY);
  ctx.shadowBlur = 0;
  ctx.fillStyle = COL.goldLight;
  ctx.fillText('WISH', W / 2, titleY);

  // "RUNNER" — gold glow
  ctx.shadowColor = COL.gold;
  ctx.shadowBlur = 40;
  ctx.fillStyle = COL.gold;
  ctx.fillText('RUNNER', W / 2, titleY + 60);
  ctx.shadowBlur = 20;
  ctx.fillText('RUNNER', W / 2, titleY + 60);
  ctx.shadowBlur = 0;
  ctx.fillStyle = COL.goldLight;
  ctx.fillText('RUNNER', W / 2, titleY + 60);

  // Subtitle — cyan
  ctx.font = `400 14px -apple-system, 'Segoe UI', Roboto, sans-serif`;
  ctx.shadowColor = COL.cyan;
  ctx.shadowBlur = 12;
  ctx.fillStyle = COL.cyan;
  ctx.fillText('Run Your Dreams Through the Cosmos', W / 2, titleY + 105);
  ctx.shadowBlur = 0;

  // High score
  if (highScore > 0) {
    drawGlowText(`HIGH SCORE: ${highScore.toLocaleString()}`, W / 2, titleY + 145, 16, 'rgba(255,255,255,0.5)', 'center', 0);
  }

  if (totalCoins > 0) {
    drawGlowText(`\uD83D\uDC8E TOTAL DIAMONDS: ${totalCoins.toLocaleString()}`, W / 2, titleY + 168, 14, COL.cyanGlow, 'center', 0);
  }

  // TAP TO RUN — pulsing white glow
  const pulse = 0.5 + Math.sin(time * 0.004) * 0.3;
  ctx.globalAlpha = pulse;
  ctx.font = `bold 20px -apple-system, 'Segoe UI', Roboto, sans-serif`;
  ctx.shadowColor = COL.white;
  ctx.shadowBlur = 15;
  ctx.fillStyle = COL.white;
  ctx.textAlign = 'center';
  ctx.fillText('TAP TO RUN', W / 2, H * 0.65);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  drawGlowText('Drag to Move \u00B7 Swipe Up/Down', W / 2, H * 0.72, 12, 'rgba(255,255,255,0.2)', 'center', 0);
}

// ─── GAME OVER SCREEN ───────────────────────────────────────────
function drawGameOverScreen() {
  // Slow fade overlay
  const fadeAlpha = Math.min(0.8, deathTimer * 1.2);
  ctx.fillStyle = `rgba(5, 0, 15, ${fadeAlpha})`;
  ctx.fillRect(0, 0, W, H);

  if (deathTimer < 0.4) return; // brief pause before stats appear

  const centerY = H * 0.2;
  const finalScore = Math.floor(score + distance);
  const reveal = gameOverStatReveal;

  // YOUR WISH RUN
  if (reveal > 0) {
    const t = Math.min(1, reveal * 2);
    ctx.globalAlpha = t;
    ctx.font = `bold 36px -apple-system, 'Segoe UI', Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = COL.purple;
    ctx.shadowBlur = 30;
    ctx.fillStyle = COL.purple;
    ctx.fillText('YOUR WISH RUN', W / 2, centerY);
    ctx.shadowBlur = 0;
    ctx.fillStyle = COL.white;
    ctx.fillText('YOUR WISH RUN', W / 2, centerY);
    ctx.globalAlpha = 1;
  }

  const statY = centerY + 60;
  const lineH = 38;

  // Stats pop in one by one
  const stats = [
    { label: 'DISTANCE', value: `${Math.floor(distance)}m`, color: COL.cyan, delay: 0.3 },
    { label: 'SCORE', value: finalScore.toLocaleString(), color: COL.gold, delay: 0.6 },
    { label: 'DIAMONDS \uD83D\uDC8E', value: `${orbsCollected}`, color: COL.cyan, delay: 0.9 },
    { label: 'LEVEL', value: `${level}`, color: COL.purple, delay: 1.2 },
    { label: 'BEST COMBO', value: `x${maxCombo}`, color: COL.gold, delay: 1.5 },
    { label: 'JACKPOTS \uD83D\uDCB0', value: `${Math.floor((totalJackpots || 0))}`, color: COL.gold, delay: 1.8 },
  ];

  for (let i = 0; i < stats.length; i++) {
    const s = stats[i];
    const t = clamp((reveal - s.delay) * 3, 0, 1);
    if (t <= 0) continue;
    const bounce = t < 1 ? 1 + (1 - t) * 0.3 : 1; // pop-in bounce
    ctx.globalAlpha = t;
    const sy = statY + i * lineH;
    drawGlowText(s.label, W / 2, sy, 12, 'rgba(255,255,255,0.4)', 'center', 0);
    drawGlowText(s.value, W / 2, sy + 14, Math.floor(24 * bounce), s.color, 'center', 10);
  }
  ctx.globalAlpha = 1;

  // New high score
  if (reveal > 1.8 && isNewHighScore) {
    const flash = 0.7 + Math.sin(Date.now() * 0.008) * 0.3;
    ctx.globalAlpha = flash;
    drawGlowText('NEW RECORD! \uD83C\uDFC6', W / 2, statY + stats.length * lineH + 10, 22, COL.gold, 'center', 20);
    ctx.globalAlpha = 1;
    // Celebration particles
    if (Math.random() < 0.3) {
      spawnBurst(W / 2 + rand(-80, 80), statY + stats.length * lineH + rand(-20, 20), COL.gold, 3, 3, 0.5, 3);
    }
  } else if (reveal > 1.8) {
    drawGlowText(`BEST: ${highScore.toLocaleString()}`, W / 2, statY + stats.length * lineH + 10, 16, 'rgba(255,255,255,0.35)', 'center', 0);
  }

  // TAP TO RUN AGAIN
  if (reveal > 2.2) {
    const pulse = 0.4 + Math.sin(Date.now() * 0.004) * 0.3;
    ctx.globalAlpha = pulse;
    drawGlowText('TAP TO RUN AGAIN', W / 2, H * 0.82, 18, COL.white, 'center', 10);
    ctx.globalAlpha = 1;

    // WishPath link
    ctx.globalAlpha = 0.3;
    drawGlowText('Generate Your Real Roadmap \u2192', W / 2, H * 0.88, 12, COL.cyan, 'center', 0);
    ctx.globalAlpha = 1;
  }
}

// ─── MAIN LOOP ──────────────────────────────────────────────────
function update(dt) {
  updateStars(dt);
  updateParticles(dt);
  updateFloatingTexts(dt);
  updatePathSparkles(dt);
  spawnAmbientSparkles(dt);

  if (state === STATE.DEAD) {
    deathTimer += dt;
    gameOverStatReveal += dt;
    return;
  }

  if (state !== STATE.PLAYING) return;

  // Slow-mo
  let effDt = dt;
  if (slowMoTimer > 0) {
    slowMoTimer -= dt;
    effDt = dt * 0.3;
  }
  if (levelUpFlash > 0) levelUpFlash -= dt;

  // Distance + score
  distance += speed * effDt * 2;
  score += speed * effDt * 0.5;

  // Speed increase
  speedTimer += dt;
  if (speedTimer >= 10) {
    speedTimer = 0;
    const increment = speed < 2.5 ? 0.2 : speed < 5 ? 0.15 : 0.1;
    speed = Math.min(maxSpeed, speed + increment);
  }

  // Distance markers
  if (Math.floor(distance / 100) > Math.floor(lastMarkerDistance / 100)) {
    lastMarkerDistance = Math.floor(distance / 100) * 100;
    distanceMarkerFlash = 1;
    if (lastMarkerDistance % 500 === 0) {
      const env = getEnvPhase();
      spawnBurst(W / 2, H * 0.4, env.edge, 40, 5, 0.9, 5);
      spawnBurst(W / 2, H * 0.4, COL.cyan, 25, 4, 0.7, 4);
    }
  }
  if (distanceMarkerFlash > 0) distanceMarkerFlash -= dt * 1.5;

  // Combo decay
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) { combo = 0; comboTimer = 0; }
  }

  // Spawn obstacles
  const spawnRate = Math.max(0.9, 3.5 - distance * 0.0006);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = spawnRate + rand(-0.2, 0.2);
    spawnObstacle();
  }

  // Spawn orbs
  orbSpawnTimer -= dt;
  if (orbSpawnTimer <= 0) {
    orbSpawnTimer = rand(0.5, 1.2);
    spawnOrb();
  }

  // Gold coin spawning
  goldCoinSpawnDist += speed * effDt * 2;
  if (goldCoinSpawnDist >= nextGoldCoinAt) {
    spawnGoldCoin();
    goldCoinSpawnDist = 0;
    nextGoldCoinAt = rand(800, 1500);
  }

  updatePlayer(dt);
  updateObstacles(dt);
  updateOrbs(dt);
  updateGoldCoins(dt);
  checkCollisions();

  // Screen shake
  if (shakeDur > 0) {
    shakeDur -= dt;
    shakeX = rand(-8, 8) * (shakeDur / 0.5);
    shakeY = rand(-8, 8) * (shakeDur / 0.5);
  } else {
    shakeX = 0; shakeY = 0;
  }

  if (screenFlash > 0) screenFlash -= dt * 2;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Deep space background
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  // Nebulae layers
  drawNebulae();

  // Vanishing point glow
  const horizGrad = ctx.createRadialGradient(W / 2, H * HORIZON_Y, 0, W / 2, H * HORIZON_Y, W * 0.6);
  const env = getEnvPhase();
  horizGrad.addColorStop(0, `${env.grid} 0.08)`);
  horizGrad.addColorStop(0.5, `${env.grid} 0.03)`);
  horizGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = horizGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawStars(performance.now());
  drawGodRays(performance.now());
  drawPath();
  drawPathSparkles();

  // Draw objects sorted by depth
  const allObjects = [
    ...obstacles.map(o => ({ ...o, kind: 'obs' })),
    ...orbs.map(o => ({ ...o, kind: 'orb' })),
    ...goldCoins.map(o => ({ ...o, kind: 'gold' })),
  ];
  allObjects.sort((a, b) => b.z - a.z);
  for (const obj of allObjects) {
    if (obj.kind === 'orb') drawOrb(obj);
    else if (obj.kind === 'gold') drawGoldCoin(obj);
    else drawObstacle(obj);
  }

  if (state === STATE.PLAYING || state === STATE.DEAD) {
    drawPlayer();
  }

  drawParticles();
  ctx.restore();

  // Screen flash overlay
  if (screenFlash > 0) {
    ctx.globalAlpha = screenFlash * 0.35;
    ctx.fillStyle = screenFlashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (state === STATE.PLAYING) drawHUD();
  if (state === STATE.MENU) drawMenuScreen();
  if (state === STATE.DEAD) drawGameOverScreen();
}

function loop(time) {
  requestAnimationFrame(loop);
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  update(dt);
  draw();
}

lastTime = performance.now();
requestAnimationFrame(loop);
</script>
