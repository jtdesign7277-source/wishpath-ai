function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const isP = window.innerWidth < window.innerHeight && window.innerWidth < 900;
  W = isP ? window.innerHeight : window.innerWidth;
  H = isP ? window.innerWidth : window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = (isP ? window.innerHeight : W) + 'px';
  canvas.style.height = (isP ? window.innerWidth : H) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

function lerp(a,b,t){return a+(b-a)*t}
function rand(a,b){return Math.random()*(b-a)+a}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function arcadeFont(sz){return `${sz}px 'Press Start 2P', monospace`}
function hexToRgba(hex,a){const c=hex.replace('#','');return `rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`}

// ─── AUDIO ENGINE (Web Audio API — laser SFX) ─────────────────
let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playLaserSound(pitch){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    const osc=ac.createOscillator();const gain=ac.createGain();const filter=ac.createBiquadFilter();
    osc.type='sawtooth';osc.frequency.setValueAtTime(800+pitch*200,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200+pitch*80,ac.currentTime+0.08);
    filter.type='lowpass';filter.frequency.setValueAtTime(3000,ac.currentTime);
    filter.frequency.exponentialRampToValueAtTime(400,ac.currentTime+0.1);
    gain.gain.setValueAtTime(0.08,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.1);
    osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.12);
  }catch(e){}
}
function playHitSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    const osc=ac.createOscillator();const gain=ac.createGain();
    osc.type='square';osc.frequency.setValueAtTime(150,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40,ac.currentTime+0.15);
    gain.gain.setValueAtTime(0.1,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);
    osc.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.18);
  }catch(e){}
}
function playExplosionSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    const bufSize=ac.sampleRate*0.3;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
    const data=buf.getChannelData(0);for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
    const src=ac.createBufferSource();src.buffer=buf;
    const gain=ac.createGain();gain.gain.setValueAtTime(0.15,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);
    const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=800;
    src.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    src.start(ac.currentTime);
  }catch(e){}
}
function playNukeSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    // Deep bass rumble
    const osc=ac.createOscillator();const gain=ac.createGain();
    osc.type='sawtooth';osc.frequency.setValueAtTime(60,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20,ac.currentTime+1.2);
    gain.gain.setValueAtTime(0.2,ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.25,ac.currentTime+0.1);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+1.5);
    const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=200;
    osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+1.6);
    // White noise blast
    const bufSize=ac.sampleRate*0.8;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
    const data=buf.getChannelData(0);for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,1.5);
    const src=ac.createBufferSource();src.buffer=buf;
    const g2=ac.createGain();g2.gain.setValueAtTime(0.01,ac.currentTime);
    g2.gain.linearRampToValueAtTime(0.2,ac.currentTime+0.05);
    g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.8);
    src.connect(g2);g2.connect(ac.destination);src.start(ac.currentTime);
  }catch(e){}
}
function playNukeChargeSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    const osc=ac.createOscillator();const gain=ac.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(400,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200,ac.currentTime+0.25);
    gain.gain.setValueAtTime(0.12,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.35);
    osc.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.4);
  }catch(e){}
}

function initBgStars(){

    for(let i=0;i<layer.count;i++){
      bgStars.push({

        alpha:rand(layer.alpha*0.6,layer.alpha),
        twinkle:rand(1,5),offset:rand(0,6.28),
        speed:layer.speed,
        color:Math.random()<0.5?'#FFF':['#A855F7','#22D3EE','#3B82F6','#67E8F9','#C084FC'][randInt(0,4)],
      });
    }

  // Nebulae

    });
  }
}

function drawBackground(time){
  const theme=getTheme();
  const heat=clamp(distance/20000,0,0.4);

  // Sky gradient
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,theme.bg1);sg.addColorStop(1,theme.bg2);
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  // Heat overlay
  if(heat>0.02){
    ctx.globalAlpha=heat*0.25;
    const hg=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.7);
    hg.addColorStop(0,'rgba(255,80,20,0.12)');hg.addColorStop(1,'transparent');
    ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }

  // Nebulae
  for(const n of nebulae){
    const nx=((n.x-cameraX*n.speed)%W+W)%W;
    const ng=ctx.createRadialGradient(nx,n.y,0,nx,n.y,Math.max(n.rx,n.ry));
    ng.addColorStop(0,n.color);ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng;
    ctx.beginPath();ctx.ellipse(nx,n.y,n.rx,n.ry,0,0,Math.PI*2);ctx.fill();
  }

  // Perspective grid (depth fog)
  const tileSize=50;
  const offsetX=(cameraX*0.15)%tileSize;
  ctx.strokeStyle=theme.grid;ctx.lineWidth=0.5;
  ctx.beginPath();
  for(let x=-offsetX;x<W+tileSize;x+=tileSize){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=0;y<=H;y+=tileSize){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();

  // Stars (parallax layers)
  for(const s of bgStars){
    const sx=((s.x-cameraX*s.speed)%W+W)%W;
    const tw=Math.sin(time*0.001*s.twinkle+s.offset);
    const a=s.alpha*(0.5+tw*0.5);
    if(a<0.03)continue;
    ctx.globalAlpha=a;ctx.fillStyle=s.color;
    if(s.size>1.5){ctx.shadowColor=s.color;ctx.shadowBlur=s.size*4;}
    ctx.beginPath();ctx.arc(sx,s.y,s.size,0,Math.PI*2);ctx.fill();
    // Cross glow for bright stars
    if(s.size>2.2&&a>0.4){
      ctx.globalAlpha=a*0.25;
      const arm=s.size*4;
      ctx.fillRect(sx-arm,s.y-0.5,arm*2,1);
      ctx.fillRect(sx-0.5,s.y-arm,1,arm*2);
    }
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // Data streams (Matrix/crypto falling numbers)
  for(const ds of dataStreams){
    const dx=((ds.x-cameraX*ds.speed)%W+W)%W;
    ctx.globalAlpha=ds.alpha;ctx.font=`${ds.charH}px monospace`;ctx.fillStyle=ds.color;
    const scrollOff=(time*0.03+ds.offset)%(ds.chars.length*ds.charH+H);
    for(let ci=0;ci<ds.chars.length;ci++){
      const cy=-ds.chars.length*ds.charH+scrollOff+ci*ds.charH;
      if(cy>-20&&cy<H+20){
        const fade=ci===0?0.3:ci===ds.chars.length-1?0.3:1;
        ctx.globalAlpha=ds.alpha*fade;
        ctx.fillText(ds.chars[ci],dx,cy);
      }
    }
  }
  ctx.globalAlpha=1;

  // Scan lines (subtle CRT/holographic)
  ctx.globalAlpha=0.02;ctx.fillStyle='#000';
  for(let y=0;y<H;y+=3){ctx.fillRect(0,y,W,1);}
  ctx.globalAlpha=1;

  // Level warp overlay
  if(levelWarpTimer>0){
    if(levelWarpTimer>1.5){ctx.globalAlpha=(levelWarpTimer-1.5)*2;ctx.fillStyle='#FFF';ctx.fillRect(0,0,W,H);}
    else if(levelWarpTimer>0.5){ctx.globalAlpha=(levelWarpTimer-0.5)*0.3;ctx.fillStyle=theme.edge;ctx.fillRect(0,0,W,H);}
    ctx.globalAlpha=1;
  }
}

// ─── PARTICLES ─────────────────────────────────────────────────
function spawnP(x,y,color,vx,vy,life,size,grav){
  if(particles.length>=MAX_PARTICLES)return;
  particles.push({x,y,vx:vx||0,vy:vy||0,life,maxLife:life,size:size||3,color,grav:grav||0});
}
function spawnBurst(x,y,color,count,spread,life,size){
  const n=Math.min(count,MAX_PARTICLES-particles.length);
  for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),spd=rand(0.5,spread);spawnP(x,y,color,Math.cos(a)*spd,Math.sin(a)*spd,rand(life*0.5,life),rand(size*0.3,size),0.02);}
}
function spawnOrbBurst(x,y,colors,count,spread){
  const n=Math.min(count,MAX_PARTICLES-particles.length);
  for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),spd=rand(1,spread);spawnP(x,y,colors[randInt(0,colors.length-1)],Math.cos(a)*spd,Math.sin(a)*spd,rand(0.4,1.0),rand(3,10),0.01);}
  for(let i=0;i<Math.min(30,MAX_PARTICLES-particles.length);i++){const a=rand(0,Math.PI*2);spawnP(x,y,'#FFF',Math.cos(a)*rand(spread*0.8,spread*1.2),Math.sin(a)*rand(spread*0.8,spread*1.2),rand(0.2,0.5),rand(1,3),0);}
}
function spawnDeathExplosion(x,y){
  const cols=['#FF4444','#FF8800','#FFCC00','#FF2EC4','#A855F7','#22D3EE','#FFF','#FDE047'];

  for(let i=0;i<40;i++){const a=rand(0,Math.PI*2),spd=rand(0.5,5);spawnP(x,y,'#FF6600',Math.cos(a)*spd,Math.sin(a)*spd,rand(0.3,0.8),rand(5,15),0.05);}
  for(let i=0;i<35;i++){deathParticles.push({x,y,vx:rand(-10,10),vy:rand(-12,6),rot:rand(0,6.28),rotV:rand(-0.4,0.4),size:rand(3,14),life:rand(0.8,2.5),maxLife:2.5,color:cols[randInt(0,7)]});}
}
// TOWER EXPLOSION — called when shielded player smashes a wall

// Swap-remove for O(1) particle deletion — GD-style performance
function swapRemove(arr,i){arr[i]=arr[arr.length-1];arr.pop();}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=p.grav*dt*60;p.life-=dt;if(p.life<=0)swapRemove(particles,i);}
  for(let i=deathParticles.length-1;i>=0;i--){const d=deathParticles[i];d.x+=d.vx*dt*60;d.y+=d.vy*dt*60;d.vy+=0.2*dt*60;d.rot+=d.rotV*dt*60;d.life-=dt;if(d.life<=0)swapRemove(deathParticles,i);}
}
function drawParticles(){
  for(const p of particles){const a=clamp(p.life/p.maxLife,0,1),sz=p.size*(0.3+a*0.7);if(sz<0.3)continue;ctx.globalAlpha=a*0.9;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=Math.min(12,sz*2);ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();}
  for(const d of deathParticles){const a=clamp(d.life/d.maxLife,0,1);ctx.globalAlpha=a;ctx.fillStyle=d.color;ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.fillRect(-d.size/2,-d.size/2,d.size,d.size);ctx.restore();}
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

}

    }
  }
  for(let i=persistentSmoke.length-1;i>=0;i--){const s=persistentSmoke[i];s.x+=s.vx*dt*60;s.y+=s.vy*dt*60;s.vy-=0.02*dt*60;s.size=lerp(s.size,s.maxSize,dt*2);s.life-=dt;if(s.life<=0)swapRemove(persistentSmoke,i);}

function drawPersistentSmoke(){
  for(const s of persistentSmoke){

  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

// ─── SPARKLE STARS — premium twinkling decoration ──────────────
function spawnSparkle(){
  const colors=['#FFFFFF','#FFF8DC','#FFD700','#FEF08A','#E0F0FF','#D0E8FF'];
  sparkles.push({
    x:rand(0,W),y:rand(0,H),
    size:rand(3,7),
    color:colors[randInt(0,colors.length-1)],
    vx:rand(-8,8),vy:rand(-12,-2),
    life:rand(1.2,2.8),maxLife:0,
    phase:rand(0,Math.PI*2), // twinkle phase offset
    twinkleSpeed:rand(0.003,0.008),
    points:Math.random()<0.5?4:6,
  });
  sparkles[sparkles.length-1].maxLife=sparkles[sparkles.length-1].life;
}
function updateSparkles(dt){
  // Keep 6–10 sparkles alive at all times
  while(sparkles.length<8)spawnSparkle();
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.life<=0)swapRemove(sparkles,i);
  }
}
function drawStarShape(x,y,r,points){
  const step=Math.PI/points;ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const a=i*step-Math.PI/2;const rad=i%2===0?r:r*0.42;
    i===0?ctx.moveTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad):ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);
  }ctx.closePath();
}
function drawSparkles(){
  const time=performance.now();
  for(const s of sparkles){
    const lifeFrac=s.life/s.maxLife;
    // fade in (first 15%) and out (last 30%)
    const fadeIn=lifeFrac>0.85?((1-lifeFrac)/0.15):1;
    const fadeOut=lifeFrac<0.3?(lifeFrac/0.3):1;
    const alpha=fadeIn*fadeOut*(0.55+Math.sin(time*s.twinkleSpeed+s.phase)*0.45);
    if(alpha<=0)continue;
    ctx.save();ctx.globalAlpha=clamp(alpha,0,1);
    ctx.shadowColor=s.color;ctx.shadowBlur=s.size*2.5;
    ctx.fillStyle=s.color;
    drawStarShape(s.x,s.y,s.size,s.points);ctx.fill();
    // Tiny bright center dot
    ctx.shadowBlur=0;ctx.fillStyle='#FFFFFF';ctx.globalAlpha=clamp(alpha*0.8,0,1);
    ctx.beginPath();ctx.arc(s.x,s.y,s.size*0.22,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function addFloatingText(x,y,text,color,size){floatingTexts.push({x,y,text,color,size:size||14,life:1.5,maxLife:1.5});}
function updateFloatingTexts(dt){for(let i=floatingTexts.length-1;i>=0;i--){const ft=floatingTexts[i];ft.y-=50*dt;ft.life-=dt;if(ft.life<=0)swapRemove(floatingTexts,i);}}
function drawFloatingTexts(){for(const ft of floatingTexts){const a=clamp(ft.life/ft.maxLife,0,1),sc=1+(1-a)*0.2;ctx.globalAlpha=a;ctx.save();ctx.translate(ft.x,ft.y);ctx.scale(sc,sc);ctx.font=arcadeFont(ft.size);ctx.fillStyle=ft.color;ctx.textAlign='center';ctx.shadowColor=ft.color;ctx.shadowBlur=15;ctx.fillText(ft.text,0,0);ctx.shadowBlur=0;ctx.restore();}ctx.globalAlpha=1;}

// ─── PATTERN-BASED MAZE WALLS (GD-style learnable sequences) ────
// Patterns create rhythm — groups then gaps, zigzags, tunnels, waves
const WALL_PATTERNS=[
  'straight',   // straight corridor, same gap Y
  'zigzag',     // alternating up-down gaps
  'wave',       // sinusoidal wave motion
  'tunnel',     // tight narrowing corridor
  'scatter',    // random placement (classic)
  'staircase',  // gaps step up or down progressively
];
let currentPattern='scatter',patternWallsLeft=0,patternBaseY=0,patternDir=1,patternStep=0;

function pickNextPattern(){
  const diff=clamp(distance/15000,0,1);
  const pool=diff<0.2?['straight','scatter','wave']:diff<0.5?['straight','zigzag','wave','scatter','staircase']:WALL_PATTERNS;
  currentPattern=pool[randInt(0,pool.length-1)];
  patternWallsLeft=randInt(3,7);patternStep=0;patternDir=Math.random()<0.5?1:-1;
  patternBaseY=H*0.3+rand(0,H*0.4);
}

function generateWalls(){
  const needUpTo=cameraX+W+600;
  const diff=clamp(distance/15000,0,1);
  const ld=(level-1)*0.08;
  while(nextWallX<needUpTo){
    // Pick new pattern when current one is done or on first call
    if(patternWallsLeft<=0){
      pickNextPattern();
      // Breathing room between patterns — GD-style gap
      nextWallX+=rand(180,280);
    }
    const spacing=Math.max(140,280-diff*90-ld*35+rand(-15,15));
    nextWallX+=spacing;
    const gapH=Math.max(75,170-diff*50-ld*20+rand(-8,8));
    const margin=gapH/2+25;

    // Pattern-driven gap Y position
    let gapY;
    switch(currentPattern){
      case 'straight':
        gapY=patternBaseY;break;
      case 'zigzag':
        gapY=patternBaseY+patternDir*(patternStep%2===0?H*0.15:-H*0.15);break;
      case 'wave':
        gapY=H/2+Math.sin(patternStep*0.8)*H*0.25;break;
      case 'tunnel':
        gapY=patternBaseY+patternDir*patternStep*15;break;
      case 'staircase':
        gapY=patternBaseY+patternDir*patternStep*35;break;
      default: // scatter — original random
        gapY=H/2+Math.sin(nextWallX*0.003+level)*H*0.28+rand(-50,50);break;
    }
    gapY=clamp(gapY,margin,H-margin);

    let type=0;
    if(diff>0.3&&Math.random()<0.2+diff*0.15)type=1; // thick wall
    if(diff>0.5&&Math.random()<0.1+diff*0.1)type=2;   // double wall

    walls.push({x:nextWallX,gapY,gapH,passed:false,type,hit:false});
    if(type===2){walls.push({x:nextWallX+55,gapY:clamp(gapY+rand(-40,40),margin,H-margin),gapH:gapH*0.9,passed:false,type:0,hit:false});}

    // Collectibles — placed in gap for rhythm (reward good pathing)
    if(Math.random()<0.55){const rr=Math.random(),dsz=rr<0.4?0.6:rr<0.8?1.0:1.5,dpt=dsz===0.6?500:dsz===1.0?1000:2000;diamonds.push({x:nextWallX+rand(5,35),y:gapY+rand(-gapH*0.2,gapH*0.2),collected:false,anim:rand(0,6.28),dSize:dsz,dPts:dpt});}
    if(Math.random()<0.25){const rr=Math.random(),dsz=rr<0.4?0.6:rr<0.8?1.0:1.5,dpt=dsz===0.6?500:dsz===1.0?1000:2000;diamonds.push({x:nextWallX-spacing*0.5,y:rand(50,H-50),collected:false,anim:rand(0,6.28),dSize:dsz,dPts:dpt});}
    if(Math.random()<0.04)bitcoins.push({x:nextWallX+rand(-15,15),y:gapY,collected:false,anim:rand(0,6.28)});
    if(Math.random()<0.05)blueDiamonds.push({x:nextWallX+rand(5,35),y:gapY+rand(-15,15),collected:false,anim:rand(0,6.28)});
    if(Math.random()<0.035)rocketBoosters.push({x:nextWallX+rand(5,30),y:gapY+rand(-gapH*0.15,gapH*0.15),collected:false,anim:rand(0,6.28)});
    if(Math.random()<0.026)gunOrbPickups.push({x:nextWallX+rand(8,42),y:gapY+rand(-gapH*0.22,gapH*0.22),collected:false,anim:rand(0,6.28)});

    patternWallsLeft--;patternStep++;
  }
}

function drawWalls(time){
  const theme=getTheme();
  for(const w of walls){
    const sx=w.x-cameraX;
    if(sx<-80||sx>W+80)continue;
    const wallW=w.type===1?48:30;
    const topH=w.gapY-w.gapH/2;
    const botY=w.gapY+w.gapH/2;
    draw3DWall(sx,0,wallW,topH,theme,w.hit,true);
    draw3DWall(sx,botY,wallW,H-botY,theme,w.hit,false);
    // Neon gap edge glow
    if(!w.hit){
      ctx.shadowColor=theme.edge;ctx.shadowBlur=12;ctx.strokeStyle=theme.edge;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sx,topH);ctx.lineTo(sx+wallW,topH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx,botY);ctx.lineTo(sx+wallW,botY);ctx.stroke();
      ctx.shadowBlur=0;
    }
  }
}

function draw3DWall(x,y,w,h,theme,hit,isTop){
  if(h<=0)return;
  const bevel=6; // 3D depth

  // Main face
  ctx.fillStyle=hit?'rgba(255,50,50,0.35)':theme.wall;
  ctx.fillRect(x,y,w,h);

  // Inner grid
  ctx.strokeStyle=hit?'rgba(255,100,100,0.08)':hexToRgba(theme.wallEdge,0.12);
  ctx.lineWidth=0.5;ctx.beginPath();
  const ts=25;
  for(let gx=x;gx<=x+w;gx+=ts){ctx.moveTo(gx,y);ctx.lineTo(gx,y+h);}
  for(let gy=y-(y%ts);gy<=y+h;gy+=ts){if(gy>=y){ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);}}
  ctx.stroke();

  // 3D bevel — highlight edge (facing player, left side)
  const hlGrad=ctx.createLinearGradient(x,0,x+bevel,0);
  hlGrad.addColorStop(0,hit?'rgba(255,100,100,0.3)':hexToRgba(theme.wallHi||theme.wallEdge,0.35));
  hlGrad.addColorStop(1,'transparent');
  ctx.fillStyle=hlGrad;ctx.fillRect(x,y,bevel,h);

  // 3D bevel — top/bottom edge (gap-facing edge gets bright highlight)
  if(isTop){
    // Bottom edge of top wall = gap edge = bright
    const btGrad=ctx.createLinearGradient(0,y+h-bevel,0,y+h);
    btGrad.addColorStop(0,'transparent');
    btGrad.addColorStop(1,hit?'rgba(255,100,100,0.2)':hexToRgba(theme.wallHi||theme.wallEdge,0.3));
    ctx.fillStyle=btGrad;ctx.fillRect(x,y+h-bevel,w,bevel);
  }else{
    // Top edge of bottom wall = gap edge = bright
    const tpGrad=ctx.createLinearGradient(0,y,0,y+bevel);
    tpGrad.addColorStop(0,hit?'rgba(255,100,100,0.2)':hexToRgba(theme.wallHi||theme.wallEdge,0.3));
    tpGrad.addColorStop(1,'transparent');
    ctx.fillStyle=tpGrad;ctx.fillRect(x,y,w,bevel);
  }

  // Shadow on far edge (right side)
  const shGrad=ctx.createLinearGradient(x+w-bevel,0,x+w,0);
  shGrad.addColorStop(0,'transparent');
  shGrad.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle=shGrad;ctx.fillRect(x+w-bevel,y,bevel,h);

  // Outline
  ctx.strokeStyle=hit?'rgba(255,80,80,0.4)':theme.wallEdge;
  ctx.lineWidth=1.5;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

// ─── BOUNDARY WALLS ────────────────────────────────────────────
function drawBoundaryWalls(){
  const theme=getTheme();const bh=8;
  // Boundary walls pulse with rhythm — GD breathing feel
  const bp=6+Math.sin(performance.now()*0.004)*3;
  ctx.fillStyle=theme.wall;ctx.fillRect(0,0,W,bh);
  ctx.shadowColor=theme.edge;ctx.shadowBlur=bp;ctx.strokeStyle=theme.edge;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,bh);ctx.lineTo(W,bh);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=theme.wall;ctx.fillRect(0,H-bh,W,bh);
  ctx.shadowColor=theme.edge;ctx.shadowBlur=bp;
  ctx.beginPath();ctx.moveTo(0,H-bh);ctx.lineTo(W,H-bh);ctx.stroke();ctx.shadowBlur=0;
}

function drawDiamond(d,time){
  if(d.collected)return;const sx=d.x-cameraX;if(sx<-50||sx>W+50)return;
  const bob=Math.sin(time*0.003+d.anim)*5;
  const scale=d.dSize||1.0;
  ctx.save();ctx.translate(sx,d.y+bob);ctx.scale(scale,scale);ctx.rotate(Math.sin(time*0.002+d.anim)*0.2);
  const sz=13;
  ctx.shadowColor=scale>=1.5?'#FDE047':'#7DF900';ctx.shadowBlur=scale>=1.5?22:14;
  const fill=scale>=1.5?'#A4FF44':scale<=0.6?'#5EC700':'#7DF900';
  ctx.beginPath();ctx.moveTo(0,-sz);ctx.lineTo(sz,0);ctx.lineTo(0,sz);ctx.lineTo(-sz,0);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#A4FF44';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.moveTo(0,-sz*0.5);ctx.lineTo(sz*0.35,0);ctx.lineTo(0,sz*0.1);ctx.lineTo(-sz*0.1,-sz*0.1);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

// BITCOIN — spinning 3D gold coin with ₿
function drawBitcoin(bc,time){
  if(bc.collected)return;const sx=bc.x-cameraX;if(sx<-35||sx>W+35)return;
  const bob=Math.sin(time*0.004+bc.anim)*4;
  const spin=time*0.003+bc.anim;
  const scaleX=Math.cos(spin);
  const absScale=Math.abs(scaleX);
  ctx.save();ctx.translate(sx,bc.y+bob);ctx.scale(0.2+absScale*0.8,1);

  const r=16;
  // Gold metallic gradient
  ctx.shadowColor='#FDE047';ctx.shadowBlur=20;
  const cg=ctx.createRadialGradient(-3,-3,0,0,0,r);
  cg.addColorStop(0,'#FEF08A');cg.addColorStop(0.4,'#FDE047');cg.addColorStop(0.7,'#EAB308');cg.addColorStop(1,'#A16207');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();

  // Rim
  ctx.strokeStyle='#D97706';ctx.lineWidth=2.5;ctx.stroke();

  // Inner ring
  ctx.strokeStyle='rgba(254,240,138,0.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,r*0.75,0,Math.PI*2);ctx.stroke();

  // ₿ symbol (only when face is visible enough)
  ctx.shadowBlur=0;
  if(absScale>0.3){
    ctx.font=`bold ${Math.floor(r*1.1)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#92400E';ctx.fillText('₿',1,1);
    ctx.fillStyle='#FEF9C3';ctx.fillText('₿',0,0);
  }

  // Shine highlight
  ctx.globalAlpha=0.25;ctx.fillStyle='#FFF';
  ctx.beginPath();ctx.ellipse(-r*0.25,-r*0.25,r*0.5,r*0.3,Math.PI*0.2,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  ctx.restore();
}

// ─── SPACESHIP ─────────────────────────────────────────────────
function drawShip(time){
  if(state===STATE.DEAD&&deathTimer>0.25)return;
  const sx=SHIP_X,sy=ship.y;
  if(invincTimer>0&&Math.floor(invincTimer*10)%2===0)ctx.globalAlpha=0.5;

  // Engine trail
  if(state===STATE.PLAYING){
    const tc=shieldActive?`hsl(${(performance.now()*0.4)%360},100%,65%)`:rocketBoostActive?'#F97316':superBoostTimer>0?'#FDE047':'#22D3EE';
    ship.trail.push({x:sx-SHIP_W*0.5,y:sy,life:0.3,maxLife:0.3,color:tc,size:rand(3,rocketBoostActive?8:5)});
    if(ship.trail.length>25)ship.trail.shift();
  }
  for(let i=ship.trail.length-1;i>=0;i--){
    const t=ship.trail[i];t.x-=(rocketBoostActive?5:2.5);t.life-=0.016;
    if(t.life<=0){ship.trail.splice(i,1);continue;}
    ctx.globalAlpha=(t.life/t.maxLife)*(rocketBoostActive?0.5:0.35);ctx.fillStyle=t.color;
    ctx.shadowColor=t.color;ctx.shadowBlur=rocketBoostActive?10:5;
    ctx.beginPath();ctx.arc(t.x,t.y,t.size*(t.life/t.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(invincTimer>0&&Math.floor(invincTimer*10)%2===0)ctx.globalAlpha=0.5;

  ctx.save();ctx.translate(sx,sy);ctx.rotate(ship.bankAngle);

  // Boost auras
  if(superBoostTimer>0||rocketBoostActive){
    const bc=rocketBoostActive?'#F97316':'#FDE047';
    ctx.shadowColor=bc;ctx.shadowBlur=rocketBoostActive?50:35;
    ctx.fillStyle=rocketBoostActive?'rgba(249,115,22,0.2)':'rgba(253,224,71,0.12)';
    ctx.beginPath();ctx.arc(0,0,SHIP_W*(rocketBoostActive?1.0:0.8),0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // INVINCIBLE SHIELD AURA — pulsing rainbow dome
  if(shieldActive){
    const t=performance.now()*0.001;
    const warning=shieldTimer<2.0;
    const warnFlash=warning&&Math.floor(shieldTimer*6)%2===0;
    const pulse=0.85+Math.sin(shieldPhase*1.8)*0.15;
    const baseR=SHIP_W*1.15*pulse;

    // Inner fill dome
    const domeG=ctx.createRadialGradient(0,0,0,0,0,baseR);
    if(warnFlash){
      domeG.addColorStop(0,'rgba(255,80,80,0.22)');domeG.addColorStop(0.7,'rgba(255,40,40,0.10)');domeG.addColorStop(1,'rgba(255,0,0,0)');
    } else {
      domeG.addColorStop(0,`hsla(${(t*120)%360},100%,70%,0.18)`);
      domeG.addColorStop(0.5,`hsla(${(t*120+120)%360},100%,65%,0.10)`);
      domeG.addColorStop(1,'rgba(255,255,255,0)');
    }
    ctx.fillStyle=domeG;ctx.beginPath();ctx.arc(0,0,baseR,0,Math.PI*2);ctx.fill();

    // Three spinning rainbow rings
    for(let ring=0;ring<3;ring++){
      const ringR=baseR*(1+ring*0.18);
      const hue=warnFlash?0:(t*180+ring*120)%360;
      const alpha=warnFlash?(0.9-ring*0.2):(0.7-ring*0.15);
      ctx.globalAlpha=alpha;
      ctx.strokeStyle=warnFlash?'#FF3333':`hsl(${hue},100%,65%)`;
      ctx.lineWidth=3.5-ring*0.8;
      ctx.shadowColor=warnFlash?'#FF3333':`hsl(${hue},100%,65%)`;
      ctx.shadowBlur=18-ring*4;
      ctx.beginPath();ctx.arc(0,0,ringR,0,Math.PI*2);ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;

    // Orbiting energy sparks
    if(!warning){
      for(let s=0;s<6;s++){
        const angle=shieldPhase+s*(Math.PI/3);
        const spkR=baseR*1.05;
        const spkX=Math.cos(angle)*spkR,spkY=Math.sin(angle)*spkR;
        const hue2=(t*200+s*60)%360;
        ctx.globalAlpha=0.8;ctx.fillStyle=`hsl(${hue2},100%,70%)`;
        ctx.shadowColor=`hsl(${hue2},100%,70%)`;ctx.shadowBlur=12;
        ctx.beginPath();ctx.arc(spkX,spkY,3.5,0,Math.PI*2);ctx.fill();
      }
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }

  // Engine flame
  ship.flamePhase+=0.3;
  const boostMult=rocketBoostActive?3:superBoostTimer>0?1.5:1;
  const flameLen=(20+Math.sin(ship.flamePhase*3)*5)*boostMult;
  const flameW=(10+Math.sin(ship.flamePhase*5)*3)*boostMult;

  // Outer flame
  const fg=ctx.createLinearGradient(-SHIP_W*0.5-flameLen,0,-SHIP_W*0.5,0);
  fg.addColorStop(0,'transparent');
  if(rocketBoostActive){
    fg.addColorStop(0.2,'rgba(249,115,22,0.4)');fg.addColorStop(0.5,'rgba(239,68,68,0.6)');fg.addColorStop(0.8,'rgba(253,224,71,0.8)');
  }else if(superBoostTimer>0){
    fg.addColorStop(0.3,'rgba(253,224,71,0.6)');fg.addColorStop(0.7,'rgba(253,224,71,0.8)');
  }else{
    fg.addColorStop(0.3,'rgba(255,46,196,0.5)');fg.addColorStop(0.7,'rgba(168,85,247,0.7)');
  }
  fg.addColorStop(1,'rgba(34,211,238,0.9)');
  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.5,-flameW);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.7,0,-SHIP_W*0.5-flameLen,0);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.7,0,-SHIP_W*0.5,flameW);
  ctx.closePath();ctx.fill();

  // Inner flame core
  const ig=ctx.createLinearGradient(-SHIP_W*0.5-flameLen*0.6,0,-SHIP_W*0.5,0);
  ig.addColorStop(0,'transparent');ig.addColorStop(0.5,'rgba(255,255,255,0.4)');ig.addColorStop(1,'rgba(255,255,255,0.8)');
  ctx.fillStyle=ig;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.5,-flameW*0.35);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.4,0,-SHIP_W*0.5-flameLen*0.6,0);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.4,0,-SHIP_W*0.5,flameW*0.35);
  ctx.closePath();ctx.fill();

  // ═══ COMBAT WARSHIP — heavily detailed ═══
  const t=performance.now()*0.001;
  const shipStroke=shieldActive?`hsl(${(t*180)%360},100%,70%)`:rocketBoostActive?'#F97316':'#67E8F9';

  // Engine nacelles (two pods on wings)
  for(const side of [-1,1]){
    const ny=SHIP_H*0.42*side;
    // Nacelle body
    const ng=ctx.createLinearGradient(-SHIP_W*0.38,ny-5,-SHIP_W*0.38,ny+5);
    ng.addColorStop(0,'#4A2D8C');ng.addColorStop(0.5,'#2D1B69');ng.addColorStop(1,'#1A1040');
    ctx.fillStyle=ng;
    ctx.beginPath();ctx.moveTo(-SHIP_W*0.12,ny-4*side);ctx.lineTo(-SHIP_W*0.42,ny-5*side);
    ctx.lineTo(-SHIP_W*0.48,ny);ctx.lineTo(-SHIP_W*0.42,ny+5*side);
    ctx.lineTo(-SHIP_W*0.12,ny+4*side);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#7C3AED';ctx.lineWidth=0.8;ctx.stroke();
    // Nacelle exhaust glow
    const eGlow=ctx.createRadialGradient(-SHIP_W*0.48,ny,0,-SHIP_W*0.48,ny,8);
    eGlow.addColorStop(0,'rgba(34,211,238,0.6)');eGlow.addColorStop(0.5,'rgba(168,85,247,0.3)');eGlow.addColorStop(1,'transparent');
    ctx.fillStyle=eGlow;ctx.beginPath();ctx.arc(-SHIP_W*0.48,ny,8,0,Math.PI*2);ctx.fill();
  }

  // Wing-mounted heavy cannons (outer)
  for(const side of [-1,1]){
    const cy=SHIP_H*0.55*side;
    // Cannon housing
    ctx.fillStyle='#3A1E6E';ctx.strokeStyle='#A855F7';ctx.lineWidth=0.8;
    ctx.fillRect(SHIP_W*0.15,cy-2.5,SHIP_W*0.35,5);ctx.strokeRect(SHIP_W*0.15,cy-2.5,SHIP_W*0.35,5);
    // Cannon barrel tip
    ctx.fillStyle='#C084FC';
    ctx.fillRect(SHIP_W*0.48,cy-1.5,SHIP_W*0.12,3);
    // Cannon glow ring
    ctx.shadowColor='#FF2EC4';ctx.shadowBlur=6;
    ctx.fillStyle='#FF6BD6';ctx.beginPath();ctx.arc(SHIP_W*0.6,cy,2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // Main hull — armored, angular, aggressive
  const hg=ctx.createLinearGradient(0,-SHIP_H*0.5,0,SHIP_H*0.5);
  hg.addColorStop(0,'#D8B4FE');hg.addColorStop(0.15,'#C084FC');hg.addColorStop(0.3,'#A855F7');
  hg.addColorStop(0.5,'#7C3AED');hg.addColorStop(0.7,'#22D3EE');hg.addColorStop(0.85,'#0E7490');hg.addColorStop(1,'#064E5B');
  ctx.beginPath();
  // Nose — sharp pointed spear
  ctx.moveTo(SHIP_W*0.58,0);
  // Upper hull — angular armor plating
  ctx.lineTo(SHIP_W*0.4,-SHIP_H*0.12);
  ctx.lineTo(SHIP_W*0.25,-SHIP_H*0.28);
  ctx.lineTo(SHIP_W*0.05,-SHIP_H*0.35);
  ctx.lineTo(-SHIP_W*0.15,-SHIP_H*0.38);
  ctx.lineTo(-SHIP_W*0.35,-SHIP_H*0.32);
  // Rear — angular engine block
  ctx.lineTo(-SHIP_W*0.45,-SHIP_H*0.18);
  ctx.lineTo(-SHIP_W*0.5,-SHIP_H*0.08);
  ctx.lineTo(-SHIP_W*0.5,SHIP_H*0.08);
  ctx.lineTo(-SHIP_W*0.45,SHIP_H*0.18);
  // Lower hull mirror
  ctx.lineTo(-SHIP_W*0.35,SHIP_H*0.32);
  ctx.lineTo(-SHIP_W*0.15,SHIP_H*0.38);
  ctx.lineTo(SHIP_W*0.05,SHIP_H*0.35);
  ctx.lineTo(SHIP_W*0.25,SHIP_H*0.28);
  ctx.lineTo(SHIP_W*0.4,SHIP_H*0.12);
  ctx.closePath();
  ctx.fillStyle=hg;ctx.fill();

  // Damage tint
  if(damageLevel>=1){ctx.globalAlpha=0.15+damageLevel*0.1;ctx.fillStyle='#FF4444';ctx.fill();ctx.globalAlpha=1;}
  // Hull edge glow
  ctx.shadowColor=shipStroke;ctx.shadowBlur=shieldActive?30:rocketBoostActive?18:12;
  ctx.strokeStyle=shipStroke;ctx.lineWidth=shieldActive?2.5:1.8;ctx.stroke();ctx.shadowBlur=0;

  // Armor panel lines (detail seams)
  ctx.globalAlpha=0.25;ctx.strokeStyle='#FFF';ctx.lineWidth=0.6;
  ctx.beginPath();ctx.moveTo(SHIP_W*0.3,0);ctx.lineTo(-SHIP_W*0.1,-SHIP_H*0.32);ctx.stroke();
  ctx.beginPath();ctx.moveTo(SHIP_W*0.3,0);ctx.lineTo(-SHIP_W*0.1,SHIP_H*0.32);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.2,-SHIP_H*0.1);ctx.lineTo(-SHIP_W*0.2,SHIP_H*0.1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(SHIP_W*0.1,-SHIP_H*0.2);ctx.lineTo(SHIP_W*0.1,SHIP_H*0.2);ctx.stroke();
  ctx.globalAlpha=1;

  // Central ridge (spine)
  const rg=ctx.createLinearGradient(SHIP_W*0.4,0,-SHIP_W*0.3,0);
  rg.addColorStop(0,'rgba(255,255,255,0.15)');rg.addColorStop(0.5,'rgba(168,85,247,0.2)');rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg;
  ctx.beginPath();ctx.moveTo(SHIP_W*0.5,0);ctx.lineTo(SHIP_W*0.1,-SHIP_H*0.06);
  ctx.lineTo(-SHIP_W*0.3,-SHIP_H*0.04);ctx.lineTo(-SHIP_W*0.3,SHIP_H*0.04);
  ctx.lineTo(SHIP_W*0.1,SHIP_H*0.06);ctx.closePath();ctx.fill();

  // Cockpit — larger, more visible
  const cg2=ctx.createRadialGradient(SHIP_W*0.2,0,0,SHIP_W*0.2,0,12);
  cg2.addColorStop(0,'rgba(255,255,255,0.8)');cg2.addColorStop(0.3,'rgba(103,232,249,0.6)');
  cg2.addColorStop(0.6,'rgba(34,211,238,0.3)');cg2.addColorStop(1,'rgba(34,211,238,0.1)');
  ctx.fillStyle=cg2;ctx.beginPath();ctx.ellipse(SHIP_W*0.2,0,10,6,-0.1,0,Math.PI*2);ctx.fill();
  // Cockpit frame
  ctx.strokeStyle='rgba(103,232,249,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(SHIP_W*0.2,0,11,7,-0.1,0,Math.PI*2);ctx.stroke();

  // Nose-mounted twin guns (inner)
  ctx.fillStyle='#C084FC';ctx.strokeStyle='#FF2EC4';ctx.lineWidth=0.8;
  ctx.fillRect(SHIP_W*0.42,-SHIP_H*0.14,SHIP_W*0.18,3);ctx.strokeRect(SHIP_W*0.42,-SHIP_H*0.14,SHIP_W*0.18,3);
  ctx.fillRect(SHIP_W*0.42,SHIP_H*0.1,SHIP_W*0.18,3);ctx.strokeRect(SHIP_W*0.42,SHIP_H*0.1,SHIP_W*0.18,3);

  // Muzzle flash on all 4 guns while firing
  if(state===STATE.PLAYING){
    const gc=GUN_CONFIG[Math.min(gunTier,GUN_CONFIG.length-1)];
    if(gunCooldown>gc.interval*0.82){
      ctx.shadowColor='#FF2EC4';ctx.shadowBlur=12+gunTier*3;ctx.fillStyle='#FF6BD6';
      // Inner gun muzzles
      ctx.beginPath();ctx.arc(SHIP_W*0.62,-SHIP_H*0.12,3+gunTier*0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(SHIP_W*0.62,SHIP_H*0.12,3+gunTier*0.5,0,Math.PI*2);ctx.fill();
      // Outer cannon muzzles
      ctx.fillStyle='#FDE047';ctx.shadowColor='#FDE047';
      ctx.beginPath();ctx.arc(SHIP_W*0.6,-SHIP_H*0.55,2.5+gunTier*0.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(SHIP_W*0.6,SHIP_H*0.55,2.5+gunTier*0.4,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  // Swept-back fins — larger, aggressive
  const finG=ctx.createLinearGradient(-SHIP_W*0.35,0,-SHIP_W*0.2,0);
  finG.addColorStop(0,'#3A1E6E');finG.addColorStop(1,'#7C3AED');
  ctx.fillStyle=finG;
  // Top fin
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.15,-SHIP_H*0.35);ctx.lineTo(-SHIP_W*0.38,-SHIP_H*0.82);
  ctx.lineTo(-SHIP_W*0.48,-SHIP_H*0.65);ctx.lineTo(-SHIP_W*0.42,-SHIP_H*0.3);ctx.closePath();
  ctx.fill();ctx.strokeStyle='#A855F7';ctx.lineWidth=1;ctx.stroke();
  // Fin edge glow
  ctx.shadowColor='#A855F7';ctx.shadowBlur=6;ctx.strokeStyle='#C084FC';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.38,-SHIP_H*0.82);ctx.lineTo(-SHIP_W*0.48,-SHIP_H*0.65);ctx.stroke();ctx.shadowBlur=0;
  // Bottom fin
  ctx.fillStyle=finG;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.15,SHIP_H*0.35);ctx.lineTo(-SHIP_W*0.38,SHIP_H*0.82);
  ctx.lineTo(-SHIP_W*0.48,SHIP_H*0.65);ctx.lineTo(-SHIP_W*0.42,SHIP_H*0.3);ctx.closePath();
  ctx.fill();ctx.strokeStyle='#A855F7';ctx.lineWidth=1;ctx.stroke();
  ctx.shadowColor='#A855F7';ctx.shadowBlur=6;ctx.strokeStyle='#C084FC';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.38,SHIP_H*0.82);ctx.lineTo(-SHIP_W*0.48,SHIP_H*0.65);ctx.stroke();ctx.shadowBlur=0;

  // Running lights (pulsing)
  const pulse=0.5+Math.sin(t*6)*0.5;
  ctx.globalAlpha=0.6+pulse*0.4;
  // Wingtip lights
  ctx.fillStyle='#EF4444';ctx.shadowColor='#EF4444';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(-SHIP_W*0.38,-SHIP_H*0.75,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#22C55E';ctx.shadowColor='#22C55E';
  ctx.beginPath();ctx.arc(-SHIP_W*0.38,SHIP_H*0.75,2,0,Math.PI*2);ctx.fill();
  // Nose light
  ctx.fillStyle='#FFF';ctx.shadowColor='#67E8F9';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(SHIP_W*0.55,0,1.5+pulse,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.globalAlpha=1;

  // Top highlight sheen
  ctx.globalAlpha=0.1;ctx.fillStyle='#FFF';
  ctx.beginPath();ctx.moveTo(SHIP_W*0.5,0);ctx.quadraticCurveTo(SHIP_W*0.25,-SHIP_H*0.25,-SHIP_W*0.1,-SHIP_H*0.3);
  ctx.lineTo(-SHIP_W*0.1,-SHIP_H*0.05);ctx.quadraticCurveTo(SHIP_W*0.2,-SHIP_H*0.05,SHIP_W*0.5,0);ctx.closePath();ctx.fill();ctx.globalAlpha=1;

  // Scorch marks (battle damage)
  if(damageLevel>=1){ctx.globalAlpha=0.45;ctx.fillStyle='#333';
    ctx.beginPath();ctx.ellipse(-SHIP_W*0.15,SHIP_H*0.22,7,3.5,0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(SHIP_W*0.05,SHIP_H*0.3,5,2,0.5,0,Math.PI*2);ctx.fill();
    if(damageLevel>=2){ctx.beginPath();ctx.ellipse(SHIP_W*0.12,-SHIP_H*0.18,9,4.5,-0.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(-SHIP_W*0.3,SHIP_H*0.05,6,3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF4400';ctx.globalAlpha=0.15+Math.sin(t*12)*0.1;
      ctx.beginPath();ctx.arc(-SHIP_W*0.2,SHIP_H*0.1,8,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;}

  ctx.restore();ctx.globalAlpha=1;
}

// ─── WRECKAGE ──────────────────────────────────────────────────
function drawWreckage(time){
  const wx=wreckageX,wy=wreckageY;
  ctx.save();ctx.translate(wx,wy);ctx.rotate(0.3);
  ctx.globalAlpha=0.6;ctx.fillStyle='#444';ctx.beginPath();ctx.moveTo(-15,-8);ctx.lineTo(10,-12);ctx.lineTo(15,0);ctx.lineTo(-5,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#555';ctx.beginPath();ctx.moveTo(5,-5);ctx.lineTo(20,-3);ctx.lineTo(18,8);ctx.lineTo(0,6);ctx.closePath();ctx.fill();
  ctx.globalAlpha=0.3+Math.sin(time*0.005)*0.1;ctx.fillStyle='#FF4444';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore();
  for(let i=0;i<3;i++){const ph=time*0.001+i*1.5;const sx2=wx+Math.sin(ph*0.7)*8;const sy2=wy-10-((ph*20)%40);const sz2=4+((ph*5)%8);const a2=0.15-((ph*4)%0.15);if(a2>0){ctx.globalAlpha=a2;ctx.fillStyle='#555';ctx.beginPath();ctx.arc(sx2,sy2,sz2,0,Math.PI*2);ctx.fill();}}
  ctx.globalAlpha=1;
}

// ─── UPDATE ────────────────────────────────────────────────────
function updateShip(dt){
  if(state!==STATE.PLAYING)return;
  // Smooth drag-follow — ship glides to target, never teleports
  const dy=ship.targetY-ship.y;ship.vy=dy*4;ship.vy=clamp(ship.vy,-SHIP_SPEED,SHIP_SPEED);
  ship.y+=ship.vy*dt;ship.y=clamp(ship.y,25,H-25);
  ship.bankAngle=lerp(ship.bankAngle,clamp(ship.vy/SHIP_SPEED*0.45,-0.45,0.45),0.3);

  if(invincTimer>0)invincTimer-=dt;
  if(hitFlashTimer>0)hitFlashTimer-=dt;
  if(damageFlash>0)damageFlash-=dt*2;
  if(superBoostTimer>0)superBoostTimer-=dt;
  if(jackpotTimer>0){jackpotTimer-=dt;jackpotScoreAnim=Math.min(10000,jackpotScoreAnim+dt*8000);}
  if(levelUpFlash>0)levelUpFlash-=dt;
  if(levelWarpTimer>0)levelWarpTimer-=dt;
  if(blueDiamondHudFlash>0)blueDiamondHudFlash-=dt;
  if(rocketBoostHudFlash>0)rocketBoostHudFlash-=dt;
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)comboMultiplier=1;}

  // Shield drain + warning flash
  if(shieldActive){
    shieldTimer-=dt;shieldPhase+=dt*8;
    if(shieldTimer<=0){
      shieldActive=false;shieldTimer=0;
      screenFlash=0.4;screenFlashColor='#FF4444';shakeDur=0.3;
      addFloatingText(SHIP_X,ship.y-50,'SHIELD GONE!','#FF4444',18);
    } else if(shieldTimer<2.0&&Math.floor(shieldTimer*6)%2===0){
      screenFlash=0.06;screenFlashColor='#FFD700';
    }
  }

  // Rocket boost drain
  if(rocketBoostActive){
    rocketBoostFuel-=dt;
    if(rocketBoostFuel<=0){rocketBoostActive=false;rocketBoostReady=false;rocketBoostFuel=0;aButtonPressed=false;}
    // Massive exhaust particles
    for(let i=0;i<4;i++){
      spawnP(SHIP_X-SHIP_W*0.5-rand(5,25),ship.y+rand(-8,8),
        ['#F97316','#EF4444','#FDE047','#FFF'][randInt(0,3)],rand(-8,-14),rand(-1.5,1.5),rand(0.15,0.35),rand(2,6),0);
    }
    // Screen shake while boosting
    shakeX=rand(-2,2);shakeY=rand(-2,2);
  }

  // Normal engine particles — extra juicy
  if(Math.random()<0.7){
    const col=rocketBoostActive?'#F97316':superBoostTimer>0?'#FDE047':(Math.random()<0.5?'#FF2EC4':'#A855F7');
    spawnP(SHIP_X-SHIP_W*0.5-rand(5,15),ship.y+rand(-4,4),col,rand(-3,-6),rand(-0.5,0.5),rand(0.12,0.25),rand(1.5,3),0);
  }
  // Extra thrust sparkles
  if(Math.random()<0.35){
    spawnP(SHIP_X-SHIP_W*0.5-rand(2,10),ship.y+rand(-6,6),'#7132F5',rand(-4,-8)+(-ship.vy*0.02),rand(-1,1),rand(0.08,0.18),rand(1,2.5),0.02);
  }
}

function checkCollisions(){
  if(state!==STATE.PLAYING)return;
  // Tight geometric hitbox — forgiving enough for "near miss" thrill
  const sl=SHIP_X-SHIP_W*0.33+cameraX,sr=SHIP_X+SHIP_W*0.33+cameraX;
  const st=ship.y-SHIP_H*0.28,sb=ship.y+SHIP_H*0.28;
  const isInvincible=superBoostTimer>0||rocketBoostActive||shieldActive;

  // Walls
  for(const w of walls){
    if(w.hit&&w.passed)continue;
    const ww=w.type===1?48:30;
    if(sr>w.x&&sl<w.x+ww){
      const topH=w.gapY-w.gapH/2,botY=w.gapY+w.gapH/2;
      if(st<topH||sb>botY){
        if(isInvincible){
          if(!w.hit){
            w.hit=true;
            if(shieldActive){spawnTowerExplosion(w.x-cameraX,ship.y,w);}
            else{spawnBurst(SHIP_X,ship.y,'#FDE047',15,4,0.4,4);score+=50;}
          }
          continue;
        }
        if(invincTimer<=0&&!w.hit){w.hit=true;takeDamage();}
      }else if(!w.passed){w.passed=true;score+=10;}
    }
  }
  if(st<8||sb>H-8){if(invincTimer<=0&&!isInvincible)takeDamage();}

  // Diamonds
  for(const d of diamonds){
    if(d.collected)continue;
    const hitR=28*(d.dSize||1.0);
    if(Math.abs((SHIP_X+cameraX)-d.x)<hitR&&Math.abs(ship.y-d.y)<hitR){
      d.collected=true;diamondsCollected++;totalCoinsAll++;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      const basePts=d.dPts||1000;const dScore=basePts*comboMultiplier;score+=dScore;
      const burst=d.dSize>=1.5?60:d.dSize<=0.6?25:40;
      spawnOrbBurst(d.x-cameraX,d.y,['#7DF900','#A4FF44','#22D3EE','#67E8F9','#FFF'],burst+comboMultiplier*8,6+comboMultiplier);
      shakeDur=0.1+comboMultiplier*0.02;screenFlash=0.15;screenFlashColor='#7DF900';
      const szLabel=d.dSize>=1.5?' ★':d.dSize<=0.6?' •':'';
      addFloatingText(d.x-cameraX,d.y-25,'+'+dScore.toLocaleString()+szLabel+(comboMultiplier>1?' x'+comboMultiplier:''),'#7DF900',18+comboMultiplier*2);
    }
  }

  // Bitcoins
  for(const bc of bitcoins){
    if(bc.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-bc.x)<28&&Math.abs(ship.y-bc.y)<28){
      bc.collected=true;bitcoinsCollected++;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      const bcScore=2000*comboMultiplier;score+=bcScore;
      spawnOrbBurst(bc.x-cameraX,bc.y,['#FDE047','#FEF08A','#EAB308','#FFF','#FFD700'],60+comboMultiplier*8,8+comboMultiplier);
      shakeDur=0.15+comboMultiplier*0.02;screenFlash=0.2;screenFlashColor='#FDE047';
      addFloatingText(bc.x-cameraX,bc.y-25,'₿ +'+bcScore.toLocaleString()+(comboMultiplier>1?' x'+comboMultiplier:''),'#FDE047',20+comboMultiplier*2);
      if(bitcoinsCollected>=3){
        bitcoinsCollected=0;level++;levelWarpTimer=2.0;levelUpFlash=2.0;
        scrollSpeed=Math.min(maxSpeed,baseSpeed+(level-1)*22);
        shakeDur=0.6;screenFlash=0.8;screenFlashColor='#FFF';
        spawnOrbBurst(W/2,H/2,['#FFF','#FDE047','#A855F7','#22D3EE','#FF2EC4','#7DF900'],150,14);
        addFloatingText(W/2,H/2-40,'LEVEL '+level+'!','#FFF',30);
        addFloatingText(W/2,H/2+10,getTheme().name,getTheme().edge,14);
        score+=10000;jackpotTimer=2.5;jackpotScoreAnim=0;
      }
    }
  }

  // Blue diamonds
  for(const bd of blueDiamonds){
    if(bd.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-bd.x)<28&&Math.abs(ship.y-bd.y)<28){
      bd.collected=true;blueDiamondsCollected++;blueDiamondHudFlash=0.5;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      spawnOrbBurst(bd.x-cameraX,bd.y,['#3B82F6','#60A5FA','#93C5FD','#FFF'],40+comboMultiplier*5,6+comboMultiplier);
      shakeDur=0.1+comboMultiplier*0.01;screenFlash=0.1;screenFlashColor='#3B82F6';
      addFloatingText(bd.x-cameraX,bd.y-20,'◆ BOOST'+(comboMultiplier>1?' x'+comboMultiplier:''),'#60A5FA',14);
      if(blueDiamondsCollected>=3){
        blueDiamondsCollected=0;superBoostTimer=5;
        screenFlash=0.6;screenFlashColor='#3B82F6';shakeDur=0.3;
        spawnOrbBurst(SHIP_X,ship.y,['#3B82F6','#FDE047','#FFF'],80,10);
        addFloatingText(W/2,H/3,'⚡ SUPER BOOST! ⚡','#FDE047',20);
      }
    }
  }

  // Rocket boosters
  for(const rb of rocketBoosters){
    if(rb.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-rb.x)<28&&Math.abs(ship.y-rb.y)<28){
      rb.collected=true;rocketBoostersCollected++;rocketBoostHudFlash=0.5;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      spawnOrbBurst(rb.x-cameraX,rb.y,['#F97316','#EF4444','#FDE047','#FFF'],50+comboMultiplier*5,7+comboMultiplier);
      shakeDur=0.12+comboMultiplier*0.01;screenFlash=0.15;screenFlashColor='#F97316';
      addFloatingText(rb.x-cameraX,rb.y-20,'🚀 BOOSTER!'+(comboMultiplier>1?' x'+comboMultiplier:''),'#F97316',16);
      if(rocketBoostersCollected>=3){
        rocketBoostersCollected=0;
        shieldActive=true;shieldTimer=SHIELD_DURATION;shieldPhase=0;
        screenFlash=0.9;screenFlashColor='#FFD700';shakeDur=0.5;
        spawnOrbBurst(SHIP_X,ship.y,['#FFD700','#FF6BD6','#22D3EE','#A855F7','#FFF','#7DF900','#F97316'],140,16);
        addFloatingText(W/2,H/2-30,'🛡 INVINCIBLE SHIELD!','#FFD700',26);
        addFloatingText(W/2,H/2+10,'SMASH THROUGH TOWERS','#FF6BD6',14);
      }
    }
  }

  // Gun upgrade orbs — diamond cluster; each pickup raises blaster tier (max 5)
  for(const go of gunOrbPickups){
    if(go.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-go.x)<30&&Math.abs(ship.y-go.y)<30){
      go.collected=true;
      const prev=gunTier;
      gunTier=Math.min(gunTier+1,GUN_CONFIG.length-1);
      const names=['DUAL BLAST','TRIPLE','QUAD STREAM','RAPID FIRE','MAX BLASTER'];
      const msg=gunTier>prev?'⚡ '+names[gunTier-1]+'!':'⚡ MAX — BONUS!';
      spawnOrbBurst(go.x-cameraX,go.y,['#22D3EE','#A855F7','#FDE047','#FF2EC4','#FFF'],45,10);
      shakeDur=0.18;screenFlash=0.22;screenFlashColor='#A855F7';
      addFloatingText(go.x-cameraX,go.y-22,msg,'#FDE047',15);
      score+=500*comboMultiplier;
    }
  }
}

function takeDamage(){
  health--;damageLevel=maxHealth-health;invincTimer=1.5;hitFlashTimer=0.3;shakeDur=0.4;damageFlash=1.0;
  if(comboMultiplier>1)addFloatingText(SHIP_X,ship.y-55,'COMBO LOST!','#FF4444',12);
  comboMultiplier=1;comboTimer=0;
  screenFlash=0.3;screenFlashColor='#FF4444';
  spawnBurst(SHIP_X,ship.y,'#FF4444',25,5,0.5,4);
  // BIG smoke burst on impact — immediate visual feedback
  const smkCols=damageLevel>=2?['#111','#222','#333','#FF4400']:['#888','#AAA','#CCC','#FFF'];
  for(let i=0;i<(damageLevel>=2?20:12);i++){
    const a=rand(0,Math.PI*2),spd=rand(1,4);
    persistentSmoke.push({x:SHIP_X+rand(-10,10),y:ship.y+rand(-8,8),size:rand(6,14),maxSize:rand(20,40),life:rand(0.6,1.4),maxLife:1.4,vx:Math.cos(a)*spd-2,vy:Math.sin(a)*spd,dark:damageLevel>=2});
  }
  if(health<=0)die();else addFloatingText(SHIP_X,ship.y-35,'-1 ❤','#FF4444',16);
}

function die(){
  state=STATE.DEAD;deathTimer=0;damageLevel=3;wreckageX=SHIP_X;wreckageY=ship.y;
  rocketBoostActive=false;rocketBoostReady=false;shieldActive=false;shieldTimer=0;
  spawnDeathExplosion(SHIP_X,ship.y);shakeDur=0.8;screenFlash=0.6;screenFlashColor='#FF2222';
  if(score>highScore){highScore=Math.floor(score);localStorage.setItem('wr_m3_hi',highScore);}
  localStorage.setItem('wr_m3_coins',totalCoinsAll);attempt++;localStorage.setItem('wr_m3_attempt',attempt);
}

function startGame(){
  state=STATE.PLAYING;score=0;distance=0;health=3;damageLevel=0;damageFlash=0;
  invincTimer=0;hitFlashTimer=0;diamondsCollected=0;bitcoinsCollected=0;blueDiamondsCollected=0;
  rocketBoostersCollected=0;rocketBoostReady=false;rocketBoostActive=false;rocketBoostFuel=0;
  shieldActive=false;shieldTimer=0;shieldPhase=0;
  superBoostTimer=0;jackpotTimer=0;level=1;levelUpFlash=0;levelWarpTimer=0;
  scrollSpeed=baseSpeed;cameraX=0;nextWallX=W*0.7;
  ship.y=H/2;ship.vy=0;ship.targetY=H/2;ship.bankAngle=0;ship.trail=[];
  walls=[];diamonds=[];bitcoins=[];blueDiamonds=[];rocketBoosters=[];
  particles=[];deathParticles=[];persistentSmoke=[];floatingTexts=[];speedLines=[];sparkles=[];
  enemies=[];enemySpawnTimer=0;projectiles=[];gunTier=0;gunCooldown=0;gunOrbPickups=[];
  shakeX=0;shakeY=0;shakeDur=0;screenFlash=0;deathTimer=0;blueDiamondHudFlash=0;rocketBoostHudFlash=0;
  comboMultiplier=1;comboTimer=0;
  nukeCharges=0;nukeLastScore=0;nukeActive=false;nukeTimer=0;nukeBtnPulse=0;
  aButtonPressed=false;useMouseFollow=false;patternWallsLeft=0;
  runStartTime=performance.now();generateWalls();
}

function update(dt){
  processKeyboardInput(dt);
  if(state===STATE.DEAD){
    deathTimer+=dt;updateParticles(dt);updateFloatingTexts(dt);updateSparkles(dt);
    if(deathTimer>0.5&&Math.random()<0.3){persistentSmoke.push({x:wreckageX+rand(-10,10),y:wreckageY+rand(-8,5),size:rand(3,8),maxSize:rand(12,22),life:rand(0.5,1.2),maxLife:1.2,vx:rand(-1.5,0),vy:rand(-2,-0.5),dark:true});}
    updatePersistentSmoke(dt);
    if(shakeDur>0){shakeDur-=dt;shakeX=rand(-6,6)*(shakeDur/0.8);shakeY=rand(-6,6)*(shakeDur/0.8);}else{shakeX=0;shakeY=0;}
    if(screenFlash>0)screenFlash-=dt*2;return;
  }
  if(state!==STATE.PLAYING)return;

  const boostMult=rocketBoostActive?2.2:superBoostTimer>0?1.3:1;
  const effSpeed=scrollSpeed*boostMult;
  cameraX+=effSpeed*dt;distance+=effSpeed*dt;score+=effSpeed*dt*0.03;
  scrollSpeed=Math.min(maxSpeed,baseSpeed+distance*0.006+(level-1)*20);

  // Activate rocket boost if A pressed and ready
  if(aButtonPressed&&rocketBoostReady&&!rocketBoostActive){
    rocketBoostActive=true;rocketBoostReady=false;
    screenFlash=0.3;screenFlashColor='#F97316';shakeDur=0.3;
    spawnOrbBurst(SHIP_X,ship.y,['#F97316','#EF4444','#FDE047'],60,8);
    addFloatingText(W/2,H/2,'🚀 WICKED FAST!','#F97316',24);
  }
  if(!aButtonPressed&&rocketBoostActive){rocketBoostActive=false;}

  // NUKE CHARGE — check score thresholds
  for(let i=0;i<NUKE_THRESHOLDS.length;i++){
    if(score>=NUKE_THRESHOLDS[i]&&nukeLastScore<NUKE_THRESHOLDS[i]){
      nukeCharges=Math.min(nukeCharges+1,3);
      nukeLastScore=NUKE_THRESHOLDS[i];
      nukeBtnPulse=1.5;
      playNukeChargeSound();
      addFloatingText(W-70,H-80,'☢ NUKE READY!','#FDE047',16);
    }
  }
  if(nukeBtnPulse>0)nukeBtnPulse-=dt;

  // NUKE EXPLOSION — destroy all enemies on screen
  if(nukeActive){
    nukeTimer-=dt;nukeFlashPhase+=dt*12;
    if(nukeTimer<=0){nukeActive=false;nukeTimer=0;}
    // Kill all enemies during explosion
    for(const e of enemies){
      if(!e.dead){
        e.dead=true;
        const ex=e.x-cameraX;
        const pts=e.type.pts*2*comboMultiplier;score+=pts;
        spawnOrbBurst(ex,e.y,['#FF4500','#FDE047','#FFF','#FF2EC4','#22D3EE'],80,14);
        addFloatingText(ex,e.y-30,'☢ +'+pts.toLocaleString(),'#FDE047',18);
      }
    }
  }

  // GUNS — continuous auto-fire with LASER bolts (color matches level theme)
  if(gunCooldown>0)gunCooldown-=dt;
  if(gunCooldown<=0){
    const cfg=GUN_CONFIG[Math.min(gunTier,GUN_CONFIG.length-1)];
    gunCooldown=cfg.interval;
    const bx=SHIP_X+cameraX+SHIP_W,by=ship.y;
    const lc=getLaserColors();
    for(const b of cfg.bullets){
      projectiles.push({x:bx,y:by+b.dy,vy:b.vy||0,dead:false,color:lc.primary,color2:lc.secondary,born:performance.now()});
    }
    // Laser fire sound — pitch varies with gun tier
    playLaserSound(gunTier*0.5);
    shakeDur=Math.max(shakeDur,0.025);
    spawnOrbBurst(SHIP_X+SHIP_W,ship.y,[lc.primary,lc.secondary,'#FFF'],4+gunTier,2);
  }

  // Update projectiles
  for(const p of projectiles){
    if(p.dead)continue;
    p.x+=PROJECTILE_SPEED*dt;
    p.y+=(p.vy||0)*dt;
    p.y=clamp(p.y,8,H-8);
    if(p.x-cameraX>W+50){p.dead=true;continue;}
    // Hit enemies
    for(const e of enemies){
      if(e.dead)continue;
      const ex=e.x-cameraX,px=p.x-cameraX;
      if(Math.abs(px-ex)<e.type.w*0.6&&Math.abs(p.y-e.y)<e.type.h*0.8){
        p.dead=true;e.hp--;
        if(e.hp<=0){
          e.dead=true;
          const pts=e.type.pts*comboMultiplier;score+=pts;
          comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
          spawnOrbBurst(ex,e.y,[e.type.color,'#FDE047','#FFF','#FF6BD6'],60,10);
          addFloatingText(ex,e.y-30,'💥 +'+pts.toLocaleString(),e.type.color,20);
          shakeDur=0.2;screenFlash=0.25;screenFlashColor=e.type.color;
          playExplosionSound();
          if(Math.random()<0.12)gunOrbPickups.push({x:e.x,y:e.y,collected:false,anim:rand(0,6.28)});
        } else {
          spawnOrbBurst(ex,e.y,['#FFF','#FF2EC4'],15,4);
          addFloatingText(ex,e.y-20,'HIT!','#FF2EC4',14);
          playHitSound();
        }
        break;
      }
    }
    // Hit walls
    for(const w of walls){
      if(w.hit)continue;
      const sx=w.x-cameraX,px=p.x-cameraX;
      if(px>sx-10&&px<sx+50){
        const isInGap=p.y>w.gapY-w.gapH/2&&p.y<w.gapY+w.gapH/2;
        if(!isInGap){p.dead=true;break;}
      }
    }
  }
  projectiles=projectiles.filter(p=>!p.dead);

  // ENEMY SPAWNING
  enemySpawnTimer-=dt;
  if(enemySpawnTimer<=0){
    enemySpawnTimer=ENEMY_SPAWN_INTERVAL*(0.7+Math.random()*0.6);
    // Harder enemies as score increases
    const r=Math.random();const typeIdx=score>10000?(r<0.3?2:r<0.65?1:0):(score>3000?(r<0.15?2:r<0.5?1:0):0);
    const type=ENEMY_TYPES[typeIdx];
    enemies.push({x:cameraX+W+100,y:rand(50,H-50),type,hp:type.hp,dead:false,phase:rand(0,6.28),speed:ENEMY_SPEED+rand(-40,40)});
  }

  // Update enemies — fly left with sine wave motion
  for(const e of enemies){
    if(e.dead)continue;
    e.x-=e.speed*dt;e.phase+=dt*3;
    e.y+=Math.sin(e.phase)*1.5;
    e.y=clamp(e.y,30,H-30);
    // Off-screen left = remove
    if(e.x<cameraX-100){e.dead=true;continue;}
    // Collide with player ship
    if(!shieldActive&&invincTimer<=0){
      const ex=e.x-cameraX;
      if(Math.abs(SHIP_X-ex)<(SHIP_W+e.type.w)*0.4&&Math.abs(ship.y-e.y)<(SHIP_H+e.type.h)*0.5){
        e.dead=true;
        spawnOrbBurst(ex,e.y,['#EF4444','#FF6BD6','#FFF'],40,8);
        health--;damageLevel=maxHealth-health;invincTimer=1.5;hitFlashTimer=0.3;shakeDur=0.4;damageFlash=1.0;
        if(health<=0){die();return;}
      }
    } else if(shieldActive){
      const ex=e.x-cameraX;
      if(Math.abs(SHIP_X-ex)<(SHIP_W+e.type.w)*0.5&&Math.abs(ship.y-e.y)<(SHIP_H+e.type.h)*0.6){
        e.dead=true;const pts=e.type.pts*2*comboMultiplier;score+=pts;
        spawnOrbBurst(ex,e.y,[e.type.color,'#FFD700','#FFF'],70,12);
        addFloatingText(ex,e.y-30,'💥 SHIELDED! +'+pts.toLocaleString(),'#FFD700',22);
        shakeDur=0.2;screenFlash=0.3;screenFlashColor='#FFD700';
      }
    }
  }
  enemies=enemies.filter(e=>!e.dead);

  generateWalls();updateShip(dt);checkCollisions();
  updateParticles(dt);updatePersistentSmoke(dt);updateFloatingTexts(dt);updateSpeedLines(dt);updateSparkles(dt);

  const cleanX=cameraX-200;
  walls=walls.filter(w=>w.x+60>cleanX);diamonds=diamonds.filter(d=>d.x>cleanX);

    const barW=Math.min(W*0.44,320),barX=(W-barW)/2,barY=H-42;
    const t2=performance.now()*0.001;
    // Background track
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.beginPath();ctx.roundRect(barX-3,barY-3,barW+6,20,10);ctx.fill();
    // Bar fill
    if(warnFlash){
      ctx.fillStyle='rgba(255,50,50,0.3)';
    } else {
      const barG=ctx.createLinearGradient(barX,0,barX+barW,0);
      barG.addColorStop(0,`hsl(${(t2*180)%360},100%,60%)`);
      barG.addColorStop(0.33,`hsl(${(t2*180+80)%360},100%,65%)`);
      barG.addColorStop(0.66,`hsl(${(t2*180+160)%360},100%,60%)`);
      barG.addColorStop(1,`hsl(${(t2*180+240)%360},100%,65%)`);
      ctx.fillStyle=barG;
    }
    ctx.shadowColor=warning?'#FF3333':'#FFD700';ctx.shadowBlur=warning?12:8;
    ctx.beginPath();ctx.roundRect(barX,barY,barW*shieldPct,14,7);ctx.fill();ctx.shadowBlur=0;
    // Border ring
    ctx.strokeStyle=warning?(warnFlash?'#FF3333':'rgba(255,80,80,0.4)'):'rgba(255,215,0,0.5)';
    ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(barX-3,barY-3,barW+6,20,10);ctx.stroke();
    // Label
    ctx.font=arcadeFont(8);ctx.textAlign='center';
    ctx.fillStyle=warning?(warnFlash?'#FF4444':'rgba(255,120,120,0.8)'):'#FFD700';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=warning?10:6;
    ctx.fillText(warning?'⚠ SHIELD FADING ⚠':'🛡 SHIELD: '+shieldTimer.toFixed(1)+'s',W/2,barY-8);
    ctx.shadowBlur=0;
  }

  // Rocket boost screen blur/motion effect
  if(rocketBoostActive){
    ctx.globalAlpha=0.08;
    const mg=ctx.createLinearGradient(0,0,W,0);mg.addColorStop(0,'#F97316');mg.addColorStop(0.5,'transparent');mg.addColorStop(1,'#F97316');
    ctx.fillStyle=mg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
}

// ─── MENU ──────────────────────────────────────────────────────
function drawMenuScreen(){
  const time=performance.now();ctx.fillStyle='rgba(5,10,25,0.6)';ctx.fillRect(0,0,W,H);
  const titleY=H*0.22;const pulse=1+Math.sin(time*0.003)*0.03;
  ctx.save();ctx.translate(W/2,titleY);ctx.scale(pulse,pulse);
  ctx.shadowColor='#A855F7';ctx.shadowBlur=30;ctx.font=arcadeFont(Math.min(34,W*0.042));
  ctx.fillStyle='#FFF';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('WISH RUNNER',0,0);ctx.shadowBlur=0;
  ctx.font=arcadeFont(Math.min(10,W*0.014));ctx.fillStyle='#22D3EE';ctx.fillText('CRYPTO SPACE HIGHWAY',0,32);
  ctx.restore();
  ctx.font=arcadeFont(Math.min(12,W*0.017));ctx.fillStyle=getTheme().edge;ctx.textAlign='center';ctx.fillText(getTheme().name,W/2,titleY+60);

  const btnR=Math.min(50,W*0.055),btnY=H*0.53;const bp=1+Math.sin(time*0.004)*0.05;
  ctx.save();ctx.translate(W/2,btnY);ctx.scale(bp,bp);
  ctx.strokeStyle='#FFF';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,btnR+8,0,Math.PI*2);ctx.stroke();
  ctx.shadowColor='#7DF900';ctx.shadowBlur=25;ctx.fillStyle='#7DF900';ctx.beginPath();ctx.arc(0,0,btnR,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#5BC700';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#FFF';ctx.beginPath();ctx.moveTo(-btnR*0.22,-btnR*0.32);ctx.lineTo(-btnR*0.22,btnR*0.32);ctx.lineTo(btnR*0.32,0);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.font=arcadeFont(Math.min(9,W*0.013));ctx.fillStyle='rgba(255,255,255,0.45)';ctx.textAlign='center';ctx.fillText('TAP / CLICK TO PLAY',W/2,btnY+btnR+28);
  ctx.font=arcadeFont(Math.min(7,W*0.01));ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillText('AUTO-BLAST · GRAB CYAN GUN DIAMONDS TO POWER UP · HOLD 🚀 TO BOOST',W/2,btnY+btnR+46);
  ctx.font=arcadeFont(Math.min(10,W*0.014));ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillText('ATTEMPT '+attempt,W/2,H*0.84);
  if(highScore>0){ctx.fillStyle='#FDE047';ctx.fillText('★ BEST: '+highScore.toLocaleString(),W/2,H*0.9);}
}

// ─── DEATH SCREEN ──────────────────────────────────────────────
function drawGameOverScreen(){
  if(deathTimer<0.2)return;const rT=clamp((deathTimer-0.2)/0.5,0,1),alpha=easeOutCubic(rT);
  ctx.fillStyle=`rgba(5,10,20,${alpha*0.75})`;ctx.fillRect(0,0,W,H);if(rT<0.05)return;ctx.globalAlpha=alpha;
  if(deathTimer>0.35)drawWreckage(performance.now());

  // ─── BIG PROGRESS % — GD "I can beat that" motivation ───
  const pr=clamp(distance/(4000+level*1500)*100,0,100);
  const prText=Math.floor(pr)+'%';
  const prPulse=1+Math.sin(performance.now()*0.006)*0.03;
  ctx.save();ctx.translate(W/2,H*0.22);ctx.scale(prPulse,prPulse);
  ctx.font=arcadeFont(Math.min(48,W*0.06));ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=getTheme().edge;ctx.shadowBlur=25;
  ctx.fillStyle=getTheme().edge;ctx.fillText(prText,0,0);
  ctx.shadowBlur=0;ctx.font=arcadeFont(Math.min(10,W*0.014));
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillText('PROGRESS',0,30);
  ctx.restore();

  // Stats panel
  const pW=Math.min(380,W*0.6),pH=Math.min(250,H*0.48),pX=(W-pW)/2,pY=H*0.36;
  ctx.fillStyle='rgba(15,25,50,0.93)';ctx.beginPath();ctx.roundRect(pX,pY,pW,pH,16);ctx.fill();
  ctx.strokeStyle='rgba(100,150,255,0.3)';ctx.lineWidth=2;ctx.stroke();
  ctx.font=arcadeFont(Math.min(11,W*0.015));ctx.fillStyle=getTheme().edge;ctx.textAlign='center';ctx.fillText('LEVEL '+level+' — '+getTheme().name,W/2,pY+24);
  const sY=pY+46,sG=24;ctx.font=arcadeFont(Math.min(8,W*0.011));
  const el=((performance.now()-runStartTime)/1000).toFixed(1);
  const wp=walls.filter(w=>w.passed).length;
  const sts=[['ATTEMPT',''+attempt],['SCORE',Math.floor(score).toLocaleString()],['WALLS',''+wp],['TIME',el+'s'],['DIAMONDS',''+diamondsCollected]];
  for(let i=0;i<sts.length;i++){const sy=sY+i*sG;ctx.fillStyle='rgba(255,255,255,0.5)';ctx.textAlign='left';ctx.fillText(sts[i][0],pX+20,sy);ctx.fillStyle='#FFF';ctx.textAlign='right';ctx.fillText(sts[i][1],pX+pW-20,sy);}
  if(Math.floor(score)>=highScore&&score>0){ctx.font=arcadeFont(Math.min(10,W*0.013));ctx.fillStyle='#FDE047';ctx.textAlign='center';ctx.shadowColor='#FDE047';ctx.shadowBlur=12;ctx.fillText('★ NEW BEST! ★',W/2,pY+pH-48);ctx.shadowBlur=0;}

  // Retry button — appears FAST (GD instant restart feel)
  if(deathTimer>0.5){const bR=Math.min(26,W*0.032),bY2=pY+pH-18,bp2=1+Math.sin(performance.now()*0.005)*0.06;
    ctx.save();ctx.translate(W/2,bY2);ctx.scale(bp2,bp2);ctx.strokeStyle='#FFF';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,bR+6,0,Math.PI*2);ctx.stroke();
    ctx.shadowColor='#7DF900';ctx.shadowBlur=15;ctx.fillStyle='#7DF900';ctx.beginPath();ctx.arc(0,0,bR,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#5BC700';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#FFF';ctx.strokeStyle='#FFF';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,bR*0.4,-0.8,Math.PI*1.5,false);ctx.stroke();ctx.beginPath();ctx.moveTo(bR*0.15,-bR*0.5);ctx.lineTo(bR*0.45,-bR*0.25);ctx.lineTo(bR*0.05,-bR*0.15);ctx.closePath();ctx.fill();ctx.restore();
    ctx.font=arcadeFont(Math.min(7,W*0.009));ctx.fillStyle='rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.fillText('TAP TO RETRY',W/2,bY2+bR+18);}
  ctx.globalAlpha=1;
}

// ─── DRAW ──────────────────────────────────────────────────────
function draw(){
  const time=performance.now();ctx.clearRect(0,0,W,H);
  drawBackground(time);
  ctx.save();ctx.translate(shakeX,shakeY);
  drawSpeedLines();
  drawWalls(time);drawBoundaryWalls();
  for(const d of diamonds)drawDiamond(d,time);
  for(const bc of bitcoins)drawBitcoin(bc,time);
  for(const bd of blueDiamonds)drawBlueDiamondObj(bd,time);
  for(const rb of rocketBoosters)drawRocketBooster(rb,time);
  for(const go of gunOrbPickups){
    if(go.collected)continue;
    const sx=go.x-cameraX;
    if(sx<-40||sx>W+40)continue;
    const bob=Math.sin(time*0.006+go.anim)*5;
    const rot=time*0.002+go.anim;
    ctx.save();ctx.translate(sx,go.y+bob);ctx.rotate(rot);
    ctx.shadowColor='#22D3EE';ctx.shadowBlur=16;
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,-14);ctx.lineTo(10,0);ctx.lineTo(0,14);ctx.lineTo(-10,0);ctx.closePath();
    const gg=ctx.createLinearGradient(-10,-14,10,14);
    gg.addColorStop(0,'rgba(34,211,238,0.95)');gg.addColorStop(0.5,'rgba(168,85,247,0.9)');gg.addColorStop(1,'rgba(253,224,71,0.85)');
    ctx.fillStyle=gg;ctx.fill();ctx.stroke();
    ctx.rotate(-rot);
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('GUN',0,0);
    ctx.shadowBlur=0;ctx.restore();
  }
  // Draw projectiles — LONG LASER STREAKS with level-themed colors
  for(const p of projectiles){if(!p.dead){const sx=p.x-cameraX;if(sx<W+80){
    const col=p.color||getLaserColors().primary;
    const col2=p.color2||getLaserColors().secondary;
    const age=Math.min((performance.now()-(p.born||0))*0.001,1);
    const laserLen=60+age*20;const laserW=2.2;
    ctx.save();ctx.translate(sx,p.y);
    // Long outer glow trail
    ctx.shadowColor=col;ctx.shadowBlur=18;
    ctx.globalAlpha=0.2;ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(0,0,laserLen*0.85,laserW*2.5,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // Laser streak body — long, thin, tapered
    const lg=ctx.createLinearGradient(-laserLen,0,laserLen,0);
    lg.addColorStop(0,'transparent');lg.addColorStop(0.05,hexToRgba(col,0.15));
    lg.addColorStop(0.2,col);lg.addColorStop(0.5,col2);lg.addColorStop(0.8,col);lg.addColorStop(0.95,hexToRgba(col2,0.6));lg.addColorStop(1,'transparent');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.moveTo(-laserLen,0);
    ctx.lineTo(-laserLen*0.6,-laserW*0.4);
    ctx.lineTo(-laserLen*0.2,-laserW);
    ctx.lineTo(laserLen*0.5,-laserW*0.8);
    ctx.lineTo(laserLen*0.9,-laserW*0.3);ctx.lineTo(laserLen,0);
    ctx.lineTo(laserLen*0.9,laserW*0.3);
    ctx.lineTo(laserLen*0.5,laserW*0.8);
    ctx.lineTo(-laserLen*0.2,laserW);
    ctx.lineTo(-laserLen*0.6,laserW*0.4);
    ctx.closePath();ctx.fill();
    // Inner white-hot core — thin streak
    ctx.shadowBlur=6;ctx.shadowColor='#FFF';
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.moveTo(-laserLen*0.5,0);
    ctx.lineTo(-laserLen*0.1,-laserW*0.25);
    ctx.lineTo(laserLen*0.7,0);
    ctx.lineTo(-laserLen*0.1,laserW*0.25);
    ctx.quadraticCurveTo(0,laserW*0.3,-laserLen*0.4,0);
    ctx.closePath();ctx.fill();
    // Tip spark
    ctx.fillStyle=col2;ctx.shadowColor=col2;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(laserLen*0.85,0,2+Math.sin(performance.now()*0.02)*0.8,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }}}
  // Draw enemies
  for(const e of enemies){if(!e.dead){const ex=e.x-cameraX;if(ex>-60&&ex<W+60){ctx.save();ctx.translate(ex,e.y);
    const ew=e.type.w,eh=e.type.h;
    ctx.shadowColor=e.type.color;ctx.shadowBlur=15;
    // Enemy ship body
    ctx.fillStyle=e.type.color;ctx.beginPath();ctx.moveTo(ew/2,0);ctx.lineTo(-ew/2,-eh/2);ctx.lineTo(-ew/3,0);ctx.lineTo(-ew/2,eh/2);ctx.closePath();ctx.fill();
    // Cockpit
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(ew*0.15,0,eh*0.25,0,Math.PI*2);ctx.fill();
    // Engine glow
    ctx.fillStyle=e.type.color;ctx.globalAlpha=0.5+Math.sin(time*0.02+e.phase)*0.3;
    ctx.beginPath();ctx.moveTo(-ew/2,0);ctx.lineTo(-ew/2-12,-eh*0.2);ctx.lineTo(-ew/2-12,eh*0.2);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    // HP bar for multi-hit enemies
    if(e.type.hp>1){const bw=ew*0.8,bh=3,bx=-bw/2,by=-eh/2-8;
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=e.hp>1?'#22c55e':'#ef4444';ctx.fillRect(bx,by,bw*(e.hp/e.type.hp),bh);}
    ctx.shadowBlur=0;ctx.restore();}}}
  drawPersistentSmoke();
  if(state===STATE.PLAYING||state===STATE.DEAD)drawShip(time);
  drawParticles();drawFloatingTexts();ctx.restore();
  if(screenFlash>0){ctx.globalAlpha=screenFlash*0.35;ctx.fillStyle=screenFlashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  drawSparkles();
  if(state===STATE.PLAYING){drawHUD();}
  if(state===STATE.MENU)drawMenuScreen();
  if(state===STATE.DEAD)drawGameOverScreen();
}

// ─── GAME LOOP ─────────────────────────────────────────────────
function loop(time){requestAnimationFrame(loop);const dt=Math.min((time-lastTime)/1000,0.05);lastTime=time;update(dt);draw();}

// ─── INPUT ─────────────────────────────────────────────────────
// INSTANT restart — GD "one more try" addiction. Tap anywhere after brief death anim.
function handleTap(){if(state===STATE.MENU){startGame();return;}if(state===STATE.DEAD&&deathTimer>0.45){startGame();return;}}

canvas.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  if(state!==STATE.PLAYING){handleTap();return;}
  const touch=e.touches[0],rect=canvas.getBoundingClientRect();
  const isP=window.innerWidth<window.innerHeight&&window.innerWidth<900;
  const tx=isP?(rect.bottom-touch.clientY):(touch.clientX-rect.left);
  const ty=isP?(rect.right-touch.clientX):(touch.clientY-rect.top);
  const canvasX=tx*(W/(isP?rect.height:rect.width));
  const canvasY=ty*(H/(isP?rect.width:rect.height));

  // Check if touching NUKE button (bottom-right)
  if(nukeCharges>0&&!nukeActive&&Math.abs(canvasX-(W-65))<40&&Math.abs(canvasY-(H-75))<40){
    nukeCharges--;nukeActive=true;nukeTimer=NUKE_DURATION;nukeFlashPhase=0;
    playNukeSound();
    shakeDur=1.0;shakeX=rand(-15,15);shakeY=rand(-15,15);
    screenFlash=0.8;screenFlashColor='#FF4400';
    // Massive particle burst from center
    const cx=W/2,cy=H/2;
    for(let i=0;i<200;i++){const a=rand(0,Math.PI*2),spd=rand(4,25);
      spawnP(cx,cy,['#FF4500','#FDE047','#FFF','#FF8800','#FF2200'][randInt(0,4)],Math.cos(a)*spd,Math.sin(a)*spd,rand(0.5,1.5),rand(3,12),0.02);}
    addFloatingText(W/2,H/2-40,'☢ NUCLEAR BLAST! ☢','#FDE047',26);
    return;
  }
  // Check if touching A button area
  if((rocketBoostReady||rocketBoostActive)&&canvasX>W-120&&canvasY>H-110){
    aButtonPressed=true;return;
  }
  isDragging=true;
  dragStartY=isP?(rect.right-touch.clientX):(touch.clientY-rect.top);
  dragShipStartY=ship.targetY;
  // Immediately offset ship above finger so it's visible
  ship.targetY=clamp(ship.targetY+TOUCH_Y_OFFSET,25,H-25);
},{passive:false});

canvas.addEventListener('touchmove',(e)=>{
  e.preventDefault();if(!isDragging||state!==STATE.PLAYING)return;
  const touch=e.touches[0],rect=canvas.getBoundingClientRect();
  const isP=window.innerWidth<window.innerHeight&&window.innerWidth<900;
  const currentY=isP?(rect.right-touch.clientX):(touch.clientY-rect.top);
  const scale=isP?(H/rect.width):(H/rect.height);
  ship.targetY=clamp(dragShipStartY+(currentY-dragStartY)*scale,25,H-25);
},{passive:false});

canvas.addEventListener('touchend',(e)=>{e.preventDefault();isDragging=false;aButtonPressed=false;},{passive:false});

canvas.addEventListener('mousedown',(e)=>{
  if(state!==STATE.PLAYING){handleTap();return;}
  isDragging=true;const rect=canvas.getBoundingClientRect();
  dragStartY=(e.clientY-rect.top);
  dragShipStartY=ship.targetY;
});
canvas.addEventListener('mousemove',(e)=>{if(!isDragging||state!==STATE.PLAYING)return;const rect=canvas.getBoundingClientRect();const currentY=(e.clientY-rect.top);const scale=H/rect.height;ship.targetY=clamp(dragShipStartY+(currentY-dragStartY)*scale,25,H-25);});
canvas.addEventListener('mouseup',()=>{isDragging=false;});

document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();handleTap();return;}
  keysDown[e.code]=true;
  if(['ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code)){e.preventDefault();useMouseFollow=false;}
  if(e.code==='KeyA'&&(rocketBoostReady||rocketBoostActive)){aButtonPressed=true;}
});
document.addEventListener('keyup',(e)=>{keysDown[e.code]=false;if(e.code==='KeyA')aButtonPressed=false;});

function processKeyboardInput(dt){
  if(state!==STATE.PLAYING||useMouseFollow)return;let dir=0;
  if(keysDown['ArrowUp']||keysDown['KeyW'])dir-=1;if(keysDown['ArrowDown']||keysDown['KeyS'])dir+=1;
  if(dir!==0)ship.targetY=clamp(ship.targetY+dir*SHIP_SPEED*dt,25,H-25);
}

document.addEventListener('touchmove',(e)=>e.preventDefault(),{passive:false});

// ─── INIT ──────────────────────────────────────────────────────
resize();lastTime=performance.now();requestAnimationFrame(loop);
</script>
</body>
