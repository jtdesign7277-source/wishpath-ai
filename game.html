  // Cockpit — larger, more visible
  const cg2=ctx.createRadialGradient(SHIP_W*0.2,0,0,SHIP_W*0.2,0,12);
  cg2.addColorStop(0,'rgba(255,255,255,0.8)');cg2.addColorStop(0.3,'rgba(103,232,249,0.6)');
  cg2.addColorStop(0.6,'rgba(34,211,238,0.3)');cg2.addColorStop(1,'rgba(34,211,238,0.1)');
  ctx.fillStyle=cg2;ctx.beginPath();ctx.ellipse(SHIP_W*0.2,0,10,6,-0.1,0,Math.PI*2);ctx.fill();
  // Cockpit frame
  ctx.strokeStyle='rgba(103,232,249,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(SHIP_W*0.2,0,11,7,-0.1,0,Math.PI*2);ctx.stroke();

  // Nose-mounted twin guns (inner)
  ctx.fillStyle='#C084FC';ctx.strokeStyle='#FF2EC4';ctx.lineWidth=0.8;
  ctx.fillRect(SHIP_W*0.42,-SHIP_H*0.14,SHIP_W*0.18,3);ctx.strokeRect(SHIP_W*0.42,-SHIP_H*0.14,SHIP_W*0.18,3);
  ctx.fillRect(SHIP_W*0.42,SHIP_H*0.1,SHIP_W*0.18,3);ctx.strokeRect(SHIP_W*0.42,SHIP_H*0.1,SHIP_W*0.18,3);

  // Muzzle flash on all 4 guns while firing
  if(state===STATE.PLAYING){
    const gc=GUN_CONFIG[Math.min(gunTier,GUN_CONFIG.length-1)];
    if(gunCooldown>gc.interval*0.82){
      ctx.shadowColor='#FF2EC4';ctx.shadowBlur=12+gunTier*3;ctx.fillStyle='#FF6BD6';
      // Inner gun muzzles
      ctx.beginPath();ctx.arc(SHIP_W*0.62,-SHIP_H*0.12,3+gunTier*0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(SHIP_W*0.62,SHIP_H*0.12,3+gunTier*0.5,0,Math.PI*2);ctx.fill();
      // Outer cannon muzzles
      ctx.fillStyle='#FDE047';ctx.shadowColor='#FDE047';
      ctx.beginPath();ctx.arc(SHIP_W*0.6,-SHIP_H*0.55,2.5+gunTier*0.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(SHIP_W*0.6,SHIP_H*0.55,2.5+gunTier*0.4,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  // Swept-back fins — larger, aggressive
  const finG=ctx.createLinearGradient(-SHIP_W*0.35,0,-SHIP_W*0.2,0);
  finG.addColorStop(0,'#3A1E6E');finG.addColorStop(1,'#7C3AED');
  ctx.fillStyle=finG;
  // Top fin
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.15,-SHIP_H*0.35);ctx.lineTo(-SHIP_W*0.38,-SHIP_H*0.82);
  ctx.lineTo(-SHIP_W*0.48,-SHIP_H*0.65);ctx.lineTo(-SHIP_W*0.42,-SHIP_H*0.3);ctx.closePath();
  ctx.fill();ctx.strokeStyle='#A855F7';ctx.lineWidth=1;ctx.stroke();
  // Fin edge glow
  ctx.shadowColor='#A855F7';ctx.shadowBlur=6;ctx.strokeStyle='#C084FC';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.38,-SHIP_H*0.82);ctx.lineTo(-SHIP_W*0.48,-SHIP_H*0.65);ctx.stroke();ctx.shadowBlur=0;
  // Bottom fin
  ctx.fillStyle=finG;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.15,SHIP_H*0.35);ctx.lineTo(-SHIP_W*0.38,SHIP_H*0.82);
  ctx.lineTo(-SHIP_W*0.48,SHIP_H*0.65);ctx.lineTo(-SHIP_W*0.42,SHIP_H*0.3);ctx.closePath();
  ctx.fill();ctx.strokeStyle='#A855F7';ctx.lineWidth=1;ctx.stroke();
  ctx.shadowColor='#A855F7';ctx.shadowBlur=6;ctx.strokeStyle='#C084FC';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.38,SHIP_H*0.82);ctx.lineTo(-SHIP_W*0.48,SHIP_H*0.65);ctx.stroke();ctx.shadowBlur=0;

  // Running lights (pulsing)
  const pulse=0.5+Math.sin(t*6)*0.5;
  ctx.globalAlpha=0.6+pulse*0.4;
  // Wingtip lights
  ctx.fillStyle='#EF4444';ctx.shadowColor='#EF4444';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(-SHIP_W*0.38,-SHIP_H*0.75,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#22C55E';ctx.shadowColor='#22C55E';
  ctx.beginPath();ctx.arc(-SHIP_W*0.38,SHIP_H*0.75,2,0,Math.PI*2);ctx.fill();
  // Nose light
  ctx.fillStyle='#FFF';ctx.shadowColor='#67E8F9';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(SHIP_W*0.55,0,1.5+pulse,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.globalAlpha=1;

  // Top highlight sheen
  ctx.globalAlpha=0.1;ctx.fillStyle='#FFF';
  ctx.beginPath();ctx.moveTo(SHIP_W*0.5,0);ctx.quadraticCurveTo(SHIP_W*0.25,-SHIP_H*0.25,-SHIP_W*0.1,-SHIP_H*0.3);
  ctx.lineTo(-SHIP_W*0.1,-SHIP_H*0.05);ctx.quadraticCurveTo(SHIP_W*0.2,-SHIP_H*0.05,SHIP_W*0.5,0);ctx.closePath();ctx.fill();ctx.globalAlpha=1;

  // Scorch marks (battle damage)
  if(damageLevel>=1){ctx.globalAlpha=0.45;ctx.fillStyle='#333';
    ctx.beginPath();ctx.ellipse(-SHIP_W*0.15,SHIP_H*0.22,7,3.5,0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(SHIP_W*0.05,SHIP_H*0.3,5,2,0.5,0,Math.PI*2);ctx.fill();
    if(damageLevel>=2){ctx.beginPath();ctx.ellipse(SHIP_W*0.12,-SHIP_H*0.18,9,4.5,-0.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(-SHIP_W*0.3,SHIP_H*0.05,6,3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF4400';ctx.globalAlpha=0.15+Math.sin(t*12)*0.1;
      ctx.beginPath();ctx.arc(-SHIP_W*0.2,SHIP_H*0.1,8,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;}

  ctx.restore();ctx.globalAlpha=1;
}

// ─── WRECKAGE ──────────────────────────────────────────────────
function drawWreckage(time){
  const wx=wreckageX,wy=wreckageY;
  ctx.save();ctx.translate(wx,wy);ctx.rotate(0.3);
  ctx.globalAlpha=0.6;ctx.fillStyle='#444';ctx.beginPath();ctx.moveTo(-15,-8);ctx.lineTo(10,-12);ctx.lineTo(15,0);ctx.lineTo(-5,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#555';ctx.beginPath();ctx.moveTo(5,-5);ctx.lineTo(20,-3);ctx.lineTo(18,8);ctx.lineTo(0,6);ctx.closePath();ctx.fill();
  ctx.globalAlpha=0.3+Math.sin(time*0.005)*0.1;ctx.fillStyle='#FF4444';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore();
  for(let i=0;i<3;i++){const ph=time*0.001+i*1.5;const sx2=wx+Math.sin(ph*0.7)*8;const sy2=wy-10-((ph*20)%40);const sz2=4+((ph*5)%8);const a2=0.15-((ph*4)%0.15);if(a2>0){ctx.globalAlpha=a2;ctx.fillStyle='#555';ctx.beginPath();ctx.arc(sx2,sy2,sz2,0,Math.PI*2);ctx.fill();}}
  ctx.globalAlpha=1;
}

// ─── UPDATE ────────────────────────────────────────────────────
function updateShip(dt){
  if(state!==STATE.PLAYING)return;
  // Smooth drag-follow — ship glides to target, never teleports
  const dy=ship.targetY-ship.y;ship.vy=dy*4;ship.vy=clamp(ship.vy,-SHIP_SPEED,SHIP_SPEED);
  ship.y+=ship.vy*dt;ship.y=clamp(ship.y,25,H-25);
  ship.bankAngle=lerp(ship.bankAngle,clamp(ship.vy/SHIP_SPEED*0.45,-0.45,0.45),0.3);

  if(invincTimer>0)invincTimer-=dt;
  if(hitFlashTimer>0)hitFlashTimer-=dt;
  if(damageFlash>0)damageFlash-=dt*2;
  if(superBoostTimer>0)superBoostTimer-=dt;
  if(jackpotTimer>0){jackpotTimer-=dt;jackpotScoreAnim=Math.min(10000,jackpotScoreAnim+dt*8000);}
  if(levelUpFlash>0)levelUpFlash-=dt;
  if(levelWarpTimer>0)levelWarpTimer-=dt;
  if(blueDiamondHudFlash>0)blueDiamondHudFlash-=dt;
  if(rocketBoostHudFlash>0)rocketBoostHudFlash-=dt;
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)comboMultiplier=1;}

  // Shield drain + warning flash
  if(shieldActive){
    shieldTimer-=dt;shieldPhase+=dt*8;
    if(shieldTimer<=0){
      shieldActive=false;shieldTimer=0;
      screenFlash=0.4;screenFlashColor='#FF4444';shakeDur=0.3;
      addFloatingText(SHIP_X,ship.y-50,'SHIELD GONE!','#FF4444',18);
    } else if(shieldTimer<2.0&&Math.floor(shieldTimer*6)%2===0){
      screenFlash=0.06;screenFlashColor='#FFD700';
    }
  }

  // Rocket boost drain
  if(rocketBoostActive){
    rocketBoostFuel-=dt;
    if(rocketBoostFuel<=0){rocketBoostActive=false;rocketBoostReady=false;rocketBoostFuel=0;aButtonPressed=false;}
    // Massive exhaust particles
    for(let i=0;i<4;i++){
      spawnP(SHIP_X-SHIP_W*0.5-rand(5,25),ship.y+rand(-8,8),
        ['#F97316','#EF4444','#FDE047','#FFF'][randInt(0,3)],rand(-8,-14),rand(-1.5,1.5),rand(0.15,0.35),rand(2,6),0);
    }
    // Screen shake while boosting
    shakeX=rand(-2,2);shakeY=rand(-2,2);
  }

  // Normal engine particles — extra juicy
  if(Math.random()<0.7){
    const col=rocketBoostActive?'#F97316':superBoostTimer>0?'#FDE047':(Math.random()<0.5?'#FF2EC4':'#A855F7');
    spawnP(SHIP_X-SHIP_W*0.5-rand(5,15),ship.y+rand(-4,4),col,rand(-3,-6),rand(-0.5,0.5),rand(0.12,0.25),rand(1.5,3),0);
  }
  // Extra thrust sparkles
  if(Math.random()<0.35){
    spawnP(SHIP_X-SHIP_W*0.5-rand(2,10),ship.y+rand(-6,6),'#7132F5',rand(-4,-8)+(-ship.vy*0.02),rand(-1,1),rand(0.08,0.18),rand(1,2.5),0.02);
  }
}

function checkCollisions(){
  if(state!==STATE.PLAYING)return;
  // Tight geometric hitbox — forgiving enough for "near miss" thrill
  const sl=SHIP_X-SHIP_W*0.33+cameraX,sr=SHIP_X+SHIP_W*0.33+cameraX;
  const st=ship.y-SHIP_H*0.28,sb=ship.y+SHIP_H*0.28;
  const isInvincible=superBoostTimer>0||rocketBoostActive||shieldActive;

  // Walls
  for(const w of walls){
    if(w.hit&&w.passed)continue;
    const ww=w.type===1?48:30;
    if(sr>w.x&&sl<w.x+ww){
      const topH=w.gapY-w.gapH/2,botY=w.gapY+w.gapH/2;
      if(st<topH||sb>botY){
        if(isInvincible){
          if(!w.hit){
            w.hit=true;
            if(shieldActive){spawnTowerExplosion(w.x-cameraX,ship.y,w);}
            else{spawnBurst(SHIP_X,ship.y,'#FDE047',15,4,0.4,4);score+=50;}
          }
          continue;
        }
        if(invincTimer<=0&&!w.hit){w.hit=true;takeDamage();}
      }else if(!w.passed){w.passed=true;score+=10;}
    }
  }
  if(st<8||sb>H-8){if(invincTimer<=0&&!isInvincible)takeDamage();}

  // Diamonds
  for(const d of diamonds){
    if(d.collected)continue;
    const hitR=28*(d.dSize||1.0);
    if(Math.abs((SHIP_X+cameraX)-d.x)<hitR&&Math.abs(ship.y-d.y)<hitR){
      d.collected=true;diamondsCollected++;totalCoinsAll++;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      const basePts=d.dPts||1000;const dScore=basePts*comboMultiplier;score+=dScore;
      const burst=d.dSize>=1.5?60:d.dSize<=0.6?25:40;
      spawnOrbBurst(d.x-cameraX,d.y,['#7DF900','#A4FF44','#22D3EE','#67E8F9','#FFF'],burst+comboMultiplier*8,6+comboMultiplier);
      shakeDur=0.1+comboMultiplier*0.02;screenFlash=0.15;screenFlashColor='#7DF900';
      const szLabel=d.dSize>=1.5?' ★':d.dSize<=0.6?' •':'';
      addFloatingText(d.x-cameraX,d.y-25,'+'+dScore.toLocaleString()+szLabel+(comboMultiplier>1?' x'+comboMultiplier:''),'#7DF900',18+comboMultiplier*2);
    }
  }

  // Bitcoins
  for(const bc of bitcoins){
    if(bc.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-bc.x)<28&&Math.abs(ship.y-bc.y)<28){
      bc.collected=true;bitcoinsCollected++;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      const bcScore=2000*comboMultiplier;score+=bcScore;
      spawnOrbBurst(bc.x-cameraX,bc.y,['#FDE047','#FEF08A','#EAB308','#FFF','#FFD700'],60+comboMultiplier*8,8+comboMultiplier);
      shakeDur=0.15+comboMultiplier*0.02;screenFlash=0.2;screenFlashColor='#FDE047';
      addFloatingText(bc.x-cameraX,bc.y-25,'₿ +'+bcScore.toLocaleString()+(comboMultiplier>1?' x'+comboMultiplier:''),'#FDE047',20+comboMultiplier*2);
      if(bitcoinsCollected>=3){
        bitcoinsCollected=0;level++;levelWarpTimer=2.0;levelUpFlash=2.0;
        scrollSpeed=Math.min(maxSpeed,baseSpeed+(level-1)*22);
        shakeDur=0.6;screenFlash=0.8;screenFlashColor='#FFF';
        spawnOrbBurst(W/2,H/2,['#FFF','#FDE047','#A855F7','#22D3EE','#FF2EC4','#7DF900'],150,14);
        addFloatingText(W/2,H/2-40,'LEVEL '+level+'!','#FFF',30);
        addFloatingText(W/2,H/2+10,getTheme().name,getTheme().edge,14);
        score+=10000;jackpotTimer=2.5;jackpotScoreAnim=0;
      }
    }
  }

  // Blue diamonds
  for(const bd of blueDiamonds){
    if(bd.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-bd.x)<28&&Math.abs(ship.y-bd.y)<28){
      bd.collected=true;blueDiamondsCollected++;blueDiamondHudFlash=0.5;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      spawnOrbBurst(bd.x-cameraX,bd.y,['#3B82F6','#60A5FA','#93C5FD','#FFF'],40+comboMultiplier*5,6+comboMultiplier);
      shakeDur=0.1+comboMultiplier*0.01;screenFlash=0.1;screenFlashColor='#3B82F6';
      addFloatingText(bd.x-cameraX,bd.y-20,'◆ BOOST'+(comboMultiplier>1?' x'+comboMultiplier:''),'#60A5FA',14);
      if(blueDiamondsCollected>=3){
        blueDiamondsCollected=0;superBoostTimer=5;
        screenFlash=0.6;screenFlashColor='#3B82F6';shakeDur=0.3;
        spawnOrbBurst(SHIP_X,ship.y,['#3B82F6','#FDE047','#FFF'],80,10);
        addFloatingText(W/2,H/3,'⚡ SUPER BOOST! ⚡','#FDE047',20);
      }
    }
  }

  // Rocket boosters
  for(const rb of rocketBoosters){
    if(rb.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-rb.x)<28&&Math.abs(ship.y-rb.y)<28){
      rb.collected=true;rocketBoostersCollected++;rocketBoostHudFlash=0.5;
      comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
      spawnOrbBurst(rb.x-cameraX,rb.y,['#F97316','#EF4444','#FDE047','#FFF'],50+comboMultiplier*5,7+comboMultiplier);
      shakeDur=0.12+comboMultiplier*0.01;screenFlash=0.15;screenFlashColor='#F97316';
      addFloatingText(rb.x-cameraX,rb.y-20,'🚀 BOOSTER!'+(comboMultiplier>1?' x'+comboMultiplier:''),'#F97316',16);
      if(rocketBoostersCollected>=3){
        rocketBoostersCollected=0;
        shieldActive=true;shieldTimer=SHIELD_DURATION;shieldPhase=0;
        screenFlash=0.9;screenFlashColor='#FFD700';shakeDur=0.5;
        spawnOrbBurst(SHIP_X,ship.y,['#FFD700','#FF6BD6','#22D3EE','#A855F7','#FFF','#7DF900','#F97316'],140,16);
        addFloatingText(W/2,H/2-30,'🛡 INVINCIBLE SHIELD!','#FFD700',26);
        addFloatingText(W/2,H/2+10,'SMASH THROUGH TOWERS','#FF6BD6',14);
      }
    }
  }

  // Gun upgrade orbs — diamond cluster; each pickup raises blaster tier (max 5)
  for(const go of gunOrbPickups){
    if(go.collected)continue;
    if(Math.abs((SHIP_X+cameraX)-go.x)<30&&Math.abs(ship.y-go.y)<30){
      go.collected=true;
      const prev=gunTier;
      gunTier=Math.min(gunTier+1,GUN_CONFIG.length-1);
      const names=['DUAL BLAST','TRIPLE','QUAD STREAM','RAPID FIRE','MAX BLASTER'];
      const msg=gunTier>prev?'⚡ '+names[gunTier-1]+'!':'⚡ MAX — BONUS!';
      spawnOrbBurst(go.x-cameraX,go.y,['#22D3EE','#A855F7','#FDE047','#FF2EC4','#FFF'],45,10);
      shakeDur=0.18;screenFlash=0.22;screenFlashColor='#A855F7';
      addFloatingText(go.x-cameraX,go.y-22,msg,'#FDE047',15);
      score+=500*comboMultiplier;
    }
  }
}

function takeDamage(){
  health--;damageLevel=maxHealth-health;invincTimer=1.5;hitFlashTimer=0.3;shakeDur=0.4;damageFlash=1.0;
  if(comboMultiplier>1)addFloatingText(SHIP_X,ship.y-55,'COMBO LOST!','#FF4444',12);
  comboMultiplier=1;comboTimer=0;
  screenFlash=0.3;screenFlashColor='#FF4444';
  spawnBurst(SHIP_X,ship.y,'#FF4444',25,5,0.5,4);
  // BIG smoke burst on impact — immediate visual feedback
  const smkCols=damageLevel>=2?['#111','#222','#333','#FF4400']:['#888','#AAA','#CCC','#FFF'];
  for(let i=0;i<(damageLevel>=2?20:12);i++){
    const a=rand(0,Math.PI*2),spd=rand(1,4);
    persistentSmoke.push({x:SHIP_X+rand(-10,10),y:ship.y+rand(-8,8),size:rand(6,14),maxSize:rand(20,40),life:rand(0.6,1.4),maxLife:1.4,vx:Math.cos(a)*spd-2,vy:Math.sin(a)*spd,dark:damageLevel>=2});
  }
  if(health<=0)die();else addFloatingText(SHIP_X,ship.y-35,'-1 ❤','#FF4444',16);
}

function die(){
  state=STATE.DEAD;deathTimer=0;damageLevel=3;wreckageX=SHIP_X;wreckageY=ship.y;
  rocketBoostActive=false;rocketBoostReady=false;shieldActive=false;shieldTimer=0;
  spawnDeathExplosion(SHIP_X,ship.y);shakeDur=0.8;screenFlash=0.6;screenFlashColor='#FF2222';
  if(score>highScore){highScore=Math.floor(score);localStorage.setItem('wr_m3_hi',highScore);}
  localStorage.setItem('wr_m3_coins',totalCoinsAll);attempt++;localStorage.setItem('wr_m3_attempt',attempt);
}

function startGame(){
  state=STATE.PLAYING;score=0;distance=0;health=3;damageLevel=0;damageFlash=0;
  invincTimer=0;hitFlashTimer=0;diamondsCollected=0;bitcoinsCollected=0;blueDiamondsCollected=0;
  rocketBoostersCollected=0;rocketBoostReady=false;rocketBoostActive=false;rocketBoostFuel=0;
  shieldActive=false;shieldTimer=0;shieldPhase=0;
  superBoostTimer=0;jackpotTimer=0;level=1;levelUpFlash=0;levelWarpTimer=0;
  scrollSpeed=baseSpeed;cameraX=0;nextWallX=W*0.7;
  ship.y=H/2;ship.vy=0;ship.targetY=H/2;ship.bankAngle=0;ship.trail=[];
  walls=[];diamonds=[];bitcoins=[];blueDiamonds=[];rocketBoosters=[];
  particles=[];deathParticles=[];persistentSmoke=[];floatingTexts=[];speedLines=[];sparkles=[];
  enemies=[];enemySpawnTimer=0;projectiles=[];gunTier=0;gunCooldown=0;gunOrbPickups=[];enemyLasers=[];
  shakeX=0;shakeY=0;shakeDur=0;screenFlash=0;deathTimer=0;blueDiamondHudFlash=0;rocketBoostHudFlash=0;
  comboMultiplier=1;comboTimer=0;
  nukeCharges=0;nukeLastScore=0;nukeActive=false;nukeTimer=0;nukeBtnPulse=0;
  grenadeCharges=0;grenadeLastScore=0;grenades=[];grenadeBtnPulse=0;
  laserCharges=0;laserLastScore=0;laserActive=false;laserTimer=0;laserPhase=0;laserBtnPulse=0;
  currentBoss=null;bossActive=false;bossWarningTimer=0;nextBossLevel=5;homingMissiles=[];
  aButtonPressed=false;useMouseFollow=false;patternWallsLeft=0;
  runStartTime=performance.now();generateWalls();
}

function update(dt){
  processKeyboardInput(dt);
  if(state===STATE.DEAD){
    deathTimer+=dt;updateParticles(dt);updateFloatingTexts(dt);updateSparkles(dt);
    if(deathTimer>0.5&&Math.random()<0.3){persistentSmoke.push({x:wreckageX+rand(-10,10),y:wreckageY+rand(-8,5),size:rand(3,8),maxSize:rand(12,22),life:rand(0.5,1.2),maxLife:1.2,vx:rand(-1.5,0),vy:rand(-2,-0.5),dark:true});}
    updatePersistentSmoke(dt);
    if(shakeDur>0){shakeDur-=dt;shakeX=rand(-6,6)*(shakeDur/0.8);shakeY=rand(-6,6)*(shakeDur/0.8);}else{shakeX=0;shakeY=0;}
    if(screenFlash>0)screenFlash-=dt*2;return;
  }
  if(state!==STATE.PLAYING)return;

  const boostMult=rocketBoostActive?2.2:superBoostTimer>0?1.3:1;
  const effSpeed=scrollSpeed*boostMult;
  cameraX+=effSpeed*dt;distance+=effSpeed*dt;score+=effSpeed*dt*0.03;
  scrollSpeed=Math.min(maxSpeed,baseSpeed+distance*0.006+(level-1)*20);

  // Activate rocket boost if A pressed and ready
  if(aButtonPressed&&rocketBoostReady&&!rocketBoostActive){
    rocketBoostActive=true;rocketBoostReady=false;
    screenFlash=0.3;screenFlashColor='#F97316';shakeDur=0.3;
    spawnOrbBurst(SHIP_X,ship.y,['#F97316','#EF4444','#FDE047'],60,8);
    addFloatingText(W/2,H/2,'🚀 WICKED FAST!','#F97316',24);
  }
  if(!aButtonPressed&&rocketBoostActive){rocketBoostActive=false;}

  // NUKE CHARGE — check score thresholds
  for(let i=0;i<NUKE_THRESHOLDS.length;i++){
    if(score>=NUKE_THRESHOLDS[i]&&nukeLastScore<NUKE_THRESHOLDS[i]){
      nukeCharges=Math.min(nukeCharges+1,3);
      nukeLastScore=NUKE_THRESHOLDS[i];
      nukeBtnPulse=1.5;
      playNukeChargeSound();
      addFloatingText(W-70,H-80,'☢ NUKE READY!','#FDE047',16);
    }
  }
  if(nukeBtnPulse>0)nukeBtnPulse-=dt;

  // NUKE EXPLOSION — destroy all enemies on screen
  if(nukeActive){
    nukeTimer-=dt;nukeFlashPhase+=dt*12;
    if(nukeTimer<=0){nukeActive=false;nukeTimer=0;}
    // Kill all enemies during explosion
    for(const e of enemies){
      if(!e.dead){
        e.dead=true;
        const ex=e.x-cameraX;
        const pts=e.type.pts*2*comboMultiplier;score+=pts;
        spawnOrbBurst(ex,e.y,['#FF4500','#FDE047','#FFF','#FF2EC4','#22D3EE'],80,14);
        addFloatingText(ex,e.y-30,'☢ +'+pts.toLocaleString(),'#FDE047',18);
      }
    }
  }

  // GRENADE CHARGE — check score thresholds
  for(let i=0;i<GRENADE_THRESHOLDS.length;i++){
    if(score>=GRENADE_THRESHOLDS[i]&&grenadeLastScore<GRENADE_THRESHOLDS[i]){
      grenadeCharges=Math.min(grenadeCharges+1,5);
      grenadeLastScore=GRENADE_THRESHOLDS[i];
      grenadeBtnPulse=1.5;
      playNukeChargeSound();
      addFloatingText(W-70,H-240,'💣 GRENADE!','#84CC16',14);
    }
  }
  if(grenadeBtnPulse>0)grenadeBtnPulse-=dt;

  // GRENADE PROJECTILES — physics, collisions, splash
  for(const g of grenades){
    if(g.dead)continue;
    g.x+=g.vx*dt; g.y+=g.vy*dt; g.vy+=520*dt; g.life-=dt; g.rot+=dt*6;
    // Trail smoke
    if(Math.random()<0.7){
      persistentSmoke.push({x:g.x-cameraX,y:g.y,size:rand(4,7),maxSize:rand(14,22),life:rand(0.3,0.6),maxLife:0.6,vx:rand(-1,1),vy:rand(-1,-0.2),dark:false});
    }
    // Off-screen or timed out
    if(g.x-cameraX>W+40||g.y>H+40||g.life<=0){explodeGrenade(g);continue;}
    // Hit enemy
    for(const e of enemies){
      if(e.dead||e.shieldOn)continue;
      const ex=e.x-cameraX,gx=g.x-cameraX;
      if(Math.abs(gx-ex)<e.type.w*0.5+g.r&&Math.abs(g.y-e.y)<e.type.h*0.5+g.r){
        explodeGrenade(g); break;
      }
    }
    // Hit boss
    if(!g.dead&&bossActive&&currentBoss&&!currentBoss.dead){
      const b=currentBoss,gx=g.x-cameraX;
      if(Math.abs(gx-b.screenX)<b.w*0.55+g.r&&Math.abs(g.y-b.y)<b.h*0.55+g.r){
        b.hp-=5; b.hitFlash=1.0;
        spawnBurst(b.screenX,b.y,'#84CC16',20,6,0.4,6);
        if(b.hp<=0)killBoss();
        explodeGrenade(g);
      }
    }
  }
  grenades=grenades.filter(g=>!g.dead);

  // LASER CHARGE — check score thresholds
  for(let i=0;i<LASER_THRESHOLDS.length;i++){
    if(score>=LASER_THRESHOLDS[i]&&laserLastScore<LASER_THRESHOLDS[i]){
      laserCharges=Math.min(laserCharges+1,3);
      laserLastScore=LASER_THRESHOLDS[i];
      laserBtnPulse=1.5;
      playNukeChargeSound();
      addFloatingText(W-70,H-150,'⚡ LASER READY!','#22D3EE',14);
    }
  }
  if(laserBtnPulse>0)laserBtnPulse-=dt;

  // LASER BEAM — while active, kill all enemies in the beam band
  if(laserActive){
    laserTimer-=dt; laserPhase+=dt*18;
    if(laserTimer<=0){laserActive=false;laserTimer=0;}
    const beamTop=ship.y-LASER_HEIGHT*0.5, beamBot=ship.y+LASER_HEIGHT*0.5;
    for(const e of enemies){
      if(e.dead||e.shieldOn)continue;
      if(e.y+e.type.h*0.5>beamTop&&e.y-e.type.h*0.5<beamBot){
        const ex=e.x-cameraX;
        if(ex<SHIP_X)continue; // only kill enemies in front of the ship
        e.dead=true;
        const pts=e.type.pts*comboMultiplier;score+=pts;
        spawnOrbBurst(ex,e.y,['#22D3EE','#67E8F9','#FFF','#A855F7'],50,9);
        addFloatingText(ex,e.y-24,'⚡ +'+pts.toLocaleString(),'#22D3EE',16);
      }
    }
    // Shoot down homing missiles in the beam too
    for(const m of homingMissiles){
      if(m.dead)continue;
      if(m.y>beamTop&&m.y<beamBot&&(m.x-cameraX)>SHIP_X){m.dead=true;spawnBurst(m.x-cameraX,m.y,'#22D3EE',14,4,0.25,3);}
    }
    // Hit boss steadily while beam is on
    if(bossActive&&currentBoss&&!currentBoss.dead){
      const b=currentBoss;
      if(b.y+b.h*0.5>beamTop&&b.y-b.h*0.5<beamBot){
        b.hp-=dt*8; b.hitFlash=Math.max(b.hitFlash||0,0.6);
        if(b.hp<=0)killBoss();
      }
    }
  }

  // GUNS — continuous auto-fire with LASER bolts (color matches level theme)
  if(gunCooldown>0)gunCooldown-=dt;
  if(gunCooldown<=0){
    const cfg=GUN_CONFIG[Math.min(gunTier,GUN_CONFIG.length-1)];
    gunCooldown=cfg.interval;
    const bx=SHIP_X+cameraX+SHIP_W,by=ship.y;
    const lc=getLaserColors();
    for(const b of cfg.bullets){
      projectiles.push({x:bx,y:by+b.dy,vy:b.vy||0,dead:false,color:lc.primary,color2:lc.secondary,born:performance.now()});
    }
    // Laser fire sound — pitch varies with gun tier
    playLaserSound(gunTier*0.5);
    shakeDur=Math.max(shakeDur,0.025);
    spawnOrbBurst(SHIP_X+SHIP_W,ship.y,[lc.primary,lc.secondary,'#FFF'],4+gunTier,2);
  }

  // Update projectiles
  for(const p of projectiles){
    if(p.dead)continue;
    p.x+=PROJECTILE_SPEED*dt;
    p.y+=(p.vy||0)*dt;
    p.y=clamp(p.y,8,H-8);
    if(p.x-cameraX>W+50){p.dead=true;continue;}
    // Hit enemies
    for(const e of enemies){
      if(e.dead)continue;
      if(e.shieldOn)continue; // Dreadnought shield phase — immune
      const ex=e.x-cameraX,px=p.x-cameraX;
      if(Math.abs(px-ex)<e.type.w*0.6&&Math.abs(p.y-e.y)<e.type.h*0.8){
        p.dead=true;e.hp--;
        if(e.hp<=0){
          e.dead=true;
          const pts=e.type.pts*comboMultiplier;score+=pts;
          comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
          spawnOrbBurst(ex,e.y,[e.type.color,'#FDE047','#FFF','#FF6BD6'],60,10);
          addFloatingText(ex,e.y-30,'💥 +'+pts.toLocaleString(),e.type.color,20);
          shakeDur=0.2;screenFlash=0.25;screenFlashColor=e.type.color;
          playExplosionSound();
          if(Math.random()<0.12)gunOrbPickups.push({x:e.x,y:e.y,collected:false,anim:rand(0,6.28)});
        } else {
          spawnOrbBurst(ex,e.y,['#FFF','#FF2EC4'],15,4);
          addFloatingText(ex,e.y-20,'HIT!','#FF2EC4',14);
          playHitSound();
        }
        break;
      }
    }
    // Hit boss
    if(bossActive&&currentBoss&&!currentBoss.dead&&!p.dead){
      const b=currentBoss;
      const px=p.x-cameraX;
      if(Math.abs(px-b.screenX)<b.w*0.55&&Math.abs(p.y-b.y)<b.h*0.55){
        p.dead=true;b.hp--;b.hitFlash=1.0;playHitSound();
        spawnBurst(b.screenX,b.y,'#FF4444',12,5,0.3,4);
        if(b.hp<=0)killBoss();
      }
    }
    // Homing missile shoot-down
    if(!p.dead){
      for(let mi=homingMissiles.length-1;mi>=0;mi--){
        const m=homingMissiles[mi];if(m.dead)continue;
        const mx=m.x-cameraX,px2=p.x-cameraX;
        if(Math.abs(px2-mx)<20&&Math.abs(p.y-m.y)<20){
          p.dead=true;m.hp--;
          if(m.hp<=0){m.dead=true;spawnBurst(mx,m.y,'#FF4500',25,6,0.5,5);addFloatingText(mx,m.y-20,'MISSILE DOWN!','#FF4500',14);score+=500;}
          break;
        }
      }
    }
    // Hit walls
    for(const w of walls){
      if(w.hit)continue;
      const sx=w.x-cameraX,px=p.x-cameraX;
      if(px>sx-10&&px<sx+50){
        const isInGap=p.y>w.gapY-w.gapH/2&&p.y<w.gapY+w.gapH/2;
        if(!isInGap){p.dead=true;break;}
      }
    }
  }
  projectiles=projectiles.filter(p=>!p.dead);

  // BOSS TRIGGER — every 5 levels
  if(!bossActive&&level>=nextBossLevel&&bossWarningTimer<=0){
    bossWarningTimer=2.5;
    setTimeout(()=>{if(state===STATE.PLAYING)spawnBoss();},2500);
    nextBossLevel+=5;
    addFloatingText(W/2,H/2-30,'⚠ WARNING — MOTHERSHIP INCOMING ⚠','#FF4444',18);
    addFloatingText(W/2,H/2+15,'BRACE FOR IMPACT','#FF8800',13);
    screenFlash=0.5;screenFlashColor='#FF2200';shakeDur=0.6;
  }
  if(bossWarningTimer>0)bossWarningTimer-=dt;

  // ENEMY SPAWNING — skip while boss warning, pause normal spawns during boss
  enemySpawnTimer-=dt;
  if(enemySpawnTimer<=0&&!bossActive){
    enemySpawnTimer=ENEMY_SPAWN_INTERVAL*(0.8+Math.random()*0.5);
    const r=Math.random();
    const typeIdx=score>20000?(r<0.15?3:r<0.4?2:r<0.7?1:0):(score>10000?(r<0.25?2:r<0.6?1:0):(score>3000?(r<0.15?2:r<0.5?1:0):0));
    const type=ENEMY_TYPES[typeIdx];

    const roll=Math.random();
    if(roll<0.12&&score>8000){
      // Sine wave squadron
      for(let si=0;si<5;si++){
        enemies.push({x:cameraX+W+100+si*55,y:clamp(H/2+Math.sin(si*1.25)*70,40,H-40),
          type:ENEMY_TYPES[0],hp:ENEMY_TYPES[0].hp,dead:false,phase:si*1.25,
          speed:ENEMY_SPEED-25,shootTimer:999,wingPhase:rand(0,6.28),sineAmp:35});
      }
      enemySpawnTimer+=1.5;
    } else if(roll<0.22&&score>15000){
      // Pincer attack — converge from top & bottom
      const playerY=ship.y;
      const count=3;
      for(let pi=0;pi<count;pi++){
        const ptype=ENEMY_TYPES[randInt(0,2)];
        enemies.push({x:cameraX+W+100+pi*65,y:clamp(30+pi*12,25,H/2-60),type:ptype,hp:ptype.hp,dead:false,phase:rand(0,6.28),speed:ENEMY_SPEED-15,shootTimer:rand(0.5,2),wingPhase:rand(0,6.28),pincerTarget:playerY,pincerConverging:true});
        enemies.push({x:cameraX+W+100+pi*65,y:clamp(H-30-pi*12,H/2+60,H-25),type:ptype,hp:ptype.hp,dead:false,phase:rand(0,6.28),speed:ENEMY_SPEED-15,shootTimer:rand(0.5,2),wingPhase:rand(0,6.28),pincerTarget:playerY,pincerConverging:true});
      }
      enemySpawnTimer+=1.5;
    } else if(roll<0.55&&score>2000){
      // Formation
      const f=FORMATIONS[randInt(0,FORMATIONS.length-1)];
      const baseY=rand(80,H-80);
      for(var fi=0;fi<f.count;fi++){
        var off=f.offsets(fi);
        enemies.push({x:cameraX+W+120+off.dx,y:clamp(baseY+off.dy,35,H-35),type,hp:type.hp,dead:false,phase:rand(0,6.28),speed:ENEMY_SPEED+rand(-30,30),shootTimer:type.shootRate>0?rand(0.5,type.shootRate):999,wingPhase:rand(0,6.28)});
      }
      enemySpawnTimer+=1.0;
    } else {
      enemies.push({x:cameraX+W+100,y:rand(50,H-50),type,hp:type.hp,dead:false,phase:rand(0,6.28),speed:ENEMY_SPEED+rand(-40,40),shootTimer:type.shootRate>0?rand(0.5,type.shootRate):999,wingPhase:rand(0,6.28)});
    }
  }

  // Update enemies — smart AI by type
  for(const e of enemies){
    if(e.dead)continue;
    e.phase+=dt*3;e.wingPhase+=dt*5;
    const ex=e.x-cameraX;
    const ename=e.type.name;

    // Pincer convergence — override Y toward target
    if(e.pincerConverging){
      e.y=lerp(e.y,e.pincerTarget,dt*2.2);
      if(Math.abs(e.y-e.pincerTarget)<18)e.pincerConverging=false;
    }

    if(ename==='Scout'){
      // Dodge bullets heading toward within 80px
      let dodging=false;
      for(const p of projectiles){
        if(p.dead)continue;
        const px=p.x-cameraX;
        if(px<ex+10&&px>ex-80&&Math.abs(p.y-e.y)<80){
          e.y+=(e.y<H/2?200:-200)*dt;dodging=true;break;
        }
      }
      if(!dodging&&!e.pincerConverging)e.y+=Math.sin(e.phase)*(e.sineAmp?e.sineAmp/10:1.5);
      e.x-=e.speed*dt;
    } else if(ename==='Cruiser'){
      if(!e.aiState){e.aiState='moving';e.strafeTargetY=rand(60,H-60);e.burstCount=0;e.aiTimer=0;}
      if(e.aiState==='moving'){
        e.x-=e.speed*dt;
        if(!e.pincerConverging)e.y=lerp(e.y,e.strafeTargetY,dt*2.5);
        if(Math.abs(e.y-e.strafeTargetY)<22&&ex>W*0.15&&ex<W*0.9){
          e.aiState='firing';e.burstCount=0;e.aiTimer=0.12;
        }
      } else if(e.aiState==='firing'){
        e.x-=e.speed*0.05*dt;
        e.aiTimer-=dt;
        if(e.aiTimer<=0){
          if(e.burstCount<3){
            if(ex>0&&ex<W+50){
              const ang=Math.atan2(ship.y-e.y,SHIP_X-ex);
              enemyLasers.push({x:e.x-e.type.w*0.5,y:e.y,vx:Math.cos(ang)*ENEMY_LASER_SPEED,vy:Math.sin(ang)*ENEMY_LASER_SPEED,dead:false,color:e.type.color,born:performance.now()});
            }
            e.burstCount++;e.aiTimer=0.18;
          } else {e.aiState='moving';e.strafeTargetY=rand(60,H-60);e.aiTimer=0;}
        }
      }
    } else if(ename==='Destroyer'){
      if(!e.aiState){e.aiState='normal';e.aiTimer=rand(1.5,3.0);}
      if(e.aiState==='normal'){
        e.x-=e.speed*dt;
        if(!e.pincerConverging)e.y+=Math.sin(e.phase)*1.5;
        e.aiTimer-=dt;
        if(e.aiTimer<=0&&Math.random()<0.30&&ex>50&&ex<W*0.65){
          e.aiState='kamikaze';
          e.kamikazeVx=-e.speed*2.5;
          e.kamikazeVy=(ship.y-e.y)*(0.5+Math.random()*0.5);
        }
      } else {
        e.x+=e.kamikazeVx*dt;e.y+=e.kamikazeVy*dt;
        if(ex<-60){e.dead=true;continue;}
      }
    } else if(ename==='Dreadnought'){
      if(!e.shieldCycleTimer){e.shieldCycleTimer=4.0;e.shieldOn=false;}
      e.x-=e.speed*dt;
      if(!e.pincerConverging)e.y+=Math.sin(e.phase)*1.2;
      e.shieldCycleTimer-=dt;
      if(e.shieldCycleTimer<=0){
        e.shieldOn=!e.shieldOn;
        e.shieldCycleTimer=e.shieldOn?1.0:4.0;
        if(e.shieldOn){spawnBurst(ex,e.y,'#22D3EE',20,5,0.4,4);addFloatingText(ex,e.y-28,'SHIELD!','#22D3EE',12);}
      }
    } else if(ename==='Stealth'){
      if(e.stealthAlpha===undefined)e.stealthAlpha=0.2;
      e.x-=e.speed*dt;
      if(!e.pincerConverging)e.y+=Math.sin(e.phase)*2;
      const distP=Math.abs(ex-SHIP_X);
      const tA=distP<130?0.92:(e.shootTimer<0.6?0.88:0.2);
      e.stealthAlpha=lerp(e.stealthAlpha,tA,dt*3);
    } else {
      e.x-=e.speed*dt;
      if(!e.pincerConverging)e.y+=Math.sin(e.phase)*(e.sineAmp?e.sineAmp/10:1.5);
    }

    e.y=clamp(e.y,30,H-30);
    if(e.x<cameraX-100){e.dead=true;continue;}

    // Shoot (Cruiser handles its own burst above)
    if(e.type.shootRate>0&&ename!=='Cruiser'){
      e.shootTimer-=dt;
      if(e.shootTimer<=0){
        e.shootTimer=e.type.shootRate*(0.7+Math.random()*0.6);
        if(ex>0&&ex<W+50){
          const ang=Math.atan2(ship.y-e.y,SHIP_X-ex);
          enemyLasers.push({x:e.x-e.type.w*0.5,y:e.y,vx:Math.cos(ang)*ENEMY_LASER_SPEED,vy:Math.sin(ang)*ENEMY_LASER_SPEED,dead:false,color:e.type.color,born:performance.now()});
          if(ename==='Stealth')e.stealthAlpha=0.9;
        }
      }
    }

    // Collide with player
    if(!shieldActive&&invincTimer<=0){
      if(ename==='Dreadnought'&&e.shieldOn){/* immune to collision too */}
      else if(Math.abs(SHIP_X-ex)<(SHIP_W+e.type.w)*0.4&&Math.abs(ship.y-e.y)<(SHIP_H+e.type.h)*0.5){
        e.dead=true;
        spawnOrbBurst(ex,e.y,['#EF4444','#FF6BD6','#FFF'],40,8);
        health--;damageLevel=maxHealth-health;invincTimer=1.5;hitFlashTimer=0.3;shakeDur=0.4;damageFlash=1.0;
        if(health<=0){die();return;}
      }
    } else if(shieldActive){
      if(Math.abs(SHIP_X-ex)<(SHIP_W+e.type.w)*0.5&&Math.abs(ship.y-e.y)<(SHIP_H+e.type.h)*0.6){
        e.dead=true;const pts=e.type.pts*2*comboMultiplier;score+=pts;
        spawnOrbBurst(ex,e.y,[e.type.color,'#FFD700','#FFF'],70,12);
        addFloatingText(ex,e.y-30,'💥 SHIELDED! +'+pts.toLocaleString(),'#FFD700',22);
        shakeDur=0.2;screenFlash=0.3;screenFlashColor='#FFD700';
      }
    }
  }
  enemies=enemies.filter(e=>!e.dead);

  // Update enemy lasers
  for(const el of enemyLasers){
    if(el.dead)continue;
    el.x+=el.vx*dt;el.y+=el.vy*dt;
    const elx=el.x-cameraX;
    if(elx<-50||elx>W+50||el.y<-20||el.y>H+20){el.dead=true;continue;}
    // Hit player
    if(!shieldActive&&invincTimer<=0&&Math.abs(SHIP_X-elx)<SHIP_W*0.4&&Math.abs(ship.y-el.y)<SHIP_H*0.5){
      el.dead=true;health--;damageLevel=maxHealth-health;invincTimer=1.0;hitFlashTimer=0.3;shakeDur=0.3;damageFlash=0.8;
      spawnOrbBurst(SHIP_X,ship.y,['#EF4444','#FFF'],20,5);
      if(health<=0){die();return;}
    } else if(shieldActive&&Math.abs(SHIP_X-elx)<SHIP_W*0.5&&Math.abs(ship.y-el.y)<SHIP_H*0.6){
      el.dead=true;spawnOrbBurst(SHIP_X,ship.y,['#FFD700','#FFF'],10,3);
    }
  }
  enemyLasers=enemyLasers.filter(el=>!el.dead);

  updateBoss(dt);if(state!==STATE.PLAYING)return;
  updateHomingMissiles(dt);if(state!==STATE.PLAYING)return;
  generateWalls();updateShip(dt);checkCollisions();
  updateParticles(dt);updatePersistentSmoke(dt);updateFloatingTexts(dt);updateSpeedLines(dt);updateSparkles(dt);

  const cleanX=cameraX-200;
  walls=walls.filter(w=>w.x+60>cleanX);diamonds=diamonds.filter(d=>d.x>cleanX);
  bitcoins=bitcoins.filter(b=>b.x>cleanX);blueDiamonds=blueDiamonds.filter(b=>b.x>cleanX);
  rocketBoosters=rocketBoosters.filter(r=>r.x>cleanX);gunOrbPickups=gunOrbPickups.filter(g=>g.x>cleanX);

  if(!rocketBoostActive){
    if(shakeDur>0){shakeDur-=dt;shakeX=rand(-8,8)*(shakeDur/0.5);shakeY=rand(-8,8)*(shakeDur/0.5);}else{shakeX=0;shakeY=0;}
  }
  if(screenFlash>0)screenFlash-=dt*2;
}

// ─── HUD ───────────────────────────────────────────────────────
function drawHUD(){
  const pad=12,theme=getTheme(),now=performance.now();
  // Global pulse — everything breathes together (GD rhythm feel)
  const pulse=Math.sin(now*0.004);

  // Progress bar — pulses glow when above 50%
  const barH=5,barY=pad;const progress=clamp(distance/(4000+level*1500),0,1);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(W*0.15,barY,W*0.7,barH);
  const bg2=ctx.createLinearGradient(W*0.15,0,W*0.15+W*0.7*progress,0);bg2.addColorStop(0,'#7DF900');bg2.addColorStop(1,'#A4FF44');
  ctx.fillStyle=bg2;ctx.shadowColor='#7DF900';ctx.shadowBlur=progress>0.5?6+pulse*4:6;ctx.fillRect(W*0.15,barY,W*0.7*progress,barH);ctx.shadowBlur=0;
  // Progress % — larger and pulsing
  const prFontSz=progress>0.7?11:progress>0.4?10:9;
  ctx.font=arcadeFont(prFontSz);ctx.fillStyle=progress>0.7?'#FDE047':'#FFF';ctx.textAlign='right';
  if(progress>0.7){ctx.shadowColor='#FDE047';ctx.shadowBlur=8;}
  ctx.fillText(Math.floor(progress*100)+'%',W*0.15+W*0.7+40,barY+barH+1);ctx.shadowBlur=0;

  // Score pill
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(pad+8,pad+20,170,30,15);ctx.fill();
  ctx.font=arcadeFont(10);ctx.fillStyle='#FDE047';ctx.textAlign='left';
  ctx.fillText('★ '+Math.floor(score).toLocaleString(),pad+20,pad+40);
  if(gunTier>0){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.roundRect(pad+8,pad+52,138,22,11);ctx.fill();
    ctx.font=arcadeFont(8);ctx.fillStyle='#67E8F9';ctx.textAlign='left';
    ctx.fillText('BLASTER Lv '+gunTier,pad+18,pad+67);
  }

  // (Level pill removed per user request)

  // Combo multiplier pill
  if(comboMultiplier>1){
    const comboAlpha=comboTimer>0.5?1:comboTimer*2;
    const comboPulse=1+Math.sin(now*0.012)*0.08*comboMultiplier;
    ctx.save();ctx.globalAlpha=comboAlpha;
    ctx.translate(pad+8+85,pad+100);ctx.scale(comboPulse,comboPulse);ctx.translate(-(pad+8+85),-(pad+100));
    const comboW=90+comboMultiplier*8;
    const comboHue=comboMultiplier>=6?0:comboMultiplier>=4?40:280;
    const comboColor=`hsl(${comboHue},100%,${55+comboMultiplier*3}%)`;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();ctx.roundRect(pad+8,pad+88,comboW,28,14);ctx.fill();
    ctx.strokeStyle=comboColor;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(pad+8,pad+88,comboW,28,14);ctx.stroke();
    ctx.font=arcadeFont(10);ctx.fillStyle=comboColor;ctx.textAlign='left';
    ctx.shadowColor=comboColor;ctx.shadowBlur=12;
    ctx.fillText('x'+comboMultiplier+' COMBO',pad+18,pad+107);
    ctx.shadowBlur=0;ctx.restore();
  }

  // DAMAGE INDICATORS — dim when safe, lights up BRIGHT on each hit
  // dim dim dim → BRIGHT dim dim → BRIGHT BRIGHT dim → BRIGHT BRIGHT BRIGHT → DEAD
  const heartX=W-pad-10,heartY=pad+34;ctx.textAlign='right';
  const hits=maxHealth-health; // 0=no hits, 1=one hit, 2=two hits, 3=dead
  for(let i=0;i<3;i++){
    const hx=heartX-(2-i)*30;
    const isLit=i<hits; // lights up when this hit has been taken
    const justLit=isLit&&i===hits-1&&damageFlash>0; // most recent hit — pulse!
    if(justLit){
      // Pulse/glow animation on fill-in
      const pScale=1+damageFlash*0.4;
      ctx.save();ctx.translate(hx,heartY);ctx.scale(pScale,pScale);
      ctx.shadowColor='#FF2222';ctx.shadowBlur=20+damageFlash*15;
      ctx.fillStyle='#FF2222';ctx.font=arcadeFont(16);
      ctx.fillText('♥',0,0);
      ctx.shadowBlur=0;ctx.restore();
    }else if(isLit){
      // Fully lit — bright red, visible glow
      ctx.shadowColor='#FF4444';ctx.shadowBlur=10;
      ctx.fillStyle='#FF4444';ctx.font=arcadeFont(15);
      ctx.fillText('♥',hx,heartY);ctx.shadowBlur=0;
    }else{
      // Dim/shaded — dark outline, unfilled
      ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.12)';ctx.font=arcadeFont(15);
      ctx.fillText('♥',hx,heartY);
      // Subtle outline for visibility
      ctx.strokeStyle='rgba(255,80,80,0.2)';ctx.lineWidth=1;
    }
  }
  ctx.shadowBlur=0;

  // Diamond counter
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(W-pad-120,heartY+14,120,26,13);ctx.fill();
  ctx.font=arcadeFont(8);ctx.fillStyle='#7DF900';ctx.textAlign='right';ctx.fillText('◆ '+diamondsCollected,W-pad-14,heartY+34);

  // Bitcoin counter — 3D coin + counter in premium pill
  {const bcW=118,bcH=32,bcR=16,bcX=W-pad-bcW,bcY=heartY+44;
  // Pill drop shadow + background
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(bcX,bcY,bcW,bcH,bcR);ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.restore();
  // Pulsing gold border when 2+ collected
  if(bitcoinsCollected>=2){const p=0.4+Math.sin(now*0.01)*0.3;ctx.globalAlpha=p;ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(bcX,bcY,bcW,bcH,bcR);ctx.stroke();ctx.globalAlpha=1;}
  // 3D gold coin
  const cx2=bcX+20,cy2=bcY+bcH/2,cr=13;
  ctx.save();ctx.shadowColor='#FFD700';ctx.shadowBlur=12;
  const cg2=ctx.createRadialGradient(cx2-4,cy2-4,0,cx2,cy2,cr);
  cg2.addColorStop(0,'#FFFACD');cg2.addColorStop(0.25,'#FFD700');cg2.addColorStop(0.65,'#DAA520');cg2.addColorStop(1,'#B8860B');
  ctx.fillStyle=cg2;ctx.beginPath();ctx.arc(cx2,cy2,cr,0,Math.PI*2);ctx.fill();
  // Raised edge ring
  ctx.shadowBlur=0;ctx.strokeStyle='#8B6000';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='rgba(255,235,120,0.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx2,cy2,cr-3,0,Math.PI*2);ctx.stroke();
  // ₿ embossed
  ctx.font='bold 12px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(100,50,0,0.8)';ctx.fillText('₿',cx2+0.7,cy2+0.7);
  ctx.fillStyle='#FFF8DC';ctx.fillText('₿',cx2,cy2);
  // Shine spot
  ctx.globalAlpha=0.32;ctx.fillStyle='#FFF';ctx.beginPath();ctx.ellipse(cx2-3,cy2-3,cr*0.48,cr*0.28,Math.PI*0.2,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
  // Counter text
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=4;ctx.shadowOffsetY=1;
  ctx.font='900 15px "Arial Black","Helvetica Neue",Arial,sans-serif';
  ctx.fillStyle='#FFFFFF';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(bitcoinsCollected+'/3',bcX+39,bcY+bcH/2+1);
  ctx.restore();ctx.textBaseline='alphabetic';}

  // Blue diamond boost slots (bottom-left)
  const slotX=pad+10,slotY=H-50;
  for(let i=0;i<3;i++){const sx2=slotX+i*32;ctx.beginPath();ctx.moveTo(sx2+10,slotY-12);ctx.lineTo(sx2+22,slotY);ctx.lineTo(sx2+10,slotY+12);ctx.lineTo(sx2-2,slotY);ctx.closePath();
    if(i<blueDiamondsCollected){ctx.fillStyle='#3B82F6';ctx.shadowColor='#3B82F6';ctx.shadowBlur=10;ctx.fill();}else{ctx.strokeStyle='rgba(59,130,246,0.3)';ctx.lineWidth=2;ctx.stroke();}ctx.shadowBlur=0;}
  if(superBoostTimer>0){const p2=0.7+Math.sin(performance.now()*0.01)*0.3;ctx.globalAlpha=p2;ctx.font=arcadeFont(10);ctx.fillStyle='#FDE047';ctx.textAlign='left';ctx.shadowColor='#FDE047';ctx.shadowBlur=10;ctx.fillText('⚡ '+superBoostTimer.toFixed(1)+'s',slotX,slotY+28);ctx.shadowBlur=0;ctx.globalAlpha=1;}

  // (Rocket booster circles removed per user request)

  // ROCKET BOOST BUTTON — Premium hand-drawn rocket icon
  if(rocketBoostReady||rocketBoostActive){
    const abX=W-80,abY=H-70;
    const now=performance.now();
    const breathe=0.92+Math.sin(now*0.006)*0.08;
    const abPulse=rocketBoostActive?1.0+Math.sin(now*0.025)*0.04:breathe;
    // Shake when boosting
    const shakeX=rocketBoostActive?(Math.random()-0.5)*4:0;
    const shakeY=rocketBoostActive?(Math.random()-0.5)*4:0;

    ctx.save();
    ctx.translate(abX+shakeX,abY+shakeY);
    ctx.scale(abPulse,abPulse);

    // Neon aura glow (cyan/purple)
    const auraPhase=now*0.004;
    const auraR=rocketBoostActive?48:40+Math.sin(auraPhase)*4;
    const auraGrad=ctx.createRadialGradient(0,0,18,0,0,auraR);
    auraGrad.addColorStop(0,'rgba(0,255,255,0)');
    auraGrad.addColorStop(0.5,rocketBoostActive?'rgba(239,68,68,0.25)':'rgba(0,255,255,0.15)');
    auraGrad.addColorStop(0.8,rocketBoostActive?'rgba(168,85,247,0.12)':'rgba(168,85,247,0.08)');
    auraGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=auraGrad;
    ctx.beginPath();ctx.arc(0,0,auraR,0,Math.PI*2);ctx.fill();

    // Outer ring — glowing
    ctx.shadowColor=rocketBoostActive?'#EF4444':'#00FFFF';
    ctx.shadowBlur=rocketBoostActive?25:12;
    ctx.strokeStyle=rocketBoostActive?'#EF4444':'rgba(0,255,255,0.8)';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,33,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;

    // Inner fill — dark with subtle gradient
    const bgGrad=ctx.createRadialGradient(0,-8,4,0,4,30);
    bgGrad.addColorStop(0,rocketBoostActive?'#3B1111':'#0F2A3D');
    bgGrad.addColorStop(1,rocketBoostActive?'#1A0505':'#071520');
    ctx.fillStyle=bgGrad;
    ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();

    // ── HAND-DRAWN ROCKET ──
    ctx.save();
    ctx.translate(0,-2);
    // Rotate rocket to point UP
    ctx.rotate(-Math.PI/2);

    const rs=0.7; // rocket scale

    // Engine flames (animated, behind rocket)
    const flameLen=rocketBoostActive?18+Math.random()*10:10+Math.sin(now*0.02)*3;
    const flameW=rocketBoostActive?8:5;
    for(let f=0;f<3;f++){
      const fOff=(f-1)*flameW*0.6;
      const fLen=flameLen*(0.7+Math.random()*0.3);
      const flameG=ctx.createLinearGradient(-12*rs,fOff,-12*rs-fLen,fOff);
      flameG.addColorStop(0,'rgba(255,255,255,0.9)');
      flameG.addColorStop(0.2,rocketBoostActive?'#EF4444':'#F97316');
      flameG.addColorStop(0.5,rocketBoostActive?'#F97316':'#FBBF24');
      flameG.addColorStop(1,'rgba(255,100,0,0)');
      ctx.fillStyle=flameG;
      ctx.beginPath();
      ctx.moveTo(-12*rs,fOff-flameW*0.4);
      ctx.quadraticCurveTo(-12*rs-fLen*0.6,fOff,-12*rs-fLen,fOff);
      ctx.quadraticCurveTo(-12*rs-fLen*0.6,fOff,-12*rs,fOff+flameW*0.4);
      ctx.closePath();ctx.fill();
    }

    // Rocket body — metallic gradient
    const bodyG=ctx.createLinearGradient(0,-7*rs,0,7*rs);
    bodyG.addColorStop(0,'#F0F0F0');
    bodyG.addColorStop(0.3,'#D4D4D8');
    bodyG.addColorStop(0.5,'#FAFAFA');
    bodyG.addColorStop(0.7,'#A1A1AA');
    bodyG.addColorStop(1,'#71717A');
    ctx.fillStyle=bodyG;
    ctx.beginPath();
    ctx.moveTo(16*rs,0); // nose tip
    ctx.quadraticCurveTo(12*rs,-6*rs,6*rs,-7*rs);
    ctx.lineTo(-10*rs,-6*rs);
    ctx.lineTo(-12*rs,-4*rs);
    ctx.lineTo(-12*rs,4*rs);
    ctx.lineTo(-10*rs,6*rs);
    ctx.lineTo(6*rs,7*rs);
    ctx.quadraticCurveTo(12*rs,6*rs,16*rs,0);
    ctx.closePath();ctx.fill();

    // Nose cone — red/orange gradient
    const noseG=ctx.createLinearGradient(16*rs,0,8*rs,0);
    noseG.addColorStop(0,'#EF4444');
    noseG.addColorStop(0.4,'#F97316');
    noseG.addColorStop(1,'#DC2626');
    ctx.fillStyle=noseG;
    ctx.beginPath();
    ctx.moveTo(16*rs,0);
    ctx.quadraticCurveTo(12*rs,-4.5*rs,8*rs,-5.5*rs);
    ctx.lineTo(8*rs,5.5*rs);
    ctx.quadraticCurveTo(12*rs,4.5*rs,16*rs,0);
    ctx.closePath();ctx.fill();

    // Window/porthole — glowing cyan
    ctx.shadowColor='#00FFFF';ctx.shadowBlur=6;
    ctx.fillStyle='#00FFFF';
    ctx.beginPath();ctx.arc(4*rs,0,2.5*rs,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Porthole highlight
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.arc(3.5*rs,-1*rs,1*rs,0,Math.PI*2);ctx.fill();

    // Fins — top and bottom
    const finG=ctx.createLinearGradient(0,-10*rs,0,-7*rs);
    finG.addColorStop(0,'#EF4444');finG.addColorStop(1,'#B91C1C');
    ctx.fillStyle=finG;
    // Top fin
    ctx.beginPath();
    ctx.moveTo(-8*rs,-6*rs);ctx.lineTo(-12*rs,-13*rs);ctx.lineTo(-12*rs,-6*rs);
    ctx.closePath();ctx.fill();
    // Bottom fin
    ctx.beginPath();
    ctx.moveTo(-8*rs,6*rs);ctx.lineTo(-12*rs,13*rs);ctx.lineTo(-12*rs,6*rs);
    ctx.closePath();ctx.fill();

    // Body stripe — racing line
    ctx.strokeStyle='rgba(0,255,255,0.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(7*rs,0);ctx.lineTo(-10*rs,0);ctx.stroke();

    // Metallic body highlight
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.8;
    ctx.beginPath();
    ctx.moveTo(14*rs,-1*rs);ctx.quadraticCurveTo(8*rs,-5*rs,-8*rs,-5*rs);
    ctx.stroke();

    ctx.restore(); // end rocket rotation

    // Fuel ring (drain indicator) — now neon yellow
    if(rocketBoostActive){
      const fuelPct=rocketBoostFuel/ROCKET_BOOST_DURATION;
      ctx.shadowColor='#FDE047';ctx.shadowBlur=8;
      ctx.strokeStyle='#FDE047';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,36,-Math.PI/2,-Math.PI/2+Math.PI*2*fuelPct);ctx.stroke();
      ctx.shadowBlur=0;
    }

    // Ready pulse ring (when not boosting, subtle breathe)
    if(!rocketBoostActive){
      const ringAlpha=0.3+Math.sin(now*0.005)*0.15;
      ctx.strokeStyle='rgba(0,255,255,'+ringAlpha+')';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,0,36,0,Math.PI*2);ctx.stroke();
    }

    ctx.restore();

    // Label below
    ctx.font=arcadeFont(7);ctx.textAlign='center';
    if(rocketBoostActive){
      ctx.shadowColor='#EF4444';ctx.shadowBlur=10;
      ctx.fillStyle='#EF4444';ctx.fillText('BOOSTING!',abX,abY+48);
      ctx.shadowBlur=0;
    } else {
      ctx.fillStyle='#00FFFF';ctx.fillText('HOLD',abX,abY+48);
    }
  }

  // ═══ GRENADES IN-FLIGHT — render each grenade ═══
  for(const g of grenades){
    if(g.dead)continue;
    const gsx=g.x-cameraX, gsy=g.y;
    ctx.save();
    ctx.translate(gsx,gsy);
    ctx.rotate(g.rot);
    // Outer glow
    ctx.shadowColor='#FDE047';ctx.shadowBlur=16;
    // Grenade body
    const gg=ctx.createRadialGradient(-3,-3,2,0,0,g.r);
    gg.addColorStop(0,'#84CC16');gg.addColorStop(0.6,'#3F6212');gg.addColorStop(1,'#111');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,g.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Ignition ring — red blinking
    const blink=(performance.now()*0.02)%1<0.5;
    ctx.strokeStyle=blink?'#EF4444':'#FDE047';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,g.r-2,0,Math.PI*2);ctx.stroke();
    // Top fuse cap
    ctx.fillStyle='#71717A';ctx.fillRect(-3,-g.r-4,6,4);
    ctx.fillStyle=blink?'#FDE047':'#F97316';ctx.beginPath();ctx.arc(0,-g.r-5,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // ═══ LASER BEAM — giant horizontal beam when active ═══
  if(laserActive){
    const lp=laserTimer/LASER_DURATION; // 1 → 0
    const beamOrigin=SHIP_X+18;
    const beamW=W-beamOrigin+40;
    const pulse=0.85+Math.sin(laserPhase)*0.15;
    const alpha=Math.min(1,lp*2.5); // fade in/out
    // Outer wide halo
    const haloH=LASER_HEIGHT*1.8*pulse;
    const halo=ctx.createLinearGradient(beamOrigin,0,beamOrigin+beamW,0);
    halo.addColorStop(0,'rgba(34,211,238,'+(alpha*0.5)+')');
    halo.addColorStop(1,'rgba(34,211,238,0)');
    ctx.fillStyle=halo;ctx.fillRect(beamOrigin,ship.y-haloH/2,beamW,haloH);
    // Mid cyan beam
    const midH=LASER_HEIGHT*pulse;
    const mid=ctx.createLinearGradient(beamOrigin,ship.y-midH/2,beamOrigin,ship.y+midH/2);
    mid.addColorStop(0,'rgba(34,211,238,0)');
    mid.addColorStop(0.5,'rgba(103,232,249,'+(alpha*0.9)+')');
    mid.addColorStop(1,'rgba(34,211,238,0)');
    ctx.fillStyle=mid;ctx.fillRect(beamOrigin,ship.y-midH/2,beamW,midH);
    // Hot white core
    const coreH=LASER_HEIGHT*0.35*pulse;
    ctx.shadowColor='#22D3EE';ctx.shadowBlur=30;
    const core=ctx.createLinearGradient(beamOrigin,ship.y-coreH/2,beamOrigin,ship.y+coreH/2);
    core.addColorStop(0,'rgba(255,255,255,0)');
    core.addColorStop(0.5,'rgba(255,255,255,'+alpha+')');
    core.addColorStop(1,'rgba(255,255,255,0)');

    fg.addColorStop(1,'rgba(34,211,238,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(beamOrigin,ship.y,flashR,0,Math.PI*2);ctx.fill();
  }

  // ═══ WEAPON BUTTON STACK (right side: GRENADE / LASER / NUKE bottom-up) ═══
  // Single reusable renderer — returns {x,y,r} so input handlers can hit-test
  function drawWeaponBtn(opts){
    const {x,y,r,charged,pulse,glowColor,ringColor,fillDark,fillBright,glyph,glyphColor,maxCharges,charges,label,labelColor}=opts;
    const now2=performance.now();
    const breathe=charged?(0.95+Math.sin(now2*0.005)*0.05):1;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(breathe,breathe);
    if(charged){
      // Glow aura
      const aR=r+12+Math.sin(now2*0.004)*6;
      const gg=ctx.createRadialGradient(0,0,r*0.45,0,0,aR);
      gg.addColorStop(0,glowColor+'00');
      gg.addColorStop(0.4,glowColor+'26');
      gg.addColorStop(1,glowColor+'00');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,aR,0,Math.PI*2);ctx.fill();
      // Ring
      ctx.shadowColor=pulse>0?'#FDE047':ringColor;
      ctx.shadowBlur=pulse>0?25:14;
      ctx.strokeStyle=pulse>0?'#FDE047':ringColor;
      ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
    } else {
      ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
    }
    // Inner fill
    const bg=ctx.createRadialGradient(0,-6,4,0,4,r);
    if(charged){bg.addColorStop(0,fillBright[0]);bg.addColorStop(1,fillBright[1]);}
    else{bg.addColorStop(0,fillDark[0]);bg.addColorStop(1,fillDark[1]);}
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,r-3,0,Math.PI*2);ctx.fill();
    // Glyph
    if(charged){ctx.shadowColor=glyphColor;ctx.shadowBlur=8;ctx.fillStyle=glyphColor;}
    else{ctx.fillStyle='rgba(255,255,255,0.18)';}
    ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(glyph,0,1);ctx.shadowBlur=0;
    // Charge pips
    for(let ci=0;ci<maxCharges;ci++){
      const step=8, total=(maxCharges-1)*step;
      const cx2=-total/2+ci*step, cy2=r-12;
      if(ci<charges){
        ctx.fillStyle=glyphColor;ctx.shadowColor=glyphColor;ctx.shadowBlur=5;
      } else {
        ctx.fillStyle='rgba(255,255,255,0.1)';ctx.shadowBlur=0;
      }
      ctx.beginPath();ctx.arc(cx2,cy2,2.5,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.restore();
    // Label below
    ctx.font=arcadeFont(6);ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillStyle=charged?labelColor:'rgba(255,255,255,0.2)';
    ctx.fillText(label+(charged?' x'+charges:''),x,y+r+16);
    return {x,y,r};
  }

  // Stack bottom-up so NUKE stays in its historical spot
  const _btnX=W-65, _btnR=30, _btnStep=90;
  const _nukeY=H-75;
  const _laserY=_nukeY-_btnStep;

  // Cache button geometry for input handlers (recomputed each frame)

    {key:'laser',   x:_btnX, y:_laserY, r:_btnR+8},

  ];

  drawWeaponBtn({
    x:_grenY===_grenY?_btnX:_btnX, y:_grenY, r:_btnR,
    charged:grenadeCharges>0, pulse:grenadeBtnPulse,
    glowColor:'rgba(132,204,22,', ringColor:'#84CC16',

  drawWeaponBtn({
    x:_btnX, y:_laserY, r:_btnR,
    charged:laserCharges>0, pulse:laserBtnPulse,
    glowColor:'rgba(34,211,238,', ringColor:'#22D3EE',
    fillDark:['#111','#080808'], fillBright:['#042F3D','#011419'],
    glyph:'⚡', glyphColor:'#22D3EE',

  drawWeaponBtn({

    glyph:'☢', glyphColor:'#FDE047',
    maxCharges:3, charges:nukeCharges,

  });

  // Nuke explosion overlay
  if(nukeActive){
    const np=nukeTimer/NUKE_DURATION;

    if(np>0.7){ctx.globalAlpha=(np-0.7)/0.3;ctx.fillStyle='#FFF';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}

    ctx.beginPath();ctx.roundRect(barX,barY,barW*shieldPct,14,7);ctx.fill();ctx.shadowBlur=0;
    // Border ring
    ctx.strokeStyle=warning?(warnFlash?'#FF3333':'rgba(255,80,80,0.4)'):'rgba(255,215,0,0.5)';
    ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(barX-3,barY-3,barW+6,20,10);ctx.stroke();
    // Label
    ctx.font=arcadeFont(8);ctx.textAlign='center';
    ctx.fillStyle=warning?(warnFlash?'#FF4444':'rgba(255,120,120,0.8)'):'#FFD700';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=warning?10:6;
    ctx.fillText(warning?'⚠ SHIELD FADING ⚠':'🛡 SHIELD: '+shieldTimer.toFixed(1)+'s',W/2,barY-8);
    ctx.shadowBlur=0;
  }

  // Rocket boost screen blur/motion effect
  if(rocketBoostActive){
    ctx.globalAlpha=0.08;
    const mg=ctx.createLinearGradient(0,0,W,0);mg.addColorStop(0,'#F97316');mg.addColorStop(0.5,'transparent');mg.addColorStop(1,'#F97316');
    ctx.fillStyle=mg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }

  // Boss HP bar (top center, only when boss active)
  drawBossHPBar();

  // Pause button — top-right corner
  const pbX=W-50,pbY=22,pbS=isPaused?'#FDE047':'rgba(255,255,255,0.55)';
  ctx.save();ctx.shadowColor=pbS;ctx.shadowBlur=isPaused?12:6;
  ctx.fillStyle=pbS;
  ctx.fillRect(pbX-6,pbY-11,7,22);ctx.fillRect(pbX+3,pbY-11,7,22);

}

// ─── BOSS FIGHT ────────────────────────────────────────────────
function spawnBoss(){
  if(bossActive)return;
  bossActive=true;
  const bossHp=100+level*20;
  currentBoss={
    screenX:W+160,y:H/2,targetY:H/2,
    hp:bossHp,maxHp:bossHp,
    w:130,h:64,
    phase:0,phaseTimer:3.5,
    phaseDur:[2.5,3.8,4.2,5.0],
    attackTimer:1.0,
    laserState:'idle',laserChargeTimer:0,laserFireTimer:0,
    hitFlash:0,bobPhase:0,
    entryDone:false,dead:false,
  };
  addFloatingText(W/2,H/3,'⚠ MOTHERSHIP INCOMING ⚠','#FF2200',20);
  screenFlash=0.6;screenFlashColor='#FF2200';shakeDur=0.8;
}

function killBoss(){
  if(!currentBoss)return;
  const b=currentBoss;
  b.dead=true;bossActive=false;
  // Massive explosion
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      if(state!==STATE.PLAYING)return;
      spawnBurst(b.screenX+rand(-60,60),b.y+rand(-30,30),
        ['#FF4500','#FF8800','#FFF','#FDE047','#FF2EC4'][randInt(0,4)],50,14,0.8,8);
    },i*120);
  }
  playExplosionSound();
  const bpts=25000+level*1000;
  score+=bpts;comboMultiplier=Math.min(comboMultiplier+3,8);comboTimer=3;
  shakeDur=1.2;screenFlash=0.9;screenFlashColor='#FF4500';
  addFloatingText(W/2,H/2-40,'💥 BOSS DEFEATED! 💥','#FDE047',26);
  addFloatingText(W/2,H/2+5,'+'+bpts.toLocaleString(),'#FF8800',18);
  // Drop rewards at boss screen position
  for(let i=0;i<3;i++)gunOrbPickups.push({x:b.screenX+cameraX+rand(-50,50),y:b.y+rand(-40,40),collected:false,anim:rand(0,6.28)});
  for(let i=0;i<2;i++)rocketBoosters.push({x:b.screenX+cameraX+rand(-60,60),y:b.y+rand(-50,50),collected:false,anim:rand(0,6.28)});
  currentBoss=null;
}

function updateBoss(dt){
  if(!bossActive||!currentBoss||currentBoss.dead)return;
  const b=currentBoss;
  b.bobPhase+=dt*1.1;
  b.hitFlash=Math.max(0,b.hitFlash-dt*4);

  // Entry slide in
  if(!b.entryDone){
    b.screenX=lerp(b.screenX,W*0.72,dt*2.5);
    if(b.screenX<=W*0.73)b.entryDone=true;
    return;
  }

  // Hover up/down
  b.targetY=H/2+Math.sin(b.bobPhase*0.7)*H*0.28;
  b.y=lerp(b.y,b.targetY,dt*1.8);
  b.y=clamp(b.y,b.h/2+25,H-b.h/2-25);

  // Phase cycle
  b.phaseTimer-=dt;
  if(b.phaseTimer<=0){
    b.laserState='idle';
    b.phase=(b.phase+1)%4;
    b.phaseTimer=b.phaseDur[b.phase];
    b.attackTimer=0.6;
  }
  b.attackTimer-=dt;

  if(b.phase===0&&b.attackTimer<=0){
    // Spread shot — 6 bullets fan
    b.attackTimer=1.4;
    const n=6;const spread=0.55;
    const baseAng=Math.atan2(ship.y-b.y,SHIP_X-b.screenX);
    for(let i=0;i<n;i++){
      const ang=baseAng+(i-(n-1)/2)*spread/(n-1)*2;
      enemyLasers.push({x:b.screenX+cameraX-b.w*0.45,y:b.y,vx:Math.cos(ang)*ENEMY_LASER_SPEED*0.85,vy:Math.sin(ang)*ENEMY_LASER_SPEED*0.85,dead:false,color:'#FF4500',born:performance.now(),boss:true});
    }
    playLaserSound(0.7);spawnBurst(b.screenX,b.y,'#FF4500',15,4,0.3,3);
  } else if(b.phase===1){
    // Laser beam — charge then fire
    if(b.laserState==='idle'&&b.attackTimer<=0){
      b.laserState='charging';b.laserChargeTimer=1.0;b.attackTimer=999;
    } else if(b.laserState==='charging'){
      b.laserChargeTimer-=dt;
      if(b.laserChargeTimer<=0){b.laserState='firing';b.laserFireTimer=1.5;}
    } else if(b.laserState==='firing'){
      b.laserFireTimer-=dt;
      // Damage player if in beam path
      if(!shieldActive&&invincTimer<=0&&Math.abs(ship.y-b.y)<22){
        health--;damageLevel=maxHealth-health;invincTimer=0.9;hitFlashTimer=0.3;shakeDur=0.3;damageFlash=0.8;
        spawnOrbBurst(SHIP_X,ship.y,['#EF4444','#FFF'],20,5);
        if(health<=0){die();return;}
      }
      if(b.laserFireTimer<=0){b.laserState='idle';b.attackTimer=1.2;}
    }
  } else if(b.phase===2&&b.attackTimer<=0){
    // Minion spawn
    b.attackTimer=3.0;
    const cnt=randInt(3,5);
    for(let i=0;i<cnt;i++){
      enemies.push({x:cameraX+W+80+i*35,y:rand(i%2===0?30:H/2,i%2===0?H/2:H-30),
        type:ENEMY_TYPES[0],hp:ENEMY_TYPES[0].hp,dead:false,phase:rand(0,6.28),
        speed:ENEMY_SPEED+40,shootTimer:1.2,wingPhase:rand(0,6.28)});
    }

  } else if(b.phase===3&&b.attackTimer<=0){

function updateHomingMissiles(dt){
  for(let i=homingMissiles.length-1;i>=0;i--){
    const m=homingMissiles[i];
    if(m.dead){swapRemove(homingMissiles,i);continue;}
    // Steer toward player
    const tx=SHIP_X+cameraX,ty=ship.y;
    const dx=tx-m.x,dy2=ty-m.y;
    const dist=Math.sqrt(dx*dx+dy2*dy2);
    if(dist>0){
      const dvx=dx/dist*m.speed,dvy=dy2/dist*m.speed;
      m.vx=lerp(m.vx,dvx,dt*1.2);m.vy=lerp(m.vy,dvy,dt*1.2);
    }
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    m.trailTimer-=dt;
    if(m.trailTimer<=0){m.trail.push({x:m.x,y:m.y});m.trailTimer=0.04;if(m.trail.length>12)m.trail.shift();}
    const mx=m.x-cameraX;
    if(mx<-60||mx>W+60||m.y<-30||m.y>H+30){m.dead=true;continue;}
    // Hit player
    if(!shieldActive&&invincTimer<=0&&Math.abs(SHIP_X-mx)<SHIP_W*0.45&&Math.abs(ship.y-m.y)<SHIP_H*0.5){
      m.dead=true;
      health--;damageLevel=maxHealth-health;invincTimer=1.0;hitFlashTimer=0.3;shakeDur=0.35;damageFlash=0.8;
      spawnOrbBurst(SHIP_X,ship.y,['#EF4444','#FFF'],20,5);
      if(health<=0){die();return;}
    }
    if(shieldActive&&Math.abs(SHIP_X-mx)<SHIP_W*0.5&&Math.abs(ship.y-m.y)<SHIP_H*0.6){
      m.dead=true;spawnOrbBurst(SHIP_X,ship.y,['#FFD700','#FFF'],15,4);score+=800;
    }
  }
}

}

function drawHomingMissiles(){
  for(const m of homingMissiles){
    if(m.dead)continue;

    if(mx<-60||mx>W+60)continue;
    // Trail
    for(let ti=0;ti<m.trail.length;ti++){
      const t=m.trail[ti];const a=(ti/m.trail.length)*0.6;
      ctx.globalAlpha=a;ctx.fillStyle='#FF4500';ctx.shadowColor='#FF4500';ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(t.x-cameraX,t.y,4*(ti/m.trail.length),0,Math.PI*2);ctx.fill();
    }

    ctx.save();ctx.translate(mx,m.y);

function drawBossHPBar(){
  if(!bossActive||!currentBoss||currentBoss.dead)return;
  const b=currentBoss;
  const pct=clamp(b.hp/b.maxHp,0,1);
  const bw=Math.min(W*0.45,340),bh=16,bx=(W-bw)/2,by2=18;
  const now2=performance.now();
  const warning=pct<0.3;const flash=warning&&Math.floor(now2*0.006)%2===0;
  // Background
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.roundRect(bx-4,by2-4,bw+8,bh+8,10);ctx.fill();
  ctx.strokeStyle='rgba(255,50,0,0.6)';ctx.lineWidth=1.5;ctx.stroke();

  hbg.addColorStop(0,warning?'#FF2200':'#FF4500');hbg.addColorStop(1,warning?'#FF6600':'#FF8800');
  ctx.fillStyle=flash?'rgba(255,100,100,0.5)':hbg;

    cg.addColorStop(0,'rgba(255,255,255,0.8)');cg.addColorStop(0.5,trim);cg.addColorStop(1,'rgba(0,0,0,0.3)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(-ew*0.25,0,eh*0.16,eh*0.12,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=0.7;
    ctx.beginPath();ctx.ellipse(-ew*0.25,0,eh*0.17,eh*0.13,0,0,Math.PI*2);ctx.stroke();

    // Gun barrels (nose)
    ctx.fillStyle=trim;
    ctx.fillRect(-ew*0.52,-eh*0.08,ew*0.12,3);
    ctx.fillRect(-ew*0.52,eh*0.05,ew*0.12,3);

    // Engine nacelles
    ctx.fillStyle=eng;
    ctx.beginPath();ctx.arc(ew*0.38,-eh*0.15,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ew*0.38,eh*0.15,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=trim;ctx.globalAlpha=0.5+Math.sin(time*0.04+e.phase)*0.3;
    ctx.beginPath();ctx.arc(ew*0.38,-eh*0.15,1.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ew*0.38,eh*0.15,1.8,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;

    // Damage flash
    if(e.hp<e.type.hp){
      ctx.globalAlpha=0.15;ctx.fillStyle='#FF0000';
      ctx.beginPath();ctx.moveTo(-ew*0.5,0);ctx.lineTo(ew*0.4,-eh*0.3);ctx.lineTo(ew*0.4,eh*0.3);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
    }

    // HP bar for multi-hit enemies
    if(e.type.hp>1){const bw=ew*0.8,bh=3,bx=-bw/2,by=-eh/2-10;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=e.hp>e.type.hp*0.5?'#22c55e':'#ef4444';ctx.fillRect(bx,by,bw*(e.hp/e.type.hp),bh);}
    // Dreadnought shield glow
    if(e.type.name==='Dreadnought'&&e.shieldOn){
      ctx.globalAlpha=0.5+Math.sin(time*0.02)*0.3;
      ctx.strokeStyle='#22D3EE';ctx.lineWidth=3;ctx.shadowColor='#22D3EE';ctx.shadowBlur=22;
      ctx.beginPath();ctx.ellipse(0,0,ew*0.65,eh*0.75,0,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=0.12;ctx.fillStyle='#22D3EE';ctx.fill();
      ctx.globalAlpha=1;ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();}}}

  // Draw boss and homing missiles (after normal enemies)
  drawBoss(time);
  drawHomingMissiles();

  // Draw enemy lasers
  for(const el of enemyLasers){if(!el.dead){
    const elx=el.x-cameraX;
    if(elx>-30&&elx<W+30){
      ctx.save();ctx.translate(elx,el.y);
      const angle=Math.atan2(el.vy,el.vx);
      ctx.rotate(angle);
      const laserLen=22;
      const lg=ctx.createLinearGradient(-laserLen,0,4,0);
      lg.addColorStop(0,'transparent');lg.addColorStop(0.3,el.color);lg.addColorStop(1,'#FFF');
      ctx.strokeStyle=lg;ctx.lineWidth=3;ctx.shadowColor=el.color;ctx.shadowBlur=10;
      ctx.beginPath();ctx.moveTo(-laserLen,0);ctx.lineTo(4,0);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-laserLen*0.6,0);ctx.lineTo(4,0);ctx.stroke();
      ctx.shadowBlur=0;ctx.restore();
    }
  }}
  drawPersistentSmoke();
  if(state===STATE.PLAYING||state===STATE.DEAD)drawShip(time);
  drawParticles();drawFloatingTexts();ctx.restore();
  if(screenFlash>0){ctx.globalAlpha=screenFlash*0.35;ctx.fillStyle=screenFlashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  drawSparkles();
  if(state===STATE.PLAYING){drawHUD();if(isPaused)drawPauseOverlay();}
  if(state===STATE.MENU)drawMenuScreen();
  if(state===STATE.DEAD)drawGameOverScreen();
}

function drawPauseOverlay(){
  ctx.fillStyle='rgba(5,10,25,0.72)';ctx.fillRect(0,0,W,H);
  const pulse=1+Math.sin(performance.now()*0.004)*0.04;
  ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(pulse,pulse);
  ctx.shadowColor='#A855F7';ctx.shadowBlur=28;
  ctx.font=arcadeFont(Math.min(36,W*0.045));ctx.fillStyle='#FFF';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('PAUSED',0,0);ctx.shadowBlur=0;ctx.restore();
  ctx.font=arcadeFont(Math.min(11,W*0.015));ctx.fillStyle='rgba(255,255,255,0.5)';ctx.textAlign='center';
  ctx.fillText('TAP ▐▌ TO RESUME',W/2,H/2+20);
}

// ─── GAME LOOP ─────────────────────────────────────────────────
function loop(time){requestAnimationFrame(loop);const dt=Math.min((time-lastTime)/1000,0.05);lastTime=time;if(!isPaused)update(dt);draw();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state===STATE.PLAYING)isPaused=true;});

// ─── INPUT ─────────────────────────────────────────────────────
// INSTANT restart — GD "one more try" addiction. Tap anywhere after brief death anim.
function handleTap(){if(state===STATE.MENU){startGame();return;}if(state===STATE.DEAD&&deathTimer>0.45){startGame();return;}}

// Helper: convert touch event to canvas coordinates
function touchToCanvas(touch,rect){
  const isP=window.innerWidth<window.innerHeight&&window.innerWidth<900;
  const tx=isP?(rect.bottom-touch.clientY):(touch.clientX-rect.left);
  const ty=isP?(rect.right-touch.clientX):(touch.clientY-rect.top);
  return {
    x:tx*(W/(isP?rect.height:rect.width)),
    y:ty*(H/(isP?rect.width:rect.height))
  };
}

// Hit-test all weapon buttons. Returns true if a button was fired.
function tryFireWeaponAt(px,py){
  const btns=window.__wrWeaponBtns||[];
  for(const b of btns){
    const dx=px-b.x, dy=py-b.y;
    if(dx*dx+dy*dy<b.r*b.r){
      if(b.key==='nuke')    return fireNuke();
      if(b.key==='grenade') return fireGrenade();
      if(b.key==='laser')   return fireLaser();
    }
  }
  return false;
}

canvas.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  if(state!==STATE.PLAYING){handleTap();return;}
  const touch=e.touches[0],rect=canvas.getBoundingClientRect();
  const c=touchToCanvas(touch,rect);

  // Pause button (top-right corner)
  if(c.x>W-80&&c.y<60){isPaused=!isPaused;return;}

  if(isPaused)return;

  // Weapon buttons — grenade, laser, nuke (right-side stack)
  if(tryFireWeaponAt(c.x,c.y))return;

  // Check if touching A button area
  if((rocketBoostReady||rocketBoostActive)&&c.x>W-120&&c.y>H-110){
    aButtonPressed=true;return;
  }
  isDragging=true;
  // ABSOLUTE positioning: ship jumps to finger position + offset (above finger)
  ship.targetY=clamp(c.y+getTouchOffset(),25,H-25);
},{passive:false});

canvas.addEventListener('touchmove',(e)=>{
  e.preventDefault();if(!isDragging||state!==STATE.PLAYING||isPaused)return;
  const touch=e.touches[0],rect=canvas.getBoundingClientRect();
  const c=touchToCanvas(touch,rect);
  // ABSOLUTE positioning: ship always stays above finger
  ship.targetY=clamp(c.y+getTouchOffset(),25,H-25);
},{passive:false});

canvas.addEventListener('touchend',(e)=>{e.preventDefault();isDragging=false;aButtonPressed=false;},{passive:false});

canvas.addEventListener('mousedown',(e)=>{
  if(state!==STATE.PLAYING){handleTap();return;}
  const rect=canvas.getBoundingClientRect();
  // Convert mouse coords to canvas coords (matches touch rotation logic)
  const isP=window.innerWidth<window.innerHeight&&window.innerWidth<900;
  const mx=isP?(rect.bottom-e.clientY):(e.clientX-rect.left);
  const my=isP?(rect.right-e.clientX):(e.clientY-rect.top);
  const cx=mx*(W/(isP?rect.height:rect.width));
  const cy=my*(H/(isP?rect.width:rect.height));

  // Pause button
  if(cx>W-80&&cy<60){isPaused=!isPaused;return;}
  if(isPaused)return;

  // Weapon buttons — grenade, laser, nuke
  if(tryFireWeaponAt(cx,cy))return;

  isDragging=true;
  dragStartY=(e.clientY-rect.top);
  dragShipStartY=ship.targetY;
});
canvas.addEventListener('mousemove',(e)=>{if(!isDragging||state!==STATE.PLAYING)return;const rect=canvas.getBoundingClientRect();const currentY=(e.clientY-rect.top);const scale=H/rect.height;ship.targetY=clamp(dragShipStartY+(currentY-dragStartY)*scale,25,H-25);});
canvas.addEventListener('mouseup',()=>{isDragging=false;});

document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();handleTap();return;}
  keysDown[e.code]=true;
  if(['ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code)){e.preventDefault();useMouseFollow=false;}
  if(e.code==='KeyA'&&(rocketBoostReady||rocketBoostActive)){aButtonPressed=true;}
});
document.addEventListener('keyup',(e)=>{keysDown[e.code]=false;if(e.code==='KeyA')aButtonPressed=false;});

function processKeyboardInput(dt){
  if(state!==STATE.PLAYING||useMouseFollow)return;let dir=0;
  if(keysDown['ArrowUp']||keysDown['KeyW'])dir-=1;if(keysDown['ArrowDown']||keysDown['KeyS'])dir+=1;
  if(dir!==0)ship.targetY=clamp(ship.targetY+dir*SHIP_SPEED*dt,25,H-25);
}

document.addEventListener('touchmove',(e)=>e.preventDefault(),{passive:false});

// ─── INIT ──────────────────────────────────────────────────────
resize();lastTime=performance.now();requestAnimationFrame(loop);
</script>
