<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wish Runner — WishPath</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0B1628;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    font-family: 'Press Start 2P', monospace;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  /* Force landscape on mobile */
  @media screen and (orientation: portrait) and (max-width: 900px) {
    html { transform: rotate(90deg); transform-origin: top left; width: 100vh; height: 100vw; position: absolute; top: 0; left: 100%; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════════
// WISH RUNNER — Geometry Dash × Cosmic Theme
// Horizontal auto-scroller with tap-to-jump
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  // For portrait orientation on mobile, swap dimensions
  const isPortrait = window.innerWidth < window.innerHeight && window.innerWidth < 900;
  W = isPortrait ? window.innerHeight : window.innerWidth;
  H = isPortrait ? window.innerWidth : window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = (isPortrait ? window.innerHeight : W) + 'px';
  canvas.style.height = (isPortrait ? window.innerWidth : H) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  GROUND_Y = H * 0.78;
  PLAYER_X = W * 0.18;
}

// ─── COLORS ────────────────────────────────────────────────────
const COL = {
  bg1: '#0B1628',
  bg2: '#0D1B3A',
  bgGrid: 'rgba(100, 140, 255, 0.06)',
  bgGridBright: 'rgba(100, 140, 255, 0.12)',
  purple: '#A855F7',
  purpleDark: '#7C3AED',
  cyan: '#22D3EE',
  cyanGlow: '#67E8F9',
  gold: '#FDE047',
  goldDark: '#EAB308',
  magenta: '#FF2EC4',
  green: '#7DF900',
  greenDark: '#5BC700',
  greenGlow: '#A4FF44',
  white: '#ffffff',
  blue: '#3B82F6',
  groundLine: '#22D3EE',
  spike: '#FF2EC4',
  block: '#2A4A7F',
  blockEdge: '#4A7ACC',
};

// ─── STATE ─────────────────────────────────────────────────────
const STATE = { MENU: 0, PLAYING: 1, DEAD: 2, LEVEL_COMPLETE: 3 };
let state = STATE.MENU;
let GROUND_Y = 0, PLAYER_X = 0;

// Score + progress
let score = 0, distance = 0, maxDistance = 0;
let highScore = parseInt(localStorage.getItem('wr_gd_highscore')) || 0;
let totalCoins = parseInt(localStorage.getItem('wr_gd_coins')) || 0;
let attempt = parseInt(localStorage.getItem('wr_gd_attempt')) || 1;
let jumpCount = 0;
let runStartTime = 0;

// Player
const PLAYER_SIZE = 36;
const GRAVITY = 2800;
const JUMP_FORCE = -780;
const player = {
  y: 0, vy: 0,
  onGround: true,
  rotation: 0,
  targetRotation: 0,
  size: PLAYER_SIZE,
  trail: [],
};

// Scrolling
let scrollSpeed = 360;
let baseSpeed = 360;
let maxSpeed = 720;
let cameraX = 0;

// Health system (3 hits)
let health = 3;
let invincTimer = 0;
let hitFlashTimer = 0;
let damageSmoke = []; // visual smoke puffs on damage

// Diamonds (green neon, 8 = level up)
let diamonds = [];
let diamondsCollected = 0;
const DIAMONDS_PER_LEVEL = 8;

// Level system
let level = 1;
let levelUpFlash = 0;

// Jackpot gold coins (3 = 10,000 pts)
let goldCoins = [];
let goldCoinsCollected = 0;
let jackpotTimer = 0;
let jackpotScoreAnim = 0;
let totalJackpots = 0;

// Super boost blue diamonds (3 = invincible)
let blueDiamonds = [];
let blueDiamondsCollected = 0;
let superBoostTimer = 0;
let totalSuperBoosts = 0;
let blueDiamondHudFlash = 0;

// Obstacles + platforms
let obstacles = [];
let platforms = [];
let spawnX = 0; // next world-X to spawn at
const SPAWN_AHEAD = 1200; // spawn this far ahead of camera

// Particles
const MAX_PARTICLES = 800;
let particles = [];

// Screen effects
let shakeX = 0, shakeY = 0, shakeDur = 0;
let screenFlash = 0, screenFlashColor = COL.gold;
let floatingTexts = [];
let deathParticles = [];

// Grid scroll
let gridOffsetX = 0;

// Progress within level
let levelDistance = 0;
const LEVEL_LENGTH = 5000; // distance per level

// Death anim
let deathTimer = 0;

// Environment phase colors per level
const ENV_PHASES = [
  { bg: '#0B1628', edge: '#A855F7', ground: '#22D3EE', glow: 'rgba(168,85,247,0.15)' },
  { bg: '#0B1630', edge: '#3B82F6', ground: '#60A5FA', glow: 'rgba(59,130,246,0.15)' },
  { bg: '#0D1825', edge: '#22D3EE', ground: '#67E8F9', glow: 'rgba(34,211,238,0.15)' },
  { bg: '#12102A', edge: '#FF2EC4', ground: '#FF6BD6', glow: 'rgba(255,46,196,0.12)' },
  { bg: '#0F1A10', edge: '#7DF900', ground: '#A4FF44', glow: 'rgba(125,249,0,0.12)' },
  { bg: '#1A1408', edge: '#FDE047', ground: '#FEF08A', glow: 'rgba(253,224,71,0.12)' },
];
function getEnv() { return ENV_PHASES[(level - 1) % ENV_PHASES.length]; }

// Delta time
let lastTime = 0;

// ─── HELPERS ───────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return Math.random() * (b - a) + a; }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutQuad(t) { return t < 0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

// Chunky arcade font helper
let fontLoaded = false;
document.fonts && document.fonts.ready.then(() => { fontLoaded = true; });
function arcadeFont(size) { return `${size}px 'Press Start 2P', monospace`; }

// ─── PARTICLES ─────────────────────────────────────────────────
function spawnParticle(x, y, color, vx, vy, life, size, grav) {
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({ x, y, vx: vx||0, vy: vy||0, life, maxLife: life, size: size||3, color, grav: grav||0 });
}

function spawnBurst(x, y, color, count, spread, life, size) {
  const budget = Math.min(count, MAX_PARTICLES - particles.length);
  for (let i = 0; i < budget; i++) {
    const a = rand(0, Math.PI * 2);
    const spd = rand(0.5, spread);
    spawnParticle(x, y, color, Math.cos(a)*spd, Math.sin(a)*spd, rand(life*0.5, life), rand(size*0.3, size), 0.02);
  }
}

function spawnDeathExplosion(x, y) {
  // GD-style pixel explosion
  const colors = [COL.purple, COL.cyan, COL.magenta, COL.white, COL.green, COL.gold];
  for (let i = 0; i < 60; i++) {
    const a = rand(0, Math.PI * 2);
    const spd = rand(2, 12);
    const c = colors[randInt(0, colors.length - 1)];
    const sz = rand(2, 7);
    spawnParticle(x, y, c, Math.cos(a)*spd, Math.sin(a)*spd - rand(0, 4), rand(0.4, 1.2), sz, 0.15);
  }
  // Square debris
  for (let i = 0; i < 20; i++) {
    deathParticles.push({
      x, y, vx: rand(-8, 8), vy: rand(-12, -2),
      rot: rand(0, 6.28), rotV: rand(-0.3, 0.3),
      size: rand(4, 12), life: rand(0.5, 1.5), maxLife: 1.5,
      color: colors[randInt(0, colors.length - 1)],
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vy += p.grav * dt * 60;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = deathParticles.length - 1; i >= 0; i--) {
    const d = deathParticles[i];
    d.x += d.vx * dt * 60;
    d.y += d.vy * dt * 60;
    d.vy += 0.3 * dt * 60;
    d.rot += d.rotV * dt * 60;
    d.life -= dt;
    if (d.life <= 0) deathParticles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = clamp(p.life / p.maxLife, 0, 1);
    const sz = p.size * (0.3 + alpha * 0.7);
    if (sz < 0.3) continue;
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = Math.min(10, sz * 2);
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  // Square death debris
  for (const d of deathParticles) {
    const alpha = clamp(d.life / d.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = d.color;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ─── FLOATING TEXT ─────────────────────────────────────────────
function addFloatingText(x, y, text, color, size) {
  floatingTexts.push({ x, y, text, color, size: size || 14, life: 1.2, maxLife: 1.2 });
}

function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 40 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    const alpha = clamp(ft.life / ft.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.font = arcadeFont(ft.size);
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = 12;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ─── BACKGROUND — GRID + STARS ─────────────────────────────────
let bgStars = [];
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 120; i++) {
    bgStars.push({
      x: rand(0, W), y: rand(0, H * 0.7),
      size: rand(0.5, 2.2),
      alpha: rand(0.15, 0.6),
      twinkle: rand(1, 4),
      offset: rand(0, 6.28),
      color: Math.random() < 0.6 ? COL.white : [COL.purple, COL.cyan, COL.blue][randInt(0, 2)],
    });
  }
}
initBgStars();
window.addEventListener('resize', () => { resize(); initBgStars(); });

function drawBackground(time) {
  const env = getEnv();

  // Gradient sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, env.bg);
  skyGrad.addColorStop(0.6, COL.bg2);
  skyGrad.addColorStop(1, '#050A14');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Rectangular tile grid (GD style)
  const tileSize = 50;
  const offsetX = (cameraX * 0.3) % tileSize;
  ctx.strokeStyle = COL.bgGrid;
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (let x = -offsetX; x < W + tileSize; x += tileSize) {
    ctx.moveTo(x, 0); ctx.lineTo(x, GROUND_Y);
  }
  for (let y = 0; y <= GROUND_Y; y += tileSize) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();

  // Subtle brighter grid near ground
  const nearGroundGrad = ctx.createLinearGradient(0, GROUND_Y - 120, 0, GROUND_Y);
  nearGroundGrad.addColorStop(0, 'transparent');
  nearGroundGrad.addColorStop(1, env.glow);
  ctx.fillStyle = nearGroundGrad;
  ctx.fillRect(0, GROUND_Y - 120, W, 120);

  // Stars
  for (const s of bgStars) {
    const tw = Math.sin(time * 0.001 * s.twinkle + s.offset);
    const a = s.alpha * (0.5 + tw * 0.5);
    if (a < 0.03) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    if (s.size > 1.5) { ctx.shadowColor = s.color; ctx.shadowBlur = s.size * 4; }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

// ─── GROUND ────────────────────────────────────────────────────
function drawGround() {
  const env = getEnv();

  // Ground blocks (GD style rectangular tiles below ground line)
  const tileSize = 50;
  const offsetX = (cameraX * 1) % tileSize;
  const groundBlockY = GROUND_Y;
  const rows = Math.ceil((H - GROUND_Y) / tileSize) + 1;
  const cols = Math.ceil(W / tileSize) + 2;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const bx = c * tileSize - offsetX;
      const by = groundBlockY + r * tileSize;
      const depth = r / rows;

      // Block fill — darker as it goes down
      const brightness = Math.max(0.15, 0.5 - depth * 0.4);
      ctx.fillStyle = `rgba(20, 40, 80, ${brightness + 0.4})`;
      ctx.fillRect(bx, by, tileSize, tileSize);

      // Block edge
      ctx.strokeStyle = `rgba(60, 100, 180, ${0.3 - depth * 0.15})`;
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, tileSize - 1, tileSize - 1);
    }
  }

  // Glowing ground line
  ctx.shadowColor = env.ground;
  ctx.shadowBlur = 20;
  ctx.strokeStyle = env.ground;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Extra glow layer
  const glowGrad = ctx.createLinearGradient(0, GROUND_Y - 15, 0, GROUND_Y + 15);
  glowGrad.addColorStop(0, 'transparent');
  glowGrad.addColorStop(0.5, env.ground.replace ? env.ground : COL.cyan);
  glowGrad.addColorStop(1, 'transparent');
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, GROUND_Y - 15, W, 30);
  ctx.globalAlpha = 1;
}

// ─── PLAYER (NEON CUBE) ───────────────────────────────────────
function drawPlayer() {
  if (state === STATE.DEAD && deathTimer > 0.3) return; // hide after explosion

  const px = PLAYER_X;
  const py = player.y;
  const sz = player.size;

  // Particle trail behind cube
  if (state === STATE.PLAYING) {
    const trailColor = superBoostTimer > 0 ? COL.gold : COL.cyan;
    player.trail.push({ x: px - sz/2, y: py + sz * 0.3, life: 0.4, maxLife: 0.4, color: trailColor });
    if (player.trail.length > 20) player.trail.shift();
  }

  // Draw trail
  for (let i = player.trail.length - 1; i >= 0; i--) {
    const t = player.trail[i];
    t.life -= 0.016;
    if (t.life <= 0) { player.trail.splice(i, 1); continue; }
    const alpha = (t.life / t.maxLife) * 0.5;
    const tsz = sz * 0.4 * (t.life / t.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(t.x - tsz/2, t.y - tsz/2, tsz, tsz);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(player.rotation);

  // Super boost glow
  if (superBoostTimer > 0) {
    ctx.shadowColor = COL.gold;
    ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(253, 224, 71, 0.3)';
    ctx.fillRect(-sz * 0.7, -sz * 0.7, sz * 1.4, sz * 1.4);
    ctx.shadowBlur = 0;
  }

  // Invincibility flash
  if (invincTimer > 0 && Math.floor(invincTimer * 10) % 2 === 0) {
    ctx.globalAlpha = 0.5;
  }

  // Cube body — purple/cyan gradient
  const grad = ctx.createLinearGradient(-sz/2, -sz/2, sz/2, sz/2);
  grad.addColorStop(0, COL.purple);
  grad.addColorStop(1, COL.cyan);
  ctx.fillStyle = grad;
  ctx.shadowColor = COL.purple;
  ctx.shadowBlur = 15;
  ctx.fillRect(-sz/2, -sz/2, sz, sz);

  // Neon outline
  ctx.shadowBlur = 8;
  ctx.shadowColor = COL.cyanGlow;
  ctx.strokeStyle = COL.cyanGlow;
  ctx.lineWidth = 2;
  ctx.strokeRect(-sz/2, -sz/2, sz, sz);

  // Inner icon — small diamond/star shape
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  const ic = sz * 0.2;
  ctx.beginPath();
  ctx.moveTo(0, -ic);
  ctx.lineTo(ic, 0);
  ctx.lineTo(0, ic);
  ctx.lineTo(-ic, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;

  // Damage smoke puffs
  for (let i = damageSmoke.length - 1; i >= 0; i--) {
    const s = damageSmoke[i];
    s.x -= 1.5;
    s.y -= 0.8;
    s.life -= 0.016;
    s.size += 0.3;
    if (s.life <= 0) { damageSmoke.splice(i, 1); continue; }
    const alpha = (s.life / s.maxLife) * 0.4;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── LEVEL GENERATION ──────────────────────────────────────────
// Procedural obstacle/diamond/coin placement
function generateChunk(startX, endX) {
  let x = startX;
  const minGap = Math.max(150, 280 - level * 10);
  const maxGap = Math.max(200, 400 - level * 15);

  while (x < endX) {
    const gap = rand(minGap, maxGap);
    x += gap;
    if (x >= endX) break;

    const r = Math.random();

    if (r < 0.45) {
      // Spike (triangle)
      obstacles.push({
        x: x, y: GROUND_Y,
        type: 'spike', w: 36, h: 42,
        hit: false,
      });
      // Sometimes double/triple spikes
      if (Math.random() < 0.25 + level * 0.03) {
        obstacles.push({ x: x + 38, y: GROUND_Y, type: 'spike', w: 36, h: 42, hit: false });
      }
      if (Math.random() < 0.1 + level * 0.02) {
        obstacles.push({ x: x + 76, y: GROUND_Y, type: 'spike', w: 36, h: 42, hit: false });
      }
    } else if (r < 0.7) {
      // Block platform
      const bw = rand(80, 180);
      const bh = rand(36, 60);
      const elevated = Math.random() < 0.35;
      const by = elevated ? GROUND_Y - rand(80, 140) : GROUND_Y;
      platforms.push({ x: x, y: by, w: bw, h: bh });

      // Spike on top of block
      if (Math.random() < 0.3 + level * 0.04) {
        obstacles.push({ x: x + bw/2, y: by - bh, type: 'spike', w: 30, h: 36, hit: false });
      }

      // Diamonds on top of elevated platforms
      if (elevated && Math.random() < 0.6) {
        diamonds.push({ x: x + bw/2, y: by - bh - 30, collected: false, anim: rand(0, 6.28) });
      }
    } else if (r < 0.85) {
      // Tall pillar
      const pw = rand(40, 60);
      const ph = rand(70, 140);
      platforms.push({ x: x, y: GROUND_Y - ph, w: pw, h: ph });
      // Spike on top
      if (Math.random() < 0.4) {
        obstacles.push({ x: x + pw/2, y: GROUND_Y - ph, type: 'spike', w: 30, h: 36, hit: false });
      }
    } else {
      // Gap section — spikes in a pit pattern
      for (let s = 0; s < randInt(2, 4); s++) {
        obstacles.push({ x: x + s * 34, y: GROUND_Y, type: 'spike', w: 32, h: 38, hit: false });
      }
    }

    // Floating diamonds (in air between obstacles)
    if (Math.random() < 0.5) {
      const dy = GROUND_Y - rand(60, 160);
      diamonds.push({ x: x + rand(-30, 60), y: dy, collected: false, anim: rand(0, 6.28) });
    }

    // Gold coin (rare)
    if (Math.random() < 0.04) {
      goldCoins.push({ x: x + rand(0, 80), y: GROUND_Y - rand(40, 120), collected: false, anim: rand(0, 6.28) });
    }

    // Blue diamond (moderate rarity)
    if (Math.random() < 0.06) {
      blueDiamonds.push({ x: x + rand(0, 80), y: GROUND_Y - rand(60, 140), collected: false, anim: rand(0, 6.28) });
    }
  }
}

function ensureWorldGenerated() {
  const needUpTo = cameraX + W + SPAWN_AHEAD;
  if (needUpTo > spawnX) {
    generateChunk(spawnX, needUpTo);
    spawnX = needUpTo;
  }
}

// ─── DRAW OBSTACLES ────────────────────────────────────────────
function drawSpike(sx, sy, sw, sh, hit) {
  const screenX = sx - cameraX;
  if (screenX < -50 || screenX > W + 50) return;

  ctx.save();
  ctx.translate(screenX, sy);

  // Spike triangle
  ctx.beginPath();
  ctx.moveTo(0, -sh);
  ctx.lineTo(-sw/2, 0);
  ctx.lineTo(sw/2, 0);
  ctx.closePath();

  // Dark fill with neon outline
  ctx.fillStyle = 'rgba(20, 10, 30, 0.9)';
  ctx.fill();
  ctx.strokeStyle = hit ? 'rgba(255,100,100,0.5)' : COL.magenta;
  ctx.lineWidth = 2;
  ctx.shadowColor = COL.magenta;
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Inner glow line
  ctx.beginPath();
  ctx.moveTo(0, -sh + 8);
  ctx.lineTo(-sw/2 + 6, -2);
  ctx.lineTo(sw/2 - 6, -2);
  ctx.closePath();
  ctx.strokeStyle = `rgba(255, 46, 196, 0.3)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

function drawPlatform(p) {
  const screenX = p.x - cameraX;
  if (screenX + p.w < -10 || screenX > W + 10) return;

  // Block body
  ctx.fillStyle = COL.block;
  ctx.fillRect(screenX, p.y - p.h, p.w, p.h);

  // Block edge highlight
  ctx.strokeStyle = COL.blockEdge;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(screenX + 0.5, p.y - p.h + 0.5, p.w - 1, p.h - 1);

  // Top bright edge
  ctx.strokeStyle = 'rgba(100, 160, 255, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(screenX, p.y - p.h);
  ctx.lineTo(screenX + p.w, p.y - p.h);
  ctx.stroke();

  // Inner grid pattern
  const ts = 25;
  ctx.strokeStyle = 'rgba(80, 130, 200, 0.15)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  const oX = cameraX % ts;
  for (let gx = screenX - oX; gx < screenX + p.w; gx += ts) {
    if (gx >= screenX && gx <= screenX + p.w) {
      ctx.moveTo(gx, p.y - p.h);
      ctx.lineTo(gx, p.y);
    }
  }
  for (let gy = p.y - p.h; gy <= p.y; gy += ts) {
    ctx.moveTo(screenX, gy);
    ctx.lineTo(screenX + p.w, gy);
  }
  ctx.stroke();
}

// ─── DRAW DIAMONDS (GREEN NEON, GD STYLE) ─────────────────────
function drawDiamond(d, time) {
  if (d.collected) return;
  const screenX = d.x - cameraX;
  if (screenX < -30 || screenX > W + 30) return;

  const bob = Math.sin(time * 0.003 + d.anim) * 5;
  const rot = Math.sin(time * 0.002 + d.anim) * 0.2;

  ctx.save();
  ctx.translate(screenX, d.y + bob);
  ctx.rotate(rot);

  const sz = 14;
  ctx.shadowColor = COL.green;
  ctx.shadowBlur = 14;

  // Diamond shape
  ctx.beginPath();
  ctx.moveTo(0, -sz);
  ctx.lineTo(sz, 0);
  ctx.lineTo(0, sz);
  ctx.lineTo(-sz, 0);
  ctx.closePath();
  ctx.fillStyle = COL.green;
  ctx.fill();

  // Outline
  ctx.strokeStyle = COL.greenGlow;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Inner shine
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(0, -sz * 0.5);
  ctx.lineTo(sz * 0.4, 0);
  ctx.lineTo(0, sz * 0.1);
  ctx.lineTo(-sz * 0.1, -sz * 0.1);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── DRAW GOLD COINS ──────────────────────────────────────────
function drawGoldCoinObj(gc, time) {
  if (gc.collected) return;
  const screenX = gc.x - cameraX;
  if (screenX < -30 || screenX > W + 30) return;

  const bob = Math.sin(time * 0.004 + gc.anim) * 4;
  const scaleX = Math.abs(Math.cos(time * 0.003 + gc.anim));

  ctx.save();
  ctx.translate(screenX, gc.y + bob);
  ctx.scale(0.3 + scaleX * 0.7, 1);

  ctx.shadowColor = COL.gold;
  ctx.shadowBlur = 16;
  ctx.fillStyle = COL.gold;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = COL.goldDark;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Star emblem
  ctx.shadowBlur = 0;
  ctx.fillStyle = COL.goldDark;
  ctx.font = arcadeFont(10);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', 0, 1);

  ctx.restore();
}

// ─── DRAW BLUE DIAMONDS ───────────────────────────────────────
function drawBlueDiamondObj(bd, time) {
  if (bd.collected) return;
  const screenX = bd.x - cameraX;
  if (screenX < -30 || screenX > W + 30) return;

  const bob = Math.sin(time * 0.003 + bd.anim) * 6;
  const pulse = 0.9 + Math.sin(time * 0.005 + bd.anim) * 0.1;

  ctx.save();
  ctx.translate(screenX, bd.y + bob);
  ctx.scale(pulse, pulse);

  const sz = 13;
  ctx.shadowColor = COL.blue;
  ctx.shadowBlur = 18;

  ctx.beginPath();
  ctx.moveTo(0, -sz);
  ctx.lineTo(sz, 0);
  ctx.lineTo(0, sz);
  ctx.lineTo(-sz, 0);
  ctx.closePath();

  const grad = ctx.createLinearGradient(-sz, -sz, sz, sz);
  grad.addColorStop(0, '#3B82F6');
  grad.addColorStop(1, '#60A5FA');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = '#93C5FD';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── UPDATE PLAYER ─────────────────────────────────────────────
function jump() {
  if (state === STATE.MENU) {
    startGame();
    return;
  }
  if (state === STATE.DEAD) {
    if (deathTimer > 0.8) startGame();
    return;
  }
  if (state === STATE.LEVEL_COMPLETE) {
    nextLevel();
    return;
  }
  if (player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    jumpCount++;
    // Jump particles
    for (let i = 0; i < 6; i++) {
      spawnParticle(PLAYER_X, player.y + player.size/2, COL.cyan, rand(-2, 2), rand(1, 3), rand(0.2, 0.4), rand(2, 4), 0);
    }
  }
}

function updatePlayer(dt) {
  if (state !== STATE.PLAYING) return;

  // Gravity
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;

  // Ground collision
  const groundLevel = GROUND_Y - player.size / 2;
  let onPlatform = false;

  // Check platform collisions (only when falling)
  if (player.vy >= 0) {
    for (const p of platforms) {
      const px = PLAYER_X + cameraX;
      const pLeft = p.x;
      const pRight = p.x + p.w;
      const pTop = p.y - p.h;

      if (px + player.size/2 > pLeft + 4 && px - player.size/2 < pRight - 4) {
        const playerBottom = player.y + player.size / 2;
        const prevBottom = playerBottom - player.vy * dt;
        if (prevBottom <= pTop + 2 && playerBottom >= pTop) {
          player.y = pTop - player.size / 2;
          player.vy = 0;
          player.onGround = true;
          onPlatform = true;
          break;
        }
      }
    }
  }

  if (!onPlatform) {
    if (player.y + player.size / 2 >= GROUND_Y) {
      player.y = groundLevel;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }
  }

  // Rotation — spin in air (GD style)
  if (!player.onGround) {
    player.rotation += 6 * dt; // rotate while airborne
  } else {
    // Snap to nearest 90 degrees
    const target = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
    player.rotation = lerp(player.rotation, target, 0.3);
  }

  // Invincibility timer
  if (invincTimer > 0) invincTimer -= dt;
  if (hitFlashTimer > 0) hitFlashTimer -= dt;

  // Super boost timer
  if (superBoostTimer > 0) {
    superBoostTimer -= dt;
    if (superBoostTimer <= 0) {
      superBoostTimer = 0;
    }
  }

  // Jackpot timer
  if (jackpotTimer > 0) {
    jackpotTimer -= dt;
    jackpotScoreAnim = Math.min(10000, jackpotScoreAnim + dt * 8000);
  }

  // Level up flash
  if (levelUpFlash > 0) levelUpFlash -= dt;

  // Blue diamond HUD flash
  if (blueDiamondHudFlash > 0) blueDiamondHudFlash -= dt;
}

// ─── COLLISION DETECTION ───────────────────────────────────────
function checkCollisions() {
  if (state !== STATE.PLAYING) return;

  const px = PLAYER_X + cameraX; // world X
  const py = player.y;
  const ps = player.size * 0.4; // hitbox radius

  // Spike collisions
  for (const obs of obstacles) {
    if (obs.hit) continue;
    const screenDist = obs.x - px;
    if (Math.abs(screenDist) > 60) continue;

    // Triangle hitbox approximation
    const dx = Math.abs(px - obs.x);
    const dy = (py + ps) - (obs.y - obs.h);
    if (dx < obs.w * 0.35 && dy > 0 && py + ps > obs.y - obs.h && py - ps < obs.y) {
      if (superBoostTimer > 0) {
        obs.hit = true;
        spawnBurst(obs.x - cameraX, obs.y - obs.h/2, COL.gold, 15, 4, 0.5, 4);
        score += 50;
        continue;
      }
      if (invincTimer <= 0) {
        obs.hit = true;
        takeDamage(obs.x - cameraX, py);
      }
    }
  }

  // Diamond collection
  for (const d of diamonds) {
    if (d.collected) continue;
    const dx = Math.abs(px - d.x);
    const dy = Math.abs(py - d.y);
    if (dx < 28 && dy < 28) {
      d.collected = true;
      diamondsCollected++;
      score += 100;
      totalCoins++;
      spawnBurst(d.x - cameraX, d.y, COL.green, 12, 4, 0.5, 4);
      addFloatingText(d.x - cameraX, d.y - 20, '+100', COL.green, 12);

      // Level up check
      if (diamondsCollected % DIAMONDS_PER_LEVEL === 0) {
        level++;
        levelUpFlash = 1.5;
        scrollSpeed = Math.min(maxSpeed, baseSpeed + (level - 1) * 30);
        screenFlash = 0.5;
        screenFlashColor = getEnv().edge;
        spawnBurst(PLAYER_X, py, getEnv().edge, 40, 6, 0.8, 5);
        addFloatingText(W/2, H/2 - 40, 'LEVEL ' + level + '!', COL.white, 18);
      }
    }
  }

  // Gold coin collection
  for (const gc of goldCoins) {
    if (gc.collected) continue;
    const dx = Math.abs(px - gc.x);
    const dy = Math.abs(py - gc.y);
    if (dx < 28 && dy < 28) {
      gc.collected = true;
      goldCoinsCollected++;
      spawnBurst(gc.x - cameraX, gc.y, COL.gold, 15, 5, 0.6, 5);
      addFloatingText(gc.x - cameraX, gc.y - 20, '★ GOLD!', COL.gold, 14);

      if (goldCoinsCollected >= 3) {
        // JACKPOT!
        goldCoinsCollected = 0;
        jackpotTimer = 2.5;
        jackpotScoreAnim = 0;
        totalJackpots++;
        score += 10000;
        screenFlash = 0.8;
        screenFlashColor = COL.gold;
        shakeDur = 0.5;
        spawnBurst(W/2, H/2, COL.gold, 80, 8, 1.2, 7);
        addFloatingText(W/2, H/3, '★ JACKPOT +10,000! ★', COL.gold, 20);
      }
    }
  }

  // Blue diamond collection
  for (const bd of blueDiamonds) {
    if (bd.collected) continue;
    const dx = Math.abs(px - bd.x);
    const dy = Math.abs(py - bd.y);
    if (dx < 28 && dy < 28) {
      bd.collected = true;
      blueDiamondsCollected++;
      blueDiamondHudFlash = 0.5;
      spawnBurst(bd.x - cameraX, bd.y, COL.blue, 12, 4, 0.5, 4);
      addFloatingText(bd.x - cameraX, bd.y - 20, '◆ BOOST', COL.blue, 12);

      if (blueDiamondsCollected >= 3) {
        // SUPER BOOST!
        blueDiamondsCollected = 0;
        superBoostTimer = 5;
        totalSuperBoosts++;
        screenFlash = 0.6;
        screenFlashColor = COL.blue;
        shakeDur = 0.3;
        spawnBurst(PLAYER_X, py, COL.blue, 50, 6, 1.0, 6);
        spawnBurst(PLAYER_X, py, COL.gold, 30, 5, 0.8, 4);
        addFloatingText(W/2, H/3, '⚡ SUPER BOOST! ⚡', COL.gold, 18);
      }
    }
  }
}

function takeDamage(x, y) {
  health--;
  invincTimer = 1.5;
  hitFlashTimer = 0.3;
  shakeDur = 0.4;
  screenFlash = 0.3;
  screenFlashColor = '#FF4444';

  // Smoke puffs
  for (let i = 0; i < 5; i++) {
    damageSmoke.push({
      x: PLAYER_X + rand(-15, 15), y: player.y + rand(-15, 15),
      size: rand(4, 10), life: rand(0.5, 1.0), maxLife: 1.0,
    });
  }
  spawnBurst(x, y, '#FF4444', 20, 5, 0.5, 4);

  if (health <= 0) {
    die();
  } else {
    addFloatingText(PLAYER_X, player.y - 40, '-1 ❤', '#FF4444', 14);
  }
}

function die() {
  state = STATE.DEAD;
  deathTimer = 0;
  spawnDeathExplosion(PLAYER_X, player.y);
  shakeDur = 0.6;
  screenFlash = 0.5;
  screenFlashColor = '#FF2222';

  // Save scores
  if (score > highScore) {
    highScore = Math.floor(score);
    localStorage.setItem('wr_gd_highscore', highScore);
  }
  localStorage.setItem('wr_gd_coins', totalCoins);
  attempt++;
  localStorage.setItem('wr_gd_attempt', attempt);
}

// ─── GAME LIFECYCLE ────────────────────────────────────────────
function startGame() {
  state = STATE.PLAYING;
  score = 0;
  distance = 0;
  levelDistance = 0;
  health = 3;
  invincTimer = 0;
  hitFlashTimer = 0;
  diamondsCollected = 0;
  goldCoinsCollected = 0;
  blueDiamondsCollected = 0;
  superBoostTimer = 0;
  jackpotTimer = 0;
  totalJackpots = 0;
  totalSuperBoosts = 0;
  level = 1;
  levelUpFlash = 0;
  jumpCount = 0;
  scrollSpeed = baseSpeed;
  cameraX = 0;
  spawnX = 0;
  player.y = GROUND_Y - PLAYER_SIZE / 2;
  player.vy = 0;
  player.onGround = true;
  player.rotation = 0;
  player.trail = [];
  obstacles = [];
  platforms = [];
  diamonds = [];
  goldCoins = [];
  blueDiamonds = [];
  particles = [];
  deathParticles = [];
  damageSmoke = [];
  floatingTexts = [];
  shakeX = 0; shakeY = 0; shakeDur = 0;
  screenFlash = 0;
  deathTimer = 0;
  blueDiamondHudFlash = 0;
  runStartTime = performance.now();
  ensureWorldGenerated();
}

function nextLevel() {
  level++;
  levelDistance = 0;
  state = STATE.PLAYING;
  scrollSpeed = Math.min(maxSpeed, baseSpeed + (level - 1) * 30);
  levelUpFlash = 1.5;
}

// ─── UPDATE ────────────────────────────────────────────────────
function update(dt) {
  if (state === STATE.DEAD) {
    deathTimer += dt;
    updateParticles(dt);
    updateFloatingTexts(dt);
    if (shakeDur > 0) {
      shakeDur -= dt;
      shakeX = rand(-6, 6) * (shakeDur / 0.6);
      shakeY = rand(-6, 6) * (shakeDur / 0.6);
    } else { shakeX = 0; shakeY = 0; }
    if (screenFlash > 0) screenFlash -= dt * 2;
    return;
  }

  if (state !== STATE.PLAYING) return;

  // Scroll world
  const effSpeed = superBoostTimer > 0 ? scrollSpeed * 1.4 : scrollSpeed;
  cameraX += effSpeed * dt;
  distance += effSpeed * dt;
  levelDistance += effSpeed * dt;
  score += effSpeed * dt * 0.05;

  // Progressive speed ramp
  scrollSpeed = Math.min(maxSpeed, baseSpeed + distance * 0.008 + (level - 1) * 25);

  ensureWorldGenerated();
  updatePlayer(dt);
  checkCollisions();
  updateParticles(dt);
  updateFloatingTexts(dt);

  // Clean up passed objects
  const cleanX = cameraX - 200;
  obstacles = obstacles.filter(o => o.x > cleanX);
  platforms = platforms.filter(p => p.x + p.w > cleanX);
  diamonds = diamonds.filter(d => d.x > cleanX || !d.collected);
  goldCoins = goldCoins.filter(g => g.x > cleanX || !g.collected);
  blueDiamonds = blueDiamonds.filter(b => b.x > cleanX || !b.collected);

  // Screen shake
  if (shakeDur > 0) {
    shakeDur -= dt;
    shakeX = rand(-8, 8) * (shakeDur / 0.5);
    shakeY = rand(-8, 8) * (shakeDur / 0.5);
  } else { shakeX = 0; shakeY = 0; }

  if (screenFlash > 0) screenFlash -= dt * 2;

  // Ground-line trail particles
  if (Math.random() < 0.3) {
    const env = getEnv();
    spawnParticle(PLAYER_X - player.size/2, GROUND_Y, env.ground, rand(-1, -3), rand(-0.5, -2), rand(0.15, 0.35), rand(1, 3), 0);
  }
}

// ─── HUD (Geometry Dash style) ─────────────────────────────────
function drawHUD() {
  const pad = 12;
  const env = getEnv();

  // ── Progress bar at top ──
  const barH = 5;
  const barY = pad;
  const progress = clamp(levelDistance / LEVEL_LENGTH, 0, 1);

  // Track
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(W * 0.15, barY, W * 0.7, barH);

  // Fill
  const barGrad = ctx.createLinearGradient(W * 0.15, 0, W * 0.15 + W * 0.7 * progress, 0);
  barGrad.addColorStop(0, COL.green);
  barGrad.addColorStop(1, COL.greenGlow);
  ctx.fillStyle = barGrad;
  ctx.shadowColor = COL.green;
  ctx.shadowBlur = 6;
  ctx.fillRect(W * 0.15, barY, W * 0.7 * progress, barH);
  ctx.shadowBlur = 0;

  // Progress %
  ctx.font = arcadeFont(9);
  ctx.fillStyle = COL.white;
  ctx.textAlign = 'right';
  ctx.fillText(Math.floor(progress * 100) + '%', W * 0.15 + W * 0.7 + 40, barY + barH + 1);

  // ── Score badge (top-left pill) ──
  const badgeX = pad + 8;
  const badgeY = pad + 20;
  const scoreStr = Math.floor(score).toLocaleString();

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(badgeX, badgeY, 160, 30, 15);
  ctx.fill();

  ctx.font = arcadeFont(10);
  ctx.fillStyle = COL.gold;
  ctx.textAlign = 'left';
  ctx.fillText('★ ' + scoreStr, badgeX + 12, badgeY + 20);

  // ── Level indicator ──
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(badgeX, badgeY + 38, 90, 26, 13);
  ctx.fill();
  ctx.font = arcadeFont(8);
  ctx.fillStyle = env.edge;
  ctx.fillText('LV ' + level, badgeX + 12, badgeY + 56);

  // ── Health hearts (top-right) ──
  const heartX = W - pad - 10;
  const heartY = pad + 32;
  ctx.font = arcadeFont(14);
  ctx.textAlign = 'right';
  for (let i = 0; i < 3; i++) {
    const hx = heartX - (2 - i) * 28;
    if (i < health) {
      ctx.fillStyle = '#FF4444';
      ctx.shadowColor = '#FF4444';
      ctx.shadowBlur = 8;
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.shadowBlur = 0;
    }
    ctx.fillText('♥', hx, heartY);
  }
  ctx.shadowBlur = 0;

  // ── Diamond counter ──
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(W - pad - 120, heartY + 14, 120, 26, 13);
  ctx.fill();
  ctx.font = arcadeFont(8);
  ctx.fillStyle = COL.green;
  ctx.textAlign = 'right';
  ctx.fillText('◆ ' + diamondsCollected + ' / ' + (level * DIAMONDS_PER_LEVEL), W - pad - 14, heartY + 34);

  // ── Gold coin counter ──
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(W - pad - 80, heartY + 46, 80, 24, 12);
  ctx.fill();
  ctx.font = arcadeFont(8);
  ctx.fillStyle = COL.gold;
  ctx.fillText('★ ' + goldCoinsCollected + '/3', W - pad - 14, heartY + 64);

  // ── Super Boost diamond slots (left side) ──
  const slotX = pad + 10;
  const slotY = H - 55;
  for (let i = 0; i < 3; i++) {
    const sx = slotX + i * 32;
    const filled = i < blueDiamondsCollected;

    // Stencil diamond slot
    ctx.beginPath();
    ctx.moveTo(sx + 10, slotY - 12);
    ctx.lineTo(sx + 22, slotY);
    ctx.lineTo(sx + 10, slotY + 12);
    ctx.lineTo(sx - 2, slotY);
    ctx.closePath();

    if (filled) {
      ctx.fillStyle = COL.blue;
      ctx.shadowColor = COL.blue;
      ctx.shadowBlur = 10;
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(59, 130, 246, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  if (blueDiamondHudFlash > 0) {
    ctx.globalAlpha = blueDiamondHudFlash;
    ctx.fillStyle = COL.blue;
    ctx.fillRect(slotX - 5, slotY - 18, 100, 36);
    ctx.globalAlpha = 1;
  }

  // Super boost active indicator
  if (superBoostTimer > 0) {
    const pulse = 0.7 + Math.sin(performance.now() * 0.01) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.font = arcadeFont(10);
    ctx.fillStyle = COL.gold;
    ctx.textAlign = 'left';
    ctx.shadowColor = COL.gold;
    ctx.shadowBlur = 10;
    ctx.fillText('⚡ BOOST ' + superBoostTimer.toFixed(1) + 's', slotX, slotY + 30);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ── Jackpot celebration overlay ──
  if (jackpotTimer > 0) {
    const pulse = 0.5 + Math.sin(performance.now() * 0.015) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.font = arcadeFont(22);
    ctx.fillStyle = COL.gold;
    ctx.textAlign = 'center';
    ctx.shadowColor = COL.gold;
    ctx.shadowBlur = 20;
    ctx.fillText('★ JACKPOT! ★', W/2, H/2 - 20);
    ctx.font = arcadeFont(16);
    ctx.fillText('+' + Math.floor(jackpotScoreAnim).toLocaleString(), W/2, H/2 + 20);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ── Level up flash ──
  if (levelUpFlash > 0) {
    const alpha = levelUpFlash > 1 ? 1 : levelUpFlash;
    ctx.globalAlpha = alpha * 0.8;
    ctx.font = arcadeFont(24);
    ctx.fillStyle = env.edge;
    ctx.textAlign = 'center';
    ctx.shadowColor = env.edge;
    ctx.shadowBlur = 20;
    ctx.fillText('LEVEL ' + level, W/2, H * 0.35);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ── Hit flash ──
  if (hitFlashTimer > 0) {
    ctx.globalAlpha = hitFlashTimer * 0.4;
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

// ─── MENU SCREEN ───────────────────────────────────────────────
function drawMenuScreen() {
  const time = performance.now();

  // Dim overlay
  ctx.fillStyle = 'rgba(5, 10, 25, 0.6)';
  ctx.fillRect(0, 0, W, H);

  // Title
  const titleY = H * 0.28;
  const pulse = 1 + Math.sin(time * 0.003) * 0.03;

  ctx.save();
  ctx.translate(W/2, titleY);
  ctx.scale(pulse, pulse);

  // Title glow
  ctx.shadowColor = COL.purple;
  ctx.shadowBlur = 30;
  ctx.font = arcadeFont(Math.min(36, W * 0.045));
  ctx.fillStyle = COL.white;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('WISH RUNNER', 0, 0);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.font = arcadeFont(Math.min(12, W * 0.016));
  ctx.fillStyle = COL.cyan;
  ctx.fillText('GEOMETRY DASH × COSMIC', 0, 36);
  ctx.restore();

  // Level name
  ctx.font = arcadeFont(Math.min(14, W * 0.02));
  ctx.fillStyle = getEnv().edge;
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + level + ' — COSMIC RUN', W/2, titleY + 70);

  // Big green play button (GD style)
  const btnR = Math.min(55, W * 0.06);
  const btnY = H * 0.55;
  const btnPulse = 1 + Math.sin(time * 0.004) * 0.05;

  ctx.save();
  ctx.translate(W/2, btnY);
  ctx.scale(btnPulse, btnPulse);

  // White outline ring
  ctx.strokeStyle = COL.white;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, 0, btnR + 8, 0, Math.PI * 2);
  ctx.stroke();

  // Green circle
  ctx.shadowColor = COL.green;
  ctx.shadowBlur = 25;
  ctx.fillStyle = COL.green;
  ctx.beginPath();
  ctx.arc(0, 0, btnR, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Darker green border
  ctx.strokeStyle = COL.greenDark;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Play triangle
  ctx.fillStyle = COL.white;
  ctx.beginPath();
  ctx.moveTo(-btnR * 0.25, -btnR * 0.35);
  ctx.lineTo(-btnR * 0.25, btnR * 0.35);
  ctx.lineTo(btnR * 0.35, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // Tap to play text
  ctx.font = arcadeFont(Math.min(10, W * 0.014));
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign = 'center';
  ctx.fillText('TAP ANYWHERE TO PLAY', W/2, btnY + btnR + 35);

  // Attempt counter
  ctx.font = arcadeFont(Math.min(10, W * 0.014));
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('ATTEMPT ' + attempt, W/2, H * 0.82);

  // High score
  if (highScore > 0) {
    ctx.font = arcadeFont(Math.min(10, W * 0.014));
    ctx.fillStyle = COL.gold;
    ctx.fillText('★ BEST: ' + highScore.toLocaleString(), W/2, H * 0.88);
  }
}

// ─── DEATH SCREEN (GD STYLE) ──────────────────────────────────
function drawGameOverScreen() {
  if (deathTimer < 0.3) return; // wait for explosion

  const revealT = clamp((deathTimer - 0.3) / 0.8, 0, 1);
  const alpha = easeOutCubic(revealT);

  // Dark overlay
  ctx.fillStyle = `rgba(5, 10, 20, ${alpha * 0.75})`;
  ctx.fillRect(0, 0, W, H);

  if (revealT < 0.1) return;

  ctx.globalAlpha = alpha;

  // Panel
  const panelW = Math.min(420, W * 0.7);
  const panelH = Math.min(320, H * 0.65);
  const panelX = (W - panelW) / 2;
  const panelY = (H - panelH) / 2;

  ctx.fillStyle = 'rgba(15, 25, 50, 0.95)';
  ctx.beginPath();
  ctx.roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(100, 150, 255, 0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Level name
  ctx.font = arcadeFont(Math.min(14, W * 0.02));
  ctx.fillStyle = getEnv().edge;
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + level, W/2, panelY + 35);

  // Stats
  const statY = panelY + 65;
  const statGap = 30;
  ctx.font = arcadeFont(Math.min(10, W * 0.014));
  ctx.textAlign = 'left';
  const statX = panelX + 30;

  const elapsedSec = ((performance.now() - runStartTime) / 1000).toFixed(1);
  const progress = clamp(levelDistance / LEVEL_LENGTH * 100, 0, 100).toFixed(0);

  const stats = [
    ['ATTEMPT', '' + attempt],
    ['SCORE', Math.floor(score).toLocaleString()],
    ['JUMPS', '' + jumpCount],
    ['TIME', elapsedSec + 's'],
    ['PROGRESS', progress + '%'],
    ['DIAMONDS', '' + diamondsCollected],
  ];

  for (let i = 0; i < stats.length; i++) {
    const sy = statY + i * statGap;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textAlign = 'left';
    ctx.fillText(stats[i][0], statX, sy);
    ctx.fillStyle = COL.white;
    ctx.textAlign = 'right';
    ctx.fillText(stats[i][1], panelX + panelW - 30, sy);
  }

  // New high score
  if (Math.floor(score) >= highScore && score > 0) {
    ctx.font = arcadeFont(Math.min(12, W * 0.016));
    ctx.fillStyle = COL.gold;
    ctx.textAlign = 'center';
    ctx.shadowColor = COL.gold;
    ctx.shadowBlur = 12;
    ctx.fillText('★ NEW BEST! ★', W/2, panelY + panelH - 65);
    ctx.shadowBlur = 0;
  }

  // Replay button (green circle with arrow, GD style)
  if (deathTimer > 1.0) {
    const btnR = Math.min(30, W * 0.04);
    const btnY2 = panelY + panelH - 28;
    const time2 = performance.now();
    const btnPulse = 1 + Math.sin(time2 * 0.004) * 0.05;

    ctx.save();
    ctx.translate(W/2, btnY2);
    ctx.scale(btnPulse, btnPulse);

    // White ring
    ctx.strokeStyle = COL.white;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, btnR + 6, 0, Math.PI * 2);
    ctx.stroke();

    // Green fill
    ctx.shadowColor = COL.green;
    ctx.shadowBlur = 15;
    ctx.fillStyle = COL.green;
    ctx.beginPath();
    ctx.arc(0, 0, btnR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = COL.greenDark;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Replay arrow
    ctx.fillStyle = COL.white;
    ctx.strokeStyle = COL.white;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, btnR * 0.4, -0.8, Math.PI * 1.5, false);
    ctx.stroke();
    // Arrow tip
    ctx.beginPath();
    ctx.moveTo(btnR * 0.15, -btnR * 0.5);
    ctx.lineTo(btnR * 0.45, -btnR * 0.25);
    ctx.lineTo(btnR * 0.05, -btnR * 0.15);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  ctx.globalAlpha = 1;
}

// ─── DRAW ──────────────────────────────────────────────────────
function draw() {
  const time = performance.now();
  ctx.clearRect(0, 0, W, H);

  drawBackground(time);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawGround();

  // Draw platforms
  for (const p of platforms) drawPlatform(p);

  // Draw obstacles (spikes)
  for (const obs of obstacles) {
    drawSpike(obs.x, obs.y, obs.w, obs.h, obs.hit);
  }

  // Draw collectibles
  for (const d of diamonds) drawDiamond(d, time);
  for (const gc of goldCoins) drawGoldCoinObj(gc, time);
  for (const bd of blueDiamonds) drawBlueDiamondObj(bd, time);

  // Draw player
  if (state === STATE.PLAYING || state === STATE.DEAD) drawPlayer();

  drawParticles();
  drawFloatingTexts();

  ctx.restore();

  // Screen flash overlay
  if (screenFlash > 0) {
    ctx.globalAlpha = screenFlash * 0.35;
    ctx.fillStyle = screenFlashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (state === STATE.PLAYING) drawHUD();
  if (state === STATE.MENU) drawMenuScreen();
  if (state === STATE.DEAD) drawGameOverScreen();
}

// ─── GAME LOOP ─────────────────────────────────────────────────
function loop(time) {
  requestAnimationFrame(loop);
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  update(dt);
  draw();
}

// ─── INPUT ─────────────────────────────────────────────────────
function handleInput(e) {
  e.preventDefault();
  jump();
}

canvas.addEventListener('touchstart', handleInput, { passive: false });
canvas.addEventListener('mousedown', handleInput);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    jump();
  }
});

// Prevent scroll / zoom
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// ─── INIT ──────────────────────────────────────────────────────
resize();
lastTime = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
