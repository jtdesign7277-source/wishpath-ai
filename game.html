const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const isP = window.innerWidth < window.innerHeight && window.innerWidth < 900;
  W = isP ? window.innerHeight : window.innerWidth;
  H = isP ? window.innerWidth : window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = (isP ? window.innerHeight : W) + 'px';
  canvas.style.height = (isP ? window.innerWidth : H) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SHIP_X = W * 0.18;
}
let SHIP_X = 0;

// ─── HELPERS ───────────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t}
function rand(a,b){return Math.random()*(b-a)+a}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function arcadeFont(sz){return `${sz}px 'Press Start 2P', monospace`}
function hexToRgba(hex,a){const c=hex.replace('#','');return `rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`}

// ─── AUDIO ENGINE (Web Audio API — laser SFX) ─────────────────
let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playLaserSound(pitch){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    const osc=ac.createOscillator();const gain=ac.createGain();const filter=ac.createBiquadFilter();
    osc.type='sawtooth';osc.frequency.setValueAtTime(800+pitch*200,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200+pitch*80,ac.currentTime+0.08);
    filter.type='lowpass';filter.frequency.setValueAtTime(3000,ac.currentTime);
    filter.frequency.exponentialRampToValueAtTime(400,ac.currentTime+0.1);
    gain.gain.setValueAtTime(0.08,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.1);
    osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.12);
  }catch(e){}
}
function playHitSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    const osc=ac.createOscillator();const gain=ac.createGain();
    osc.type='square';osc.frequency.setValueAtTime(150,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40,ac.currentTime+0.15);
    gain.gain.setValueAtTime(0.1,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);
    osc.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.18);
  }catch(e){}
}
function playExplosionSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime;
    // Layer 1: deep bass thump
    const osc=ac.createOscillator();const og=ac.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(120,t);
    osc.frequency.exponentialRampToValueAtTime(30,t+0.4);
    og.gain.setValueAtTime(0.25,t);og.gain.linearRampToValueAtTime(0.3,t+0.02);
    og.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    osc.connect(og);og.connect(ac.destination);
    osc.start(t);osc.stop(t+0.55);
    // Layer 2: noise burst (the boom)
    const bufSize=Math.floor(ac.sampleRate*0.6);const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++){const env=Math.pow(1-i/bufSize,3);data[i]=(Math.random()*2-1)*env;}
    const src=ac.createBufferSource();src.buffer=buf;
    const ng=ac.createGain();ng.gain.setValueAtTime(0.01,t);
    ng.gain.linearRampToValueAtTime(0.22,t+0.01);
    ng.gain.exponentialRampToValueAtTime(0.001,t+0.55);
    const lp=ac.createBiquadFilter();lp.type='lowpass';
    lp.frequency.setValueAtTime(2400,t);lp.frequency.exponentialRampToValueAtTime(300,t+0.4);
    src.connect(lp);lp.connect(ng);ng.connect(ac.destination);src.start(t);
    // Layer 3: mid crackle
    const o2=ac.createOscillator();const g2=ac.createGain();
    o2.type='sawtooth';o2.frequency.setValueAtTime(200,t);
    o2.frequency.exponentialRampToValueAtTime(50,t+0.3);
    g2.gain.setValueAtTime(0.08,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=400;bp.Q.value=2;
    o2.connect(bp);bp.connect(g2);g2.connect(ac.destination);
    o2.start(t);o2.stop(t+0.4);
  }catch(e){}
}
function playNukeSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    // Deep bass rumble
    const osc=ac.createOscillator();const gain=ac.createGain();
    osc.type='sawtooth';osc.frequency.setValueAtTime(60,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20,ac.currentTime+1.2);
    gain.gain.setValueAtTime(0.2,ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.25,ac.currentTime+0.1);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+1.5);
    const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=200;
    osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+1.6);
    // White noise blast
    const bufSize=ac.sampleRate*0.8;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
    const data=buf.getChannelData(0);for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,1.5);
    const src=ac.createBufferSource();src.buffer=buf;
    const g2=ac.createGain();g2.gain.setValueAtTime(0.01,ac.currentTime);
    g2.gain.linearRampToValueAtTime(0.2,ac.currentTime+0.05);
    g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.8);
    src.connect(g2);g2.connect(ac.destination);src.start(ac.currentTime);
  }catch(e){}
}

}

    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.25);

}
function playLaserBeamSound(){
  try{
    const ac=getAudioCtx();if(ac.state==='suspended')ac.resume();
    // Screaming descending sweep
    const osc=ac.createOscillator();const gain=ac.createGain();
    osc.type='sawtooth';osc.frequency.setValueAtTime(1800,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200,ac.currentTime+0.8);
    gain.gain.setValueAtTime(0.12,ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.18,ac.currentTime+0.05);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.85);
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=4;
    osc.connect(bp);bp.connect(gain);gain.connect(ac.destination);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.9);
  }catch(e){}
}

// Grenade fire — spawns 3 grenades in a spread, one charge consumed
function fireGrenade(){
  if(grenadeCharges<=0)return false;
  grenadeCharges--;
  const bx=SHIP_X+cameraX+SHIP_W, by=ship.y;
  const spread=[{dy:-14,vy:-110},{dy:0,vy:0},{dy:14,vy:110}];
  for(const s of spread){
    grenades.push({x:bx,y:by+s.dy,vx:GRENADE_SPEED,vy:s.vy,r:12,life:1.6,rot:0,dead:false});
  }
  playGrenadeFireSound();
  shakeDur=Math.max(shakeDur,0.2);
  spawnOrbBurst(bx-cameraX,by,['#84CC16','#FDE047','#FFF'],18,6);
  addFloatingText(W/2,H/2-40,'💣 GRENADE BARRAGE!','#84CC16',20);
  return true;
}

// Explode a single grenade — splash damage in radius
function explodeGrenade(g){
  if(g.dead)return;
  g.dead=true;
  const gx=g.x-cameraX, gy=g.y;
  // Visual burst
  for(let i=0;i<60;i++){const a=rand(0,Math.PI*2),spd=rand(3,14);
    spawnP(gx,gy,['#FDE047','#FF4500','#FFF','#84CC16','#F97316'][randInt(0,4)],Math.cos(a)*spd,Math.sin(a)*spd,rand(0.3,0.9),rand(3,10),0.02);}
  shakeDur=Math.max(shakeDur,0.3);
  screenFlash=Math.max(screenFlash,0.25);screenFlashColor='#F97316';
  playExplosionSound&&playExplosionSound();
  // Splash damage to all enemies within radius
  for(const e of enemies){
    if(e.dead||e.shieldOn)continue;
    const ex=e.x-cameraX;
    const dx=ex-gx, dy=e.y-gy, d=Math.sqrt(dx*dx+dy*dy);
    if(d<GRENADE_SPLASH_R){
      const dmg=d<60?5:d<100?3:2;
      e.hp-=dmg;
      if(e.hp<=0){
        e.dead=true;
        const pts=e.type.pts*comboMultiplier;score+=pts;
        comboMultiplier=Math.min(comboMultiplier+1,8);comboTimer=2;
        spawnOrbBurst(ex,e.y,[e.type.color,'#FDE047','#FFF'],40,8);
        addFloatingText(ex,e.y-26,'💥 +'+pts.toLocaleString(),'#84CC16',16);
      } else {
        spawnOrbBurst(ex,e.y,['#FDE047','#FFF'],12,3);
      }
    }
  }
  // Also damage enemy lasers and homing missiles in radius (clears the board a bit)
  for(const el of enemyLasers){
    if(el.dead)continue;
    const dx=(el.x-cameraX)-gx, dy=el.y-gy;
    if(dx*dx+dy*dy<GRENADE_SPLASH_R*GRENADE_SPLASH_R)el.dead=true;
  }
  for(const m of homingMissiles){
    if(m.dead)continue;
    const dx=(m.x-cameraX)-gx, dy=m.y-gy;
    if(dx*dx+dy*dy<GRENADE_SPLASH_R*GRENADE_SPLASH_R)m.dead=true;
  }
}

// Laser fire — activates giant horizontal beam for LASER_DURATION
function fireLaser(){
  if(laserCharges<=0||laserActive)return false;
  laserCharges--;
  laserActive=true;laserTimer=LASER_DURATION;laserPhase=0;
  playLaserBeamSound();
  shakeDur=Math.max(shakeDur,0.4);
  screenFlash=Math.max(screenFlash,0.35);screenFlashColor='#22D3EE';
  addFloatingText(W/2,H/2-40,'⚡ MEGA LASER!','#22D3EE',22);
  return true;
}

// Nuke fire — extracted for reuse by both touch and mouse handlers
function fireNuke(){
  if(nukeCharges<=0||nukeActive)return false;
  nukeCharges--;nukeActive=true;nukeTimer=NUKE_DURATION;nukeFlashPhase=0;
  playNukeSound();
  shakeDur=Math.max(shakeDur,1.0);shakeX=rand(-15,15);shakeY=rand(-15,15);
  screenFlash=Math.max(screenFlash,0.8);screenFlashColor='#FF4400';
  const cx=W/2,cy=H/2;
  for(let i=0;i<200;i++){const a=rand(0,Math.PI*2),spd=rand(4,25);
    spawnP(cx,cy,['#FF4500','#FDE047','#FFF','#FF8800','#FF2200'][randInt(0,4)],Math.cos(a)*spd,Math.sin(a)*spd,rand(0.5,1.5),rand(3,12),0.02);}
  addFloatingText(W/2,H/2-40,'☢ NUCLEAR BLAST! ☢','#FDE047',26);
  return true;
}

function drawBackground(time){
  const theme=getTheme();
  const heat=clamp(distance/20000,0,0.4);

  // Sky gradient
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,theme.bg1);sg.addColorStop(1,theme.bg2);
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  // Heat overlay
  if(heat>0.02){
    ctx.globalAlpha=heat*0.25;
    const hg=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.7);
    hg.addColorStop(0,'rgba(255,80,20,0.12)');hg.addColorStop(1,'transparent');
    ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }

  // Nebulae
  for(const n of nebulae){
    const nx=((n.x-cameraX*n.speed)%W+W)%W;
    const ng=ctx.createRadialGradient(nx,n.y,0,nx,n.y,Math.max(n.rx,n.ry));
    ng.addColorStop(0,n.color);ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng;
    ctx.beginPath();ctx.ellipse(nx,n.y,n.rx,n.ry,0,0,Math.PI*2);ctx.fill();
  }

  // Perspective grid (depth fog)
  const tileSize=50;
  const offsetX=(cameraX*0.15)%tileSize;
  ctx.strokeStyle=theme.grid;ctx.lineWidth=0.5;
  ctx.beginPath();
  for(let x=-offsetX;x<W+tileSize;x+=tileSize){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=0;y<=H;y+=tileSize){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();

  // Stars (parallax layers)
  for(const s of bgStars){
    const sx=((s.x-cameraX*s.speed)%W+W)%W;
    const tw=Math.sin(time*0.001*s.twinkle+s.offset);
    const a=s.alpha*(0.5+tw*0.5);
    if(a<0.03)continue;
    ctx.globalAlpha=a;ctx.fillStyle=s.color;
    if(s.size>1.5){ctx.shadowColor=s.color;ctx.shadowBlur=s.size*4;}
    ctx.beginPath();ctx.arc(sx,s.y,s.size,0,Math.PI*2);ctx.fill();
    // Cross glow for bright stars
    if(s.size>2.2&&a>0.4){
      ctx.globalAlpha=a*0.25;
      const arm=s.size*4;
      ctx.fillRect(sx-arm,s.y-0.5,arm*2,1);
      ctx.fillRect(sx-0.5,s.y-arm,1,arm*2);
    }
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // Data streams (Matrix/crypto falling numbers)
  for(const ds of dataStreams){
    const dx=((ds.x-cameraX*ds.speed)%W+W)%W;
    ctx.globalAlpha=ds.alpha;ctx.font=`${ds.charH}px monospace`;ctx.fillStyle=ds.color;
    const scrollOff=(time*0.03+ds.offset)%(ds.chars.length*ds.charH+H);
    for(let ci=0;ci<ds.chars.length;ci++){
      const cy=-ds.chars.length*ds.charH+scrollOff+ci*ds.charH;
      if(cy>-20&&cy<H+20){
        const fade=ci===0?0.3:ci===ds.chars.length-1?0.3:1;
        ctx.globalAlpha=ds.alpha*fade;
        ctx.fillText(ds.chars[ci],dx,cy);
      }
    }
  }
  ctx.globalAlpha=1;

  // Scan lines (subtle CRT/holographic)
  ctx.globalAlpha=0.02;ctx.fillStyle='#000';
  for(let y=0;y<H;y+=3){ctx.fillRect(0,y,W,1);}
  ctx.globalAlpha=1;

  // Level warp overlay
  if(levelWarpTimer>0){
    if(levelWarpTimer>1.5){ctx.globalAlpha=(levelWarpTimer-1.5)*2;ctx.fillStyle='#FFF';ctx.fillRect(0,0,W,H);}
    else if(levelWarpTimer>0.5){ctx.globalAlpha=(levelWarpTimer-0.5)*0.3;ctx.fillStyle=theme.edge;ctx.fillRect(0,0,W,H);}
    ctx.globalAlpha=1;
  }
}

// Swap-remove for O(1) particle deletion — GD-style performance
function swapRemove(arr,i){arr[i]=arr[arr.length-1];arr.pop();}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=p.grav*dt*60;p.life-=dt;if(p.life<=0)swapRemove(particles,i);}
  for(let i=deathParticles.length-1;i>=0;i--){const d=deathParticles[i];d.x+=d.vx*dt*60;d.y+=d.vy*dt*60;d.vy+=0.2*dt*60;d.rot+=d.rotV*dt*60;d.life-=dt;if(d.life<=0)swapRemove(deathParticles,i);}
}
function drawParticles(){
  for(const p of particles){const a=clamp(p.life/p.maxLife,0,1),sz=p.size*(0.3+a*0.7);if(sz<0.3)continue;ctx.globalAlpha=a*0.9;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=Math.min(12,sz*2);ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();}
  for(const d of deathParticles){const a=clamp(d.life/d.maxLife,0,1);ctx.globalAlpha=a;ctx.fillStyle=d.color;ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.fillRect(-d.size/2,-d.size/2,d.size,d.size);ctx.restore();}
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

  }
  ctx.globalAlpha=1;
}

function updatePersistentSmoke(dt){
  if(state===STATE.PLAYING&&damageLevel>0){
    // 1st hit: thick gray/white smoke billowing visibly
    if(damageLevel===1){
      if(Math.random()<0.7){persistentSmoke.push({x:SHIP_X-SHIP_W*0.3+rand(-12,12),y:ship.y+rand(-8,8),size:rand(8,16),maxSize:rand(25,45),life:rand(0.6,1.2),maxLife:1.2,vx:rand(-4,-1.5),vy:rand(-2,2),dark:false,fire:false});}
      if(Math.random()<0.3){persistentSmoke.push({x:SHIP_X+rand(-8,8),y:ship.y+rand(-6,6),size:rand(5,10),maxSize:rand(18,30),life:rand(0.4,0.8),maxLife:0.8,vx:rand(-3,-1),vy:rand(-3,-1),dark:false,fire:false});}
    }
    // 2nd hit: heavy BLACK smoke pouring out, impossible to miss
    if(damageLevel>=2){
      if(Math.random()<0.85){persistentSmoke.push({x:SHIP_X-SHIP_W*0.2+rand(-15,15),y:ship.y+rand(-10,10),size:rand(12,22),maxSize:rand(35,60),life:rand(0.7,1.5),maxLife:1.5,vx:rand(-5,-2),vy:rand(-2.5,2.5),dark:true,fire:false});}
      // Fire/ember particles mixed in
      if(Math.random()<0.5){persistentSmoke.push({x:SHIP_X+rand(-12,5),y:ship.y+rand(-8,8),size:rand(4,8),maxSize:rand(8,14),life:rand(0.2,0.5),maxLife:0.5,vx:rand(-6,-2),vy:rand(-3,1),dark:false,fire:true});}
      // Extra thick trailing plume
      if(Math.random()<0.6){persistentSmoke.push({x:SHIP_X-SHIP_W*0.4+rand(-5,5),y:ship.y+rand(-12,12),size:rand(10,18),maxSize:rand(40,65),life:rand(0.8,1.8),maxLife:1.8,vx:rand(-3.5,-1),vy:rand(-1,1),dark:true,fire:false});}
    }
  }
  for(let i=persistentSmoke.length-1;i>=0;i--){const s=persistentSmoke[i];s.x+=s.vx*dt*60;s.y+=s.vy*dt*60;s.vy-=0.02*dt*60;s.size=lerp(s.size,s.maxSize,dt*2);s.life-=dt;if(s.life<=0)swapRemove(persistentSmoke,i);}
}
function drawPersistentSmoke(){
  for(const s of persistentSmoke){
    const a=clamp(s.life/s.maxLife,0,1);
    if(s.fire){
      // Fire particles — bright orange/yellow glow
      ctx.globalAlpha=a*0.8;ctx.fillStyle=Math.random()<0.5?'#FF6600':'#FFAA00';
      ctx.shadowColor='#FF4400';ctx.shadowBlur=s.size*2;
    }else if(s.dark){
      // Heavy black smoke — very opaque
      ctx.globalAlpha=a*0.75;ctx.fillStyle='#1A1A1A';ctx.shadowBlur=0;
    }else{
      // Gray/white smoke — clearly visible
      ctx.globalAlpha=a*0.55;ctx.fillStyle='#AAAAAA';ctx.shadowBlur=0;
    }
    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

// ─── SPARKLE STARS — premium twinkling decoration ──────────────
function spawnSparkle(){
  const colors=['#FFFFFF','#FFF8DC','#FFD700','#FEF08A','#E0F0FF','#D0E8FF'];
  sparkles.push({
    x:rand(0,W),y:rand(0,H),
    size:rand(3,7),
    color:colors[randInt(0,colors.length-1)],
    vx:rand(-8,8),vy:rand(-12,-2),
    life:rand(1.2,2.8),maxLife:0,
    phase:rand(0,Math.PI*2), // twinkle phase offset
    twinkleSpeed:rand(0.003,0.008),
    points:Math.random()<0.5?4:6,
  });
  sparkles[sparkles.length-1].maxLife=sparkles[sparkles.length-1].life;
}
function updateSparkles(dt){
  // Keep 6–10 sparkles alive at all times
  while(sparkles.length<8)spawnSparkle();
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.life<=0)swapRemove(sparkles,i);
  }
}
function drawStarShape(x,y,r,points){
  const step=Math.PI/points;ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const a=i*step-Math.PI/2;const rad=i%2===0?r:r*0.42;
    i===0?ctx.moveTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad):ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);
  }ctx.closePath();
}
function drawSparkles(){
  const time=performance.now();
  for(const s of sparkles){
    const lifeFrac=s.life/s.maxLife;
    // fade in (first 15%) and out (last 30%)
    const fadeIn=lifeFrac>0.85?((1-lifeFrac)/0.15):1;
    const fadeOut=lifeFrac<0.3?(lifeFrac/0.3):1;
    const alpha=fadeIn*fadeOut*(0.55+Math.sin(time*s.twinkleSpeed+s.phase)*0.45);
    if(alpha<=0)continue;
    ctx.save();ctx.globalAlpha=clamp(alpha,0,1);
    ctx.shadowColor=s.color;ctx.shadowBlur=s.size*2.5;
    ctx.fillStyle=s.color;
    drawStarShape(s.x,s.y,s.size,s.points);ctx.fill();
    // Tiny bright center dot
    ctx.shadowBlur=0;ctx.fillStyle='#FFFFFF';ctx.globalAlpha=clamp(alpha*0.8,0,1);
    ctx.beginPath();ctx.arc(s.x,s.y,s.size*0.22,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function addFloatingText(x,y,text,color,size){floatingTexts.push({x,y,text,color,size:size||14,life:1.5,maxLife:1.5});}
function updateFloatingTexts(dt){for(let i=floatingTexts.length-1;i>=0;i--){const ft=floatingTexts[i];ft.y-=50*dt;ft.life-=dt;if(ft.life<=0)swapRemove(floatingTexts,i);}}
function drawFloatingTexts(){for(const ft of floatingTexts){const a=clamp(ft.life/ft.maxLife,0,1),sc=1+(1-a)*0.2;ctx.globalAlpha=a;ctx.save();ctx.translate(ft.x,ft.y);ctx.scale(sc,sc);ctx.font=arcadeFont(ft.size);ctx.fillStyle=ft.color;ctx.textAlign='center';ctx.shadowColor=ft.color;ctx.shadowBlur=15;ctx.fillText(ft.text,0,0);ctx.shadowBlur=0;ctx.restore();}ctx.globalAlpha=1;}

// ─── PATTERN-BASED MAZE WALLS (GD-style learnable sequences) ────
// Patterns create rhythm — groups then gaps, zigzags, tunnels, waves
const WALL_PATTERNS=[
  'straight',   // straight corridor, same gap Y
  'zigzag',     // alternating up-down gaps
  'wave',       // sinusoidal wave motion
  'tunnel',     // tight narrowing corridor
  'scatter',    // random placement (classic)
  'staircase',  // gaps step up or down progressively
];
let currentPattern='scatter',patternWallsLeft=0,patternBaseY=0,patternDir=1,patternStep=0;

function pickNextPattern(){
  const diff=clamp(distance/15000,0,1);
  const pool=diff<0.2?['straight','scatter','wave']:diff<0.5?['straight','zigzag','wave','scatter','staircase']:WALL_PATTERNS;
  currentPattern=pool[randInt(0,pool.length-1)];
  patternWallsLeft=randInt(3,7);patternStep=0;patternDir=Math.random()<0.5?1:-1;
  patternBaseY=H*0.3+rand(0,H*0.4);
}

function generateWalls(){
  const needUpTo=cameraX+W+600;
  const diff=clamp(distance/15000,0,1);
  const ld=(level-1)*0.08;
  while(nextWallX<needUpTo){
    // Pick new pattern when current one is done or on first call
    if(patternWallsLeft<=0){
      pickNextPattern();
      // Breathing room between patterns — GD-style gap
      nextWallX+=rand(180,280);
    }
    const spacing=Math.max(140,280-diff*90-ld*35+rand(-15,15));
    nextWallX+=spacing;
    const gapH=Math.max(75,170-diff*50-ld*20+rand(-8,8));
    const margin=gapH/2+25;

    // Pattern-driven gap Y position
    let gapY;
    switch(currentPattern){
      case 'straight':
        gapY=patternBaseY;break;
      case 'zigzag':
        gapY=patternBaseY+patternDir*(patternStep%2===0?H*0.15:-H*0.15);break;
      case 'wave':
        gapY=H/2+Math.sin(patternStep*0.8)*H*0.25;break;
      case 'tunnel':
        gapY=patternBaseY+patternDir*patternStep*15;break;
      case 'staircase':
        gapY=patternBaseY+patternDir*patternStep*35;break;
      default: // scatter — original random
        gapY=H/2+Math.sin(nextWallX*0.003+level)*H*0.28+rand(-50,50);break;
    }
    gapY=clamp(gapY,margin,H-margin);

    let type=0;
    if(diff>0.3&&Math.random()<0.2+diff*0.15)type=1; // thick wall
    if(diff>0.5&&Math.random()<0.1+diff*0.1)type=2;   // double wall

    walls.push({x:nextWallX,gapY,gapH,passed:false,type,hit:false});
    if(type===2){walls.push({x:nextWallX+55,gapY:clamp(gapY+rand(-40,40),margin,H-margin),gapH:gapH*0.9,passed:false,type:0,hit:false});}

    // Collectibles — placed in gap for rhythm (reward good pathing)
    if(Math.random()<0.55){const rr=Math.random(),dsz=rr<0.4?0.6:rr<0.8?1.0:1.5,dpt=dsz===0.6?500:dsz===1.0?1000:2000;diamonds.push({x:nextWallX+rand(5,35),y:gapY+rand(-gapH*0.2,gapH*0.2),collected:false,anim:rand(0,6.28),dSize:dsz,dPts:dpt});}
    if(Math.random()<0.25){const rr=Math.random(),dsz=rr<0.4?0.6:rr<0.8?1.0:1.5,dpt=dsz===0.6?500:dsz===1.0?1000:2000;diamonds.push({x:nextWallX-spacing*0.5,y:rand(50,H-50),collected:false,anim:rand(0,6.28),dSize:dsz,dPts:dpt});}
    if(Math.random()<0.04)bitcoins.push({x:nextWallX+rand(-15,15),y:gapY,collected:false,anim:rand(0,6.28)});
    if(Math.random()<0.05)blueDiamonds.push({x:nextWallX+rand(5,35),y:gapY+rand(-15,15),collected:false,anim:rand(0,6.28)});
    if(Math.random()<0.035)rocketBoosters.push({x:nextWallX+rand(5,30),y:gapY+rand(-gapH*0.15,gapH*0.15),collected:false,anim:rand(0,6.28)});
    if(Math.random()<0.026)gunOrbPickups.push({x:nextWallX+rand(8,42),y:gapY+rand(-gapH*0.22,gapH*0.22),collected:false,anim:rand(0,6.28)});

    patternWallsLeft--;patternStep++;
  }
}

function drawWalls(time){
  const theme=getTheme();
  const glowPulse=16+Math.sin(time*0.003)*6;
  for(const w of walls){
    const sx=w.x-cameraX;
    if(sx<-80||sx>W+80)continue;
    const wallW=w.type===1?48:30;
    const topH=w.gapY-w.gapH/2;
    const botY=w.gapY+w.gapH/2;
    draw3DWall(sx,0,wallW,topH,theme,w.hit,true);
    draw3DWall(sx,botY,wallW,H-botY,theme,w.hit,false);
    // Neon gap edge glow — thicker, animated pulse
    if(!w.hit){
      // Outer glow pass
      ctx.shadowColor=theme.edge;ctx.shadowBlur=glowPulse+8;ctx.strokeStyle=theme.edge;ctx.lineWidth=1;ctx.globalAlpha=0.4;
      ctx.beginPath();ctx.moveTo(sx,topH);ctx.lineTo(sx+wallW,topH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx,botY);ctx.lineTo(sx+wallW,botY);ctx.stroke();
      // Inner bright line
      ctx.globalAlpha=1;ctx.shadowBlur=glowPulse;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(sx,topH);ctx.lineTo(sx+wallW,topH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx,botY);ctx.lineTo(sx+wallW,botY);ctx.stroke();
      ctx.shadowBlur=0;
      // Occasional sparkle dots along gap edges
      if(Math.random()<0.12){
        const spkX=sx+Math.random()*wallW,spkY=Math.random()<0.5?topH:botY;
        ctx.save();ctx.globalAlpha=0.6+Math.random()*0.4;ctx.fillStyle=theme.edge;
        ctx.shadowColor=theme.edge;ctx.shadowBlur=10;
        ctx.beginPath();ctx.arc(spkX,spkY,1.5+Math.random()*1.5,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;ctx.restore();
      }
    }
  }
}

function draw3DWall(x,y,w,h,theme,hit,isTop){
  if(h<=0)return;
  const bevel=6; // 3D depth

  // Main face
  ctx.fillStyle=hit?'rgba(255,50,50,0.35)':theme.wall;
  ctx.fillRect(x,y,w,h);

  // Depth gradient overlay — darker at base, lighter near gap edge
  const depthG=ctx.createLinearGradient(x,y,x+w,y);
  depthG.addColorStop(0,hit?'rgba(255,60,60,0.18)':'rgba(255,255,255,0.06)');
  depthG.addColorStop(0.5,'transparent');
  depthG.addColorStop(1,'rgba(0,0,0,0.18)');
  ctx.fillStyle=depthG;ctx.fillRect(x,y,w,h);

  // Inner grid — more subtle
  ctx.strokeStyle=hit?'rgba(255,100,100,0.05)':hexToRgba(theme.wallEdge,0.07);
  ctx.lineWidth=0.5;ctx.beginPath();
  const ts=25;
  for(let gx=x;gx<=x+w;gx+=ts){ctx.moveTo(gx,y);ctx.lineTo(gx,y+h);}
  for(let gy=y-(y%ts);gy<=y+h;gy+=ts){if(gy>=y){ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);}}
  ctx.stroke();

  // 3D bevel — highlight edge (facing player, left side)
  const hlGrad=ctx.createLinearGradient(x,0,x+bevel,0);
  hlGrad.addColorStop(0,hit?'rgba(255,100,100,0.3)':hexToRgba(theme.wallHi||theme.wallEdge,0.35));
  hlGrad.addColorStop(1,'transparent');
  ctx.fillStyle=hlGrad;ctx.fillRect(x,y,bevel,h);

  // 3D bevel — top/bottom edge (gap-facing edge gets bright highlight)
  if(isTop){
    // Bottom edge of top wall = gap edge = bright
    const btGrad=ctx.createLinearGradient(0,y+h-bevel,0,y+h);
    btGrad.addColorStop(0,'transparent');
    btGrad.addColorStop(1,hit?'rgba(255,100,100,0.2)':hexToRgba(theme.wallHi||theme.wallEdge,0.3));
    ctx.fillStyle=btGrad;ctx.fillRect(x,y+h-bevel,w,bevel);
  }else{
    // Top edge of bottom wall = gap edge = bright
    const tpGrad=ctx.createLinearGradient(0,y,0,y+bevel);
    tpGrad.addColorStop(0,hit?'rgba(255,100,100,0.2)':hexToRgba(theme.wallHi||theme.wallEdge,0.3));
    tpGrad.addColorStop(1,'transparent');
    ctx.fillStyle=tpGrad;ctx.fillRect(x,y,w,bevel);
  }

  // Shadow on far edge (right side)
  const shGrad=ctx.createLinearGradient(x+w-bevel,0,x+w,0);
  shGrad.addColorStop(0,'transparent');
  shGrad.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle=shGrad;ctx.fillRect(x+w-bevel,y,bevel,h);

  // Outline
  ctx.strokeStyle=hit?'rgba(255,80,80,0.4)':theme.wallEdge;
  ctx.lineWidth=1.5;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

// ─── BOUNDARY WALLS ────────────────────────────────────────────
function drawBoundaryWalls(){
  const theme=getTheme();const bh=8;
  // Boundary walls pulse with rhythm — GD breathing feel
  const bp=6+Math.sin(performance.now()*0.004)*3;
  ctx.fillStyle=theme.wall;ctx.fillRect(0,0,W,bh);
  ctx.shadowColor=theme.edge;ctx.shadowBlur=bp;ctx.strokeStyle=theme.edge;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,bh);ctx.lineTo(W,bh);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=theme.wall;ctx.fillRect(0,H-bh,W,bh);
  ctx.shadowColor=theme.edge;ctx.shadowBlur=bp;
  ctx.beginPath();ctx.moveTo(0,H-bh);ctx.lineTo(W,H-bh);ctx.stroke();ctx.shadowBlur=0;
}

// ─── COLLECTIBLES ──────────────────────────────────────────────
function drawDiamond(d,time){
  if(d.collected)return;const sx=d.x-cameraX;if(sx<-50||sx>W+50)return;
  const bob=Math.sin(time*0.003+d.anim)*5;
  const scale=d.dSize||1.0;
  ctx.save();ctx.translate(sx,d.y+bob);ctx.scale(scale,scale);ctx.rotate(Math.sin(time*0.002+d.anim)*0.2);
  const sz=13;
  ctx.shadowColor=scale>=1.5?'#FDE047':'#7DF900';ctx.shadowBlur=scale>=1.5?22:14;
  const fill=scale>=1.5?'#A4FF44':scale<=0.6?'#5EC700':'#7DF900';
  ctx.beginPath();ctx.moveTo(0,-sz);ctx.lineTo(sz,0);ctx.lineTo(0,sz);ctx.lineTo(-sz,0);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#A4FF44';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.moveTo(0,-sz*0.5);ctx.lineTo(sz*0.35,0);ctx.lineTo(0,sz*0.1);ctx.lineTo(-sz*0.1,-sz*0.1);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

// BITCOIN — spinning 3D gold coin with ₿
function drawBitcoin(bc,time){
  if(bc.collected)return;const sx=bc.x-cameraX;if(sx<-35||sx>W+35)return;
  const bob=Math.sin(time*0.004+bc.anim)*4;
  const spin=time*0.003+bc.anim;
  const scaleX=Math.cos(spin);
  const absScale=Math.abs(scaleX);
  ctx.save();ctx.translate(sx,bc.y+bob);ctx.scale(0.2+absScale*0.8,1);

  const r=16;
  // Gold metallic gradient
  ctx.shadowColor='#FDE047';ctx.shadowBlur=20;
  const cg=ctx.createRadialGradient(-3,-3,0,0,0,r);
  cg.addColorStop(0,'#FEF08A');cg.addColorStop(0.4,'#FDE047');cg.addColorStop(0.7,'#EAB308');cg.addColorStop(1,'#A16207');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();

  // Rim
  ctx.strokeStyle='#D97706';ctx.lineWidth=2.5;ctx.stroke();

  // Inner ring
  ctx.strokeStyle='rgba(254,240,138,0.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,r*0.75,0,Math.PI*2);ctx.stroke();

  // ₿ symbol (only when face is visible enough)
  ctx.shadowBlur=0;
  if(absScale>0.3){
    ctx.font=`bold ${Math.floor(r*1.1)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#92400E';ctx.fillText('₿',1,1);
    ctx.fillStyle='#FEF9C3';ctx.fillText('₿',0,0);
  }

  // Shine highlight
  ctx.globalAlpha=0.25;ctx.fillStyle='#FFF';
  ctx.beginPath();ctx.ellipse(-r*0.25,-r*0.25,r*0.5,r*0.3,Math.PI*0.2,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  ctx.restore();
}

function drawBlueDiamondObj(bd,time){
  if(bd.collected)return;const sx=bd.x-cameraX;if(sx<-30||sx>W+30)return;
  const bob=Math.sin(time*0.003+bd.anim)*6;const pulse=0.9+Math.sin(time*0.005+bd.anim)*0.1;
  ctx.save();ctx.translate(sx,bd.y+bob);ctx.scale(pulse,pulse);const sz=12;
  ctx.shadowColor='#3B82F6';ctx.shadowBlur=18;

  const g=ctx.createLinearGradient(-sz,-sz,sz,sz);g.addColorStop(0,'#3B82F6');g.addColorStop(1,'#60A5FA');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#93C5FD';ctx.lineWidth=2;ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
}

// ROCKET BOOSTER — glowing thruster/flame icon
function drawRocketBooster(rb,time){
  if(rb.collected)return;const sx=rb.x-cameraX;if(sx<-30||sx>W+30)return;
  const bob=Math.sin(time*0.004+rb.anim)*5;
  const pulse=0.85+Math.sin(time*0.006+rb.anim)*0.15;
  ctx.save();ctx.translate(sx,rb.y+bob);ctx.scale(pulse,pulse);

  // Glow aura
  ctx.shadowColor='#F97316';ctx.shadowBlur=22;

  // Rocket body
  ctx.fillStyle='#DC2626';
  ctx.beginPath();
  ctx.moveTo(0,-12);ctx.lineTo(7,-4);ctx.lineTo(7,6);ctx.lineTo(4,10);
  ctx.lineTo(-4,10);ctx.lineTo(-7,6);ctx.lineTo(-7,-4);ctx.closePath();
  ctx.fill();ctx.strokeStyle='#EF4444';ctx.lineWidth=1.5;ctx.stroke();

  // Nose cone
  ctx.fillStyle='#FDE047';
  ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(4,-10);ctx.lineTo(-4,-10);ctx.closePath();ctx.fill();

  // Flame (animated)
  const fh=6+Math.sin(time*0.02+rb.anim)*3;
  const fg=ctx.createLinearGradient(0,10,0,10+fh);

  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(-4,10);ctx.quadraticCurveTo(0,10+fh+2,4,10);ctx.closePath();ctx.fill();

  // Window
  ctx.fillStyle='rgba(96,165,250,0.7)';
  ctx.beginPath();ctx.arc(0,-1,3,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;ctx.restore();
}

// ─── SPACESHIP ─────────────────────────────────────────────────
function drawShip(time){
  if(state===STATE.DEAD&&deathTimer>0.25)return;
  const sx=SHIP_X,sy=ship.y;
  if(invincTimer>0&&Math.floor(invincTimer*10)%2===0)ctx.globalAlpha=0.5;

  // Engine trail
  if(state===STATE.PLAYING){
    const tc=shieldActive?`hsl(${(performance.now()*0.4)%360},100%,65%)`:rocketBoostActive?'#F97316':superBoostTimer>0?'#FDE047':'#22D3EE';
    ship.trail.push({x:sx-SHIP_W*0.5,y:sy,life:0.3,maxLife:0.3,color:tc,size:rand(3,rocketBoostActive?8:5)});
    if(ship.trail.length>25)ship.trail.shift();
  }
  for(let i=ship.trail.length-1;i>=0;i--){
    const t=ship.trail[i];t.x-=(rocketBoostActive?5:2.5);t.life-=0.016;
    if(t.life<=0){ship.trail.splice(i,1);continue;}
    ctx.globalAlpha=(t.life/t.maxLife)*(rocketBoostActive?0.5:0.35);ctx.fillStyle=t.color;
    ctx.shadowColor=t.color;ctx.shadowBlur=rocketBoostActive?10:5;
    ctx.beginPath();ctx.arc(t.x,t.y,t.size*(t.life/t.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(invincTimer>0&&Math.floor(invincTimer*10)%2===0)ctx.globalAlpha=0.5;

  ctx.save();ctx.translate(sx,sy);ctx.rotate(ship.bankAngle);

  // Boost auras
  if(superBoostTimer>0||rocketBoostActive){
    const bc=rocketBoostActive?'#F97316':'#FDE047';
    ctx.shadowColor=bc;ctx.shadowBlur=rocketBoostActive?50:35;
    ctx.fillStyle=rocketBoostActive?'rgba(249,115,22,0.2)':'rgba(253,224,71,0.12)';
    ctx.beginPath();ctx.arc(0,0,SHIP_W*(rocketBoostActive?1.0:0.8),0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // INVINCIBLE SHIELD AURA — pulsing rainbow dome
  if(shieldActive){
    const t=performance.now()*0.001;
    const warning=shieldTimer<2.0;
    const warnFlash=warning&&Math.floor(shieldTimer*6)%2===0;
    const pulse=0.85+Math.sin(shieldPhase*1.8)*0.15;
    const baseR=SHIP_W*1.15*pulse;

    // Inner fill dome
    const domeG=ctx.createRadialGradient(0,0,0,0,0,baseR);
    if(warnFlash){
      domeG.addColorStop(0,'rgba(255,80,80,0.22)');domeG.addColorStop(0.7,'rgba(255,40,40,0.10)');domeG.addColorStop(1,'rgba(255,0,0,0)');
    } else {
      domeG.addColorStop(0,`hsla(${(t*120)%360},100%,70%,0.18)`);
      domeG.addColorStop(0.5,`hsla(${(t*120+120)%360},100%,65%,0.10)`);
      domeG.addColorStop(1,'rgba(255,255,255,0)');
    }
    ctx.fillStyle=domeG;ctx.beginPath();ctx.arc(0,0,baseR,0,Math.PI*2);ctx.fill();

    // Three spinning rainbow rings
    for(let ring=0;ring<3;ring++){
      const ringR=baseR*(1+ring*0.18);
      const hue=warnFlash?0:(t*180+ring*120)%360;
      const alpha=warnFlash?(0.9-ring*0.2):(0.7-ring*0.15);
      ctx.globalAlpha=alpha;
      ctx.strokeStyle=warnFlash?'#FF3333':`hsl(${hue},100%,65%)`;
      ctx.lineWidth=3.5-ring*0.8;
      ctx.shadowColor=warnFlash?'#FF3333':`hsl(${hue},100%,65%)`;
      ctx.shadowBlur=18-ring*4;
      ctx.beginPath();ctx.arc(0,0,ringR,0,Math.PI*2);ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;

    // Orbiting energy sparks
    if(!warning){
      for(let s=0;s<6;s++){
        const angle=shieldPhase+s*(Math.PI/3);
        const spkR=baseR*1.05;
        const spkX=Math.cos(angle)*spkR,spkY=Math.sin(angle)*spkR;
        const hue2=(t*200+s*60)%360;
        ctx.globalAlpha=0.8;ctx.fillStyle=`hsl(${hue2},100%,70%)`;
        ctx.shadowColor=`hsl(${hue2},100%,70%)`;ctx.shadowBlur=12;
        ctx.beginPath();ctx.arc(spkX,spkY,3.5,0,Math.PI*2);ctx.fill();
      }
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }

  // Engine flame
  ship.flamePhase+=0.3;
  const boostMult=rocketBoostActive?3:superBoostTimer>0?1.5:1;
  const flameLen=(20+Math.sin(ship.flamePhase*3)*5)*boostMult;
  const flameW=(10+Math.sin(ship.flamePhase*5)*3)*boostMult;

  // Outer flame
  const fg=ctx.createLinearGradient(-SHIP_W*0.5-flameLen,0,-SHIP_W*0.5,0);
  fg.addColorStop(0,'transparent');
  if(rocketBoostActive){
    fg.addColorStop(0.2,'rgba(249,115,22,0.4)');fg.addColorStop(0.5,'rgba(239,68,68,0.6)');fg.addColorStop(0.8,'rgba(253,224,71,0.8)');
  }else if(superBoostTimer>0){
    fg.addColorStop(0.3,'rgba(253,224,71,0.6)');fg.addColorStop(0.7,'rgba(253,224,71,0.8)');
  }else{
    fg.addColorStop(0.3,'rgba(255,46,196,0.5)');fg.addColorStop(0.7,'rgba(168,85,247,0.7)');
  }
  fg.addColorStop(1,'rgba(34,211,238,0.9)');
  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.5,-flameW);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.7,0,-SHIP_W*0.5-flameLen,0);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.7,0,-SHIP_W*0.5,flameW);
  ctx.closePath();ctx.fill();

  // Inner flame core
  const ig=ctx.createLinearGradient(-SHIP_W*0.5-flameLen*0.6,0,-SHIP_W*0.5,0);
  ig.addColorStop(0,'transparent');ig.addColorStop(0.5,'rgba(255,255,255,0.4)');ig.addColorStop(1,'rgba(255,255,255,0.8)');
  ctx.fillStyle=ig;
  ctx.beginPath();ctx.moveTo(-SHIP_W*0.5,-flameW*0.35);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.4,0,-SHIP_W*0.5-flameLen*0.6,0);
  ctx.quadraticCurveTo(-SHIP_W*0.5-flameLen*0.4,0,-SHIP_W*0.5,flameW*0.35);
  ctx.closePath();ctx.fill();

  // ═══ COMBAT WARSHIP — heavily detailed ═══
  const t=performance.now()*0.001;
  const shipStroke=shieldActive?`hsl(${(t*180)%360},100%,70%)`:rocketBoostActive?'#F97316':'#67E8F9';

  // Engine nacelles (two pods on wings)
  for(const side of [-1,1]){
    const ny=SHIP_H*0.42*side;
    // Nacelle body
    const ng=ctx.createLinearGradient(-SHIP_W*0.38,ny-5,-SHIP_W*0.38,ny+5);
    ng.addColorStop(0,'#4A2D8C');ng.addColorStop(0.5,'#2D1B69');ng.addColorStop(1,'#1A1040');
    ctx.fillStyle=ng;
    ctx.beginPath();ctx.moveTo(-SHIP_W*0.12,ny-4*side);ctx.lineTo(-SHIP_W*0.42,ny-5*side);
    ctx.lineTo(-SHIP_W*0.48,ny);ctx.lineTo(-SHIP_W*0.42,ny+5*side);
    ctx.lineTo(-SHIP_W*0.12,ny+4*side);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#7C3AED';ctx.lineWidth=0.8;ctx.stroke();
    // Nacelle exhaust glow
    const eGlow=ctx.createRadialGradient(-SHIP_W*0.48,ny,0,-SHIP_W*0.48,ny,8);
    eGlow.addColorStop(0,'rgba(34,211,238,0.6)');eGlow.addColorStop(0.5,'rgba(168,85,247,0.3)');eGlow.addColorStop(1,'transparent');
    ctx.fillStyle=eGlow;ctx.beginPath();ctx.arc(-SHIP_W*0.48,ny,8,0,Math.PI*2);ctx.fill();
  }

  // Wing-mounted heavy cannons (outer)
  for(const side of [-1,1]){
    const cy=SHIP_H*0.55*side;
    // Cannon housing
    ctx.fillStyle='#3A1E6E';ctx.strokeStyle='#A855F7';ctx.lineWidth=0.8;

  // Central ridge (spine)
  const rg=ctx.createLinearGradient(SHIP_W*0.4,0,-SHIP_W*0.3,0);

  ctx.beginPath();ctx.moveTo(SHIP_W*0.5,0);ctx.lineTo(SHIP_W*0.1,-SHIP_H*0.06);
